services:
  postgres:
    # pgvector/pgvector ships PostgreSQL with the `vector` extension
    # pre-installed. ADR-002 makes pgvector mandatory in the PG backend,
    # so the app container will refuse to start if the extension is
    # missing — bundling it here keeps `docker compose up` zero-config.
    image: pgvector/pgvector:pg17
    container_name: covel-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-covel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: covel-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-covel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-covel}
      STORE_BACKEND: pg
      SERVER_PORT: "3001"
      NODE_ENV: production
      SERVE_STATIC: "true"
      STATIC_DIR: ./web-dist
    env_file:
      - ../.env
      # .env.llm is optional — only needed for server-side LLM key injection.
      # In production, API keys are passed per-request from the browser.
      # Create .env.llm from .env.llm.example: cp .env.llm.example .env.llm
      - path: ../.env.llm
        required: false
    volumes:
      # Model slot configuration (required — copy llm.toml.example to llm.toml)
      - ../llm.toml:/app/llm.toml:ro
      # Optional: mount custom world packages
      # - ../worlds:/app/worlds:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
