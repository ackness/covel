##
# Covel — one-command production stack
#
# Usage:
#   pnpm docker:build     # Build + start (first time or after code changes)
#   pnpm docker:up        # Start existing containers
#   pnpm docker:down      # Stop (keep volumes)
#   pnpm docker:down-all  # Stop + delete volumes (fresh start)
#   pnpm docker:logs      # Tail logs
#
# Prerequisites:
#   1. Docker Compose 2.24+ (`env_file.required` is used below).
#   2. cp .env.example .env — set POSTGRES_PASSWORD, COVEL_MEDIA_TOKEN_SECRET,
#      COVEL_DESKTOP_REST_TOKEN, and CORS_ORIGIN. The stack is fail-closed:
#      it refuses to start until all four are set.
#   3. cp llm.toml.example llm.toml  (configure LLM provider slots)
#   4. cp .env.llm.example .env.llm  (add LLM API keys, optional)
##

services:
  postgres:
    # pgvector/pgvector ships PostgreSQL with the `vector` extension
    # pre-installed (required by ADR-002). The app container will refuse
    # to start if the extension is missing.
    # PostgreSQL 18 + pgvector 0.8.6, pinned by multi-platform digest.
    # PG18 changed PGDATA and its volume root. `pgdata18` is deliberately a
    # new volume: existing PG17 `pgdata` contents are preserved but are not
    # migrated or mounted automatically.
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: covel-postgres
    restart: unless-stopped
    ports:
      # Loopback-only: Postgres must never be reachable from outside the
      # host by default (S-10). Set POSTGRES_PORT + bind your own interface
      # explicitly if you need remote access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-covel}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: covel-app
    restart: unless-stopped
    ports:
      # Keep the plain-HTTP service local by default. Set APP_BIND_IP only
      # when an authenticated TLS reverse proxy protects external traffic.
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3001}:3001"
    environment:
      # ── Database ────────────────────────────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-covel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-covel}
      STORE_BACKEND: pg

      # ── Server ─────────────────────────────────────────────────
      SERVER_PORT: "3001"
      # The server defaults to loopback (audit S-02); inside the container it
      # must listen on the container interface to be reachable via the mapped
      # host port. This is an explicit deployment opt-in.
      COVEL_BIND_HOST: 0.0.0.0
      NODE_ENV: production
      SERVE_STATIC: "true"
      STATIC_DIR: ./web-dist
      # Empty interpolation lets `docker compose up postgres` work without
      # app-only secrets. The commercial server still rejects an empty value
      # at boot, so starting the full stack remains fail-closed.
      COVEL_MEDIA_TOKEN_SECRET: ${COVEL_MEDIA_TOKEN_SECRET:-}

      # ── Auth — fail-closed hosted posture (C-01) ────────────────
      # The container listens on 0.0.0.0 and is mapped to a host port, so it
      # is network-reachable by default. DEPLOYMENT_TIER=commercial makes the
      # server hard-enforce per-session owner tokens on every session-scoped
      # route and gate session creation/listing and config endpoints behind
      # the operator token below — anonymous access is impossible. Like
      # POSTGRES_PASSWORD / COVEL_MEDIA_TOKEN_SECRET, the server refuses to
      # boot until the token is set in .env. Empty Compose defaults only keep
      # the DB-only service command independent from app-only configuration.
      DEPLOYMENT_TIER: commercial
      COVEL_DESKTOP_REST_TOKEN: ${COVEL_DESKTOP_REST_TOKEN:-}
      # Commercial posture also requires an explicit CORS allowlist at boot.
      # The bundled web UI is served same-origin, so set this to the public
      # origin players will use (e.g. https://covel.example.com).
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # World package seed directory (inside container)
      COVEL_WORLDS_DIR: /app/worlds
    env_file:
      # Root scripts already require .env via `--env-file`; keep this service
      # source optional so Compose can resolve the postgres-only service with
      # an alternate env file and without app configuration.
      - path: ../.env
        required: false
      # .env.llm is optional — only needed for server-side LLM key injection.
      # In browser-key mode (default), API keys are passed per-request via
      # X-Provider-Keys header from the frontend localStorage.
      - path: ../.env.llm
        required: false
    volumes:
      # Model slot configuration (required — copy llm.toml.example to llm.toml)
      - type: bind
        source: ../llm.toml
        target: /app/llm.toml
        read_only: true
        bind:
          # A missing file must fail instead of becoming a host directory.
          create_host_path: false
      # Optional: mount custom world packages from host
      # - ../worlds:/app/worlds:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  # New name prevents Docker Compose from attaching the incompatible PG17
  # development volume. The old `pgdata` volume remains untouched.
  pgdata18:
