##
# Covel — one-command production stack
#
# Usage:
#   pnpm docker:build     # Build + start (first time or after code changes)
#   pnpm docker:up        # Start existing containers
#   pnpm docker:down      # Stop (keep volumes)
#   pnpm docker:down-all  # Stop + delete volumes (fresh start)
#   pnpm docker:logs      # Tail logs
#
# Prerequisites:
#   1. cp .env.example .env — set POSTGRES_PASSWORD, COVEL_MEDIA_TOKEN_SECRET,
#      COVEL_DESKTOP_REST_TOKEN, and CORS_ORIGIN. The stack is fail-closed:
#      it refuses to start until all four are set.
#   2. cp llm.toml.example llm.toml  (configure LLM provider slots)
#   3. cp .env.llm.example .env.llm  (add LLM API keys, optional)
##

services:
  postgres:
    # pgvector/pgvector ships PostgreSQL with the `vector` extension
    # pre-installed (required by ADR-002). The app container will refuse
    # to start if the extension is missing.
    # Pinned by digest (pg17 as of 2026-07-15) — bump the digest (and this
    # comment) when intentionally upgrading Postgres.
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    container_name: covel-postgres
    restart: unless-stopped
    ports:
      # Loopback-only: Postgres must never be reachable from outside the
      # host by default (S-10). Set POSTGRES_PORT + bind your own interface
      # explicitly if you need remote access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-covel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: covel-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      # ── Database ────────────────────────────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-covel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-covel}
      STORE_BACKEND: pg

      # ── Server ─────────────────────────────────────────────────
      SERVER_PORT: "3001"
      # The server defaults to loopback (audit S-02); inside the container it
      # must listen on the container interface to be reachable via the mapped
      # host port. This is an explicit deployment opt-in.
      COVEL_BIND_HOST: 0.0.0.0
      NODE_ENV: production
      SERVE_STATIC: "true"
      STATIC_DIR: ./web-dist
      COVEL_MEDIA_TOKEN_SECRET: ${COVEL_MEDIA_TOKEN_SECRET:?Set COVEL_MEDIA_TOKEN_SECRET in .env}

      # ── Auth — fail-closed hosted posture (C-01) ────────────────
      # The container listens on 0.0.0.0 and is mapped to a host port, so it
      # is network-reachable by default. DEPLOYMENT_TIER=commercial makes the
      # server hard-enforce per-session owner tokens on every session-scoped
      # route and gate session creation/listing and config endpoints behind
      # the operator token below — anonymous access is impossible. Like
      # POSTGRES_PASSWORD / COVEL_MEDIA_TOKEN_SECRET, compose refuses to
      # start until the token is set in .env.
      DEPLOYMENT_TIER: commercial
      COVEL_DESKTOP_REST_TOKEN: ${COVEL_DESKTOP_REST_TOKEN:?Set COVEL_DESKTOP_REST_TOKEN in .env}
      # Commercial posture also requires an explicit CORS allowlist at boot.
      # The bundled web UI is served same-origin, so set this to the public
      # origin players will use (e.g. https://covel.example.com).
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env (the app's public origin)}

      # World package seed directory (inside container)
      COVEL_WORLDS_DIR: /app/worlds
    env_file:
      - ../.env
      # .env.llm is optional — only needed for server-side LLM key injection.
      # In browser-key mode (default), API keys are passed per-request via
      # X-Provider-Keys header from the frontend localStorage.
      - path: ../.env.llm
        required: false
    volumes:
      # Model slot configuration (required — copy llm.toml.example to llm.toml)
      - ../llm.toml:/app/llm.toml:ro
      # Optional: mount custom world packages from host
      # - ../worlds:/app/worlds:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  pgdata:
