services:
  postgres:
    image: postgres:17-alpine
    container_name: covel-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-covel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-covel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: covel-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-covel}:${POSTGRES_PASSWORD:-covel_dev}@postgres:5432/${POSTGRES_DB:-covel}
      SERVER_PORT: "3001"
      NODE_ENV: production
      SERVE_STATIC: "true"
      STATIC_DIR: ./web-dist
    env_file:
      - ../.env
      - ../.env.llm
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
