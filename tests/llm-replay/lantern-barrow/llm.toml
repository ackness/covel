# The models this session was recorded with. `pnpm e2e:replay` replaces every
# baseUrl with its proxy, so the value here is only a placeholder; recording
# sends requests to DEFAULT_BASE_URL (or --upstream) with the key in
# DEFAULT_API_KEY, named after the provider. Changing a model here changes
# every request: record the session again afterwards.

[covel.story]
provider = "default"
model    = "codex/gpt-6-luna"
baseUrl  = "https://llm-replay.invalid"
protocol = "openai-chat-v1"

[covel.plugin]
provider = "default"
model    = "codex/gpt-6-luna"
baseUrl  = "https://llm-replay.invalid"
protocol = "openai-chat-v1"
