<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session bridge probe</title>
    <link rel="stylesheet" href="app.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <h1>Session bridge probe</h1>
    <p>
      Grant the labelled capabilities in the host. Return and permissions are
      outside this page. Changed content asks again.
    </p>
    <img src="probe.svg" alt="Local resource loaded" width="24" height="24" />
    <pre id="story"></pre>
    <pre id="input"></pre>
    <section id="interactions"></section>
    <label>Player action <textarea id="draft"></textarea></label
    ><button id="submit">Submit action</button
    ><button id="write">Write note</button
    ><button id="ask-form">Ask form</button
    ><button id="ask-choice">Ask choice</button
    ><button id="ask-confirmation">Ask confirmation</button
    ><button id="stop">Stop execution</button
    ><button id="panel">Open notes</button><output id="outcome"></output>
  </body>
</html>
