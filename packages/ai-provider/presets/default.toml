# ── Provider Defaults ────────────────────────────────────────────
# API keys are NOT stored here — they come from browser localStorage
# via the X-Provider-Keys request header.

[providers.deepseek]
baseUrl = "${DEEPSEEK_BASE_URL}"
protocol = "openai-chat-v1"

[providers.dashscope]
baseUrl = "${DASHSCOPE_BASE_URL}"
protocol = "openai-chat-v1"

# ── Presets ──────────────────────────────────────────────────────

[[presets]]
id = "default"
name = "DeepSeek Chat"
provider = "deepseek"
model = "deepseek-chat"
tier = "medium"
defaultSlot = "heavy"
supportedModes = ["text", "object", "stream"]
enabled = true
isDefault = true
fallbackPresetIds = ["fallback-dashscope"]

[[presets]]
id = "fallback-dashscope"
name = "DashScope Qwen 3.5 Flash"
provider = "dashscope"
model = "qwen3.5-flash"
tier = "medium"
defaultSlot = "fast"
supportedModes = ["text", "object", "stream"]
enabled = true
