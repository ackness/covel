PLUGIN.md:
  displayName: 轮流发言
  description: 决定每个回合由哪些角色发言：你提到谁就是谁、按固定顺序、随机、由你选，或由 AI 导演来选。
  contributes:
    actionKinds:
      - name: choose-actors
        display:
          label: 选择发言角色
          placeholder: 给所选角色的提示（可选）
    settings:
      - key: strategy
        label: 谁来发言
        description: 每个回合怎样决定哪些角色发言。
        options:
          - label: 你提到谁，谁就发言
          - label: 按固定顺序轮流
          - label: 每回合随机几位
          - label: 每回合由你选择
          - label: AI 导演（每回合多用一次 AI，花费更高）
      - key: actorOrder
        label: 发言顺序
        description: 选择固定顺序时使用。每行写一个角色名，最多 32 个。
