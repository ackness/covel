# Chinese text of the scene-stage plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 舞台画面
  description: 显示当前场景、白天或夜晚，以及在场角色的立绘。
  contributes:
    events:
      - description: 演员有变化的回合在正文前发射一次：cues 合并本轮全部登退场、站位、焦点、视觉变体变化。actor.focus 只控制画面焦点；名牌来自故事段落的说话者。actor.leave 与 stage.clear 应指定离场 transition。
      - description: 发射条件：第一回合开场确立场景时、场景/地点切换时、昼夜变化时——满足任一即须发射（每回合最多一次）。location 用叙事中的地点名；无把握沿用上次值。
    settings:
      - key: activeSpeakerCount
        label: 同时发言的角色数
        description: 每次回复里最多有几位角色发言，范围 1 到 4。
    data:
      assets:
        authoring:
          title: 场景背景图片
      scenes:
        authoring:
          title: 场景背景清单
runtimes/cast/RUNTIME.md:
  description: 记录谁在场景里、谁来发言。
runtimes/direction/RUNTIME.md:
  description: 执行舞台指令：谁上场或离场、站在哪里、谁是焦点，以及他们的服装、表情和姿势。
runtimes/resolver/RUNTIME.md:
  description: 记录当前所在的场景，以及现在是白天还是夜晚。
runtimes/seed/RUNTIME.md:
  description: 游戏开始时先在舞台上显示世界的第一个场景，不让舞台空着。
runtimes/story-cues/RUNTIME.md:
  description: 让舞台跟上故事：故事发生在哪里、有谁在场。
