# Chinese text of the world-init plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 世界状态
  description: 记录世界的数值和状态，如势力、天气、声望，并随剧情更新。
runtimes/dimension-clock/RUNTIME.md:
  description: 更新跟随世界时钟变化的数值，例如日期。不调用 AI。
runtimes/dimension-context/RUNTIME.md:
  description: 把本回合的世界状态交给故事。不调用 AI。
runtimes/dimension-tracker/RUNTIME.md:
  description: 每回合结束后，按世界的规则根据故事里发生的事更新世界状态。
runtimes/edit-dimensions/RUNTIME.md:
  description: 让你修改某个数值，或手动处理、跳过等待中的更新。
runtimes/schema-gen/RUNTIME.md:
  description: 开局时一次性设置好角色属性和世界信息。
messages:
