# Chinese text of the affinity plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 好感度
  description: 记录各角色对你的好感，分数、等级和最近变化会显示在侧栏。
  contributes:
    data:
      affinity:
        authoring:
          title: 初始好感
messages:
  Affinity: 好感度
  shortLabel|Affinity: 好感
  "No affinity records yet. They will appear as you interact with characters…": 还没有好感记录，与角色互动后会自动出现…
  "Scores run from -100 (Hostile) to 100 (Devoted). The middle of the bar is Neutral.": 分数从 -100（敌视）到 100（挚爱），进度条中间为中立。
  Affinity changes: 好感变化
  No affinity changes this turn.: 本回合没有好感变化。
  Hostile: 敌视
  Cold: 冷淡
  Neutral: 中立
  Friendly: 友好
  Close: 亲密
  Devoted: 挚爱
