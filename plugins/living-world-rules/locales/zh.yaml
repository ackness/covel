# Chinese text of the living-world-rules plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 世界规则
  description: 展示这个世界长期有效的规则，如禁忌和风俗，并让故事始终遵守。
  contributes:
    data:
      rules:
        authoring:
          title: 世界规则
messages:
  World: 世界
  Rules: 规则
  This world has no special rules.: 这个世界没有特别的规则。
  Lasting rules and taboos of this world. You can read them but not change them.: 这个世界长期有效的规则和禁忌，只能查看，不能修改。
  No rules: 暂无规则
  Always: 一直生效
  When triggered: 条件满足时
  Changes with the story: 随剧情变化
