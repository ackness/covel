# Chinese text of the inventory plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 行囊
  description: 每回合从叙事中记录明确的物品得失与装备变化，右栏随时可查背包。
  contributes:
    commands:
      - name: bag
        description: 查看当前背包并打开行囊面板。
    data:
      items:
        authoring:
          title: 开局物品
runtimes/ledger/RUNTIME.md:
  description: 每回合从共享的事实抽取中记录主角的物品得失与装备变化。
runtimes/vocabulary/RUNTIME.md:
  description: 在事实抽取前公布背包里的物品名，便于沿用同一名称。
messages:
  Inventory changes: 行囊变化
  Inventory: 行囊
  Bag: 行囊
  Your bag is empty. Items you explicitly obtain in the story will appear here…: 行囊空空如也，故事里明确拿到的东西会自动记进来……
  title|Equipped: 已装备
  Unequip: 卸下
  Drop: 丢弃
  Backpack: 背包
  Equip: 装备
  Your bag contains {count} item entry.: 行囊中有 {count} 项物品。
  Your bag contains {count} item entries.: 行囊中有 {count} 项物品。
  Gained: 获得
  Lost: 失去
  Updated: 更新
  Equipped: 装备
  Unequipped: 卸下
