# Chinese text of the inventory plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 背包
  description: 记录你随身携带的东西。故事里获得、失去或装备的物品会自动记进背包。
  contributes:
    commands:
      - name: bag
        description: 查看你带着什么，并打开背包页。
    data:
      items:
        authoring:
          title: 初始物品
runtimes/ledger/RUNTIME.md:
  description: 每回合根据故事内容记录你获得、失去或装备的物品。
runtimes/vocabulary/RUNTIME.md:
  description: 记录背包里已有的物品名，让后续记录沿用同一个叫法。
messages:
  Bag changes: 背包变化
  Bag: 背包
  Your bag is empty. Items you pick up in the story will appear here.: 背包是空的。故事里拿到的东西会自动出现在这里。
  title|Equipped: 已装备
  Unequip: 卸下
  Drop: 丢弃
  Carried: 随身物品
  Equip: 装备
  You have {count} item in your bag.: 背包里有 {count} 件物品。
  You have {count} items in your bag.: 背包里有 {count} 件物品。
  Gained: 获得
  Lost: 失去
  Equipped: 已装备
  Unequipped: 已卸下
