# Chinese text of the narrator plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 叙事
  description: 根据你的行动继续推进故事，描写场景、人物反应和结果。
  contributes:
    settings:
      - key: perspective
        label: 视角
        description: 由谁讲述故事、旁白如何称呼玩家角色；人物对白保持各自的人称。
        options:
          - label: 玩家角色·第一人称（我）
          - label: 玩家角色·第二人称（你）
          - label: 玩家角色·第三人称（角色名）
          - label: 全知旁白
          - label: 主持人（DM）
