# Chinese text of the dice-check plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 骰子判定
  description: 遇到有风险的行动时掷骰子，并把结果显示在对话里。
  contributes:
    events:
      - description: 发射条件：本回合完成过至少一次骰子判定时必须发射，且整回合只发一次——把所有判定按使用顺序装进 checks 数组（先判定完、再一次性发射）。每项：action 填行动简述；attribute 填所用属性，未使用属性时省略；modifier 填属性修正，没有可用的有量程能力属性时填 0；difficulty 填 easy、normal、hard 或 extreme；outcome 填本回合判定表给出的结果。不要填 d20、DC 和合计，它们由系统补上。无风险行动不判定也不发射。
    commands:
      - name: roll
        description: 掷骰子，例如 /roll 2d6；默认掷一个 20 面骰。
        arguments:
          - name: notation
            description: 要掷的骰子，例如 2d6（两个六面骰）。
runtimes/recorder/RUNTIME.md:
  description: 记录故事中报告的每次骰子结果，并显示在对话和判定记录里。
runtimes/roller/RUNTIME.md:
  description: 每回合开始时先掷好骰子，成败由骰子决定，而不是由 AI 决定。
messages:
  Some results were left out because they did not match this turn's dice and rules.: 有些结果与本回合的骰子和规则不符，已被略去。
  Roll log: 判定记录
  No rolls yet. Results appear here when you try a risky action.: 还没有掷骰记录。尝试有风险的行动后，结果会出现在这里。
  You can also type /roll in the chat, for example /roll 2d6.: 也可以直接在对话里输入 /roll，例如 /roll 2d6。
  Roll d20: 掷 d20
  Roll 2d6: 掷 2d6
  Dice count must be between 1 and 100.: 骰子数量必须在 1 到 100 之间。
  Die sides must be between 2 and 1000.: 骰子面数必须在 2 到 1000 之间。
  "Enter dice like 2d6: number of dice, then d, then number of sides.": 请这样输入骰子，例如 2d6：骰子个数、字母 d、骰子面数。
  "{notation}: {rolls} (total {total})": "{notation}：{rolls}（合计 {total}）"
  Success: 成功
  Failure: 失败
  Critical success: 大成功
  Critical failure: 大失败
  "Turn {turn}": "第 {turn} 回合"
