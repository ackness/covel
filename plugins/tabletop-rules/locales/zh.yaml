# Chinese text of the tabletop-rules plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 属性判定
  description: 开局时让你把初始点数分配到主角的属性上，之后遇到判定就掷骰子并保存结果。
  contributes:
    data:
      rules:
        authoring:
          title: 初始属性点
runtimes/check/RUNTIME.md:
  description: 掷一次属性判定骰子，回合重试时也不会重掷
runtimes/creation/RUNTIME.md:
  description: 把初始点数分配到属性上
messages:
  Ability checks: 属性判定
  Make an ability check: 做一次属性判定
  This world has no abilities to check, so ability checks are unavailable.: 这个世界没有可判定的属性，无法进行属性判定。
  Ability check: 属性判定
  Attempted action: 尝试的行动
  Ability: 属性
  Difficulty: 难度
  Easy: 简单
  Normal: 普通
  Hard: 困难
  Very hard: 极难
  Roll the check: 掷骰判定
  Starting ability points applied.: 初始属性点已生效。
  "Starting ability points: spread {budget} points": 初始属性点：请分配 {budget} 点
  Confirm points: 确认分配
  Starting ability points chosen.: 已选好初始属性点。
  "{label}: enter a whole number from {min} to {max}": "{label}：请填写 {min} 到 {max} 之间的整数"
  Spend exactly {budget} points. You have spent {spent}.: 需要正好分配 {budget} 点，你已分配 {spent} 点。
