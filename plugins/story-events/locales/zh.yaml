# Chinese text of the story-events plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 隐藏剧情
  description: 世界里的隐藏剧情、隐藏选项与隐藏奖励会一直保密，条件满足后才在游玩中自然解锁。支持确定性条件、AI 语义判断以及可选的后台剧情策划。
  contributes:
    settings:
      - key: planner
        label: 规划隐藏剧情
        description: 让 AI 在后台规划之后才会发生的隐藏剧情。每 3 回合多用一次 AI，花费更高。
      - key: semanticJudge
        label: 语义判断自然语言触发条件
        description: 允许隐蔽子 Agent 判断自然语言写的隐藏条件以及改写后的隐藏选项。没有语义条件的世界不会产生额外 AI 调用。
      - key: maxJudgedPerTurn
        label: 每回合语义判定上限
        description: 单回合最多合并送审的候选自然语言隐藏条件条数。
    data:
      events:
        authoring:
          title: 隐藏剧情
          summary: 为世界添加按剧情发展或世界状态触发的隐藏转折、隐藏选项与隐藏奖励。
runtimes/evaluate/RUNTIME.md:
  description: 每回合检查隐藏剧情的条件是否满足，满足就把它融入故事。
runtimes/assess/RUNTIME.md:
  description: 每回合结算后评估隐藏条件、解锁隐藏选项并发放隐藏奖励。
runtimes/judge/RUNTIME.md:
  description: 隐蔽子 Agent，依据当前故事证据判断自然语言隐藏条件或已解锁选项意图是否成立。
runtimes/intake/RUNTIME.md:
  description: 校验游戏中新规划的隐藏剧情，并把它们加入隐藏剧情表。
runtimes/plot/RUNTIME.md:
  description: 每隔几回合读取最新剧情和世界状态，为之后规划隐藏剧情。
messages:
  Unlocked hidden actions: 已解锁隐藏行动
  Hidden rewards unlocked: 获得隐藏奖励
  Hidden action: 隐藏行动
  Item: 物品
  Lore: 设定
  Reward: 奖励
