# Chinese text of the story-events plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: 隐藏剧情
  description: 世界里的隐藏剧情会一直保密，条件满足的那一回合才自然融入故事。也可以让 AI 在游戏中规划新的隐藏剧情。
  contributes:
    settings:
      - key: planner
        label: 规划隐藏剧情
        description: 让 AI 在后台规划之后才会发生的隐藏剧情。每 3 回合多用一次 AI，花费更高。
    data:
      events:
        authoring:
          title: 隐藏剧情
runtimes/evaluate/RUNTIME.md:
  description: 每回合检查隐藏剧情的条件是否满足，满足就把它融入故事。
runtimes/intake/RUNTIME.md:
  description: 校验游戏中新规划的隐藏剧情，并把它们加入隐藏剧情表。
runtimes/plot/RUNTIME.md:
  description: 每隔几回合读取最新剧情和世界状态，为之后规划隐藏剧情。
