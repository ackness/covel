# Russian text of the story-events plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  displayName: Скрытые события
  description: Тайные сюжетные события, варианты и награды мира остаются скрытыми, пока не выполнятся их условия, а затем естественно открываются в игре. Поддерживает точные проверки, семантическую оценку ИИ и фоновое планирование событий.
  contributes:
    settings:
      - key: planner
        label: Планировать скрытые события
        description: Позволяет ИИ в фоне планировать будущие скрытые события. Раз в 3 хода тратится дополнительный запрос к ИИ, поэтому игра обходится дороже.
      - key: semanticJudge
        label: Оценивать текстовые условия
        description: Позволяет скрытому субагенту проверять текстовые скрытые условия и перефразированные скрытые варианты. В мирах без текстовых условий лишних вызовов ИИ нет.
      - key: maxJudgedPerTurn
        label: Максимум текстовых проверок за ход
        description: Предельное число отобранных текстовых скрытых условий, отправляемых на оценку за один ход.
    data:
      events:
        authoring:
          title: Скрытые события
          summary: Добавляет скрытые повороты сюжета, открываемые скрытые варианты и скрытые награды, срабатывающие по ходу истории или состоянию мира.
runtimes/evaluate/RUNTIME.md:
  description: Каждый ход проверяет, выполнены ли условия скрытого события, и если да, вплетает его в историю.
runtimes/assess/RUNTIME.md:
  description: После завершения хода оценивает скрытые условия, открывает скрытые варианты и выдаёт скрытые награды.
runtimes/judge/RUNTIME.md:
  description: Скрытый субагент, проверяющий по фактам истории, выполнены ли текстовые скрытые условия или намерение выбрать открытый вариант.
runtimes/intake/RUNTIME.md:
  description: Проверяет новые скрытые события, запланированные по ходу игры, и добавляет их в список.
runtimes/plot/RUNTIME.md:
  description: Раз в несколько ходов читает последние события и состояние мира и планирует скрытые события на будущее.
messages:
  Unlocked hidden actions: Открытые скрытые действия
  Hidden rewards unlocked: Получены скрытые награды
  Hidden action: Скрытое действие
  Item: Предмет
  Lore: Знание
  Reward: Награда
