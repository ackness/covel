- id: traditional-story
  label:
    zh-CN: 经典故事
    en-US: Classic Story
    ru-RU: Классическая история
  description:
    zh-CN: 边读边选行动，附带图鉴和人物关系图，适合长篇冒险。
    en-US: Read the story and pick your actions, with an almanac and a relationship map for long adventures.
    ru-RU: Читайте историю и выбирайте действия; энциклопедия и карта отношений помогают в долгих приключениях.
