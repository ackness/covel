- id: dialogue-mode
  label:
    zh-CN: 对话
    en-US: Dialogue
    ru-RU: Диалог
  description:
    zh-CN: 像聊天一样推进故事，有舞台画面、人物立绘和快捷回复。
    en-US: Play the story like a chat, with a stage, character portraits and quick replies.
    ru-RU: "Ведите историю как чат: со сценой, портретами персонажей и быстрыми ответами."
