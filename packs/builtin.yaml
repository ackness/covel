- id: traditional-story
  label:
    zh-CN: 传统故事模式
    en-US: Traditional Story
    ru-RU: Традиционная история
  description:
    zh-CN: 主叙事器、行动建议、图鉴和关系图，适合长篇探索。
    en-US: Narrator, suggestions, codex, and relationship memory for long-form
      exploration.
    ru-RU:
      Рассказчик, предложения, кодекс и память взаимоотношений для подробного
      исследования.
  tags:
    - mode:traditional-story
  source: builtin
  requested:
    - pregame
    - world-init
    - char-creator
    - narrator
    - guide
    - codex
    - npc-graph
    - living-world-rules
  recommended:
    - memory
- id: dialogue-mode
  label:
    zh-CN: 对话模式
    en-US: Dialogue Mode
    ru-RU: Диалоговый режим
  description:
    zh-CN: 对话优先叙事、场景演员、快速短句和角色资料。
    en-US:
      Dialogue-first narration, scene cast state, quick replies, and character
      profiles.
    ru-RU: Повествование через диалоги, состав текущей сцены, быстрые ответы и
      профили персонажей.
  tags:
    - mode:dialogue
  source: builtin
  # A world generated for this pack opens new sessions on the stage.
  defaultViewMode: stage
  requested:
    - pregame
    - world-init
    - char-creator
    - chat-mode-narrator
    - scene-stage
    - guide
    - character-blueprint
    - living-world-rules
    - branch-reply
  recommended:
    - memory
    - npc-graph
- id: low-cost
  label:
    zh-CN: 低成本
    en-US: Low Cost
    ru-RU: Бюджетный
  description:
    zh-CN: 保留核心流程和函数型插件，减少下游 LLM 调用。
    en-US: Keeps the core loop and function plugins while reducing downstream LLM calls.
    ru-RU:
      Сохраняет основной цикл и функциональные плагины, сокращая последующие
      вызовы LLM.
  tags:
    - cost:function
  source: builtin
  requested:
    - pregame
    - world-init
    - char-creator
    - narrator
    - living-world-rules
  recommended:
    - memory
- id: narrative-only
  label:
    zh-CN: 只要叙事
    en-US: Narrative Only
    ru-RU: Только повествование
  description:
    zh-CN: 只启用主叙事器。没有开局表单、角色创建、世界维度、世界时间和长期记忆，模型调用最少。
    en-US: Only the narrator. No opening form, character creation, world
      dimensions, world time or long-term memory, and the
      fewest model calls.
    ru-RU: Только рассказчик. Без вступительной формы, создания персонажа,
      измерений мира, мирового времени и долгой
      памяти, с наименьшим числом вызовов модели.
  tags:
    - mode:traditional-story
  source: builtin
  requested:
    - narrator
  excluded:
    - world-init
    - pregame
    - char-creator
    - world-time
    - memory
    - history-compaction
  recommended: []
- id: dm-mode
  tags: [mode:traditional-story]
  label:
    zh-CN: 主持人模式
    en-US: DM Mode
    ru-RU: Режим ведущего
  description:
    zh-CN: 使用现有叙事器的主持人口吻。在准备页自行选择玩家或主持人身份，再将叙事器的视角设为主持人；此组合不委托 NPC。
    en-US: Use the narrator's game-master perspective. Choose Player or Game master at creation, then set narrator Perspective to Game master. This composition does not delegate NPCs.
    ru-RU: Рассказчик в роли ведущего. Выберите роль при создании, затем перспективу ведущего в настройках рассказчика. Без делегирования NPC.
  source: builtin
  requested: [pregame, world-init, narrator]
  excluded: [char-creator, chat-mode-narrator]
  recommended: [guide, memory, codex]
  defaultViewMode: parsed
- id: ensemble-dialogue
  tags: [mode:dialogue]
  label:
    zh-CN: 群像对话
    en-US: Ensemble Dialogue
    ru-RU: Ансамблевый диалог
  description:
    zh-CN: 角色演员共同演出，默认点名策略即可游玩。可在回合策略的设置中改策略；作为主持人游玩时，准备页关闭建角并选择主持人身份。
    en-US: Character actors contribute together using the default mention strategy. Change strategy in Turn Policy settings. To play as Game master, disable character creation and choose that role during preparation.
    ru-RU: Актёры играют вместе со стратегией упоминаний. Стратегия меняется в настройках политики. Для роли ведущего отключите создание персонажа и выберите роль при подготовке.
  source: builtin
  requested:
    [
      pregame,
      world-init,
      char-creator,
      chat-mode-narrator,
      character-agent,
      turn-policy,
      scene-stage,
    ]
  excluded: [narrator]
  recommended: [guide, memory, character-blueprint]
  defaultViewMode: stage
- id: spectator
  tags: [mode:dialogue]
  label:
    zh-CN: 旁观
    en-US: Spectator
    ru-RU: Наблюдатель
  description:
    zh-CN: 准备页选择旁观者身份；在回合策略设置中选固定顺序、随机或导演，然后推进。选择主持人身份可用导演指示和旁白控制同一组 NPC。
    en-US: Choose Spectator at creation, then list, random or director in Turn Policy settings and Advance. Choose Game master instead to direct or narrate the same NPC cast.
    ru-RU: Выберите роль наблюдателя, затем список, случайный выбор или режиссёра в настройках политики и продвигайте историю. Роль ведущего позволяет давать указания и писать повествование.
  source: builtin
  requested:
    [
      pregame,
      world-init,
      chat-mode-narrator,
      character-agent,
      turn-policy,
      scene-stage,
    ]
  excluded: [narrator, char-creator]
  recommended: [memory]
  defaultViewMode: stage
