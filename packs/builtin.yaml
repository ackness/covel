- id: spectator
  label:
    zh-CN: 旁观
    en-US: Spectator
    ru-RU: Наблюдатель
  description:
    zh-CN: 只看不演：角色们自己推进故事，你随时可以插话。开局时选择「旁观者」。
    en-US: "Watch instead of play: the characters move the story on their own, and you can step in any time. Pick Spectator when you get ready."
    ru-RU: "Смотрите, а не играйте: персонажи сами двигают историю, а вы можете вмешаться в любой момент. При подготовке выберите роль наблюдателя."
