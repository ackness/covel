- id: dm-mode
  label:
    zh-CN: 主持人
    en-US: Game Master
    ru-RU: Ведущий
  description:
    zh-CN: 你来当主持人，掌控故事走向。开局时选择「主持人」，再把讲述者的「视角」设为主持人。
    en-US: You run the game. Pick Game master when you get ready, then set the Storyteller's Perspective to Game master.
    ru-RU: Вы ведёте игру. При подготовке выберите роль ведущего, затем в настройках рассказчика поставьте перспективу «Ведущий».
