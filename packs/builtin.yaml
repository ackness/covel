- id: ensemble-dialogue
  label:
    zh-CN: 群像对话
    en-US: Ensemble
    ru-RU: Ансамбль
  description:
    zh-CN: 多个角色一起演出，你提到谁，谁就开口。可在「轮流发言」设置里换成别的发言方式。
    en-US: Several characters take part together, and whoever you mention speaks. Change how they take turns in the Who Speaks Next settings.
    ru-RU: В сцене участвуют сразу несколько персонажей, и отвечает тот, кого вы упомянули. Порядок реплик можно изменить в настройках «Кто говорит».
