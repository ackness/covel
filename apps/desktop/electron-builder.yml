appId: com.covel.app
productName: Covel
copyright: Copyright © 2026 Covel

directories:
  output: ../../release/electron
  buildResources: resources

# Inject `-electron-` into artefact names so Electron and Tauri outputs
# (e.g. Covel_0.0.1-beta_aarch64.dmg) never get confused in release/.
artifactName: ${productName}-electron-${version}-${os}-${arch}.${ext}

# 我们不发布到 GitHub Release / S3，禁用 publish 即可避免 latest-*.yml
# 这种 auto-update 元数据被生成。
publish: null

# 打包结束后清理 release/ 下的中间产物（blockmap、解包目录、调试 yml），
# 让 release/electron/ 只剩 dmg / zip / exe / AppImage 等可分发安装包。
afterAllArtifactBuild: scripts/cleanup-artifacts.mjs

files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  # Built web frontend (static files)
  - from: staging/web-dist
    to: web-dist
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
  # Server 源码 + pnpm deploy 产出的扁平 node_modules。
  # 注意：electron-builder 的 extraResources 把 node_modules 单独列出才会
  # 完整复制（见 electron-builder #867、#6289），放进包含 node_modules
  # 的父目录时内部 fileMatcher 会按 "不打包源码的 deps" 规则跳过它。
  # 因此拆成两条：先拉源码 + 配置，再单独把 node_modules 打进同一目标。
  - from: staging/server
    to: server
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/*.test.ts"
      - "!**/*.spec.ts"
      - "!**/*.test.js"
      - "!**/*.spec.js"
      # 注意：不要用 "!**/*.md" —— 世界包 (WORLD*.md)、插件清单
      # (PLUGIN*.md) 以及 prompts/server/*.md 都是运行时依赖。
      - "!**/CHANGELOG*"
      - "!**/.gitignore"
      - "!**/.npmrc"
      - "!**/tsconfig.tsbuildinfo"
  - from: staging/server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
      - "!**/.cache/**"
      - "!**/*.map"

asar: true
asarUnpack:
  # tsx and its loader must be unpacked because they are spawned as a
  # child process that reads source files directly from disk.
  - "**/node_modules/tsx/**"
  - "**/node_modules/esbuild/**"
  - "**/node_modules/@esbuild/**"

compression: normal

# ── macOS ─────────────────────────────────────────────────────────
# Signing requirements (set these env vars in CI / before running `dist:mac`):
#   CSC_LINK           — path or https URL to the .p12 certificate bundle
#   CSC_KEY_PASSWORD   — password for the .p12 bundle
#   APPLE_ID           — Apple Developer account email (for notarization)
#   APPLE_APP_SPECIFIC_PASSWORD — app-specific password for notarization
#   APPLE_TEAM_ID      — Developer Team ID (e.g. "ABCDE12345")
# If the env vars are missing the build will produce an UNSIGNED artifact.
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.games
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: "Covel does not use the camera."
    NSMicrophoneUsageDescription: "Covel does not use the microphone."
  # Auto-signing: electron-builder picks up CSC_LINK from env. `identity` can
  # be set explicitly to disambiguate when multiple certs are installed:
  # identity: "Developer ID Application: Your Name (TEAMID)"
  notarize: false # set to `{ teamId: "${APPLE_TEAM_ID}" }` when certs are ready

dmg:
  sign: false # DMG signing is redundant once the app inside is signed

# ── Windows ───────────────────────────────────────────────────────
# Signing requirements:
#   CSC_LINK           — path or https URL to the .pfx bundle
#   CSC_KEY_PASSWORD   — password for the .pfx bundle
#   WIN_CSC_TIMESTAMP_SERVER — optional RFC 3161 timestamp URL
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  # electron-builder 26.x 起签名相关字段改到 signtoolOptions 下。
  # 未配置 CSC_LINK 时会直接输出 unsigned 产物。
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
  # verifyUpdateCodeSignature defaults to true in electron-updater — keep it
  # for published builds but allow unsigned locally via env.
  # publisherName: "Your Organization"  # uncomment once cert is in place

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false # preserve user worlds/plugins on uninstall

# ── Linux ─────────────────────────────────────────────────────────
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  category: Game
  maintainer: covel@example.com
  desktop:
    entry:
      Name: Covel
      Comment: AI-powered interactive storytelling
      Categories: Game;RolePlaying;
      StartupWMClass: Covel

# ── Auto-update (electron-updater) ────────────────────────────────
# Uncomment once a release channel is wired up:
# publish:
#   - provider: github
#     owner: AcKnEsS
#     repo: covel
#     releaseType: release
