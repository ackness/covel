<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>Covel</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #09090b;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #fafafa;
          color: #09090b;
        }
        .brand {
          color: #18181b;
        }
        .status {
          color: #52525b;
        }
      }
      .brand {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #e4e4e7;
        margin-bottom: 40px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 24px;
      }
      .status {
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #a1a1aa;
        min-height: 20px;
      }
      .err {
        color: #f87171;
        font-size: 12px;
        max-width: 420px;
        text-align: center;
        line-height: 1.5;
        margin-top: 16px;
        white-space: pre-wrap;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="brand">COVEL</div>
    <div class="spinner"></div>
    <div class="status" id="status">Starting…</div>
    <div class="err" id="err"></div>
    <script>
      // Listen for progress updates from the Rust main process.
      if (window.__TAURI__?.event?.listen) {
        window.__TAURI__.event.listen("covel://status", (e) => {
          const p = e.payload || {};
          if (p.label) document.getElementById("status").textContent = p.label;
          if (p.error) document.getElementById("err").textContent = p.error;
        });
      }
    </script>
  </body>
</html>
