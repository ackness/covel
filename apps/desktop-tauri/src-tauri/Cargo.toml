[package]
name = "covel-desktop-tauri"
version = "0.0.1-beta"
description = "Covel desktop shell (Tauri)"
authors = ["Covel"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
