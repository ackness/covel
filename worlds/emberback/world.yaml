# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
schemaVersion: "1.0"
id: emberback
name: Emberback Relay
version: 1.2.0
summary: A lonely relay on a tidally locked world receives a distress call in
  your own voice—sent from seventy-two hours in the future.
defaultLocale: en-US
supportedLocales:
  - en-US
  - zh-CN
tags:
  - science-fiction
  - frontier
  - mystery
  - exploration
author:
  name: Covel Contributors
  url: https://github.com/ackness/covel
license: MIT
cover: media/gallery/world-cover.webp
accentColor: "oklch(72% 0.14 50)"
pluginPolicy:
  packs:
    - id: emberback-rescue
      label: Emberback Rescue
      description: >-
        A traditional story with dice checks, quests, a field inventory, crew
        relationships, and live panels for the storm, the power grid, the signal
        log, and the convoy.
      tags:
        - mode:traditional-story
      reason: >-
        Every choice in the three hours before Crownfire spends something —
        time, charge, cargo, or trust — and the panels show exactly what is
        left.
      requested:
        - pregame
        - world-init
        - char-creator
        - narrator
        - dice-check
        - core-quest
        - inventory
        - affinity
        - guide
        - codex
        - npc-graph
        - living-world-rules
        - character-blueprint
        - story-events
      recommended:
        - branch-reply
  presetId: emberback-rescue
  preferredTags:
    - mode:traditional-story
  avoidedTags:
    - mode:dialogue
  requested:
    - dice-check
    - core-quest
    - inventory
    - affinity
  recommended:
    - npc-graph
    - codex
    - guide
    - character-blueprint
    - living-world-rules
    - story-events
pluginSettings:
  story-events:
    planner: true
characterSchema:
  types:
    - npc
    - companion
  attributes:
    - id: grit
      name: Grit
      type: number
      min: 0
      max: 5
      defaultValue: 2
      category: stats
      description:
        Strength and endurance for hard travel, lifting, climbing, and
        staying functional under heat or cold stress.
    - id: systems
      name: Systems
      type: number
      min: 0
      max: 5
      defaultValue: 2
      category: abilities
      description:
        Technical skill with radios, power grids, vehicles, sensors, and
        improvised repairs.
    - id: fieldcraft
      name: Fieldcraft
      type: number
      min: 0
      max: 5
      defaultValue: 2
      category: abilities
      description: Practical judgment for navigation, weather, driving, route
        planning, and survival beyond the station.
    - id: insight
      name: Insight
      type: number
      min: 0
      max: 5
      defaultValue: 2
      category: stats
      description: Pattern recognition, careful observation, and the ability to
        separate a meaningful signal from noise.
    - id: rapport
      name: Rapport
      type: number
      min: 0
      max: 5
      defaultValue: 2
      category: social
      description:
        The ability to earn trust, calm conflict, read a room, and persuade
        people without treating them as obstacles.
