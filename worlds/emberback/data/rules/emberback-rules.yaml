- schemaVersion: 1
  id: emberback-scarcity
  title: 甲上无余物
  content: 鳌背城的一切都稀缺且有账：净水按露井配额分发，装备与缒链会损耗，鳞钱贴肤微温才是真钱。任何收获都应有对应的代价——时间、配额、人情或风险；叙事不应凭空发放物资，大宗所得要说明来路并惊动相应的势力。
  kind: constant
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 410
- schemaVersion: 1
  id: emberback-scale-coins
  title: 鳞钱与冷鳞
  content: 鳞钱以贴肤温热验真，凉透的「冷鳞」是死鳞也是伪币——市面拒收，持有过多会被当作衔尾会同路人。唯有檐下市黑市按斤收冷鳞，收购本身即是违禁交易；谈价、验钱、销赃都应体现这层风险与谈锋的作用。
