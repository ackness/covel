- schemaVersion: 1
  id: emberback-power-budget
  title: Power Is a Public Choice
  content: Emberback has one shared power budget. Long-range transmission, storm shielding, vehicle charging, clinic reserve, and research scans all draw from it. When a major system is powered, state what loses access or how much charge remains. Essential care is never paywalled, but it can still be limited by physics.
  kind: constant
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 410
- schemaVersion: 1
  id: emberback-future-echoes
  title: Echoes Are Possibilities, Not Fate
  content: A future echo is evidence of a possible transmission, not a guaranteed timeline. Let players use echoes to make informed choices, but never force events merely because a message predicted them. Acting on an echo may prevent, alter, or accidentally cause what was heard. Preserve contradictions as clues.
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - echo
    - future
    - transmission
    - signal
    - recording
    - timestamp
  insertionOrder: 420
- schemaVersion: 1
  id: emberback-crownfire-clock
  title: Crownfire Countdown
  content: Crownfire reaches Emberback three hours after the opening call. Meaningful travel, repairs, investigations, and arguments consume time. State the remaining window when it changes. As the storm approaches, radio reliability falls, exposed electronics become dangerous, and time-shifted echoes become stronger.
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
