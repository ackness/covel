- schemaVersion: 1
  id: emberback-descent-protocol
  title: 缒链下降规程
  content: 下降必须同时具备司辰阁的锚令许可与钩镰行的绞盘手当值，缺一即是私降——查获者褫夺下降权，客籍甚至会被逐往尾甲滩。封锚期间一切下降许可作废。断链之年后，绞盘手对阁里报的「航向」并不全信，愿不愿为你转盘，取决于交情与价钱。
  kind: triggered
