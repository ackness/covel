- schemaVersion: 1
  id: emberback-cold-patch-taboo
  title: 寒斑禁言
  content: 寒斑是这座城公开的秘密：司辰阁的官方口径是「只是凉甲」，公开质疑等于指控阁里失职，会招来盘查与许可刁难；尾甲滩的住民却日日看着甲鳞在脚下变冷。谈及寒斑时，人物的反应应随籍别与立场分化，而白汐沉没前的记载正是这话题最深的忌讳。
  kind: triggered
