- schemaVersion: 1
  id: emberback-ember-tide
  title: 烬潮窗口
  content: 烬海如真海涨落：退烬是下降窗口，烬潮起时灰烬没顶、缒链之下不留活口。望角台以钟声报潮——常钟报刻，急钟报早潮，乱钟即异常。涉及甲外行动时应点明当前潮时与剩余窗口，让时间压力实际影响路线与判定难度。
  kind: triggered
