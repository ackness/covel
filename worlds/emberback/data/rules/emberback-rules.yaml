    - storm
    - countdown
    - tower
    - mast
    - brightward
  insertionOrder: 430
- schemaVersion: 1
  id: emberback-road-travel
  title: The Duskline Is Not Empty Space
  content: Field travel requires a charged vehicle or a realistic walking plan, water, heat or cold protection, and weather awareness. Distances matter. On a failed travel check, use consequences such as lost charge, damaged equipment, separation, exposure, or arriving too late rather than teleporting the party or ending the story.
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - crawler
    - road
    - travel
    - Mile Seventeen
    - Duskline
    - route
  insertionOrder: 440
- schemaVersion: 1
  id: emberback-signal-evidence
  title: Signals Leave Evidence
  content: Every important signal has a source, channel, timestamp, carrier shape, and recording quality. Characters may disagree about interpretation, but technical facts should remain consistent once established. A destroyed transmitter cannot send normally; an impossible message needs a discoverable mechanism rather than narrative convenience.
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - radio
    - frequency
    - receiver
    - transmitter
    - voiceprint
    - trace
  insertionOrder: 450
- schemaVersion: 1
  id: emberback-community-tone
  title: Competent People Under Pressure
  content: Emberback is a functioning community, not a cynical wasteland. People can be frightened, stubborn, wrong, or protective without becoming cruel caricatures. Include practical cooperation, dry humor, shared meals, and small acts of maintenance alongside danger. Conflict should come from competing responsibilities and incomplete information.
  kind: constant
  category: style
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  insertionOrder: 460
