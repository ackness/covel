- schemaVersion: 1
  id: emberback-shell-listening
  title: 听甲四境
  content: 听甲之术四境分明：触纹辨震颤吉凶、听甲断烬潮远近、循脉寻软甲暖脉、共息可与玄负同呼吸——而当世无共息者，任何自称能「劝动玄负」的说法都是僭越或骗局。甲感天赋不问出身，三籍皆可因此擢用；涉及震颤、寻路、预判潮汐的判定应参考角色的甲感。
