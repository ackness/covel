- id: emberback-power-budget
  title: 电力是公共抉择
  content: 余烬背只有一个共享电力预算。远程天线阵列、风暴护盾、载具充电、诊所用电与科研扫描都依赖于此。中继电网面板持有权威的储能数据与各系统供电状态。在叙事中切换主要系统时，请明确交代哪些设施因此断电；切勿与电网面板当前的数值产生矛盾。急救医疗绝不标价出售，但仍受物理法则限制。
- id: emberback-future-echoes
  title: 回声是可能性，而非既定命运
  content: 来自未来的回声只是某次潜在传输的证据，并非注定的时间线。引导玩家利用回声做出深思熟虑的抉择，但绝不要仅仅因为讯息预言了某事就强推剧情走向。针对回声采取行动，可能预防、改变甚至弄巧成拙促成所听到的后果。保留前后矛盾之处，作为破局的线索。
- id: emberback-crownfire-clock
  title: 王冠火倒计时
  content: 王冠火将于站区时间 09:14 席卷余烬背，即 06:14 那通开局呼叫的三小时后。实际的赶路、抢修、调查与争辩均会消耗时间。站区时钟是时间的基准，“王冠火倒计时”面板即为换算出的剩余窗口期（09:14 减去当前时间）；在关键时刻提及倒计时，且切勿与面板数值相矛盾。随着风暴逼近，无线电可靠性骤降，外露电子设备愈发凶险，带有时差的回声也会变得越来越强。
  keys:
    - 王冠火
    - 风暴
    - 倒计时
    - 塔
    - 桅杆
    - 向阳面
- id: emberback-road-travel
  title: 暮界线绝非真空荒原
  content: 在野外出行需要电量充足的载具或切实可行的徒步方案，并备好饮水、防热防寒装备，且时刻警惕天候变化。路途距离至关重要。若出行判定失败，应带来消耗电量、损坏设备、人员走散、暴露于严苛环境或延误晚到等实际代价，切勿直接让队伍瞬移，更不可直接终结故事。
  keys:
    - 爬行器
    - 道路
    - 旅行
    - 十七英里
    - 暮界线
    - 路线
- id: emberback-signal-evidence
  title: 信号必留痕迹
  content: 每个关键信号都有其源头、信道、时间戳、载波波形与录音质量。角色之间对含义的解读或有分歧，但技术事实一旦确立便须保持一致。损毁的发射机无法正常发报；看似不可能的消息背后必有可探寻的技术机制，绝不可仅凭叙事便利随手编造。
- id: emberback-community-tone
  title: 高压之下恪尽职守的人们
  content: 余烬背是一个仍在运转的互助社区，而非冷酷荒颓的废土。人们或许会恐惧、固执、犯错或护短，但绝非脸谱化的恶徒。在危机四伏的环境中，叙事同样应展现务实的互助、冷幽默、围坐共进的餐食，以及日常细微的维护工作。冲突应当源于各司其职的责任分歧与不完整的信息。
