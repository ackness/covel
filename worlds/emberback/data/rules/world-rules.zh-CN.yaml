- id: emberback-power-budget
  title: 电怎么用，是公共的事
  content: 余烬背只有一份共享的电力预算。远程发射、风暴护盾、车辆充电、诊所备用电和科研扫描都从里面取电。储备电量和各系统是否通电，以“中继电网”面板为准。切换重要系统时，要在正文里直接写明，并说清哪些地方因此断了电；不要与电网面板当前的数值矛盾。必要的医疗救治从不以付费为门槛，但仍会受物理条件限制。
- id: emberback-future-echoes
  title: 回声是可能，不是命运
  content: 来自未来的回声，是一次可能发生的发射的证据，不是一条有保证的时间线。让玩家借助回声做出有依据的选择，但不要只因为某条讯息预言了某件事，就硬让它发生。照着回声行动，可能阻止、改变，也可能无意中促成所听到的事。前后矛盾之处要保留下来，当作线索。
  keys:
    - 回声
    - 未来
    - 发射
    - 信号
    - 录音
    - 时间戳
- id: emberback-crownfire-clock
  title: 王冠火倒计时
  content: 王冠火在站区时间 09:14 到达余烬背，也就是 06:14 开场呼叫之后三小时。像样的赶路、修理、调查和争论都要花时间。站区时钟是唯一的准绳，“王冠火倒计时”面板就是把这台时钟换算成的剩余时间（09:14 减去现在）；需要时提到它，绝不与它矛盾。风暴越近，无线电越靠不住，外露的电子设备越危险，带时差的回声越强。
  keys:
    - 王冠火
    - 风暴
    - 倒计时
    - 塔
    - 桅杆
    - 向阳
- id: emberback-road-travel
  title: 暮界线不是空白地带
  content: 外出需要一辆充好电的车或一个切实可行的步行计划，还要带水、带防热或防寒装备，并留意天气。路有多远，是要算的。出行判定失败时，后果可以是电量用掉、装备损坏、队伍走散、暴露在恶劣环境里或者到得太迟；不要让队伍瞬间移动，也不要直接结束故事。
  keys:
    - 爬行器
    - 道路
    - 旅行
    - 十七英里
    - 暮界线
    - 路线
- id: emberback-signal-evidence
  title: 信号会留下证据
  content: 每个重要信号都有来源、信道、时间戳、载波波形和录音质量。角色可以对它的含义各执一词，但技术事实一经确定就要保持一致。被毁的发射机无法正常发射；一条不可能的消息需要一个查得出来的机制，而不是靠剧情方便。
  keys:
    - 电台
    - 频率
    - 接收器
    - 发射机
    - 声纹
    - 追查
- id: emberback-community-tone
  title: 压力下的能干人
  content: 余烬背是一个正常运转的社区，不是人心冷漠的废土。人可以害怕、固执、犯错、护着身边的人，但不会因此变成刻薄的脸谱人物。危险之外，也要写务实的协作、冷幽默、大家一起吃的饭，以及修修补补的小事。冲突应当来自互相拉扯的职责和不完整的信息。
