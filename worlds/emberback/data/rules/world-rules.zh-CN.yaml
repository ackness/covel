- id: emberback-power-budget
  title: 电力是公共选择
  content: 余烬背只有一个共享电力预算。远程传输、风暴屏蔽、车辆充电、诊所储备和研究扫描都从中取电。中继网格面板持有权威储备数据及当前供电的系统。切换主要系统时，请在页面上明确说明并指出哪些部分将失去访问权限；切勿与当前的网格数值矛盾。基本医疗护理绝不收费，但仍受物理条件限制。
- id: emberback-future-echoes
  title: 回声是可能性而非命运
  content: 未来回声是某种可能传输的证据，而非确定的时间线。让玩家利用回声做出明智选择，但切勿仅因消息预测了某事就强行推动事件发生。根据回声行动可能会阻止、改变或意外导致所听到的内容。保留矛盾作为线索。
- id: emberback-crownfire-clock
  title: 王冠火倒计时
  content: 王冠火将在开场通话三小时后抵达余烬背。有意义的旅行、维修、调查和争论都会消耗时间。王冠火倒计时面板持有权威的剩余时间窗口；在关键时刻提及它，切勿与其矛盾。随着风暴逼近，无线电可靠性下降，裸露的电子元件变得危险，时间错位的回声也会增强。
  keys:
    - 王冠火
    - 风暴
    - 倒计时
    - 塔
    - 桅杆
    - 明亮哨站
- id: emberback-road-travel
  title: 暮线并非虚空
  content: 野外旅行需要一辆充满电的车辆或切实可行的步行计划、水、防寒或防暑措施以及对天气的警觉。距离至关重要。若旅行检定失败，应产生诸如电量耗尽、设备损坏、队伍失散、暴露于危险或迟到等后果，而非直接传送队伍或终结故事。
  keys:
    - 爬行器
    - 道路
    - 旅行
    - 十七英里
    - 暮界线
    - 路线
- id: emberback-signal-evidence
  title: 信号留下证据
  content: 每个重要信号都有来源、频道、时间戳、载波形态和记录质量。角色们可能对解读存在分歧，但一旦确立，技术事实必须保持一致。被摧毁的发射器无法正常发送；一条不可能的消息需要有可发现的机制来解释，而不能依靠叙事便利。
- id: emberback-community-tone
  title: 高压下的能人
  content: 余烬背是一个运作中的社区，而非愤世嫉俗的荒原。人们可以感到恐惧、固执、犯错或具有保护欲，而不会变成残酷的漫画式人物。在危险之中，也要包含务实的合作、冷幽默、共享餐食以及微小的维护行为。冲突应源于相互竞争的责任和不完整的信息。
