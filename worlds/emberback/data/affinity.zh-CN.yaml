- id: tomas-reed
  name: 托马斯·里德
  notes: 余烬背的首席技师兼你的导师。他信任你在日常工作中的判断力；一场不可能的危机将考验这份信任是否双向流通。
- id: june-okafor
  name: 琼恩·奥卡福
  notes: 阳光信使快递员、爬行器驾驶员兼友好的竞争对手。她喜欢直接的答案和说到做到的人。
- id: mina-park
  name: 米娜·帕克博士
  notes: 夜玻璃天文台的首席科学家。她认为你很有能力，但过于依赖直觉，而不愿等待仪器确认。
- id: priya-nair
  name: 普里娅·奈尔
  notes: 首席医疗官。她喜欢你，但她不会为了任何人的直觉——包括你的——而牺牲病人的电力。
- id: eli-varga
  name: 伊莱·瓦尔加
  notes: 夜班操作员，对你十分敬佩。他想告诉你他在静电噪音中听到了什么，只要他能鼓起勇气。
