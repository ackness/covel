- id: tomas-reed
  name: 托马斯·里德
  notes: 余烬背的首席技术员，也是你的师傅。日常的活计上，他信得过你的判断；这场不可能的危机要考验的是，这份信任是不是双向的。
- id: june-okafor
  name: 琼·奥卡福
  notes: 逐日者信使、爬行器驾驶员，也是爱跟你较劲的朋友。她喜欢痛快的回答，也喜欢说到就到的人。
- id: mina-park
  name: 米娜·帕克博士
  notes: 夜玻璃天文台的首席科学家。她觉得你有本事，只是太容易抢在仪器对上之前，先信了直觉。
- id: priya-nair
  name: 普里娅·奈尔
  notes: 诊所的首席医师。她喜欢你，但不会拿病人的电去换任何人的直觉——你的也不行。
- id: eli-varga
  name: 伊莱·瓦尔加
  notes: 夜班信号员，很崇拜你。他想告诉你自己在杂音里听到了什么——如果他鼓得起勇气。
