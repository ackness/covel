- id: tomas-reed
  name: 托马斯·里德
  notes: 余烬背首席技术员，也是带你的导师。他信任你在日常工作中的判断力；而这场不可思议的危机，将考验这份信任是否经得起相互托付。
- id: june-okafor
  name: 琼恩·奥卡福
  notes: “逐日者”信使、爬行器驾驶员，也是暗中与你较劲的同伴。她喜欢直来直去的回答，以及说到做到、言出必行的人。
- id: mina-park
  name: 米娜·帕克博士
  notes: 夜玻璃天文台负责人。她认可你的能力，但认为你过于轻信直觉，等不及仪器得出确证。
- id: priya-nair
  name: 普里娅·奈尔
  notes: 诊所首席医师。她挺欣赏你，但绝不会为了任何人的直觉——哪怕是你——而克扣病人的救命用电。
- id: eli-varga
  name: 伊莱·瓦尔加
  notes: 夜班信号员，对你满怀敬佩。他很想告诉你自己在静电杂音里听到了什么，只要他能鼓起勇气。
