- id: call-from-tomorrow
  name: The Call from Tomorrow
  description: Your own voice has sent a warning from seventy-two hours in the future. Preserve the recording, determine how it reached Emberback, and decide how much of it to share before Crownfire arrives.
  status: active
  giver: Unknown future caller
  reward: The truth behind Emberback's first long-range echo
  objectives:
    - id: preserve-recording
      text: Make an isolated copy of the future transmission
      done: false
    - id: verify-voice
      text: Compare the signal against your station voiceprint
      done: false
    - id: trace-origin
      text: Trace the echo's time and location signature
      done: false
- id: stop-mile-seventeen
  name: Stop the Convoy
  description: June is escorting thirty medical cryo-packs toward the exact place named in the future warning. Reach her before long-range communications fail completely.
  status: active
  giver: Your future self
  reward: The convoy's safety and June's trust
  objectives:
    - id: contact-june
      text: Establish contact with June's crawler
      done: false
    - id: change-route
      text: Convince or reach the convoy before Mile Seventeen
      done: false
- id: keep-the-relay-alive
  name: Three Hours of Power
  description: Crownfire will hit Emberback in three hours. The relay cannot simultaneously power the main array, storm shields, crawler chargers, clinic reserve, and Mina's full-spectrum scan.
  status: active
  giver: Emberback Relay Cooperative
  reward: A station still capable of answering calls
  objectives:
    - id: audit-charge
      text: Review the station's power budget
      done: false
    - id: choose-priorities
      text: Commit charge to the systems that matter most
      done: false
