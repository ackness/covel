# 会话 lorebook 常量词条（to: lorebook，key: id，content 为注入正文）
- id: xuanfu
  content: 玄负——世上最后一头负城巨鳌，驮着鳌背城在烬海上走了三百年。城的暖、水、钱都出自它的甲：甲缝积土成田，甲棱凝露入井，蜕鳞打磨成鳞钱。它近年在变慢，尾甲的鳞一块块凉下去；今晨它毫无征兆地垂首停驻在一座无人标注的黑色尖塔旁——上一次它自行停驻，是十二年前的断链之年。
- id: lin-qian
  content: 鳞钱——玄负蜕鳞打磨成的小片货币，贴肤微温，温度就是防伪。凉透的「冷鳞」是死鳞，也是伪币，正市不收；但檐下市的衔尾会一直在暗中回收冷鳞，价钱给得反常地好，没人知道他们收去做什么。
- id: descent-rules
  content: 下降规程——拾荒队自尾锚桩挂缒链坠下百丈进入泊点，须备齐装具（甲带、钩镰、露水、摔响哨）方可挂链；摔响哨三短一长是收链信号。烬潮预警一响必须回链，赖着不走就是找死。锚令封锚时以火漆封链，未经许可下降者吊销行籍。断链之年后，规程写进了每个学徒的第一课。
- id: cold-patches
  content: 寒斑——三年前起，尾甲的鳞开始一块块凉透，冷斑逐月蔓延，斑上的甲田绝收、居民迁居无门。司辰阁对外称「季节性凉甲」，却在暗中悬赏测绘寒斑边界。老拾荒人私下说：鳞是从里头凉出来的——凉的不是甲，是玄负。
- id: qin-jiulian
  content: 秦九镰——悬钩堂司单人，掌委托挂单与生死簿。断链之年的幸存者，左臂留在了烬海里，如今用一只铁钩代手。守信、记仇、把账算到一钱不差。她担保了你的行籍，把你当半个徒弟，也当一枚能下到别人不敢下之处的棋子。
- id: wen-ci
  content: 温辞——司辰阁少卿，年纪不大，锚令与下降许可都攥在他手里。认定拾荒人的鲁莽迟早惊动玄负，尤其看不惯盲索那一脉「不问吉凶就下链」的做派。为人刻板却不贪，暗地里正被寒斑测绘的差事压得喘不过气——阁里嘴上说凉甲无事，悬赏却一加再加。
- id: ya-xian
  content: 哑弦——檐下市的冷鳞贩子，衔尾会的耳目。嗓子坏了，说不出整句话，以一把三弦代替语气：拨一声是应，闷一声是拒，急扫是警告。消息灵通得可怕，自称欠你师父盲索一条命，但他替衔尾会做的事，从不写在脸上。
- id: mang-suo
  content: 盲索——你的师父，上一辈最好的循脉者，双目早盲，凭甲感在鳌甲与沉城间行走如常人视物。去年独自下降后再没上来，尸骨无还。留给你一柄钩镰和半张烧焦的白汐城旧图——图上有人用冷鳞粉标了一个记号，你至今不知道那是什么意思。
