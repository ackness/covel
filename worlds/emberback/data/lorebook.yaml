- id: emberback-relay
  strategy: selective
  keys: [Emberback, relay]
  content: Emberback Relay is a cooperative communications station built into a rust-red ridge on Vesper's habitable Duskline. Its three masts connect six thousand people across the western relay chain. The station's promise is simple—no call goes unanswered—but power, parts, and time are always limited.
- id: vesper
  strategy: selective
  keys: [Vesper, Duskline]
  content: Vesper is tidally locked. Its day side is hot enough to soften exposed metal and its night side lies under moving ice. Human settlement follows the Duskline between them, where long shadows make heat and cold survivable.
- id: crownfire
  strategy: selective
  keys: [Crownfire, storm]
  content: Crownfire is a charged atmospheric storm that runs along the Duskline. It paints gold ribbons in the sky, overloads exposed electronics, scrambles ordinary radio, and can carry time-shifted echoes much farther than normal.
- id: echo-traffic
  strategy: selective
  keys: [echo, signal]
  content: Echo traffic is a recorded signal that arrives before its source transmission. Nightglass has verified short weather echoes, but the player's seventy-two-hour distress call is unprecedented. An echo describes a possible future; acting on it may prevent, change, or cause the event.
- id: mile-seventeen
  strategy: selective
  keys: [Mile Seventeen, convoy]
  content: Mile Seventeen is an exposed crossing on the Brightward Road with a field repeater and a natural basalt arch. A medical convoy carrying thirty cryo-packs is heading there now. The future call says not to let it arrive.
