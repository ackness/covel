- id: second-echo
  title: 第二次回声
  payload: 王冠火已经很近，远程天线阵列又通着电，这时所有接收器都收到第二段发射，残缺得厉害，仍是主角自己的声音，时间戳比第一段指向更远的未来。只剩下零星片段：一声喘息，一句“在拱门下”，还有一个和十七英里那台野外中继器吻合的载波波形。技术事实要写得具体、前后一致；让在场的人做出反应；它的含义保持开放，不要揭示是谁发出这通呼叫、为什么发。
- id: eli-heard-more
  title: 伊莱听到了什么
  payload: 06:14 的呼叫一旦被溯源或证实，伊莱终于把主角拉到一边。主角的声音停下之后，他在杂音里还听到了别的东西——另一个声音在从十倒数，他几乎可以肯定那是米娜。他一直没说，是因为以为自己当班时弄坏了什么。写出他的紧张，还有终于说出口时的如释重负；不要证实那段倒数意味着什么。
- id: arch-transmits
  title: 拱门发报
  payload: 车队来到十七英里的玄武岩拱门下时，固定在拱门下的那台野外中继器自己开了机，开始在中继站的应急信道上发射。有一秒钟，范围内的每一台电台都传出 06:14 那通呼叫开头的那一声吸气——是实时的，就从这里，就在此刻。接着便断成一片杂音。技术事实要写具体（信道、中继器的状态指示灯、爬行器上的仪表），让在场的人做出反应；不要解释其中的机制，也不要透露最后由谁把这次发射完成。
