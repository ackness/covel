- id: second-echo
  title: 第二次回声
  payload: 随着王冠火接近且远程阵列通电，每台接收器都捕捉到一段严重破碎的第二次传输，声音正是英雄本人的，其时间戳比第一次更靠后。仅存片段——一次呼吸、词语“拱门之下”，以及与十七英里场中继器相匹配的载波形状。使技术事实具体且一致，让船员做出反应，并保持其含义开放；不要揭示是谁发送了呼叫或为何发送。
- id: eli-heard-more
  title: 伊莱听到的内容
  payload: 一旦 06:14 的呼叫被追踪或验证，伊莱终于把英雄拉到一边。在英雄的声音停止后，他在静电噪音中听到了别的东西——一个从十开始倒计时的第二个声音，他几乎确信那是米娜的声音。他保持沉默是因为他认为自己在轮班时弄坏了什么东西。演绎他的紧张情绪以及告诉某人后的解脱感；不要确认倒计时意味着什么。
- id: arch-transmits
  title: 拱门传输
  payload: 当车队位于十七英里的玄武岩拱门下时，固定在其下方的场中继器自行开启，并在中继器的紧急频道上开始传输。有一秒钟，范围内的每台无线电都收到了 06:14 呼叫的开头部分——现场直播。然后它切断并转为静电噪音。使技术事实具体（如中继器、爬行者仪表），让船员做出反应；不要解释机制或谁将继续传输。
