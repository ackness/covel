- id: second-echo
  title: 第二次回声
  payload: 随着王冠火逼近且远程天线阵列通电，所有接收器都捕捉到了第二通断续破碎的讯息，声音正是你本人的，时间戳比第一次还要靠后。留存下来的只有只言片语——一声喘息、一句“在拱门下”，以及与十七英里野战中继器完全吻合的载波波形。请交代具体且一致的技术细节，描写站内同伴的反应，并对信号的含义保留悬念；切勿提前揭晓是谁发出的呼叫或为何发报。
- id: eli-heard-more
  title: 伊莱听到的秘密
  payload: 在 06:14 的呼叫查明来源或核实真伪后，伊莱终于把你悄悄拉到一旁。在你自己的声音戛然而止后，他其实在静电杂音里听到了别的东西——另一个声音正在从十倒数，而且他几乎笃定那就是米娜的声音。他先前之所以守口如瓶，是生怕自己在值班时弄坏了设备。请刻画出他的局促紧张，以及终于向人倾诉后的如释重负；切勿向玩家证实这段倒计时究竟意味着什么。
- id: arch-transmits
  title: 拱门发报
  payload: 当车队驶入十七英里的玄武岩拱门下方时，固定在拱门下的野战中继器竟自行启动，在中继站的应急信道上开始发报。在短短一秒之内，覆盖范围内的所有电台都收到了 06:14 那通呼叫开头的吸气声——就在此时此地，实时发报。随即信号中断，化为一片静电杂音。请交代具体的技术细节（信道、中继器指示灯、爬行器仪表），刻画车队同伴的真实反应；切勿解释背后的运作机制，也不要透露究竟是谁会去闭合这次发报。
