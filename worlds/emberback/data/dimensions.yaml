  initialValue:
    currencies:
      - name: Trade chits
        symbol: tc
        description: Cooperative credit accepted for food, repairs, route passage, and personal supplies. Essential emergency service is never denied for lack of chits.
    resources:
      - Battery charge
      - Condensed water
      - Ceramic electronics
      - Crawler parts
      - Medical cryo-packs
    tradeNotes: Power is Emberback's real budget. Every major repair, transmission, vehicle charge, or research scan takes energy away from another public need.
