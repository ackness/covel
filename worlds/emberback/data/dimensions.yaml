mechanics:
  name: Mechanics
  schema:
    type: object
    properties:
      combatStyle:
        type: string
        title: Combat
      difficulty:
        type: string
        title: Difficulty
      skillSystem:
        type: string
        title: Checks
      customRules:
        type: array
        items:
          type: string
        title: House rules
    additionalProperties: false
  initialValue:
    combatStyle: narrative
    difficulty: normal
    skillSystem: Risky actions use Grit, Systems, Fieldcraft, Insight, or Rapport. Failure changes time, charge, trust, safety, or the quality of available information rather than simply stopping the story.
    customRules:
      - Track the Crownfire countdown and state the cost when an action consumes meaningful time.
      - Vehicles, radios, and station systems require charge; power committed in one place is unavailable elsewhere.
      - Future echoes provide clues, never mandatory outcomes. Player choices may prevent, alter, or cause the heard transmission.
      - Commitments and discoveries belong in the quest and signal logs.
      - Important characters remember honesty, care, competence, and whose safety the player prioritized.
startingConditions:
  name: Opening
  schema:
    type: object
    properties:
      openingScenario:
        type: string
        title: Opening scene
      openingHook:
        type: string
        title: Hook
      openingChips:
        type: array
        items:
          type: string
        title: Opening moves
      playerConstraints:
        type: array
        items:
          type: string
        title: Constraints
      startingLocation:
        type: string
        title: Starting point
    additionalProperties: false
  initialValue:
    openingScenario: At 06:14 every receiver at Emberback plays the same impossible distress call—your own voice, speaking from seventy-two hours ahead. The message warns you to stop a medical convoy at Mile Seventeen, keep Mina off the tower, and prevent Tomas from shutting down the signal. The network then fails as a Crownfire storm approaches.
    openingHook: The future used your voice. Who do you warn first?
    openingChips:
      - Play the recording for Tomas
      - Call June and stop the convoy
      - Climb after Mina
      - Trace the signal before it fades
      - Check the station's remaining charge
    playerConstraints:
      - You are Emberback's newest linekeeper, trained but not yet trusted to run a crisis alone.
      - Crownfire reaches the ridge in three hours.
      - The medical convoy is already moving and long-range communication is failing.
    startingLocation: Emberback Relay, Signal Room
