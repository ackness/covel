crownfire:
  name: Crownfire Countdown
  description: Minutes until the Crownfire storm reaches the ridge, and how close it feels.
  schema:
    type: object
    properties:
      minutesRemaining:
        type: integer
        title: Minutes left
        minimum: 0
        maximum: 180
      stage:
        type: string
        title: Storm
        enum: [distant, approaching, imminent, overhead, passing]
        x-enumLabels:
          distant: On the horizon
          approaching: Approaching
          imminent: Imminent
          overhead: Overhead
          passing: Passing
    required: [minutesRemaining, stage]
    additionalProperties: false
  initialValue:
    minutesRemaining: 180
    stage: distant
  updateRule: >-
    Subtract the story time this turn's narrative actually spends: a short conversation 5–10 minutes, a repair, search, or argument 15–40, a crawler run to Mile Seventeen or Nightglass 30–60. If the narrative states the remaining window, use that number. Time never comes back. Set stage approaching at 120 minutes or less, imminent at 30 or less, overhead at 0, and passing only when the narrative says the storm front has moved on.

relayGrid:
  name: Relay Grid
  description: The shared power reserve and what it is currently feeding. Nothing important can run at full at once.
  schema:
    type: object
    properties:
      reserve:
        type: integer
        title: Reserve %
        minimum: 0
        maximum: 100
      systems:
        type: object
        title: Systems
        properties:
          longRange:
            type: string
            title: Long-range array
            enum: [off, low, full]
            x-enumLabels: { off: Off, low: Low, full: Full }
          stormShields:
            type: string
            title: Storm shields
            enum: [off, low, full]
            x-enumLabels: { off: Off, low: Low, full: Full }
          clinic:
            type: string
            title: Clinic reserve
            enum: [off, low, full]
            x-enumLabels: { off: Off, low: Low, full: Full }
          crawlerChargers:
            type: string
            title: Crawler chargers
            enum: [off, low, full]
            x-enumLabels: { off: Off, low: Low, full: Full }
          nightglassLink:
            type: string
            title: Nightglass link
            enum: [off, low, full]
            x-enumLabels: { off: Off, low: Low, full: Full }
        required:
          [longRange, stormShields, clinic, crawlerChargers, nightglassLink]
        additionalProperties: false
    required: [reserve, systems]
    additionalProperties: false
  initialValue:
    reserve: 64
    systems:
      longRange: off
      stormShields: low
      clinic: full
      crawlerChargers: low
      nightglassLink: low
  updateRule: >-
    Change a system only when the narrative powers it up or down. Over roughly an hour of story time, each system at full drains 6–10 reserve and each at low drains 2–4; dragging the solar fields into light or a successful repair can restore 5–20. Settle the drain for the time this turn actually spent. At 0 reserve every system except the clinic drops to off; the clinic only goes off if the narrative explicitly says so.

signalLog:
  name: Signal Log
  description: Every transmission and echo worth keeping, with the technical facts that have been established.
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        source:
          type: string
          title: Source
        channel:
          type: string
          title: Channel
        timestamp:
          type: string
          title: Timestamp
        status:
          type: string
          title: Status
          enum: [unexplained, traced, verified, disproven]
          x-enumLabels:
            unexplained: Unexplained
            traced: Traced
            verified: Verified
            disproven: Disproven
        note:
          type: string
          title: Note
          maxLength: 240
      required: [source, channel, timestamp, status]
      additionalProperties: false
  initialValue:
    call-0614:
      source: Unknown — the voice is yours
      channel: Every receiver at once, then the long-range network died
      timestamp: 06:14 station time (claims to be +72 hours)
      status: unexplained
      note: Stop the convoy at Mile Seventeen. Keep Mina off the tower. Don't let Tomas shut down the signal.
  updateRule: >-
    Add an entry (short kebab-case ID) when the narrative receives, records, or uncovers a new transmission or echo. Fill in source, channel, and timestamp as they become known; set traced when its origin is located, verified when independent instruments or witnesses confirm it, disproven when it is shown to be fake or misread. Once a technical fact is established, do not change it unless the narrative explicitly overturns it. Never delete entries.

convoy:
  name: Medical Convoy
  description: June's crawler convoy and its thirty cryo-packs — heading for Mile Seventeen.
  schema:
    type: object
    properties:
      position:
        type: string
        title: Position
        enum:
          [
            en-route,
            holding,
            rerouted,
            at-mile-seventeen,
            arrived,
            stranded,
            lost,
          ]
        x-enumLabels:
          en-route: En route to Mile Seventeen
          holding: Holding position
          rerouted: Rerouted
          at-mile-seventeen: At Mile Seventeen
          arrived: Delivered safely
          stranded: Stranded
          lost: Lost
      contact:
        type: string
        title: Contact
        enum: [none, intermittent, open]
        x-enumLabels:
          none: No contact
          intermittent: Intermittent
          open: Open channel
      cryoPacks:
        type: integer
        title: Cryo-packs intact
        minimum: 0
        maximum: 30
    required: [position, contact, cryoPacks]
    additionalProperties: false
  initialValue:
    position: en-route
    contact: none
    cryoPacks: 30
  updateRule: >-
    Change position only when the narrative shows the convoy stopping, turning, reaching a place, or getting stuck. Set contact from what the radio actually achieves this turn. Reduce cryo-packs only when the narrative explicitly shows packs damaged, spoiled, or lost.

geography:
  name: Geography
  schema:
    type: object
    properties:
      overview:
        type: string
        title: Overview
      regions:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              title: Name
            description:
              type: string
              title: Description
            climate:
              type: string
              title: Climate
            landmarks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    title: Name
                  description:
                    type: string
                    title: Description
                additionalProperties: false
              title: Landmarks
          additionalProperties: false
        title: Regions
    additionalProperties: false
  initialValue:
    overview: Vesper is a tidally locked world. Its white-hot day side and frozen night side meet along the Duskline, a habitable ribbon of red ridges, cold wind, and settlements linked by radio.
    regions:
      - name: Emberback Ridge
        description: A long rust-red escarpment carrying the relay, its homes, workshops, and movable solar fields. The ridge is isolated but never quiet.
        climate: Dry, windy, and sharply divided between brightward heat and nightward cold.
        landmarks:
          - name: The Three Masts
            description: Emberback's long-range array. The central mast can reach every settlement on the western relay chain when the sky is clear.
          - name: Switchyard
            description: A public workshop, charging bay, kitchen, and meeting floor built around the station's oldest transformer.
      - name: Brightward Road
        description: A hard-packed crawler route running toward the sun through glass flats and basalt shade. Mile Seventeen is its most exposed crossing.
        climate: Blinding glare, abrasive dust, and heat fronts that can overtake a vehicle in minutes.
        landmarks:
          - name: Mile Seventeen
            description: A field repeater beside a natural stone arch. The future warning names this place, but its maintenance log shows nothing unusual.
          - name: Mirror Farm
            description: Mobile solar collectors that power Emberback. Their daily alignment determines how much charge the community can spend.
      - name: Nightward Shelf
        description: A descending plateau of dark blue stone, frost grass, and buried ice conduits leading toward permanent night.
        climate: Clear, bitterly cold, and prone to fast-moving ice squalls.
        landmarks:
          - name: Nightglass Observatory
            description: A compact research station that studies magnetic storms, atmospheric echoes, and the moving edge of Vesper's ice.
      - name: Crownfire Front
        description: A continent-scale magnetic storm moving along the Duskline. Its charged dust bends radio signals and paints gold ribbons across the sky.
        climate: Electrically active, unpredictable, and dangerous to exposed people, vehicles, and antenna arrays.
factions:
  name: Factions
  schema:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          title: ID
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        type:
          type: string
          title: Type
        influence:
          type: string
          title: Influence
        leader:
          type: string
          title: Leader
        headquarters:
          type: string
          title: Headquarters
        relations:
          type: array
          items:
            type: object
            properties:
              targetId:
                type: string
                title: Target
              type:
                type: string
                title: Type
              description:
                type: string
                title: Description
            additionalProperties: false
          title: Relations
      additionalProperties: false
  initialValue:
    - id: relay-cooperative
      name: Emberback Relay Cooperative
      description: The station's technicians, operators, medics, growers, and cooks jointly maintain the relay and decide how its limited power is spent.
      type: guild
      influence: major
      leader: Tomas Reed, elected shift lead
      headquarters: Emberback Ridge, Switchyard
      relations:
        - targetId: sunrunners
          type: interdependent
          description: The relay keeps couriers out of storms; couriers keep the isolated station supplied.
        - targetId: nightglass-observatory
          type: strained
          description: The cooperative needs the observatory's forecasts but resents experiments that consume relay time and power.
    - id: sunrunners
      name: Sunrunners
      description: Independent crawler crews who carry medicine, mail, spare parts, and passengers between Duskline settlements.
      type: guild
      influence: major
      leader: A rotating road captain chosen at each route meeting
      headquarters: The road itself
      relations:
        - targetId: relay-cooperative
          type: loyal
          description: They trust Emberback's operators with their lives, even while complaining about every route closure.
        - targetId: nightglass-observatory
          type: skeptical
          description: Forecast models matter less to most drivers than landmarks, instinct, and a clear voice on the radio.
    - id: nightglass-observatory
      name: Nightglass Observatory
      description: A small civilian research team tracking Vesper's atmosphere and the radio echoes that sometimes arrive before their source transmission.
      type: other
      influence: minor
      leader: Dr. Mina Park
      headquarters: Nightward Shelf
      relations:
        - targetId: relay-cooperative
          type: dependent
          description: Nightglass needs Emberback's array to test its theories; Emberback needs Nightglass to predict Crownfire.
powerSystem:
  name: Echo Reading
  schema:
    type: object
    properties:
      name:
        type: string
        title: Name
      type:
        type: string
        title: Type
      description:
        type: string
        title: Description
      rules:
        type: array
        items:
          type: string
        title: Rules
      tiers:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              title: Name
            rank:
              type: integer
              title: Rank
            description:
              type: string
              title: Description
          additionalProperties: false
        title: Tiers
    additionalProperties: false
  initialValue:
    name: Echo Reading
    type: technology
    description: The craft of extracting useful information from time-shifted radio echoes caused by Vesper's magnetic weather. It is technical practice, not prophecy.
    rules:
      - An echo must be recorded, timestamped, and compared against an independent signal before it can count as evidence.
      - Clearer future information creates stronger interference when people act on it; certainty is never free.
      - Echoes show a possible transmission, not a fixed future. Choices can prevent, alter, or cause what was heard.
      - Crownfire improves echo range while making ordinary communications less reliable and exposed electronics more dangerous.
    tiers:
      - name: Listener
        rank: 1
        description: Can identify patterns, false repeats, and deliberate speech inside heavy static.
      - name: Tracer
        rank: 2
        description: Can estimate where and when an echo originated by comparing phase drift across receivers.
      - name: Splicer
        rank: 3
        description: Can reconstruct missing fragments from several conflicting echoes without pretending uncertainty has vanished.
      - name: Caller
        rank: 4
        description: Theoretical ability to transmit a reply into an earlier window. No verified caller is known.
