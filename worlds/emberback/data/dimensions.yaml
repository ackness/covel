          type: string
        title: Genres
      contentRating:
        type: string
        title: Rating
      narrativeStyle:
        type: string
        title: Narrative style
      themes:
        type: array
        items:
          type: string
        title: Themes
    additionalProperties: false
  initialValue:
    genres:
      - frontier science fiction
      - community adventure
      - temporal mystery
    contentRating: teen
    narrativeStyle: Clear, character-led adventure prose with tactile technical detail, moments of dry humor, and visible consequences. Wonder should come from people solving impossible problems together.
    themes:
      - Whether warning someone changes or creates the danger
      - Public infrastructure as a promise between strangers
