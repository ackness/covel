        year:
          type: string
          title: Year
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        significance:
          type: string
          title: Significance
      additionalProperties: false
  initialValue:
    - era: Settlement Era
      year: 214 years ago
      name: The Duskline Landing
      description: The first permanent habitats were placed where Vesper's light and cold could be balanced with ordinary engineering.
      significance: major
    - era: Relay Era
      year: 86 years ago
      name: Emberback Goes Live
      description: Three ridge masts closed the longest dead zone in the western chain and turned a repair camp into a community.
      significance: major
    - era: Modern Era
      year: 19 years ago
      name: The Long Blackout
      description: A Crownfire storm cut six settlements off for eleven days. The cooperative's promise that no call goes unanswered dates from the recovery.
      significance: major
    - era: Present
      year: 4 months ago
      name: First Verified Echo
      description: Mina Park recorded a weather bulletin nine minutes before Nightglass transmitted it. Repeat incidents have grown longer and more specific.
      significance: major
