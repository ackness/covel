geography:
  overview: Vesper is a tidally locked world. Its white-hot day side and frozen night side meet along the Duskline, a habitable ribbon of red ridges, cold wind, and settlements linked by radio.
  regions:
    - name: Emberback Ridge
      description: A long rust-red escarpment carrying the relay, its homes, workshops, and movable solar fields. The ridge is isolated but never quiet.
      climate: Dry, windy, and sharply divided between brightward heat and nightward cold.
      landmarks:
        - name: The Three Masts
          description: Emberback's long-range array. The central mast can reach every settlement on the western relay chain when the sky is clear.
        - name: Switchyard
          description: A public workshop, charging bay, kitchen, and meeting floor built around the station's oldest transformer.
    - name: Brightward Road
      description: A hard-packed crawler route running toward the sun through glass flats and basalt shade. Mile Seventeen is its most exposed crossing.
      climate: Blinding glare, abrasive dust, and heat fronts that can overtake a vehicle in minutes.
      landmarks:
        - name: Mile Seventeen
          description: A field repeater beside a natural stone arch. The future warning names this place, but its maintenance log shows nothing unusual.
        - name: Mirror Farm
          description: Mobile solar collectors that power Emberback. Their daily alignment determines how much charge the community can spend.
    - name: Nightward Shelf
      description: A descending plateau of dark blue stone, frost grass, and buried ice conduits leading toward permanent night.
      climate: Clear, bitterly cold, and prone to fast-moving ice squalls.
      landmarks:
        - name: Nightglass Observatory
          description: A compact research station that studies magnetic storms, atmospheric echoes, and the moving edge of Vesper's ice.
    - name: Crownfire Front
      description: A continent-scale magnetic storm moving along the Duskline. Its charged dust bends radio signals and paints gold ribbons across the sky.
      climate: Electrically active, unpredictable, and dangerous to exposed people, vehicles, and antenna arrays.
factions:
  - id: relay-cooperative
    name: Emberback Relay Cooperative
    description: The station's technicians, operators, medics, growers, and cooks jointly maintain the relay and decide how its limited power is spent.
    type: guild
    influence: major
    leader: Tomas Reed, elected shift lead
    headquarters: Emberback Ridge, Switchyard
    relations:
      - targetId: sunrunners
        type: interdependent
        description: The relay keeps couriers out of storms; couriers keep the isolated station supplied.
      - targetId: nightglass-observatory
        type: strained
        description: The cooperative needs the observatory's forecasts but resents experiments that consume relay time and power.
  - id: sunrunners
    name: Sunrunners
    description: Independent crawler crews who carry medicine, mail, spare parts, and passengers between Duskline settlements.
    type: guild
    influence: major
    leader: A rotating road captain chosen at each route meeting
    headquarters: The road itself
    relations:
      - targetId: relay-cooperative
        type: loyal
        description: They trust Emberback's operators with their lives, even while complaining about every route closure.
      - targetId: nightglass-observatory
        type: skeptical
        description: Forecast models matter less to most drivers than landmarks, instinct, and a clear voice on the radio.
  - id: nightglass-observatory
    name: Nightglass Observatory
    description: A small civilian research team tracking Vesper's atmosphere and the radio echoes that sometimes arrive before their source transmission.
    type: other
    influence: minor
    leader: Dr. Mina Park
    headquarters: Nightward Shelf
    relations:
      - targetId: relay-cooperative
        type: dependent
        description: Nightglass needs Emberback's array to test its theories; Emberback needs Nightglass to predict Crownfire.
powerSystem:
  name: Echo Reading
  type: technology
  description: The craft of extracting useful information from time-shifted radio echoes caused by Vesper's magnetic weather. It is technical practice, not prophecy.
  rules:
    - An echo must be recorded, timestamped, and compared against an independent signal before it can count as evidence.
    - Clearer future information creates stronger interference when people act on it; certainty is never free.
    - Echoes show a possible transmission, not a fixed future. Choices can prevent, alter, or cause what was heard.
    - Crownfire improves echo range while making ordinary communications less reliable and exposed electronics more dangerous.
  tiers:
    - name: Listener
      rank: 1
      description: Can identify patterns, false repeats, and deliberate speech inside heavy static.
    - name: Tracer
      rank: 2
      description: Can estimate where and when an echo originated by comparing phase drift across receivers.
    - name: Splicer
      rank: 3
      description: Can reconstruct missing fragments from several conflicting echoes without pretending uncertainty has vanished.
    - name: Caller
      rank: 4
      description: Theoretical ability to transmit a reply into an earlier window. No verified caller is known.
history:
  - era: Settlement Era
    year: 214 years ago
    name: The Duskline Landing
    description: The first permanent habitats were placed where Vesper's light and cold could be balanced with ordinary engineering.
    significance: major
  - era: Relay Era
    year: 86 years ago
    name: Emberback Goes Live
    description: Three ridge masts closed the longest dead zone in the western chain and turned a repair camp into a community.
    significance: major
  - era: Modern Era
    year: 19 years ago
    name: The Long Blackout
    description: A Crownfire storm cut six settlements off for eleven days. The cooperative's promise that no call goes unanswered dates from the recovery.
    significance: major
  - era: Present
    year: 4 months ago
    name: First Verified Echo
    description: Mina Park recorded a weather bulletin nine minutes before Nightglass transmitted it. Repeat incidents have grown longer and more specific.
    significance: major
economy:
  currencies:
    - name: Trade chits
      symbol: tc
      description: Cooperative credit accepted for food, repairs, route passage, and personal supplies. Essential emergency service is never denied for lack of chits.
  resources:
    - Battery charge
    - Condensed water
    - Ceramic electronics
    - Crawler parts
    - Medical cryo-packs
  tradeNotes: Power is Emberback's real budget. Every major repair, transmission, vehicle charge, or research scan takes energy away from another public need.
socialStructure:
  classes:
    - name: Residents
      rank: 1
      description: Cooperative members who live at Emberback and share maintenance shifts, votes, and emergency obligations.
    - name: Route crews
      rank: 2
      description: Couriers, haulers, and mechanics who move between settlements and rely on temporary station berths.
    - name: Visitors
      rank: 3
      description: Researchers, passengers, and traders under the same emergency protections as everyone else but without a cooperative vote.
  notes: Rank describes civic responsibility, not personal worth. During an emergency, the person with the relevant expertise leads the response.
tone:
  genres:
    - frontier science fiction
    - community adventure
    - temporal mystery
  contentRating: teen
  narrativeStyle: Clear, character-led adventure prose with tactile technical detail, moments of dry humor, and visible consequences. Wonder should come from people solving impossible problems together.
  themes:
    - Whether warning someone changes or creates the danger
    - Public infrastructure as a promise between strangers
    - Expertise, trust, and shared responsibility
    - Hope as a practical discipline
mechanics:
  combatStyle: narrative
  difficulty: normal
  skillSystem: Risky actions use Grit, Systems, Fieldcraft, Insight, or Rapport. Failure changes time, charge, trust, safety, or the quality of available information rather than simply stopping the story.
  customRules:
    - Track the Crownfire countdown and state the cost when an action consumes meaningful time.
    - Vehicles, radios, and station systems require charge; power committed in one place is unavailable elsewhere.
    - Future echoes provide clues, never mandatory outcomes. Player choices may prevent, alter, or cause the heard transmission.
    - Commitments and discoveries belong in the quest and signal logs.
    - Important characters remember honesty, care, competence, and whose safety the player prioritized.
startingConditions:
  openingScenario: At 06:14 every receiver at Emberback plays the same impossible distress call—your own voice, speaking from seventy-two hours ahead. The message warns you to stop a medical convoy at Mile Seventeen, keep Mina off the tower, and prevent Tomas from shutting down the signal. The network then fails as a Crownfire storm approaches.
  openingHook: The future used your voice. Who do you warn first?
  openingChips:
    - Play the recording for Tomas
    - Call June and stop the convoy
    - Climb after Mina
    - Trace the signal before it fades
    - Check the station's remaining charge
  playerConstraints:
    - You are Emberback's newest linekeeper, trained but not yet trusted to run a crisis alone.
    - Crownfire reaches the ridge in three hours.
    - The medical convoy is already moving and long-range communication is failing.
  startingLocation: Emberback Relay, Signal Room
  startingResources:
    Trade chits: 60
    Water cells: 2
    Crawler charge: 65
