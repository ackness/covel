- id: trade-chits
  name: 交易筹码
  description: 合作社信用点，可用于支付餐费、零件、路费和个人补给。紧急服务不出售。
- id: field-radio
  name: 野战无线电
  description: 一台坚固的短程无线电，调谐至余烬背的维护频道。其侧缓冲区仍存储着那条不可能的通话。
- id: linekeeper-kit
  name: 线路员装备包
  description: 信号探针、陶瓷切割器、修复线、密封剂和一个手摇应急充电器，装在一个磨损的卷包里。
- id: crawler-key
  name: 公用爬行器钥匙
  description: 启动余烬背那辆破旧的维护爬行器，前提是没人拔走它的充电分配。
- id: water-cells
  name: 水单元
  description: 来自夜间冷凝器的两个柔性半升水袋。足够一个人进行短途野外行动使用。
- id: heat-veil
  name: 热幕
  description: 用于短暂暴露在强光方向的反光头罩和肩披。实用但不舒适，且在大风中容易撕裂。
