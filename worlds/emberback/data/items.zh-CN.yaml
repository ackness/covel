- id: trade-chits
  name: 交易筹码
  description: 合作社的流通代币，可用来换取餐食、备件、过路费与个人配给。应急救援绝不标价出售。
- id: field-radio
  name: 野战电台
  description: 一部坚固的短波便携电台，调在余烬背的维护信道上。侧面缓存器里仍存着那段不可思议的未来呼叫。
- id: linekeeper-kit
  name: 线路员装备包
  description: 磨损的工具卷包里装有信号探针、陶瓷剪刀、修补导线、密封胶，以及一台手摇应急充电机。
- id: crawler-key
  name: 公用爬行器钥匙
  description: 用来发动余烬背那辆破旧的维护爬行器——前提是没有人拔掉它的充电配额插头。
- id: water-cells
  name: 便携水囊
  description: 两个取自背阳面冷凝设施的软质半升装水囊。轻装上阵的话，足够跑一趟短途野外任务。
- id: heat-veil
  name: 防热披罩
  description: 短暂暴露在向阳面时使用的反光风帽与护肩披风。实用却谈不上舒适，而且在强风中很容易被刮破。
