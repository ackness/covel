schemaVersion: 1
sources:
  dimensions:
    kind: yaml
    path: data/dimensions.yaml
    schema: covel://world/dimensions
    to: world:metadata.dimensions
  lore:
    kind: yaml
    path: data/lorebook.yaml
    to: lorebook
    key: id
    after: dimensions
  cast:
    kind: json
    path: characters/main-cast.json
    schema: contract:character.blueprints@1
    to: contract:character.blueprints@1
    key: id
    after: dimensions
  portraits:
    kind: media
    path: media/portraits
    to: media
    indexTo: contract:character.portrait-assets@1
    key: filename
    after: cast
  presence:
    kind: json
    path: media/presence.json
    schema: contract:character.portraits@1
    to: contract:character.portraits@1
    key: characterId
    after: portraits
  rules:
    kind: yaml
    path: data/rules/emberback-rules.yaml
    schema: contract:world.rules@1
    to: contract:world.rules@1+lorebook
    key: id
    after: dimensions
  quests:
    kind: yaml
    path: data/quests.yaml
    schema: contract:quests@1
    to: contract:quests@1
    key: id
    after: dimensions
  items:
    kind: yaml
    path: data/items.yaml
    schema: contract:inventory.items@1
    to: contract:inventory.items@1
    key: id
    after: dimensions
  affinity:
    kind: yaml
    path: data/affinity.yaml
    schema: contract:character.affinity@1
    to: contract:character.affinity@1
    key: id
    after: dimensions
  characters:
    kind: json
    path: characters/characters.json
    to: characters
    key: id
    after: cast
  memoryBlocks:
    kind: json
    path: data/memory-blocks.json
    to: contract:memory.blocks@1
    schema: contract:memory.blocks@1
    key: id
  storyEvents:
    kind: yaml
    path: data/hidden/story-events.yaml
    schema: contract:story.events@1
    to: contract:story.events@1
    key: id
    after: dimensions
    visibility: hidden
