crownfire:
  name: 王冠火倒计时
  description: 王冠火风暴还有几分钟到达山脊，以及它看起来有多近。
  schema:
    properties:
      minutesRemaining:
        title: 剩余分钟
      stage:
        title: 风暴
        x-enumLabels:
          distant: 地平线上
          approaching: 正在逼近
          imminent: 迫在眉睫
          overhead: 已到头顶
      frontPassed:
        title: 锋面已过
  updateRule: 只有当叙事写明风暴锋面已经越过山脊离开时，才把 frontPassed 设为 true。之后不要再改回 false。
relayGrid:
  name: 中继电网
  description: 公共储备电量，以及它眼下在给什么供电。要紧的东西没法同时开满。
  schema:
    properties:
      reserve:
        title: 储备 %
      systems:
        title: 系统
        properties:
          longRange:
            title: 远程天线阵列
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          stormShields:
            title: 风暴护盾
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          clinic:
            title: 诊所备用电
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          crawlerChargers:
            title: 爬行器充电桩
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          nightglassLink:
            title: 夜玻璃链路
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
  updateRule: 只有当叙事里给某个系统通电或断电时，才改它的状态。故事时间每过大约一小时，每个 full 的系统消耗 6–10 点储备，每个 low 的系统消耗 2–4 点；把太阳能田拖进光照里，或者一次成功的修理，能恢复 5–20 点。按本回合实际花掉的时间结算消耗。储备降到 0 时，除诊所外的所有系统都变为 off；只有叙事明确这样写，诊所才变为 off。
signalLog:
  name: 信号日志
  description: 每一条值得留下的发射和回声，连同已经确定的技术事实。
  schema:
    additionalProperties:
      properties:
        source:
          title: 来源
        channel:
          title: 信道
        timestamp:
          title: 时间戳
        status:
          title: 状态
          x-enumLabels:
            unexplained: 原因不明
            traced: 已溯源
            verified: 已证实
            disproven: 已证伪
        note:
          title: 备注
  initialValue:
    call-0614:
      source: 不明——是你的声音
      channel: 所有接收器同时收到，随后远程网络断了
      timestamp: 站区时间 06:14（自称来自 72 小时后）
      note: 拦住开往十七英里的车队。别让米娜上塔。别让托马斯关掉信号。
  updateRule: 叙事中收到、录下或发现一条新的发射或回声时，添加一条记录（ID 用简短的 kebab-case）。来源、信道和时间戳弄清一项填一项；查到出处时把状态设为 traced，有独立的仪器或证人确认时设为 verified，证明是伪造或误读时设为 disproven。技术事实一旦确定，除非叙事明确推翻，否则不要改。永远不要删除记录。
convoy:
  name: 医疗车队
  description: 琼的爬行器车队和车上的三十箱低温药品——正开往十七英里。
  schema:
    properties:
      position:
        title: 位置
        x-enumLabels:
          en-route: 正驶向十七英里
          holding: 原地待命
          rerouted: 已改道
          at-mile-seventeen: 已到十七英里
          arrived: 安全送达
          stranded: 受困
          lost: 已失事
      contact:
        title: 联络
        x-enumLabels:
          none: 无联络
          intermittent: 时断时续
          open: 信道畅通
      cryoPacks:
        title: 完好的低温药品箱
  updateRule: 只有当叙事写到车队停下、转向、到达某处或被困住时，才改 position。contact 按电台本回合实际联通的情况设置。只有当叙事明确写到药品箱损坏、变质或丢失时，才减少 cryoPacks。
geography:
  name: 地理
  schema:
    properties:
      overview:
        title: 概览
      regions:
        items:
          properties:
            name:
              title: 名称
            description:
              title: 描述
            climate:
              title: 气候
            landmarks:
              items:
                properties:
                  name:
                    title: 名称
                  description:
                    title: 描述
              title: 地标
        title: 区域
  initialValue:
    overview: 维斯珀是一颗潮汐锁定的行星。白热的昼面和冰封的夜面在暮界线相接——那是一条能住人的窄带，有红色的山脊、冷风，还有靠无线电连在一起的定居点。
    regions:
      - name: 余烬背山脊
        description: 一道长长的锈红色陡崖，上面是中继站、住家、工坊和能挪动的太阳能田。山脊很偏，但从来不安静。
        climate: 干燥多风；向阳的一侧热，背阳的一侧冷，界线分明。
        landmarks:
          - name: 三桅塔
            description: 余烬背的远程天线阵列。天气晴朗时，中间那根桅杆能联通西部中继链上的每一个定居点。
          - name: 开关场
            description: 公共工坊、充电区、厨房和议事的场地，围着站里最老的那台变压器建起来。
      - name: 向阳路
        description: 一条压得很实的爬行器路线，一路朝着太阳，穿过玻璃滩和玄武岩的阴影。十七英里是全线最没遮挡的一段。
        climate: 强光晃眼，沙尘磨人，热浪锋面几分钟就能追上一辆车。
        landmarks:
          - name: 十七英里
            description: 一台野外中继器，立在一座天然石拱旁边。未来的警告点了这个地方的名，可它的维护日志里看不出任何异常。
          - name: 镜田
            description: 给余烬背供电的移动式太阳能集光器。它们每天对光对得怎么样，决定了整个社区能花多少电。
      - name: 向夜阶地
        description: 一片往下倾斜的高原，暗蓝色的岩石、霜草，地下埋着冰管，一路通向永夜。
        climate: 晴朗，冷得刺骨，常有来去很快的冰风暴。
        landmarks:
          - name: 夜玻璃天文台
            description: 一座小巧紧凑的科研站，研究磁暴、大气回声，还有维斯珀冰缘的推移。
      - name: 王冠火前锋
        description: 一场大陆尺度的磁暴，正沿着暮界线移动。带电的尘埃会让无线电信号弯折，还在天上画出一道道金色光带。
        climate: 电活动强烈，难以预测，对暴露在外的人、车和天线阵列都很危险。
factions:
  name: 势力
  schema:
    items:
      properties:
        id:
          title: ID
