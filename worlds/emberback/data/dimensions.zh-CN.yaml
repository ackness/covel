      - 重要角色会记住诚实、关怀、能力以及玩家优先考虑谁的安全。
startingConditions:
  name: 开场
  schema:
    properties:
      openingScenario:
        title: 开场场景
      openingHook:
        title: 引子
      openingChips:
        title: 开局行动
      playerConstraints:
        title: 限制
