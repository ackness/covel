      description: 车站的技术员、操作员、医护人员、种植者和厨师共同维护中继站，并决定如何分配其有限的电力。
      leader: 托马斯·里德，当选轮班主管
      headquarters: 余烬背山脊，转辙场
      relations:
        - description: 中继站使信使避开风暴；信使则为孤立的车站提供补给。
        - description: 合作社需要天文台的预报，但反感那些消耗中继时间和电力的实验。
    - id: sunrunners
      name: 逐日者
      description: 独立爬行器组，负责在暮界线各定居点之间运送药品、邮件、备件和乘客。
      leader: 在每次路线会议上选出的轮值道路队长
      headquarters: 道路本身
      relations:
        - description: 他们将自己的生命托付给余烬背的操作员，尽管对每一次路线封闭都抱怨不已。
        - description: 对于大多数司机来说，预测模型的重要性不如地标、直觉以及无线电中清晰的声音。
    - id: nightglass-observatory
      name: 夜玻璃天文台
      description: 一个小型平民研究团队，追踪维斯珀的大气层以及那些有时早于其来源传输到达的无线电回声。
      leader: 米娜·帕克博士
      headquarters: 向夜架
      relations:
        - description: 夜玻璃需要余烬背的阵列来验证其理论；余烬背则需要夜玻璃来预测王冠火。
powerSystem:
  name: 回声读取
  schema:
    properties:
      name:
        title: 名称
      type:
        title: 类型
      description:
        title: 描述
      rules:
        title: 规则
      tiers:
        items:
          properties:
            name:
              title: 名称
            rank:
              title: 等级
            description:
              title: 描述
        title: 层级
  initialValue:
    name: 回声读取
    description: 一种从由维斯珀磁天气引起的时移无线电回声中提取有用信息的技术。这是一种技术实践，而非预言。
    rules:
      - 回声必须被记录、添加时间戳，并与独立信号进行比对，才能被视为证据。
      - 更清晰的未来信息在人们据此行动时会引发更强的干扰；确定性绝非免费。
      - 回声展示的是可能的传输，而非固定的未来。选择可以阻止、改变或导致所听到的内容。
      - 王冠火能增强回声范围，但同时会使普通通信可靠性降低，并让暴露的电子元件更加危险。
    tiers:
      - name: 监听者
        description: 能在强烈的静电噪声中识别模式、虚假重复和刻意言语。
      - name: 追踪者
        description: 能通过比较接收器间的相位漂移来估算回声产生的地点和时间。
      - name: 拼接者
        description: 能从几个相互冲突的回声中重建缺失片段，而不假装不确定性已消失。
      - name: 呼叫者
        description: 理论上具备将回复传输至更早窗口的能力。目前已知没有经过验证的呼叫者。
