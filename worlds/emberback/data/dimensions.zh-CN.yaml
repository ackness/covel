      difficulty:
        title: 难度
      skillSystem:
        title: 检定
      customRules:
        title: 房规
  initialValue:
    skillSystem: 高风险动作使用坚毅、系统、野外生存术、洞察或默契。失败会改变时间、电量、信任、安全或可用信息的质量，而不仅仅是停止故事。
    customRules:
      - 跟踪王冠火倒计时，并在动作消耗有意义的时间时说明代价。
