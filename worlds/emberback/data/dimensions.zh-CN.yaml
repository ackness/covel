          title: 影响力
        leader:
          title: 领袖
        headquarters:
          title: 总部
        relations:
          items:
            properties:
              targetId:
                title: 目标
              type:
                title: 类型
              description:
                title: 描述
          title: 关系
  initialValue:
    - id: relay-cooperative
      name: 余烬背中继合作社
      description: 站里的技术员、信号员、医护、种植员和厨师一起维护中继站，也一起决定有限的电怎么花。
      leader: 托马斯·里德，民选值班负责人
      headquarters: 余烬背山脊，开关场
      relations:
        - description: 中继站让信使躲开风暴；信使让这座孤站有补给可用。
        - description: 合作社离不开天文台的预报，但看不惯那些占用中继时间和电力的实验。
    - id: sunrunners
      name: 逐日者
      description: 独立的爬行器车组，在暮界线各定居点之间运送药品、邮件、备件和乘客。
      leader: 每次线路会议上推选的轮值领队
      headquarters: 就在路上
      relations:
        - description: 他们把命交给余烬背的信号员，尽管每次封路都要抱怨一通。
        - description: 对多数司机来说，预报模型远不如路标、直觉和电台里一个清楚的声音管用。
    - id: nightglass-observatory
      name: 夜玻璃天文台
      description: 一支小型的民间科研队，追踪维斯珀的大气，以及那些有时先于源头发射就到达的无线电回声。
      leader: 米娜·帕克博士
      headquarters: 向夜阶地
      relations:
        - description: 夜玻璃需要余烬背的阵列来验证它的理论；余烬背需要夜玻璃来预测王冠火。
powerSystem:
  name: 回声解译
  schema:
    properties:
      name:
        title: 名称
      type:
        title: 类型
      description:
        title: 描述
      rules:
        title: 规则
      tiers:
        items:
          properties:
            name:
              title: 名称
            rank:
              title: 等级
            description:
              title: 描述
        title: 层级
  initialValue:
    name: 回声解译
    description: 从维斯珀的磁暴天气造成的带时差无线电回声里，提取有用信息的手艺。这是技术，不是预言。
    rules:
      - 回声必须先录下、打上时间戳，再和一个独立的信号比对过，才能算作证据。
      - 未来的信息越清楚，人们照着它行动时引起的干扰就越强；确定性从来不是白来的。
      - 回声显示的是一次可能的发射，不是固定的未来。选择可以阻止、改变或促成所听到的事。
      - 王冠火会让回声传得更远，同时让普通通讯更靠不住，外露的电子设备更危险。
    tiers:
      - name: 监听者
        description: 能在浓重的静电杂音里认出规律、虚假的重复，以及有意说出的话。
      - name: 追踪者
        description: 能比对各台接收器之间的相位漂移，估算回声来自何时何地。
      - name: 重构者
        description: 能从几段互相矛盾的回声里拼出缺失的片段，同时不假装不确定性已经消失。
      - name: 发信者
        description: 理论上能把回复发进更早的时间窗口。目前没有任何经过证实的发信者。
history:
  name: 历史
  schema:
    items:
      properties:
        era:
          title: 时代
        year:
          title: 年份
        name:
          title: 名称
        description:
          title: 描述
        significance:
          title: 意义
  initialValue:
    - era: 开拓定居时代
      year: 214年前
      name: 降落暮界线
      description: 第一批永久居住舱落了地。选的位置，正好让维斯珀的光和冷能靠普通的工程手段调和。
    - era: 中继时代
      year: 86年前
      name: 余烬背通电启用
      description: 山脊上的三根桅杆填上了西部中继链上最长的一段盲区，也让一个维修营地变成了一个社区。
    - era: 当代
      year: 19年前
      name: 大断联
      description: 一场王冠火风暴让六个定居点断联了十一天。合作社“凡有呼叫，必有应答”的承诺，就是从那次恢复时开始的。
    - era: 当下
      year: 4个月前
      name: 首个证实回声
      description: 米娜·帕克录下了一份天气公报，九分钟后，夜玻璃天文台才把它播发出去。之后又出了几次，一次比一次长，一次比一次具体。
