crownfire:
  name: 王冠火倒计时
  description: 距离王冠火风暴席卷山脊的剩余分钟数，以及风暴当前的逼近态势。
  schema:
    properties:
      minutesRemaining:
        title: 剩余分钟数
      stage:
        title: 风暴
        x-enumLabels:
          distant: 地平线上
          approaching: 逼近
          imminent: 迫在眉睫
          overhead: 笼罩头顶
      frontPassed:
        title: 锋面已过
  updateRule: 仅当叙事表明风暴锋面已越过山脊移走时，才把 frontPassed 设为 true。设为 true 后不再改回 false。
relayGrid:
  name: 中继电网
  description: 共享储能池及其当前供电的系统。关键设施无法同时全负荷运转。
  schema:
    properties:
      reserve:
        title: 储能百分比
      systems:
        title: 系统
        properties:
          longRange:
            title: 远程天线阵列
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          stormShields:
            title: 风暴护盾
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          clinic:
            title: 诊所储备
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          crawlerChargers:
            title: 爬行器充电桩
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          nightglassLink:
            title: 夜玻璃链路
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
  updateRule: 仅当叙事中为某系统通电或断电时才变更其状态。在约一小时的故事时间内，每个全功率运行的系统消耗 6–10 点储备，每个低功率系统消耗 2–4 点；沿山脊拖动太阳能板列追光或成功修复设备可恢复 5–20 点。请根据本回合实际花费的时间结算电量消耗。当储备降至 0 时，除诊所外所有系统均断电关闭；只有在叙事明确交代时，诊所才会断电。
signalLog:
  name: 信号日志
  description: 所有值得留存的传输讯息与回声记录，以及已确立的技术事实。
  schema:
    additionalProperties:
      properties:
        source:
          title: 来源
        channel:
          title: 信道
        timestamp:
          title: 时间戳
        status:
          title: 状态
          x-enumLabels:
            unexplained: 原因不明
            traced: 已查明源头
            verified: 已证实
            disproven: 已证伪
        note:
          title: 备注
  initialValue:
    call-0614:
      source: 未知——声音正是你本人的
      channel: 所有接收器同时响起，随后远程网络陷入死寂
      timestamp: 站区时间 06:14（声称来自+72小时后）
      note: 不要让车队到达十七英里。别让米娜上塔。无论托马斯说什么，都绝不能关闭信号。
  updateRule: 当叙事中接收、记录或发现新的传输或回声时，添加一条记录（使用短横线分隔的小写 ID）。随着线索明朗，逐步补全来源、信道与时间戳；查明发报源头后标记为“已查明源头”，经独立仪器或目击者证实后标记为“已证实”，若证实为伪造或误读则标记为“已证伪”。技术事实一旦确立，除非叙事明确推翻，否则不得更改。切勿删除记录。
convoy:
  name: 医疗车队
  description: 琼恩带领的爬行器车队及其护送的三十箱低温药品——正驶向十七英里。
  schema:
    properties:
      position:
        title: 位置
        x-enumLabels:
          en-route: 驶向十七英里途中
          holding: 原地待命
          rerouted: 已改道
          at-mile-seventeen: 已抵达十七英里
          arrived: 安全送达
          stranded: 抛锚受阻
          lost: 失去联络
      contact:
        title: 联络
        x-enumLabels:
          none: 无法联络
          intermittent: 断断续续
          open: 信道畅通
      cryoPacks:
        title: 完好低温药品箱
  updateRule: 仅当叙事明确显示车队停下、转向、抵达目的地或抛锚受阻时，才更改位置。根据电台本回合的实际通联结果更新联络状态。仅当叙事明确交代药品受损、变质或丢失时，才扣减完好药品数量。
geography:
  name: 地理
  schema:
    properties:
      overview:
        title: 概览
      regions:
        items:
          properties:
            name:
              title: 名称
            description:
              title: 描述
            climate:
              title: 气候
            landmarks:
              items:
                properties:
                  name:
                    title: 名称
                  description:
                    title: 描述
              title: 地标
        title: 区域
  initialValue:
    overview: 维斯珀是一颗潮汐锁定的星球。酷热白炽的昼半球与冰封长夜的暗半球在暮界线交汇——那是一道由红岩山脊、刺骨寒风与电台维系各处的狭长宜居带。
    regions:
      - name: 余烬背山脊
        description: 一道锈色玄武岩长陡崖，承载着中继站、居民区、修理工坊与可移动太阳能板列。山脊虽孤悬荒原，却从未陷入沉寂。
        climate: 干燥多风，向阳侧的灼热与背阳侧的严寒截然分明。
        landmarks:
          - name: 三桅塔
            description: 余烬背的远程天线阵列。天候晴朗时，最高的主桅杆可以联通西部中继链上的每一座定居点。
          - name: 转辙场
            description: 围绕中继站最古老的变压器建成的公共工坊、充电区、炊事厨房与例会大厅。
      - name: 向阳路
        description: 一条朝向恒星烈日延伸的硬实爬行器公路，穿行在反光平原与玄武岩阴影之间。十七英里是其沿线最开阔凶险的隘口。
        climate: 强光刺目、沙尘磨蚀，热浪前锋甚至能在几分钟内吞没整辆车。
        landmarks:
          - name: 十七英里
            description: 天然玄武岩拱门下固定着一台野战中继器。未来的警告点名了此地，但维护日志上未见任何异常。
          - name: 太阳能田
            description: 为余烬背供电的可移动太阳能集热与受光板列。作业队每天拖拽对齐日光的情况，决定了全站可支配的电量。
      - name: 向夜阶地
        description: 一片向下倾斜的暗蓝玄武岩高原，生有霜草，埋设着通往永恒夜半球的冻冰管道。
        climate: 空气晴朗通透，寒气彻骨，极易突发快速移动的狂风冰暴。
        landmarks:
          - name: 夜玻璃天文台
            description: 紧凑的科研观测站，专门监测维斯珀的地磁风暴、大气回声以及坚冰边缘的推移。
      - name: 王冠火前锋
        description: 沿暮界线肆虐的大陆级地磁风暴。其带电风沙会扭曲无线电信号，并在天际染出绚烂的金光。
        climate: 剧烈的电磁活动不可捉摸，对外露的人员、车辆及天线阵列极度凶险。
