mechanics:
  name: 机制
  schema:
    properties:
      combatStyle:
        title: 战斗
      difficulty:
        title: 难度
      skillSystem:
        title: 判定
      customRules:
        title: 规则
  initialValue:
    skillSystem: 高风险行动使用坚毅、系统、野外生存术、洞察或默契进行判定。判定失败会消耗时间、电量、信任、安全，或降低所获情报的质量，绝不会直接让故事卡死终结。
    customRules:
      - 实时追踪王冠火倒计时；当行动消耗了可观的时间时，明确指出所付出的时间代价。
      - 载具、电台与站内设施均需耗电；分配给一处的电量无法在别处同时使用。
      - 来自未来的回声只提供破局线索，绝非注定的结局。玩家的选择可能会预防、改变甚至触发所听到的变故。
      - 许下的承诺与查明的线索应分别记入任务日志与信号日志。
      - 关键角色会记住你的诚实、担当、能力，以及你优先顾全了谁的安全。
startingConditions:
  name: 开场
  schema:
    properties:
      openingScenario:
        title: 开场场景
      openingHook:
        title: 引子
      openingChips:
        title: 开局行动
      playerConstraints:
        title: 限制
      startingLocation:
        title: 起始地点
  initialValue:
    openingScenario: 站区时间 06:14，余烬背中继站的所有接收器同时响起同一通不可思议的求救呼叫——声音疲惫不堪却绝不会认错，竟来自七十二小时后的你自己。呼叫警告：不要让医疗车队到达十七英里，别让米娜上塔，无论托马斯说什么都绝不能关闭信号。随后远程通讯陷入死寂，一场王冠火风暴正滚滚逼近。
    openingHook: 未来使用了你自己的声音发信。你第一步先去向谁报警？
    openingChips:
      - 把呼叫录音放给托马斯听
      - 紧急呼叫琼恩，设法拦下车队
      - 追上主塔，拦下米娜
      - 在信号散尽前排查其发报源头
      - 核查中继站当前剩余电量
    playerConstraints:
      - 你是余烬背最新的线路员，虽受过正规训练，但在危急时刻尚未获得独立处置大局的信任。
      - 王冠火风暴将在三小时后席卷山脊。
      - 医疗车队已然在路上，而远程通讯正逐步中断。
    startingLocation: 余烬背中继站，调度大厅
