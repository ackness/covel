crownfire:
  name: 王冠火倒计时
  description: 王冠火风暴抵达山脊所需的分钟数，以及其逼近的程度。
  schema:
    properties:
      minutesRemaining:
        title: 剩余分钟数
      stage:
        title: 风暴
        x-enumLabels:
          distant: 地平线上
          approaching: 逼近
          imminent: 迫在眉睫
          overhead: 头顶上方
          passing: 掠过
  updateRule: 扣除本轮叙事实际花费的故事时间：简短对话5–10分钟，修理、搜索或争论15–40分钟，前往十七英里或夜玻璃的爬行器行程30–60分钟。如果叙事说明了剩余窗口期，则使用该数值。时间永不回溯。当剩余时间在120分钟或更少时设为“逼近”，30分钟或更少时设为“迫在眉睫”，0分钟时设为“头顶上方”，仅当叙事表明风暴锋面已移过才设为“掠过”。
relayGrid:
  name: 中继网格
  description: 共享电力储备及其当前供给对象。重要系统无法同时全功率运行。
  schema:
    properties:
      reserve:
        title: 储备百分比
      systems:
        title: 系统
        properties:
          longRange:
            title: 远程阵列
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          stormShields:
            title: 风暴护盾
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          clinic:
            title: 诊所储备
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          crawlerChargers:
            title: 爬行器充电器
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
          nightglassLink:
            title: 夜玻璃链接
            x-enumLabels:
              off: 关闭
              low: 低功率
              full: 全功率
  updateRule: 仅当叙事开启或关闭某系统时才改变其状态。在大约一小时的故事时间内，每个全功率运行的系统消耗6–10点储备，每个低功率运行的系统消耗2–4点；将太阳能田拉入光照区或成功修复可恢复5–20点。根据本轮实际花费的时间结算消耗。当储备为0时，除诊所外的所有系统均降至关闭状态；只有当叙事明确说明时，诊所才会关闭。
signalLog:
  name: 信号日志
  description: 值得保留的所有传输和回声记录，以及已确立的技术事实。
  schema:
    additionalProperties:
      properties:
        source:
          title: 来源
        channel:
          title: 频道
        timestamp:
          title: 时间戳
        status:
          title: 状态
          x-enumLabels:
            unexplained: 未解释
            traced: 已追踪
            verified: 已验证
            disproven: 已证伪
        note:
          title: 备注
  initialValue:
    call-0614:
      source: 未知——声音是你自己的
      channel: 所有接收器同时响起，随后远程网络中断
      timestamp: 06:14 站点时间（声称来自+72小时后）
      note: 在十七英里处阻止车队。让米娜远离塔楼。不要让托马斯切断信号。
  updateRule: 当叙事接收、记录或发现新的传输或回声时，添加一条条目（使用短横线分隔的小写ID）。随着信息明朗，填入来源、频道和时间戳；当定位到其起源时标记为“已追踪”，当独立仪器或目击者确认时标记为“已验证”，当证明其为伪造或误读时标记为“已证伪”。一旦技术事实确立，除非叙事明确推翻，否则不得更改。切勿删除条目。
convoy:
  name: 医疗车队
  description: 琼恩的爬行器队及其三十个低温包——正前往十七英里。
  schema:
    properties:
      position:
        title: 位置
        x-enumLabels:
          en-route: 前往十七英里途中
          holding: 原地待命
          rerouted: 改道
          at-mile-seventeen: 位于十七英里
          arrived: 安全送达
          stranded: 滞留
          lost: 失联
      contact:
        title: 联络
        x-enumLabels:
          none: 无联络
          intermittent: 间歇性联络
          open: 频道畅通
      cryoPacks:
        title: 低温包完好
  updateRule: 仅当叙事显示车队停下、转向、抵达某地或陷入困境时，才更改位置。根据无线电本回合的实际通信结果设定联络状态。仅当叙事明确显示低温包受损、变质或丢失时，才减少低温包数量。
geography:
  name: 地理
  schema:
    properties:
      overview:
        title: 概览
      regions:
        items:
          properties:
            name:
              title: 名称
            description:
              title: 描述
            climate:
              title: 气候
            landmarks:
              items:
                properties:
                  name:
                    title: 名称
                  description:
                    title: 描述
              title: 地标
        title: 区域
  initialValue:
    overview: 维斯珀是一个潮汐锁定世界。其炽热的昼半球与冰封的夜半球在暮界线交汇，这是一条由红色山脊、寒风和通过无线电相连的定居点组成的宜居带。
    regions:
      - name: 余烬背山脊
        description: 一道承载中继站及其住宅、工坊和可移动太阳能田的锈红色长陡崖。该山脊虽孤立，却从未寂静。
        climate: 干燥多风，向阳侧酷热与背阴侧严寒界限分明。
        landmarks:
          - name: 三桅塔
            description: 余烬背的远程阵列。天气晴朗时，中央桅杆可覆盖西部中继链上的所有定居点。
          - name: 转辙场
            description: 围绕车站最古老的变压器建造的公共工坊、充电区、厨房和会议厅。
      - name: 向阳路
        description: 一条穿过玻璃平原和玄武岩阴影、朝向太阳延伸的硬化爬行器路线。十七英里是其中最暴露的路段。
        climate: 刺眼强光、磨蚀性尘埃，以及能在几分钟内吞噬车辆的热浪前锋。
        landmarks:
          - name: 十七英里
            description: 一座天然石拱旁的野战信号中继器。未来的警告提及此地，但其维护日志未显示任何异常。
          - name: 镜农场
            description: 为余烬背供电的移动太阳能收集器。它们的每日对准情况决定了社区可用的电量。
      - name: 向夜架
        description: 一片向下倾斜的高原，遍布深蓝岩石、霜草和通往永恒黑夜的埋藏冰管。
        climate: 晴朗、极寒，易发生快速移动的冰暴。
        landmarks:
          - name: 夜玻璃天文台
            description: 一座紧凑型研究站，用于研究磁暴、大气回声以及维斯珀冰层的移动边缘。
      - name: 王冠火前线
        description: 一场沿暮界线移动的大陆级磁暴。其带电尘埃扭曲无线电信号，并在天空中绘出金色丝带。
        climate: 电活动频繁、不可预测，对暴露在外的人员、车辆和天线阵列构成危险。
