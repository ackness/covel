  initialValue:
    openingScenario: 06:14，余烬背中继站的每个接收器都播放着同一条不可能的求救信号——你自己的声音，从七十二小时后传来。消息警告你要在十七英里处阻止医疗车队，让米娜远离塔楼，并防止托马斯关闭信号。随后网络失效，因为一场王冠风暴正在逼近。
