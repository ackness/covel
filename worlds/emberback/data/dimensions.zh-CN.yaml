    openingChips:
      - 给托马斯播放录音
      - 呼叫琼恩并阻止车队
      - 跟随米娜爬上去
      - 在信号消失前追踪它
      - 检查站点的剩余电量
    playerConstraints:
      - 你是余烬背最新的线路员，受过训练但尚未被信任独自应对危机。
      - 王冠火将在三小时内到达山脊。
      - 医疗车队已经在移动，远程通信正在失效。
    startingLocation: 余烬背中继站，信号室
