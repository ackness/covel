  initialValue:
    - id: relay-cooperative
      name: 余烬背中继合作社
      description: 站内的技术员、信号员、医护人员、水培农工与炊事员共同维护中继站，并通过例会决定如何分配有限的电力。
      leader: 托马斯·里德，民选值班负责人
      headquarters: 余烬背山脊，转辙场
      relations:
        - description: 中继站为信使导航避开风暴；信使则为孤立的中继站运送补给物资。
        - description: 合作社需要天文台的气象预警，但排斥那些消耗中继宝贵工时与电力的科研实验。
    - id: sunrunners
      name: 逐日者
      description: 民营爬行器车队，负责在暮界线各定居点之间运送急需药品、邮件、备件与被困旅客。
      leader: 每期路线协调会推选出的轮值领队
      headquarters: 各条运输路线本身
      relations:
        - description: 他们将身家性命托付给余烬背的信号员，尽管每次遇到道路封闭都会抱怨连连。
        - description: 对于大多数驾驶员来说，科研预测模型远不如路标地貌、老司机直觉以及电台里清晰的呼叫来得可靠。
    - id: nightglass-observatory
      name: 夜玻璃天文台
      description: 小型科研团队，持续监测维斯珀的大气活动，以及那些偶而在发射源发出前便已抵达的异常无线电回声。
      leader: 米娜·帕克博士
      headquarters: 向夜阶地
      relations:
        - description: 夜玻璃需要余烬背的天线阵列来验证假说；余烬背则需要夜玻璃提供王冠火风暴的精准预警。
powerSystem:
  name: 回声解译
  schema:
    properties:
      name:
        title: 名称
      type:
        title: 类型
      description:
        title: 描述
      rules:
        title: 规则
      tiers:
        items:
          properties:
            name:
              title: 名称
            rank:
              title: 等级
            description:
              title: 描述
        title: 层级
  initialValue:
    name: 回声解译
    description: 从维斯珀地磁风暴引发的时差无线电回声中提炼有效情报的技术。这是一门实打实的技术工艺，而非神秘学预言。
    rules:
      - 回声必须完整录音、打上时间戳，并与独立的参考信号进行比对，方可作为技术证据。
      - 越清晰的未来讯息，在人们针对它采取行动时激起的时空扰动就越强；确凿的未来绝非免费。
      - 回声展现的是可能发生的传输，而非不可逆转的宿命。自主选择可以预防、改变甚至弄巧成拙促成所听到的结果。
      - 王冠火会扩大回声的传播范围，但同时会削弱寻常无线电的通联可靠度，并对暴露外露的电子设备构成巨大危险。
    tiers:
      - name: 监听者
        description: 能在狂暴的背景杂音与静电中辨识出规律特征、虚假重放与真正的人声。
      - name: 追踪者
        description: 能通过比对多座接收机之间的相位漂移，推算回声的发报源头与起始时戳。
      - name: 重构者
        description: 能从多段互相冲突的回声片段中拼接还原缺失信息，同时客观看待未解的不确定性。
      - name: 发信者
        description: 理论上具备向更早的时间窗口反向发送回应的能力。至今尚无经过科学验证的发信者先例。
history:
  name: 历史
  schema:
    items:
      properties:
