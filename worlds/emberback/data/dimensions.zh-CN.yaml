              title: 符号
            description:
              title: 描述
        title: 货币
      resources:
        title: 资源
      tradeNotes:
        title: 贸易
  initialValue:
    currencies:
      - name: 交易筹码
        description: 合作社的记账凭证，能买吃的、付修理费、付路费、买个人用品。就算拿不出筹码，必要的紧急服务也不会拒绝你。
    resources:
      - 电池电量
      - 冷凝水
      - 陶瓷电子元件
      - 爬行器零件
      - 医用低温药品箱
    tradeNotes: 电才是余烬背真正的预算。每一次大修、发射、给车充电或科研扫描，都是在从别的公共需要那里抢电。
socialStructure:
  name: 社会
  schema:
    properties:
      classes:
        items:
          properties:
            name:
              title: 名称
            rank:
              title: 等级
            description:
              title: 描述
        title: 阶层
      notes:
        title: 备注
  initialValue:
    classes:
      - name: 站内社员
        description: 住在余烬背的合作社成员，一起轮维护班、一起投票，也一起担起紧急情况下的义务。
      - name: 外勤车队
        description: 在各定居点之间来回跑的信使、货运司机和机修工，靠站里的临时铺位落脚。
      - name: 往来访客
        description: 研究人员、乘客和商人。他们和所有人一样受紧急保护，但在合作社里没有投票权。
    notes: 等级说的是对公共事务担的责任，不代表一个人的价值。紧急情况下，由懂行的人带头处置。
tone:
  name: 基调
  schema:
    properties:
      genres:
        title: 类型
      contentRating:
        title: 分级
      narrativeStyle:
        title: 叙事风格
      themes:
        title: 主题
  initialValue:
    genres:
      - 边疆科幻
      - 群像冒险
      - 时间谜题
    narrativeStyle: 清楚、以人物为主的冒险文字：技术细节摸得着，时不时来点冷幽默，后果看得见。惊奇感应当来自人们一起解决不可能的难题。
    themes:
      - 提前警告，是改变了危险，还是制造了危险
      - 公共设施是陌生人之间的承诺
      - 专业、信任与共同的责任
      - 希望是一门实打实的功课
mechanics:
  name: 机制
  schema:
    properties:
      combatStyle:
        title: 战斗
      difficulty:
        title: 难度
      skillSystem:
        title: 判定
      customRules:
        title: 房规
  initialValue:
    skillSystem: 有风险的行动用体能、技术、野外经验、洞察或人缘判定。失败会改变时间、电量、信任、安全，或者手头信息的质量，而不是让故事就此停下。
    customRules:
      - 追踪王冠火倒计时；某个行动花掉了不少时间时，说清代价。
      - 车辆、电台和站内系统都要用电；一处用掉的电，别处就用不上。
      - 未来的回声只给线索，从不规定结果。玩家的选择可能阻止、改变或促成那段被听到的发射。
      - 做出的承诺和发现的线索，都记进任务日志和信号日志。
      - 重要角色会记住玩家是否诚实、是否关心人、有没有本事，以及优先保了谁的安全。
startingConditions:
  name: 开场
  schema:
    properties:
      openingScenario:
        title: 开场场景
      openingHook:
        title: 引子
      openingChips:
        title: 开局行动
      playerConstraints:
        title: 限制
      startingLocation:
        title: 起始地点
  initialValue:
    openingScenario: 06:14，余烬背所有的接收器同时放出同一通不可能的求救呼叫——是你自己的声音，从七十二小时之后传来。它警告你：拦住开往十七英里的医疗车队，别让米娜上塔，也别让托马斯关掉信号。随后，王冠火风暴逼近，网络断了。
    openingHook: 未来借了你的声音。你先去提醒谁？
    openingChips:
      - 把录音放给托马斯听
      - 呼叫琼，拦下车队
      - 爬上去追米娜
      - 趁信号还没散，追查来源
      - 看看站里还剩多少电
    playerConstraints:
      - 你是余烬背最新的线路员，受过训练，但大家还不放心让你独自应付一场危机。
      - 王冠火三小时后到达山脊。
      - 医疗车队已经上路，远程通讯正在失效。
    startingLocation: 余烬背中继站，信号室
