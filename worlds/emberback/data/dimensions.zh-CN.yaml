        year:
          title: 年份
        name:
          title: 名称
        description:
          title: 描述
        significance:
          title: 意义
  initialValue:
    - era: 开拓定居时代
      year: 214年前
      name: 降落暮界线
      description: 第一批永久定居基地在暮界线上落成，人们终于找到了仅凭常规工程技术便能平衡严寒与酷热的立足之地。
    - era: 中继时代
      year: 86年前
      name: 余烬背通电启用
      description: 山脊上的三根天线桅杆消除了西部中继链上最漫长的一处通讯盲区，让一处临时维修营地蜕变为守望相助的社区。
    - era: 当代
      year: 19年前
      name: 全网大停电
      description: 一场王冠火风暴切断了六座定居点长达十一天的联络。合作社“凡有呼叫，必有应答”的庄严承诺，正是在那场灾后重建中确立的。
    - era: 当下
      year: 4个月前
      name: 首个证实回声
      description: 米娜·帕克在夜玻璃天文台向外播发气象公报的九分钟前，录制到了该份公报的完整电讯。随后，此类重复事件的时间差越来越长，内容也愈发具体。
