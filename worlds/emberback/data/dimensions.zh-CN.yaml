    - era: 中继时代
      year: 86年前
      name: 余烬背上线
      description: 三座山脊桅杆消除了西部链条中最长的盲区，并将一个维修营地变成了一个社区。
    - era: 现代时代
      year: 19年前
      name: 大断电
      description: 一场王冠风暴使六个定居点与外界隔绝了十一天。合作社“任何呼叫都不会无人应答”的承诺便始于那次恢复期。
    - era: 现在
      year: 4个月前
      name: 首次验证回声
      description: 米娜·帕克在夜玻璃传输天气预报前九分钟记录下了该预报。重复事件变得越来越长且具体。
