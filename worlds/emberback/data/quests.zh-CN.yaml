- id: call-from-tomorrow
  name: 来自明天的呼叫
  description: 你自己的声音从七十二小时后的未来发来了警告。留存呼叫记录，查清它究竟如何传至余烬背，并在王冠火到来前决定向他人透露多少内容。
  giver: 来自未来的神秘呼叫者
  reward: 余烬背首个远程回声背后的真相
  objectives:
    - id: preserve-recording
      text: 单独备份隔离这段未来的呼叫讯息
    - id: verify-voice
      text: 将信号与你在站内留存的声纹进行比对
    - id: trace-origin
      text: 追溯回声的时标与发报源头特征
- id: stop-mile-seventeen
  name: 拦下车队
  description: 琼恩正护送三十箱低温药品赶往警告中点名提及的地点。在远程通讯彻底中断前联络上她。
  giver: 未来的你自己
  reward: 车队平安无事与琼恩的信任
  objectives:
    - id: contact-june
      text: 与琼恩的爬行器建立通讯联络
    - id: change-route
      text: 在车队抵达十七英里前追上他们或说服其改道
- id: keep-the-relay-alive
  name: 三小时供电
  description: 王冠火将在三小时后席卷余烬背。中继站无法同时为远程天线主阵列、风暴护盾、爬行器充电桩、诊所备用电以及米娜的全谱扫描供电。
  giver: 余烬背中继合作社
  reward: 一座仍能应答呼叫的中继站
  objectives:
    - id: audit-charge
      text: 盘点中继站的电力储备与消耗预算
    - id: choose-priorities
      text: 把宝贵的电量分配给最关键的系统
