# zh-CN text for time.yaml. Only translated text; structure and ids come from time.yaml.
definition:
  name: 站区时间
  calendar:
    era: 站区纪年
    months:
      - name: 暮月
  evolution:
    prompt: >-
      站区时间是这个世界唯一的时钟。冠火风暴在站区时间 09:14 到达山脊，也就是
      06:14 那通呼叫之后三小时。按本回合故事里实际花掉的时间推进时钟：一段简短对话 5–10
      分钟；一次修理、搜查或争论 15–40 分钟；开履带车去十七英里或夜镜天文台 30–60
      分钟。如果叙事里说出了钟点或剩下的时间，就照它来。时间只往前走。
