  evolution:
    prompt: >-
      站区时间是这个世界唯一的计时基准。王冠火风暴将在站区时间 09:14
      席卷山脊，即 06:14 那通呼叫后的三小时。请根据本回合实际花费的故事时间推进时钟：简短对话耗时 5–10 分钟，抢修、搜寻或争辩耗时 15–40 分钟，驾驶爬行器前往十七英里或夜玻璃天文台耗时 30–60 分钟。若叙事中明确给出了时钟读数或剩余窗口期，以叙事为准。时间绝不倒流。
