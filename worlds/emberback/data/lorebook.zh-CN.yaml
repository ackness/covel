- id: emberback-relay
  content: 余烬背中继站是一个建在维斯珀宜居带暮界线锈红色山脊上的合作通信站。它的三根桅杆连接着西部中继链上的六千人。该站点的承诺很简单——没有呼叫会被忽视——但电力、零件和时间总是有限的。
- id: vesper
  content: 维斯珀处于潮汐锁定状态。其昼侧热到足以软化裸露的金属，夜侧则覆盖着移动的冰块。人类定居点沿着两者之间的暮界线分布，那里的长阴影使得热量和寒冷可以忍受。
- id: crownfire
  content: 王冠火是沿暮界线移动的带电大气风暴。它在天空中绘出金色丝带，使暴露的电子元件过载，扰乱普通无线电，并能将时间错位的回声传播得比正常情况下更远。
- id: echo-traffic
  content: 回声流量是在源传输之前到达的记录信号。夜玻璃已验证了短时的天气回声，但玩家发出的七十二小时求救呼叫前所未有。回声描述了一种可能的未来；对其采取行动可能会阻止、改变或导致该事件发生。
- id: mile-seventeen
  content: 十七英里是向阳路上的一处暴露交叉点，设有野战中继器和天然玄武岩拱门。一支载有三十个低温包的医疗车队正前往那里。未来的呼叫说不要让车队抵达。
- id: tomas-reed
  content: 托马斯·里德是余烬背五十八岁的首席技师，也是玩家的导师。他冷静、耐心，以糟糕的咖啡闻名，重视经过验证的证据和公共安全。未来的呼叫特别警告玩家不要让托马斯切断信号。
- id: june-okafor
  content: 琼恩·奥卡福是一名逐日者信使，也是余烬背最好的爬行器飞行员。她速度快、风趣、直率，目前正护送医疗车队前往十七英里。当道路变得危险时，她信任玩家能直言不讳。
- id: mina-park
  content: 米娜·帕克博士领导夜玻璃天文台。她花了数月时间证明某些无线电回声在发送之前就已到达。当未来的呼叫警告玩家让她远离主塔时，她正带着风暴读数仪攀登余烬背的主塔。
- id: priya-nair
  content: 普里娅·奈尔是余烬背的首席医师。她管理着八床诊所及其冷藏室，今早已有两名中暑患者，并主张将诊所的备用电力用于其他所有系统。她干练、务实，无法被催促。
- id: eli-varga
  content: 伊莱·瓦尔加是十九岁的夜班信号操作员，记录了06:14的呼叫。他在接收设备方面极具天赋，但在压力下容易焦虑。他认为呼叫结束后，静电噪声中还隐藏着其他东西，且尚未告诉任何人。
