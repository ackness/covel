- id: emberback-relay
  keys: [余烬背, 中继站]
  content: 余烬背中继站坐落在维斯珀宜居暮界线的锈色山脊上，由合作社共同运作。它的三根桅杆连接着西部中继链上的六千名居民。中继站的承诺十分简单——凡有呼叫，必有应答——然而电力、备件与时间却永远捉襟见肘。
- id: vesper
  keys: [维斯珀, 暮界线]
  content: 维斯珀处于潮汐锁定状态，一颗恒星永远定格在天空。昼侧酷热难耐，足以把金属晒软；夜侧则长眠在流动的坚冰之下。人类的定居点沿两者之间的暮界线星罗棋布，借助交织的长影与微风，勉强在极热与极寒之间觅得一线生机。
- id: crownfire
  keys: [王冠火, 风暴]
  content: 王冠火是一场席卷暮界线的强带电大气风暴。它在天际染出如缕金光，烧毁过载外露的电子设备，瘫痪寻常无线电通讯，并能将带有时差的回声传向远超寻常的距离。
- id: echo-traffic
  keys: [回声, 信号]
  content: 所谓回声，是指比发信源头还要先期抵达的信号记录。夜玻璃天文台此前仅证实过历时极短的气象回声，但这一次用你自己的声音发出、跨越七十二小时的求救呼叫却是前所未闻。回声展现的是可能发生的未来；针对回声采取行动，可能会预防、改变甚至弄巧成拙促成预言中的变故。
- id: mile-seventeen
  keys: [十七英里, 车队]
  content: 十七英里是向阳路上的一处开阔隘口，天然玄武岩拱门下固定着一台野战中继器。一支运载着三十箱急救低温药品的医疗车队眼下正驶向该处，而那通未来的呼叫却警告：绝不能让车队抵达十七英里。
