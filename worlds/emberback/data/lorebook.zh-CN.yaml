- id: emberback-relay
  keys: [余烬岭, 中继站]
  content: 余烬岭中继站是一座由合作社经营的通讯站，建在维斯珀宜居的晨昏线上，嵌在一道锈红色的山脊里。三根桅杆连起西部中继链上的六千人。这座站的承诺很简单——凡有呼叫，必有应答——可电、零件和时间总是有限的。
- id: vesper
  keys: [维斯珀, 晨昏线]
  content: 维斯珀是一颗潮汐锁定的行星。昼面热得能把外露的金属晒软，夜面压在流动的冰层下。人类的定居点都沿着两者之间的晨昏线分布：那里影子长，热和冷都还扛得住。
- id: crownfire
  keys: [冠火, 风暴]
  content: 冠火是一种沿晨昏线移动的带电大气风暴。它在天上画出一道道金色光带，让外露的电子设备过载，搅乱普通无线电，还能把带时差的回声送到比平时远得多的地方。
- id: echo-traffic
  keys: [回声, 信号]
  content: 回声，是先于源头发射就被录到的信号。夜镜天文台证实过一些简短的天气回声，但玩家那通跨越七十二小时的求救呼叫前所未有。回声描述的是一种可能的未来；照着它行动，可能阻止、改变，也可能促成那件事。
- id: mile-seventeen
  keys: [十七英里, 车队]
  content: 十七英里是向阳路上一段无遮无挡的地方，那里有一台野外中继器和一座天然玄武岩拱门。一支载着三十个冷藏药箱的医疗车队正往那里开。未来的呼叫说：别让它到。
