name: 余烬背中继站
summary: 潮汐锁定星球上一座孤立的中继站，收到了一通来自七十二小时后的求救呼叫——声音竟是你自己的。
pluginPolicy:
  pitch:
    label: 余烬背救援
    description: 经典故事模式，包含投骰判定、任务、随身行囊、站内同伴关系，以及针对风暴、电网、信号日志和车队的实时面板。
    reason: 在王冠火到来的前三小时里，每一次选择都会有所消耗——时间、电量、物资或信任——而各面板会如实展现所剩的一切。
characterSchema:
  attributes:
    - id: grit
      name: 坚毅
      description: 长途跋涉、负重攀爬，以及在极热或严寒下维持行动力所需的体魄与耐力。
    - id: systems
      name: 系统
      description: 操作电台、电网、车辆与传感器，以及现场应急抢修的技术能力。
    - id: fieldcraft
      name: 野外生存术
      description: 应对野外作业的实用判断力：辨识方位、预判天候、驾驶车辆、规划路线，并在站区之外保全生命。
    - id: insight
      name: 洞察
      description: 捕捉规律、细致观察，以及从背景杂音中甄别有效信号的能力。
    - id: rapport
      name: 默契
      description: 赢得信任、平息争端、察言观色，以及在不把对方当成阻碍的前提下说服他人的能力。
