name: 余烬背中继站
summary: 潮汐锁定的星球上，一座孤零零的中继站收到一通求救呼叫。声音是你自己的，来自七十二小时之后。
pluginPolicy:
  pitch:
    label: 余烬背救援
    description: 传统故事模式，带骰子判定、任务、随身行囊和同伴关系，另有风暴、电网、信号日志和车队的实时面板。
    reason: 王冠火来临前的三小时里，每个选择都要花掉点什么——时间、电量、货物或信任——面板上清清楚楚写着还剩多少。
characterSchema:
  attributes:
    - id: grit
      name: 体能
      description: 力气和耐力：走难走的路、搬重物、攀爬，在酷热或严寒里还能正常干活。
    - id: systems
      name: 技术
      description: 电台、电网、车辆和传感器方面的技术，以及临场凑合着修好东西的本事。
    - id: fieldcraft
      name: 野外经验
      description: 出了站也靠得住的实际判断：认路、看天、开车、规划路线、活下来。
    - id: insight
      name: 洞察
      description: 看出规律，观察仔细，能从杂音里分辨出有意义的信号。
    - id: rapport
      name: 人缘
      description: 能赢得信任、平息争执、看懂场面，也能说服别人，而不是把人当成绊脚石。
