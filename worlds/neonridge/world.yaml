schemaVersion: "1.0"
id: neonridge
name: 霓虹脊・2087
version: "0.1.0"
summary: 赛博朋克城市，义体改造与企业战争是日常。你是街头的无名小卒。
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
tags:
  - cyberpunk
  - noir
  - thriller
requiredPlugins:
  - pregame
  - world-init
  - char-creator
  - narrator
recommendedPlugins:
  - guide
  - codex
  - npc-graph
  - player-identity
  - living-world-rules
excludedPlugins:
  - chat-mode-narrator
  - scene-cast
  - scene-prompts
  - branch-reply
pluginPolicy:
  preset: traditional-story
  preferTags:
    - mode:traditional-story
    - role:codex
    - role:retrieval
    - role:world-rules
  avoidTags:
    - mode:dialogue
worldData: data/world.data.yaml
