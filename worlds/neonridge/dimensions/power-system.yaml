name: 义体技术
type: technology
description: 通过植入机械义体增强人体能力。超过70%居民至少有一处义体，但维护成本是底层人的枷锁。
rules:
  - 义体过载触发'金属热'——排异反应导致抽搐甚至义体失控
  - 义体需定期充能和维护，否则性能衰减直至瘫痪
  - 底层信号屏蔽区无法远程诊断义体，只能依赖黑市技师
  - 军用级义体仅限赤焰安保持有，民间持有属重罪
tiers:
  - name: 民用级
    rank: 1
    description: 基础肢体替换与感官增强
  - name: 商用级
    rank: 2
    description: 高性能运动/计算义体，需企业授权
  - name: 军用级
    rank: 3
    description: 武器化义体与战术神经接口
  - name: 实验级
    rank: 4
    description: 未公开的前沿原型，存在严重风险
