# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
id: lantern-barrow
name: 提灯古冢・初次远征
version: 0.1.3
summary: 守了百年的古冢之灯熄灭，守灯人失踪，青铜墓门洞开。到灰苇村的酒馆组队、分配点数，掷骰踏上第一次远征。
defaultLocale: zh-CN
tags:
  - fantasy
  - tabletop
  - dungeon-crawl
  - party
  - dice
author:
  name: Covel Contributors
  url: https://github.com/ackness/covel
license: MIT
cover: media/gallery/lantern-barrow-hero.webp
accentColor: "oklch(72% 0.12 75)"
# Uses classic story pack plus dice-check / action-check@1; data/ conventions
# pull in tabletop-rules, core-quest, inventory, affinity, story-events, world-time.
plugins:
  - pack:traditional-story
  - plugin:dice-check
  - contract:action-check@1
pluginPitch:
  label: 经典跑团
  description: 开局配点、骰池检定与失败代价时钟、带加成的随身装备、带期限任务与背包、队友好感，以及地城探索与警戒面板。
  reason: 自己分配属性，按骰子结果行动。地图记录走过的地方，警戒与失败时钟记录时间流逝、寒气与惊动古冢的响动。
pluginSettings:
  story-events:
    planner: true
characterSchema:
  attributes:
    - id: persona
      name: 性格
      type: string
      category: bio
      description: 冒险者的性格和说话方式，例如“嘴硬心软、说话简短的老兵”。叙事会据此刻画你。
    - id: calling
      name: 职业
      type: string
      category: bio
      description: 你的冒险者靠什么吃饭：退役兵、锁匠、落魄书吏、修会随从、沼泽向导，或你自己的说法。
    - id: background
      name: 来历
      type: string
      category: bio
      description: 你为何来到灰苇村：为三十枚银币而来、受修会托付带信、在找二十年前失踪小队的旧识，或是追着王都学者科尔文的踪迹。
    - id: might
      name: 力量
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 搏斗、破门、攀爬与负重。
    - id: agility
      name: 敏捷
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 闪避、潜行、开锁与解除机关。
    - id: endurance
      name: 体魄
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 抵抗毒、寒冷、疲惫与恐惧带来的身体崩溃。
    - id: wits
      name: 智识
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 辨认符文、回忆传说、推理谜题与识破陷阱的原理。
    - id: insight
      name: 感知
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 察觉埋伏、听出谎言、发现暗门与追踪痕迹。
    - id: presence
      name: 魅力
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 说服、威吓、安抚与谈判——包括和不该被叫醒的东西谈判。
    - id: hp
      name: 生命
      type: number
      min: 0
      max: 20
      defaultValue: 12
      category: stats
      description: 受伤时下降，休息与治疗时恢复。降到 0 会倒下，而不是立刻死亡。
    - id: condition
      name: 状态
      type: string
      category: stats
      description: 当前受伤、中毒、惊惧等明显状态。
    - id: trust
      name: 信任
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的信任
