# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
schemaVersion: "1.0"
id: lantern-barrow
name: 提灯古冢・初次远征
version: 0.1.0
summary: 守了百年的古冢之灯熄灭，守灯人失踪，青铜墓门洞开。在灰苇村的酒馆里组队、分配点数、掷骰下墓——经典跑团，从第一次远征开始。
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
tags:
  - fantasy
  - tabletop
  - dungeon-crawl
  - party
  - dice
author:
  name: Covel Contributors
  url: https://github.com/ackness/covel
license: MIT
cover: media/gallery/lantern-barrow-hero.webp
accentColor: "oklch(72% 0.12 75)"
pluginPolicy:
  packs:
    - id: classic-tabletop
      label: 经典跑团
      description: 开局配点、表单检定与骰池判定、任务与背包、队友好感，以及地城探索、警戒与名望面板。
      tags:
        - mode:traditional-story
      reason: 跑团的乐趣在于规则可见：属性是你分的，骰子是真掷的，每个房间、每次惊动墓穴的响动都会记在面板上。
      requested:
        - pregame
        - world-init
        - char-creator
        - narrator
        - tabletop-rules
        - dice-check
        - core-quest
        - inventory
        - affinity
        - guide
        - codex
        - npc-graph
        - living-world-rules
        - character-blueprint
        - story-events
      recommended:
        - branch-reply
  presetId: classic-tabletop
  preferredTags:
    - mode:traditional-story
  avoidedTags:
    - mode:dialogue
  requires:
    - action-check@1
  requested:
    - pregame
    - world-init
    - char-creator
    - narrator
    - tabletop-rules
    - dice-check
  recommended:
    - core-quest
    - inventory
    - affinity
    - guide
    - codex
    - npc-graph
    - living-world-rules
    - character-blueprint
    - story-events
    - branch-reply
pluginSettings:
  story-events:
    planner: true
characterSchema:
  types:
    - npc
    - companion
  attributes:
    - id: persona
      name: 性格
      type: string
      category: bio
      description: 你的冒险者是什么样的人、怎么说话——如「嘴硬心软的老兵，说话简短」。影响叙事如何刻画你。
    - id: calling
      name: 职业
      type: string
      category: bio
      description: 你的冒险者靠什么吃饭：战士、游荡者、学者、祭司、猎人，或你自己的说法。
    - id: background
      name: 来历
      type: string
      category: bio
      description: 你为什么来到灰苇村，以及一件只有你知道的往事。
    - id: might
      name: 力量
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 搏斗、破门、攀爬与负重。
    - id: agility
      name: 敏捷
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 闪避、潜行、开锁与解除机关。
    - id: endurance
      name: 体魄
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 抵抗毒、寒冷、疲惫与恐惧带来的身体崩溃。
    - id: wits
      name: 智识
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 辨认符文、回忆传说、推理谜题与识破陷阱的原理。
    - id: insight
      name: 感知
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 察觉埋伏、听出谎言、发现暗门与追踪痕迹。
    - id: presence
      name: 魅力
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 说服、威吓、安抚与谈判——包括和不该被叫醒的东西谈判。
    - id: hp
      name: 生命
      type: number
      min: 0
      max: 20
      defaultValue: 12
      category: stats
      description: 受伤时下降，休息与治疗时恢复。降到 0 会倒下，而不是立刻死亡。
    - id: condition
      name: 状态
      type: string
      category: stats
      description: 当前受伤、中毒、惊惧等明显状态。
    - id: trust
      name: 信任
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的信任
worldData: data/world.data.yaml
