# en-US text for world.yaml. Only translated text; structure and ids come from world.yaml.
name: "Lantern Barrow: The First Delve"
summary: >-
  The lantern that guarded the barrow for a century has gone dark. Its keeper is
  missing, and the bronze tomb doors stand open. Gather a party at Greyreed's tavern,
  assign your points, and roll the dice on your first expedition.
pluginPitch:
  label: Classic Tabletop
  description:
    Point-buy character creation, dice-pool checks with failure clocks and item costs,
    gear with check bonuses, timed quests, Bag, companion affinity, and panels for
    dungeon exploration, the barrow's alarm, and your renown.
  reason: >-
    Assign your own attributes and act on the dice results. The map records where
    you have been; the alarm and clock panels track time spent in the tomb, creeping
    chill, and disturbances that wake the barrow.
characterSchema:
  attributes:
    - id: persona
      name: Personality
      description: >-
        Your adventurer's temperament and way of speaking, for example "a gruff,
        softhearted veteran who keeps it brief." The narrator uses this to portray you.
    - id: calling
      name: Calling
      description: >-
        How your adventurer makes a living: retired soldier, locksmith, fallen scribe,
        Order courier, marsh guide, or something of your own.
    - id: background
      name: Background
      description: >-
        Why you came to Greyreed—for thirty silver coins, carrying a sealed letter for the
        Order, tracing a missing soldier from twenty years ago, or following Corvin Ashe
        from the capital.
    - id: might
      name: Might
      description: Fighting, breaking down doors, climbing, and carrying heavy loads.
    - id: agility
      name: Agility
      description: Dodging, sneaking, picking locks, and disarming traps.
    - id: endurance
      name: Endurance
      description: Withstanding poison, cold, exhaustion, and the body giving out under terror.
    - id: wits
      name: Wits
      description:
        Recognizing runes, recalling legends, solving puzzles, and figuring out how
        traps work.
    - id: insight
      name: Insight
      description: Noticing ambushes, detecting lies, finding secret doors, and following tracks.
    - id: presence
      name: Presence
      description:
        Persuading, intimidating, reassuring, and negotiating, even with things that
        should have stayed asleep.
    - id: hp
      name: Hit Points
      description:
        Lost when you are hurt; restored by rest and healing. At 0, you collapse
        rather than die immediately.
    - id: condition
      name: Condition
      description: Current, visible conditions such as injury, poisoning, or fear.
    - id: trust
      name: Trust
      description: Trust in the player
