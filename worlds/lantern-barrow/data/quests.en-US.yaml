- id: find-the-keeper
  name: Find the Lampkeeper
  description:
    Lampkeeper Ysolde entered the barrow the night the lantern went out. Three days
    later, she still hasn't returned. The reeve is offering a bounty to bring her back
    alive.
  giver: Reeve Aldous Penn
  reward: Thirty silver coins and the village's gratitude
  deadline:
    label: Before the Barrow King wakes completely
    missed: When the Barrow King opens his eyes, the singing stops. Ysolde can no longer walk out untouched; her lantern and voice are drawn into the throne room's cold light.
  objectives:
    - id: keepers-cottage
      text: Visit the Lampkeeper's Cottage and see what she left behind
    - id: enter-the-barrow
      text: Go through the open bronze tomb doors
    - id: find-ysolde
      text: Find Ysolde in the barrow
    - id: bring-ysolde-home
      text: Bring Ysolde back to the village alive
- id: the-lantern-heart
  name: The Missing Lantern Heart
  description:
    The barrow lantern didn't go out on its own. Someone took the Lantern Heart
    that lit it. Find out who and why, then decide where it belongs.
  giver: Sister Wren
  reward: The Order of the Dawn Lantern's recognition, and a barrow that sleeps again
  objectives:
    - id: inspect-the-lantern
      text: Climb to the summit of the barrow and examine the extinguished lantern
    - id: who-took-it
      text: Find out who took the Lantern Heart
    - id: decide-its-fate
      text: Recover the Lantern Heart and decide where it should go
      deadline:
        when: { affinity: Sister Wren }
        label: While Sister Wren still trusts you
        missed: Sister Wren stopped trusting you and stepped off into the dark alone with only her bronze pendant to answer for the Order.
- id: the-singing-below
  name: The Singing Below
  description: >-
    The miller's daughter says she hears voices beneath the ground at night, singing her dead
    grandfather's name. Mirelle asks you to look into it along the way.
  giver: Mirelle Voss, innkeeper
  reward: One free night's food and lodging, and a favor from Mirelle
  objectives:
    - id: talk-to-the-millers-daughter
      text: Talk to the miller's daughter
    - id: find-the-choir
      text: Find the source of the singing
