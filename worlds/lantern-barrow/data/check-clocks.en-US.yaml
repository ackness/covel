- id: barrow-chill
  name: Barrow Chill
  full: Damp marsh cold settles into your clothes and knuckles. Fighting, forcing doors, and pushing through exhaustion are harder from now on.
- id: unquiet-dead
  name: Unquiet Dead
  full: Singing and footsteps press right up to the edge of your torchlight. Dodging ambushes and spotting traps in the dark are harder from now on.
