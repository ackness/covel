- id: night-singing
  title: Singing in the village
  payload: >-
    Late at night, the singing carries over the barrow hill into the village. The miller's
    daughter walks barefoot out of her house, eyes shut, humming her grandfather's name
    to the tune from underground. She heads uphill. Not a dog barks. Show the villagers'
    panic when they see her. Give the party time to stop her, follow her, or look for
    the source. Do not reveal where the singing comes from.
- id: corvin-cornered
  title: The cornered scholar
  payload: >-
    Someone is arguing with the choir in the darkness ahead: Corvin Ashe. The dead stand
    in a ring, silent now, their heads turned toward him. They have him cornered in a
    burial chamber. He hugs a dimly glowing crystal to his chest: the Lantern Heart.
    When he recognizes the party, he begs for help, then starts setting terms. He insists
    he "hasn't finished studying it." Let his arrogance and fear both show. Leave room
    for the party to rescue him, take the Heart, or negotiate. Call for checks when
    needed; leave the decision to the player.
- id: king-wakes
  title: The Barrow King
  payload: >-
    The choir falls silent. Deep within the hill, a voice older than the tomb speaks
    the Marsh King's own name. Cold green light comes from the throne room. The Barrow
    King wakes and offers terms in the villagers' voices without attacking immediately. Make his
    power, his terms, and the immediate danger clear. Let the player choose whether
    to fight, flee, or bargain, calling for checks when needed.
- id: keeper-in-the-choir
  title: The lampkeeper's voice
  payload: >-
    A familiar old voice comes through the choir: Lampkeeper Ysolde. She keeps humming
    the tune lampkeepers use on their rounds, pressing it over the dead's melody as if
    holding something back. Near the barrow or inside it, the party can recognize her
    voice coming from deeper within. Give the party a sense of urgency about finding her,
    but do not explain what she is doing or how long she can hold on.
- id: penn-ledger
  title: The reeve's ledger and the wax
  payload: >-
    Either behind Mirelle's bar or inside a cracked pine chest in the cottage, a page
    shows Reeve Penn's flood-dike accounts missing coin the very week Corvin took a
    wax impression of the spare cottage key. Surface only the paper gap and the wax
    trace so the player can choose whether to confront Penn, confer with Wren, or
    carry the lead straight down into the barrow; do not spell out Corvin's whole aim.
- id: ossuary-echoes
  title: Echoes in the Bone Hall
  payload: >-
    Several skulls in the Bone Hall niches shift slightly and repeat what one of the
    party just said—mixed with the names of the companions Brannoc left behind twenty
    years ago. The veteran locks up while shadows creep toward the edge of the
    torchlight. Convey the disorienting echoes and leave the player room to steady
    Brannoc, dim the light and slip past, or inspect the counterweighted flagstones,
    calling for checks where uncertain.
- id: drowned-reliquary
  title: Rusted shield and sealed oil
  payload: >-
    The black water in the Flooded Chamber parts enough to show a rusted iron shield
    from the expedition twenty years ago pinning down a wax-sealed Order bronze oil
    case. That oil could relight several wall lamps in the Hall of Lamps, though an
    iron chain runs from the shield toward a sluice deeper in the stone. Let the party
    weigh fishing it out against the cold water and the sound it may wake.
