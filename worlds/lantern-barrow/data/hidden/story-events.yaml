# Hidden encounters, imported by the story-events convention.
# Payloads give the GM a scene and its stakes, never its outcome.
- id: night-singing
  title: 歌声到了村子
  when:
    all:
      - time: phase
        equals: 4
      - dimension: lantern
        path: lamp
        equals: dark
  payload: 深夜，歌声越过古冢山，传到村里。磨坊主的女儿赤脚走出家门，双眼紧闭，跟着地底的曲调哼祖父的名字，朝山上走。村里的狗一声不吠。写出村民看见她时的惊慌，留出拦住她、跟上她或寻找歌声源头的机会。不要揭示歌声的来历。
  priority: 5
- id: corvin-cornered
  title: 学者的困境
  when:
    all:
      - dimension: barrowAlarm
        path: level
        gte: 3
      - dimension: lantern
        path: heart
        in: [missing, traced]
  payload: 前面的黑暗里，有人在和合唱争吵，是科尔文・艾什。亡者围了一圈，停了歌，转头盯着他，把他堵在墓室角落。他紧抱着一块微亮的晶石：灯心。认出队伍后，他先求救，接着又谈条件，坚持说“还没研究完”。让他的傲慢和恐惧都露出来，留给队伍救人、夺灯心或谈判的余地。需要时要求检定，不替玩家决定。
  priority: 10
- id: king-wakes
  title: 古冢之王
  when:
    dimension: barrowAlarm
    path: level
    gte: 6
  payload: 合唱突然停了。山心深处，一个比墓室还古老的声音念出沼泽之王自己的名字，王座厅那边亮起冷绿色的光。古冢之王醒来，先借村民的声音向队伍开出交易条件，没有立即进攻。写清他的威势、条件和眼前的危险，让玩家决定战斗、逃跑还是交易，需要时要求检定。
  priority: 20
- id: keeper-in-the-choir
  title: 合唱里的守灯人
  when:
    all:
      - revealed: night-singing
        turnsSinceGte: 2
      - dimension: lantern
        path: keeper
        equals: missing
  payload: 合唱里传出一个熟悉的苍老声音，是守灯人伊索德。她反复哼着守灯人巡山的调子，压过亡者的旋律，像在拖住什么。队伍靠近古冢或身处墓中时，能辨认出她的声音来自更深处。让这条线索催着队伍去找她，但别解释她正在做什么，也别透露还能撑多久。
  priority: 7
- id: penn-ledger
  title: 村长的账本与封蜡
  when:
    all:
      - turnGte: 2
      - dimension: barrowAlarm
        path: level
        lte: 2
      - dimension: lantern
        path: heart
        equals: missing
  payload: 梅瑞尔或守灯人小屋的旧木箱露出了一条不合常理的旧账：村长潘恩修堤的帐目缺了一笔银币，同一周科尔文恰巧拿走了一把小屋备钥的蜡模。先只拿出物证和缺口，让玩家决定是先去质问村长、先找修女商量，还是立刻带着线索进墓；别当场把科尔文的全部动机说穿。
  priority: 4
- id: ossuary-echoes
  title: 骸骨堂的回声
  when:
    all:
      - dimension: delveMap
        path: bone-hall.status
        equals: explored
      - dimension: barrowAlarm
        path: level
        gte: 2
  payload: 骸骨堂墙龛里的几颗旧颅骨忽然同时微转，低声吐出队伍里某个人刚说过的话——却夹杂着二十年前布兰诺克逃出时丢下同伴的名字。老兵当场僵住，火把边缘好像多了几道人影在试探火光。写出声音错位与压迫感，留给玩家稳住布兰诺克、熄灯绕行或先查地面方砖机关的选择，必要时发起检定。
  priority: 8
- id: drowned-reliquary
  title: 水下铁盾与灯油匣
  when:
    all:
      - dimension: delveMap
        path: flooded-chamber.status
        equals: explored
      - dimension: barrowAlarm
        path: phasesInside
        gte: 2
  payload: 水淹墓室的黑水退开半寸，露出二十年前那支小队遗落的锈铁盾，旁边压着一只黎明灯修会封印完好的铜油匣。油匣够把千灯廊好几盏熄灭的壁灯重新点亮，却会顺着铁链牵动墓室深处的水闸声响。让玩家权衡要不要冒险捞取，并提示水温与响动带来的风险。
  priority: 8
