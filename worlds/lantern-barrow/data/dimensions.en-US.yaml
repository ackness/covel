# en-US text for dimensions.yaml. Only translated text; structure and ids come from dimensions.yaml.
delveMap:
  name: Delve Map
  description: Known rooms in Lantern Barrow and their current condition.
  schema:
    additionalProperties:
      properties:
        room:
          title: Room
        status:
          title: Status
          x-enumLabels:
            rumored: Rumored
            explored: Explored
            cleared: Cleared
            sealed: Sealed
            collapsed: Collapsed
        note:
          title: Notes
  initialValue:
    bronze-doors:
      room: The Bronze Doors
      note:
        The doors have stood open since the night the lantern went out. The seal was pushed
        open from the inside.
    hall-of-lamps:
      room: Hall of Lamps
      note:
        The lampkeeper once said wall lamps line both sides of the first passage inside the
        tomb.
  updateRule:
    "Add an entry when a named room is first entered, seen, or reported by a
    reliable source in the narrative. Use a short English kebab-case ID. Set status to
    rumored if the party has only heard about it; explored once the player enters and
    looks around; cleared once the danger is dealt with; sealed if the door is sealed;
    collapsed if the room caves in. Write one sentence in note about the most important
    discovery: an exit, trap, relic, or danger. Never delete entries or explore unvisited
    rooms on the player's behalf."
barrowAlarm:
  name: Barrow Alarm
  description: How close the barrow is to waking. At 6, the Barrow King opens his eyes.
  schema:
    properties:
      level:
        title: Alarm
      stage:
        title: Signs
        x-enumLabels:
          sleeping: Sleeping
          murmuring: Murmuring
          restless: Restless
          singing: The choir sings
          stirring: The throne trembles
          awake: The Barrow King wakes
  updateRule:
    "Apply updates only after the party enters the barrow. Raise level by 1 when
    this turn's narrative contains fighting, breaking down doors, loud shouting, lighting
    a flame in the Choir Gallery, a critical failure, or a prolonged rest inside the tomb
    (at most +2 per turn). Lower it by 1 for relighting a wall lamp, slipping quietly past
    danger, or soothing the dead. Set stage from level: 0 sleeping, 1 murmuring, 2
    restless, 3–4 singing, 5 stirring, 6 awake. Reset level to 0 once the Lantern Heart is
    back in the ancient lantern and the lantern has been relit."
lantern:
  name: The Barrow Lantern
  description: Where the Lantern Heart is, and whether the lantern burns again.
  schema:
    properties:
      heart:
        title: Lantern Heart
        x-enumLabels:
          missing: Missing
          traced: Clue found
          recovered: Recovered
          returned: Back in the lantern
          shattered: Shattered
          bargained-away: Bargained away
      lamp:
        title: Lamp
        x-enumLabels:
          dark: Dark
          flickering: Flickering
          burning: Burning
      keeper:
        title: Lampkeeper
        x-enumLabels:
          missing: Missing
          found: Found
          rescued: Rescued
          lost: Did not survive
  updateRule:
    Update only when the narrative explicitly establishes a change. Set heart to
    traced when its whereabouts are learned, recovered when it is retrieved, returned when
    it is placed back in the lantern, shattered if it is destroyed, or bargained-away if
    it is handed to the Barrow King or anyone else. Set lamp to burning once the Heart has
    been returned and the lantern lit, or flickering if a temporary flame is barely
    keeping it alight. Set keeper to found when Ysolde is seen, rescued when she is
    brought out of the barrow, or lost if she dies.
renown:
  name: Renown
  description: What people in Greyreed and the surrounding area say about you.
  schema:
    properties:
      score:
        title: Renown
      title:
        title: Known as
        x-enumLabels:
          stranger: Stranger
          sellsword: Sellsword
          trusted: Trusted
          hero-of-greyreed: Hero of Greyreed
          legend: Legend
      deeds:
        title: Deeds
  updateRule:
    "Adjust when villagers witness or have actually heard about the player's
    actions: +1 for solving a specific problem for a villager, +2 for rescuing the lampkeeper
    or relighting the lantern, and -1 for deceiving, extorting, or bringing trouble on
    villagers. Add a sentence to deeds for each change. Set title from score: 0–1
    stranger, 2–3 sellsword, 4–6 trusted, 7–8 hero-of-greyreed, 9–10 legend. Actions no
    one knows about do not affect renown."
geography:
  name: Geography
  schema:
    properties:
      overview:
        title: Overview
      regions:
        title: Regions
        items:
          properties:
            name:
              title: Name
            description:
              title: Description
            climate:
              title: Climate
  initialValue:
    overview:
      Greyreed stands on the edge of Greyreed Marsh. The small hill north of the
      village is Lantern Barrow. For a hundred years, the ancient lantern on its summit
      has burned every night.
    regions:
      - name: Greyreed Village
        description:
          Thirty-odd households, a mill, the Crooked Antler tavern, and a small chapel.
          The villagers are practical, superstitious, and know one another inside out.
        climate: Damp and foggy, already cold in late autumn.
      - name: The Lampkeeper's Cottage
        description:
          A stone cottage at the foot of the barrow, where Ysolde has lived for forty
          years. Inside are lamp oil and old logbooks. The door is never locked.
      - name: The Lantern Barrow
        description:
          A round hill covered in dead grass. An extinguished lantern stands at the
          summit; halfway up, the bronze tomb doors hang open. The tomb is bigger inside
          than the hill that holds it.
        climate: Cold and clammy inside the tomb, with a smell of lamp oil and wet earth.
      - name: Greyreed Marsh
        description:
          Reeds and black water as far as the eye can see. They say the Marsh King's
          old village lies drowned somewhere beneath them.
factions:
  name: Factions
  schema:
    items:
      properties:
        name:
          title: Name
        description:
          title: Description
  initialValue:
    - id: greyreed-village
      name: Greyreed Village
      description:
        Reeve Penn runs the village; Mirelle at the tavern hears the news first. They
        want the lantern relit and life back to normal.
    - id: dawn-lantern-order
      name: Order of the Dawn Lantern
      description:
        An order that tends ancient lanterns in many places, believing their light
        lets the dead rest. Sister Wren is the acolyte they sent here.
    - id: hollow-choir
      name: The Hollow Choir
      description:
        "The dead inside the barrow. They do not attack people who sing. They simply
        keep singing: the Marsh King's name, and the names of the living."
tone:
  name: Tone
  schema:
    properties:
      genres:
        title: Genres
      contentRating:
        title: Rating
        x-enumLabels:
          all-ages: All ages
          teen: Teen
          mature: Mature
      narrativeStyle:
        title: Narrative style
  initialValue:
    genres:
      - classic fantasy
      - dungeon crawl
      - folk horror
    narrativeStyle:
      "Tell the story like a good game master: concrete scenes, brisk pacing,
      and real danger without gore. Laughter in the tavern; singing in the tomb."
mechanics:
  name: Mechanics
  schema:
    properties:
      combatStyle:
        title: Combat
        x-enumLabels:
          turn-based: Turn-based
          real-time: Real-time
          narrative: Narrative
          none: None
      difficulty:
        title: Difficulty
        x-enumLabels:
          easy: Easy
          normal: Normal
          hard: Hard
          adaptive: Adaptive
      skillSystem:
        title: Checks
      customRules:
        title: House rules
  initialValue:
    skillSystem:
      Might, Agility, Endurance, Wits, Insight, and Presence each start at 1.
      Distribute 6 additional points as you choose, to a maximum of 4 in any one
      attribute. Checks roll d20 + the attribute modifier (+2 per point, +10 at 5) against difficulty 8/12/16/20. A natural 20 is
      a critical success; a natural 1 is a critical failure.
    customRules:
      - At 0 hit points, you collapse rather than die immediately. Companions can drag you
        back.
      - A torch burns for about one phase of the day. Without light in the barrow, you
        cannot see where you are going or spot traps.
      - Noise, lighting a flame in the Choir Gallery, and resting too long inside the tomb all raise the Barrow Alarm.
startingConditions:
  name: Opening
  schema:
    properties:
      openingScenario:
        title: Opening scene
      openingHook:
        title: Hook
      openingChips:
        title: Opening moves
      startingLocation:
        title: Starting point
  initialValue:
    openingScenario:
      'Rain falls on a late-autumn night as you push open the door of the
      Crooked Antler. The reeve''s bounty notice hangs above the bar: the lampkeeper is
      missing, the barrow lantern has gone out, and the bronze tomb doors stand open.
      Thirty silver coins to whoever goes down. An old soldier cleans his sword in the
      corner; a young sister by the window leafs through a book of ancient lantern
      inscriptions. The innkeeper slides you a mug of hot ale. "You here about the notice
      too?"'
    openingHook: The lantern has been dark for three days. Who goes down with you tonight?
    openingChips:
      - Ask the innkeeper about the lampkeeper
      - Sit across from the old soldier
      - Ask the sister to read the lantern inscriptions
      - Find the reeve and talk money
    startingLocation: Greyreed, the Crooked Antler
