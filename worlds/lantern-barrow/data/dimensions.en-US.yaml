# en-US text for dimensions.yaml. Only translated text; structure and ids come from dimensions.yaml.
delveMap:
  name: Delve Map
  description: Known rooms in Lantern Barrow and their current condition.
  schema:
    additionalProperties:
      properties:
        room:
          title: Room
        status:
          title: Status
          x-enumLabels:
            rumored: Rumored
            explored: Explored
            cleared: Cleared
            sealed: Sealed
            collapsed: Collapsed
        note:
          title: Notes
        exits:
          title: Adjacent locations
  initialValue:
    bronze-doors:
      room: The Bronze Doors
      note: Open since the night the lantern went out. The seal bears signs of being forced from inside.
    hall-of-lamps:
      room: Hall of Lamps
      note: The lampkeeper said wall lamps line the first passage inside the tomb.
    keepers-cottage:
      room: The Lampkeeper's Cottage
      note: Ysolde has lived in this stone cottage at the foot of the hill for forty years.
    summit-lantern:
      room: The Summit Lantern
      note: The lantern that kept watch for a century has gone dark.
    bone-hall:
      room: Bone Hall
      note: The party has only heard that this hall exists; no one has explored it yet.
    flooded-chamber:
      room: Flooded Burial Chamber
      note: The party has heard of a flooded chamber but has yet to see it.
    choir-gallery:
      room: Choir Gallery
      note: The dead sing in a passage inside the tomb. What awaits there is still unknown.
    throne-room:
      room: Throne Room
      note: The throne lies deep within the hill. No one has brought back word of the room.
  updateRule: >-
    Maintain only the locations already on the map. Do not add, delete, or rename them, or change their connections.
    Set status to explored after the party enters and looks around, cleared after its dangers are dealt with,
    sealed if its door is sealed, or collapsed if it caves in. Leave places known only by rumor as rumored.
    In Notes, record only discoveries confirmed this turn, such as traps, relics, dangers, or whether a passage is usable.
    Never explore on the player's behalf. Connections are fixed passages. For sealed doors or cave-ins,
    change the status and note which passage is blocked; keep the exits and never invent a new route.
barrowAlarm:
  name: Barrow Alarm
  description: The barrow is waking. The longer you stay inside, the more it stirs. At 6, the Barrow King opens his eyes.
  schema:
    properties:
      phasesInside:
        title: Phases spent in the tomb
      level:
        title: Alarm
      stage:
        title: Signs
        x-enumLabels:
          sleeping: Sleeping
          murmuring: Murmuring
          restless: Restless
          singing: The choir sings
          stirring: The throne trembles
          awake: The Barrow King wakes
  updateRule: >-
    Follow the settled world clock for this turn and list this dimension as following the clock.
    If the party enters the tomb or acts inside it at any point this turn, add all elapsed phases reported by
    that clock to Phases spent in the tomb. Count a turn spent leaving the tomb the same way;
    add nothing for a turn spent entirely outside. Never count messages or estimate elapsed time yourself.
    Each time the accumulated count crosses a multiple of three, raise Alarm by 1. Count every threshold
    crossed, but this natural increase can only raise Alarm to 5; an existing 6 stays at 6.
    Keep the accumulated count after retreating and resume it on re-entry. Never count the same threshold twice.
    Then apply this turn's events inside the tomb: add 1 each for fighting, breaking down doors, loud shouting,
    lighting a flame in the Choir Gallery, a critical failure, or a prolonged rest. These increases are capped
    at 2 per turn and can raise Alarm to 6. Subtract 1 each for relighting a wall lamp, slipping quietly past
    danger, or soothing the dead. Clamp the final Alarm to 0 through 6. Set stage to match:
    0 sleeping, 1 murmuring, 2 restless, 3 or 4 singing, 5 stirring, 6 awake.
    Once the Lantern Heart is back in the lantern and the lantern is lit, reset both Alarm and Phases spent
    in the tomb to 0, with stage set to sleeping. Keep them there while the lantern burns.
lantern:
  name: The Barrow Lantern
  description: Where the Lantern Heart is, and whether the lantern burns again.
  schema:
    properties:
      heart:
        title: Lantern Heart
        x-enumLabels:
          missing: Missing
          traced: Clue found
          recovered: Recovered
          returned: Back in the lantern
          shattered: Shattered
          bargained-away: Bargained away
      lamp:
        title: Lamp
        x-enumLabels:
          dark: Dark
          flickering: Flickering
          burning: Burning
      keeper:
        title: Lampkeeper
        x-enumLabels:
          missing: Missing
          found: Found
          rescued: Rescued
          lost: Did not survive
  updateRule: >-
    Record only changes the narrative has confirmed. Set heart to traced when its whereabouts
    are learned, recovered once it is in hand, returned when replaced, shattered if destroyed,
    or bargained-away if handed to the Barrow King or anyone else. Set lamp to burning once the Heart is
    back and the lantern lit, or flickering if a temporary flame barely keeps it alight. Set keeper to
    found when Ysolde is seen, rescued when brought out of the barrow, or lost if she dies.
renown:
  name: Renown
  description: What people in Greyreed and the surrounding area say about you.
  schema:
    properties:
      score:
        title: Renown
      title:
        title: Known as
        x-enumLabels:
          stranger: Stranger
          sellsword: Sellsword
          trusted: Trusted
          hero-of-greyreed: Hero of Greyreed
          legend: Legend
      deeds:
        title: Deeds
  updateRule: >-
    Change Renown only after villagers witness or hear about an action: add 1 for solving a specific problem
    for a villager, add 2 for rescuing the lampkeeper or relighting the lantern, and subtract 1 for deceiving,
    extorting, or bringing trouble on villagers. Record a sentence explaining each change in Deeds.
    Set title from Renown: 0 or 1 stranger, 2 or 3 sellsword, 4 through 6 trusted, 7 or 8 hero-of-greyreed,
    9 or 10 legend. Actions that never reach the villagers do not affect Renown.
geography:
  name: Geography
  schema:
    properties:
      overview:
        title: Overview
      regions:
        title: Regions
        items:
          properties:
            name:
              title: Name
            description:
              title: Description
            climate:
              title: Climate
  initialValue:
    overview:
      Greyreed stands on the edge of Greyreed Marsh. The small hill north of the
      village is Lantern Barrow. For a hundred years, the ancient lantern on its summit
      has burned every night.
    regions:
      - name: Greyreed Village
        description:
          Thirty-odd households, a mill, the Crooked Antler tavern, and a small chapel.
          The villagers are practical, superstitious, and know one another inside out.
        climate: Damp and foggy, already cold in late autumn.
      - name: The Lampkeeper's Cottage
        description:
          A stone cottage at the foot of the barrow, where Ysolde has lived for forty
          years. Inside are lamp oil and old logbooks. The door is never locked.
      - name: The Lantern Barrow
        description:
          A round hill covered in dead grass. An extinguished lantern stands at the
          summit; halfway up, the bronze tomb doors hang open. The tomb is bigger inside
          than the hill that holds it.
        climate: Cold and clammy inside the tomb, with a smell of lamp oil and wet earth.
      - name: Greyreed Marsh
        description:
          Reeds and black water as far as the eye can see. They say the Marsh King's
          old village lies drowned somewhere beneath them.
factions:
  name: Factions
  schema:
    items:
      properties:
        name:
          title: Name
        description:
          title: Description
  initialValue:
    - id: greyreed-village
      name: Greyreed Village
      description:
        Reeve Penn runs the village; Mirelle at the tavern hears the news first. They
        want the lantern relit and life back to normal.
    - id: dawn-lantern-order
      name: Order of the Dawn Lantern
      description:
        An order that tends ancient lanterns in many places, believing their light
        lets the dead rest. Sister Wren is the acolyte they sent here.
    - id: hollow-choir
      name: The Hollow Choir
      description:
        "The dead inside the barrow. They do not attack people who sing. They simply
        keep singing: the Marsh King's name, and the names of the living."
tone:
  name: Tone
  schema:
    properties:
      genres:
        title: Genres
      contentRating:
        title: Rating
        x-enumLabels:
          all-ages: All ages
          teen: Teen
          mature: Mature
      narrativeStyle:
        title: Narrative style
  initialValue:
    genres:
      - classic fantasy
      - dungeon crawl
      - folk horror
    narrativeStyle:
      "Tell the story like a good game master: concrete scenes, brisk pacing,
      and real danger without gore. Laughter in the tavern; singing in the tomb."
mechanics:
  name: Mechanics
  schema:
    properties:
      combatStyle:
        title: Combat
        x-enumLabels:
          turn-based: Turn-based
          real-time: Real-time
          narrative: Narrative
          none: None
      difficulty:
        title: Difficulty
        x-enumLabels:
          easy: Easy
          normal: Normal
          hard: Hard
          adaptive: Adaptive
      skillSystem:
        title: Checks
      customRules:
        title: House rules
  initialValue:
    skillSystem: Use the opening form to assign points. Follow the Attribute Check panel and dice-pool receipts for modifiers, difficulties, and results.
    customRules:
      - At 0 hit points, you collapse rather than die immediately. Companions can drag you
        back.
      - A torch burns for about one phase of the day. Without light in the barrow, you
        cannot see where you are going or spot traps.
      - Noise, lighting a flame in the Choir Gallery, and resting too long inside the tomb all raise the Barrow Alarm.
startingConditions:
  name: Opening
  schema:
    properties:
      openingScenario:
        title: Opening scene
      openingHook:
        title: Hook
      openingChips:
        title: Opening moves
      startingLocation:
        title: Starting point
  initialValue:
    openingScenario:
      'Rain falls on a late-autumn night as you push open the door of the
      Crooked Antler. The reeve''s bounty notice hangs above the bar: the lampkeeper is
      missing, the barrow lantern has gone out, and the bronze tomb doors stand open.
      Thirty silver coins to whoever goes down. An old soldier cleans his sword in the
      corner; a young sister by the window leafs through a book of ancient lantern
      inscriptions. The innkeeper slides you a mug of hot ale. "You here about the notice
      too?"'
    openingHook: The lantern has been dark for three days. Who goes down with you tonight?
    openingChips:
      - Ask the innkeeper about the lampkeeper
      - Sit across from the old soldier
      - Ask the sister to read the lantern inscriptions
      - Find the reeve and talk money
    startingLocation: Greyreed, the Crooked Antler
