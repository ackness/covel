# en-US text for time.yaml. Only translated text; structure and ids come from time.yaml.
definition:
  name: Greyreed Time
  cycleLabel: Day
  phases:
    - Dawn
    - Day
    - Dusk
    - Night
    - Dead of night
  evolution:
    prompt: >-
      Count time in phases. A short tavern conversation does not advance the clock.
      A round of village visits, a search of the cottage, or a stretch of exploration
      in the tomb advances it by one phase. Camping in the tomb takes one or two phases.
      Time still passes underground, even without daylight.
