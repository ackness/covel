- id: silver
  name: Silver coins
  description: An adventurer's entire savings. A night at the tavern costs two; a healing draught costs eight.
- id: torch
  name: Torch
  description: Pitch-soaked torches that burn about an hour each. The barrow's dark eats light.
- id: rope
  name: Hemp rope (15 m)
  description: Sturdy rope for descending shafts, crossing broken bridges, or tying down things that should stay asleep.
- id: healing-draught
  name: Healing draught
  description: A horribly bitter herbal tonic. Restores a few hit points; drinking one in a fight takes an action.
- id: rations
  name: Rations
  description: Black bread, hard cheese, and salt pork — three days for one person.
- id: adventurers-blade
  name: Short blade
  description: Plain but reliable. Whatever your calling, you do not go into a barrow without a knife.
