- id: silver
  name: Silver coins
  description: Your entire savings. Food and lodging at the tavern cost two coins a night; a healing draught costs eight.
- id: torch
  name: Torch
  description: Torches soaked in pine resin, each good for about two hours. The darkness in the barrow swallows light.
- id: rope
  name: Hemp rope (15 m)
  description: Strong hemp rope for climbing down shafts, crossing broken bridges, or tying up things that should have stayed asleep.
- id: healing-draught
  name: Healing draught
  description: An unbearably bitter herbal potion. Drinking it restores a few hit points and takes one action in combat.
- id: rations
  name: Rations
  description: Dark bread, hard cheese, and salted meat. Enough to feed one person for three days.
- id: adventurers-blade
  name: Shortsword
  description: An ordinary shortsword that sits well in your hand. Whatever your calling, you need a blade when you venture into a tomb.
