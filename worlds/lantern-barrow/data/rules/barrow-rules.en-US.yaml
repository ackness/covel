- id: lantern-fair-table
  title: A fair table
  content: >-
    Call for a check only when the outcome is uncertain and failure has a cost.
    Before picking a lock, climbing a wall, or persuading a guard, state the attribute
    and difficulty. Follow the Attribute Check panel and dice-pool receipts for numbers
    and results. On failure, cost the party time, torches, hit points, position, or trust
    while letting events move on. Never leave them stuck repeating the same action.
- id: lantern-party
  title: Companions with a say
  content: >-
    Brannoc and Wren make their own judgments. They offer advice, disagree, act for
    themselves in danger, and remember how the player treats them. Never speak or
    decide for the player's character. Leave the next move to the player each turn.
- id: lantern-alarm
  title: Stirring the barrow
  content: >-
    The barrow sleeps lightly. Fighting, breaking down doors, shouting, lighting a flame
    in the Choir Gallery, and lingering inside disturb it. Relighting wall lamps,
    slipping past quietly, or soothing the dead lowers the alarm. Every three phases
    spent in the tomb raises the alarm by one, up to five; noise can still push it to six.
    Follow the Barrow Alarm panel for the reckoning. Let players hear and see the change:
    closer singing, torches going out, skulls beginning to turn. Give them grounds to
    decide whether to search another room or retreat.
  keys:
    - barrow
    - tomb
    - choir
    - sing
    - singing
    - song
    - noise
    - firelight
- id: lantern-truth
  title: The truth about the barrow
  content: >-
    Lantern Barrow imprisons the Marsh King. A hundred years ago, he traded the peace
    of all his village's dead for immortality. The first lampkeeper sealed him beneath
    the hill with the Lantern Heart's flame. While the lantern burns, he sleeps and
    the dead fall silent. Corvin took the Heart to study the power sealed inside it;
    Ysolde followed him. The reeve took Corvin's money and told him about the lantern.
    Let the player piece these facts together from clues. Never reveal them outright
    early on. Returning the Heart, bargaining with the Barrow King, destroying him for
    good, or finding another way must each carry a cost. Do not decide the ending in advance.
  keys:
    - Lantern Heart
    - Barrow King
    - lampkeeper
    - keeper
    - Ysolde
    - Corvin
- id: lantern-supplies
  title: Torches and rations
  content: >-
    Each torch burns for about one phase. Once it goes out, the party cannot see the
    path clearly or spot traps. A short rest restores a few hit points but takes time;
    camping inside disturbs the barrow. When torches, rations, or healing draughts are
    used, name the consumption in the narrative so inventory and hit points can be
    recorded accurately.
  keys:
    - torch
    - ration
    - rest
    - wound
    - wounded
    - hp
    - hit points
