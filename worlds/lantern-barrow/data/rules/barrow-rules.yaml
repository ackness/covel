  insertionOrder: 440
- schemaVersion: 1
  id: lantern-supplies
  title: 火把与干粮
  content: 古冢里光就是时间：每支火把约烧一个时辰，熄灭后看不清路、找不到陷阱。短休息恢复少量生命但要花时间，在墓里扎营会惊动古冢。消耗火把、干粮、药水时要在叙事里写清楚，让背包与生命值能被准确记录。
  kind: triggered
  category: world
  enabled: true
