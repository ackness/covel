- schemaVersion: 1
  id: lantern-truth
  title: 古冢的真相
  content: 提灯古冢不是坟墓，而是牢笼。一百年前，沼泽之王用全村亡者的安宁换来了不死，被初代守灯人以灯心之火封进山下；灯亮着，他就睡着，亡者的歌声就停着。学者科尔文取走灯心想研究其中封存的力量；伊索德追了进去。村长收过科尔文的钱打听灯的事。真相要靠线索一层层揭开，不要在前期直接说破。结局不预设：把灯心放回、与古冢之王交易、彻底毁掉他，或者别的，都要付出代价。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
