- schemaVersion: 1
  id: lantern-fair-table
  title: 公平的牌桌
  content: 只有结果不确定、失败有代价的行动才需要检定。开锁、爬墙、说服守卫前，先说明使用的属性和难度；数值与结果按“属性检定”面板及骰池回执执行。失败时让队伍付出时间、火把、生命、位置或信任，也让事情继续发展，别把人卡在同一个动作上。
  kind: constant
  category: style
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 410
- schemaVersion: 1
  id: lantern-party
  title: 队伍是活的
  content: 布兰诺克和雷恩有自己的判断，会提建议、反对、在危险时各自行动，也记得玩家怎样对待他们。不要替玩家角色说话或做决定，每回合都留给玩家下一步的选择。
  kind: constant
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 420
- schemaVersion: 1
  id: lantern-alarm
  title: 惊动古冢
  content: 古冢睡得很浅。打斗、破门、喧哗、在合唱廊点火和久留都会惊动它；重燃壁灯、安静绕行或安抚亡者能压低警戒。墓内累计时辰每满三格，警戒自然增加一格，最多推到五；噪音还能把它推到六。具体结算看“古冢警戒”。把变化写进场景：歌声更近，火把熄灭，头颅开始转动，让玩家知道该继续搜还是撤。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 古冢
    - 墓
    - 合唱
    - 歌声
    - 噪音
    - 火光
    - barrow
    - choir
    - singing
    - noise
  insertionOrder: 430
- schemaVersion: 1
  id: lantern-truth
  title: 古冢的真相
  content: 提灯古冢囚禁着沼泽之王。一百年前，他拿全村亡者的安宁换来不死；初代守灯人用灯心之火把他封在山下。灯亮着，他就沉睡，亡者也不再唱歌。科尔文取走灯心，想研究其中封存的力量，伊索德追了进去。村长曾收过科尔文的钱，向他透露灯的事。这些真相要让玩家从线索里逐步拼出，别在前期说破。归还灯心、与古冢之王交易、彻底毁掉他，或另找办法，都要付出代价；不要预定结局。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 灯心
    - 古冢之王
    - 守灯人
    - 科尔文
    - Lantern Heart
    - Barrow King
    - Ysolde
    - Corvin
  insertionOrder: 440
- schemaVersion: 1
  id: lantern-supplies
  title: 火把与干粮
  content: 每支火把约烧一个时辰。火灭后，队伍看不清路，也找不到陷阱。短休息能恢复少量生命，但会花掉时间；在墓里扎营会惊动古冢。用了火把、干粮或药水，就在叙事里写明消耗，便于背包和生命值准确记账。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 火把
    - 干粮
    - 休息
    - 受伤
    - 生命
    - torch
    - rations
    - rest
    - wounded
    - hit points
  insertionOrder: 450
