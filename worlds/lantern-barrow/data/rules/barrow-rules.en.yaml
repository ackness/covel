- schemaVersion: 1
  id: lantern-supplies
  title: Torches and Rations
  content: "Inside the barrow, light is time: each torch burns about an hour, and in the dark you cannot see the way or the traps. A short rest restores a few hit points but costs time, and camping inside stirs the barrow. Say plainly on the page when torches, rations, or draughts are used, so inventory and hit points stay accurate."
