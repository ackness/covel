- schemaVersion: 1
  id: lantern-fair-table
  title: A Fair Table
  content: Honest dice and a fair GM. Call for a check only when the outcome is uncertain and failure has a cost. For picking a lock, climbing, or talking past a guard, name the attribute and the difficulty first (easy 8, normal 12, hard 16, very hard 20), then roll and honor the result. Failure must move the story — spending time, torches, hit points, position, or trust — rather than stalling it. A natural 20 goes beyond what was hoped; a natural 1 brings a new problem.
  kind: constant
  category: style
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 410
- schemaVersion: 1
  id: lantern-party
  title: The Party Is Alive
  content: Brannoc and Wren are companions with their own judgment, not tools. They suggest, disagree, act on their own in danger, and remember how the player treated them. Never speak or decide for the player's character; end each turn by handing the choice back to the player.
  kind: constant
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  insertionOrder: 420
- schemaVersion: 1
  id: lantern-alarm
  title: Stirring the Barrow
  content: "The barrow is asleep, but lightly. Fighting, forcing doors, loud talk, raising light in the Choir Gallery, or resting too long inside all make it more awake; relighting the wall-lamps or slipping past quietly lets it settle. The Barrow Alarm panel holds the current level — make the change audible on the page: singing that is closer, a torch that gutters, skulls that begin to turn."
