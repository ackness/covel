- schemaVersion: 1
  id: lantern-truth
  title: The Truth of the Barrow
  content: "The Lantern Barrow is not a tomb but a prison. A century ago the marsh-king traded the peace of his village's dead for undeath, and the first keeper sealed him under the hill with the Lantern Heart's flame: while the lamp burns he sleeps, and the dead stop singing. The scholar Corvin took the Heart to study the power bound inside it; Ysolde went in after him. The reeve took Corvin's money for information about the lantern. Reveal this through clues, layer by layer, never all at once early on. No ending is fixed — returning the Heart, bargaining with the Barrow King, destroying him for good, or something else — and every one has a price."
  kind: evolving
  category: world
  enabled: true
