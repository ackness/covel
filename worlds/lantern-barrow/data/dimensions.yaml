delveMap:
  name: 古冢地图
  description: 提灯古冢里已知的房间和它们现在的状态。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        room:
          type: string
          title: 房间
          x-i18n: true
        status:
          type: string
          title: 状态
          enum: [rumored, explored, cleared, sealed, collapsed]
          x-enumLabels:
            rumored: 只听说过
            explored: 已探索
            cleared: 已肃清
            sealed: 已封闭
            collapsed: 已坍塌
        note:
          type: string
          title: 记录
          maxLength: 200
          x-i18n: true
      required: [room, status]
      additionalProperties: false
  initialValue:
    bronze-doors:
      room: 青铜墓门
      status: rumored
      note: 灯灭那晚之后一直洞开。门上的封印被人从里面推开了。
    hall-of-lamps:
      room: 千灯廊
      status: rumored
      note: 守灯人说过，墓里第一条走廊两侧全是壁灯。
  updateRule:
    叙事中第一次进入、看见或从可靠来源得知一个具名房间时新增条目（ID 用简短英文 kebab-case），只听说时为
    rumored。玩家亲自进入并查看后改为 explored；危险被解决后为 cleared；门被封上为 sealed；塌了为
    collapsed。note 写一句最重要的发现（出口、陷阱、遗物或危险）。不删除条目，不替玩家探索没去过的房间。

barrowAlarm:
  name: 古冢警戒
  description: 古冢有多清醒。走到 6，古冢之王就会睁开眼睛。
  schema:
    type: object
    properties:
      level:
        type: integer
        title: 警戒
        minimum: 0
        maximum: 6
      stage:
        type: string
        title: 动静
        enum: [sleeping, murmuring, restless, singing, stirring, awake]
        x-enumLabels:
          sleeping: 沉睡
          murmuring: 低语
          restless: 躁动
          singing: 合唱响起
          stirring: 王座震动
          awake: 古冢之王苏醒
    required: [level, stage]
    additionalProperties: false
  initialValue:
    level: 1
    stage: murmuring
  updateRule:
    只在玩家一行人进入古冢后结算。本轮叙事出现打斗、破门、大声喧哗、在合唱廊点亮火光、检定大失败或在墓中长时间休息时 level
    +1（一回合最多 +2）；重燃一盏壁灯、安静绕开危险或安抚亡者时 -1。stage 随 level 对应：0 沉睡，1 低语，2 躁动，3–4
    合唱响起，5 王座震动，6 苏醒。灯心被放回古灯并重新点燃后归零。

lantern:
  name: 古冢之灯
  description: 灯心在哪里，灯有没有重新亮起。
  schema:
    type: object
    properties:
      heart:
        type: string
        title: 灯心
        enum: [missing, traced, recovered, returned, shattered, bargained-away]
        x-enumLabels:
          missing: 下落不明
          traced: 找到线索
          recovered: 已夺回
          returned: 放回灯中
          shattered: 已碎裂
          bargained-away: 交易出去
      lamp:
        type: string
        title: 古灯
        enum: [dark, flickering, burning]
        x-enumLabels:
          dark: 熄灭
          flickering: 摇曳
          burning: 燃烧
      keeper:
        type: string
        title: 守灯人
        enum: [missing, found, rescued, lost]
        x-enumLabels:
          missing: 失踪
          found: 已找到
          rescued: 已救出
          lost: 未能生还
    required: [heart, lamp, keeper]
    additionalProperties: false
  initialValue:
    heart: missing
    lamp: dark
    keeper: missing
  updateRule:
    只按叙事明确发生的事推进。得知灯心下落为 traced，拿到手为 recovered，放回古灯为 returned，被毁为
    shattered，交给古冢之王或他人为 bargained-away。灯心放回并点燃后 lamp 为 burning，只靠临时火种勉强点亮为
    flickering。见到伊索德为 found，带她离开古冢为 rescued，她死去为 lost。

renown:
  name: 名望
  description: 灰苇村和周边的人怎么谈论你。
  schema:
    type: object
    properties:
      score:
        type: integer
        title: 名望
        minimum: 0
        maximum: 10
      title:
        type: string
        title: 称号
        enum: [stranger, sellsword, trusted, hero-of-greyreed, legend]
        x-enumLabels:
          stranger: 外乡人
          sellsword: 拿钱办事的
          trusted: 可靠的人
          hero-of-greyreed: 灰苇村的英雄
          legend: 传说
      deeds:
        type: array
        title: 事迹
        maxItems: 10
        items:
          type: string
          maxLength: 120
    required: [score, title, deeds]
    additionalProperties: false
  initialValue:
    score: 0
    title: stranger
    deeds: []
  updateRule:
    村民亲眼看见或确实听说玩家的作为时调整：帮村民解决具体麻烦 +1，救回守灯人或重燃古灯 +2，欺骗、勒索或连累村民 -1。每次变化在
    deeds 加一句话。称号随 score：0–1 外乡人，2–3 拿钱办事的，4–6 可靠的人，7–8 灰苇村的英雄，9–10
    传说。没人知道的事不计入名望。

geography:
  name: 地理
  schema:
    type: object
    properties:
      overview: { type: string, title: 概况, x-i18n: true }
      regions:
        type: array
        title: 地区
        items:
          type: object
          properties:
            name: { type: string, title: 名称, x-i18n: true }
            description: { type: string, title: 描述, x-i18n: true }
            climate: { type: string, title: 气候, x-i18n: true }
          required: [name, description]
          additionalProperties: false
    additionalProperties: false
  initialValue:
    overview: 灰苇村坐落在灰苇沼泽的边缘，村北的小山就是提灯古冢。一百年来，山顶的古灯每夜都亮着。
    regions:
      - name: 灰苇村
        description: 三十来户人家、一座磨坊、一间歪角鹿酒馆和一座小礼拜堂。村民务实、迷信、彼此知根知底。
        climate: 潮湿多雾，深秋已冷。
      - name: 守灯人小屋
        description: 古冢山脚的石屋，伊索德住了四十年。屋里有灯油、旧日志和一扇从不上锁的门。
      - name: 提灯古冢
        description: 长满枯草的圆丘，山顶立着熄灭的古灯，山腰是洞开的青铜墓门。墓里比山更大。
        climate: 墓内阴冷，空气里有灯油和潮土的味道。
      - name: 灰苇沼泽
        description: 一望无际的芦苇和黑水。传说沼泽之王的旧村就沉在里面。

factions:
  name: 势力
  schema:
    type: array
    items:
      type: object
      properties:
        id: { type: string, title: ID }
        name: { type: string, title: 名称, x-i18n: true }
        description: { type: string, title: 描述, x-i18n: true }
      required: [id, name, description]
      additionalProperties: false
  initialValue:
    - id: greyreed-village
      name: 灰苇村
      description: 村长潘恩主事，酒馆老板娘梅瑞尔消息最灵。他们想要的是古灯重新亮起、日子回到原样。
    - id: dawn-lantern-order
      name: 黎明灯修会
      description: 维护各地古灯的修会，相信光能让亡者安息。雷恩修女是他们派来的见习祭司。
    - id: hollow-choir
      name: 空心合唱团
      description: 古冢里的亡者。他们不攻击唱歌的人，只是一直唱，唱沼泽之王的名字，唱生者的名字。

tone:
  name: 基调
  schema:
    type: object
    properties:
      genres:
        { type: array, title: 类型, items: { type: string, x-i18n: true } }
      contentRating:
        type: string
        title: 分级
        enum: [all-ages, teen, mature]
        x-enumLabels:
          all-ages: 全年龄
          teen: 青少年
          mature: 成人
      narrativeStyle: { type: string, title: 叙事风格, x-i18n: true }
    required: [genres, contentRating]
    additionalProperties: false
  initialValue:
    genres:
      - 经典奇幻
      - 地城探索
      - 民间恐怖
    contentRating: teen
    narrativeStyle: 像一位好主持人那样讲故事：场景具体、节奏利落，危险真实但不血腥，酒馆里有笑声，墓里有歌声。

mechanics:
  name: 玩法
  schema:
    type: object
    properties:
      combatStyle:
        type: string
        title: 战斗
        enum: [turn-based, real-time, narrative, none]
        x-enumLabels:
          turn-based: 回合制
          real-time: 即时
          narrative: 叙事式
          none: 无
      difficulty:
        type: string
        title: 难度
        enum: [easy, normal, hard, adaptive]
        x-enumLabels:
          easy: 简单
          normal: 普通
          hard: 困难
          adaptive: 自适应
      skillSystem: { type: string, title: 检定规则, x-i18n: true }
      customRules:
        { type: array, title: 附加规则, items: { type: string, x-i18n: true } }
    additionalProperties: false
  initialValue:
    combatStyle: turn-based
    difficulty: normal
    skillSystem:
      六项属性（力量、敏捷、体魄、智识、感知、魅力）开局各 1 点，再自由分配 6 点，单项最高 4。检定为 d20 + 属性，对抗难度
      8/12/16/20；天然 20 大成功，天然 1 大失败。
    customRules:
      - 生命降到 0 会倒下而不是立刻死亡；队友可以把你拖回来。
      - 火把约烧一个时辰。古冢里没有光就看不见路和陷阱。
      - 噪音、火光和在墓里休息都会抬高古冢警戒。

startingConditions:
  name: 开局
  schema:
    type: object
    properties:
      openingScenario: { type: string, title: 开场, x-i18n: true }
      openingHook: { type: string, title: 引子, x-i18n: true }
      openingChips:
        { type: array, title: 开局行动, items: { type: string, x-i18n: true } }
      startingLocation: { type: string, title: 起点, x-i18n: true }
    additionalProperties: false
  initialValue:
    openingScenario: 深秋的雨夜，你推开歪角鹿酒馆的门。吧台上方钉着村长的赏金告示：守灯人失踪，古冢之灯熄灭，青铜墓门洞开，三十枚银币请人下墓。角落里的老兵在擦剑，靠窗的年轻修女在翻一本古灯铭文。老板娘把一杯热麦酒推到你面前：“你也是为告示来的？”
    openingHook: 古灯熄灭三天了。今晚，谁和你一起下墓？
    openingChips:
      - 问老板娘守灯人的事
      - 坐到老兵对面
      - 请修女读一读古灯铭文
      - 去找村长谈价钱
    startingLocation: 灰苇村・歪角鹿酒馆
