delveMap:
  name: 古冢地图
  description: 提灯古冢里已知的房间和它们现在的状态。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        room:
          type: string
          title: 房间
          x-i18n: true
        status:
          type: string
          title: 状态
          enum: [rumored, explored, cleared, sealed, collapsed]
          x-enumLabels:
            rumored: 只听说过
            explored: 已探索
            cleared: 已肃清
            sealed: 已封闭
            collapsed: 已坍塌
        note:
          type: string
          title: 记录
          maxLength: 200
          x-i18n: true
        exits:
          type: array
          title: 相邻地点
          items: { type: string }
      required: [room, status, exits]
      additionalProperties: false
  initialValue:
    bronze-doors:
      room: 青铜墓门
      status: rumored
      note: 灯灭那晚起就一直洞开，封印有从里面被推开的痕迹。
      exits: [keepers-cottage, summit-lantern, hall-of-lamps]
    hall-of-lamps:
      room: 千灯廊
      status: rumored
      note: 守灯人说过，进墓后的第一条走廊两侧都是壁灯。
      exits: [bronze-doors, bone-hall, flooded-chamber]
    keepers-cottage:
      room: 守灯人小屋
      status: rumored
      note: 山脚的石屋，伊索德在这里住了四十年。
      exits: [bronze-doors]
    summit-lantern:
      room: 山顶古灯
      status: rumored
      note: 守了百年的古灯已经熄灭。
      exits: [bronze-doors]
    bone-hall:
      room: 骸骨堂
      status: rumored
      note: 还没亲自探过，只知道墓里有这么一处地方。
      exits: [hall-of-lamps, choir-gallery]
    flooded-chamber:
      room: 水淹墓室
      status: rumored
      note: 还没亲自探过，只知道墓里有积水的墓室。
      exits: [hall-of-lamps, choir-gallery]
    choir-gallery:
      room: 合唱廊
      status: rumored
      note: 亡者在墓中的长廊里唱歌，里面的情形尚不清楚。
      exits: [bone-hall, flooded-chamber, throne-room]
    throne-room:
      room: 王座厅
      status: rumored
      note: 王座在山心深处，还没人带回里面的消息。
      exits: [choir-gallery]
  updateRule: >-
    只维护地图上已有的地点，不新增、删除或改名，不改相邻地点。
    队伍亲自进入并查看后 status 标为 explored，排除危险后标为 cleared；
    门被封住时标为 sealed，地点坍塌时标为 collapsed。只听说过的地点保持 rumored。
    记录栏只写本回合确认的发现，如陷阱、遗物、危险或通路是否可走；不要替玩家探索。
    相邻地点是固定通路，封门与坍塌只改状态并注明受阻通路，不删除出口，也不凭空开路。

barrowAlarm:
  name: 古冢警戒
  description: 古冢正一点点醒来。在墓里待得越久，动静越大；警戒到 6，古冢之王就睁眼。
  schema:
    type: object
    properties:
      phasesInside:
        type: integer
        title: 墓内累计时辰
        minimum: 0
      level:
        type: integer
        title: 警戒
        minimum: 0
        maximum: 6
      stage:
        type: string
        title: 动静
        enum: [sleeping, murmuring, restless, singing, stirring, awake]
        x-enumLabels:
          sleeping: 沉睡
          murmuring: 低语
          restless: 躁动
          singing: 合唱响起
          stirring: 王座震动
          awake: 古冢之王苏醒
    required: [level, stage, phasesInside]
    additionalProperties: false
  initialValue:
    level: 1
    stage: murmuring
    phasesInside: 0
  updateRule: >-
    按本回合结算后的世界时钟维护，列为随时钟变化的维度。
    本回合一旦有入墓或墓内行动，就把时钟给出的本回合经过阶段数全部计入“墓内累计时辰”；
    包含出墓行动的回合也这样计时，整回合都在墓外时不累加。不要按消息条数或自行估计时间。
    累计时辰每跨过一个三的倍数，警戒自然增加 1；一次跨过几档就加几次，但自然增加最多推到 5，
    已经为 6 时保持 6。撤出后保留累计时辰，再次入墓接着计，不重复结算已经跨过的档位。
    再按本回合墓内发生的事调整：打斗、破门、大声喧哗、在合唱廊点火、检定大失败或长时间休息，
    每项加 1，这部分每回合最多加 2，可以推到 6；重燃一盏壁灯、安静绕过危险或安抚亡者，每项减 1。
    最终警戒限制在 0–6。stage 随警戒变化：0 sleeping，1 murmuring，2 restless，3–4 singing，5 stirring，6 awake。
    灯心放回古灯并点燃后，警戒和累计时辰都归零，stage 为 sleeping；古灯持续燃烧时保持这个状态。

lantern:
  name: 古冢之灯
  description: 灯心在哪里，灯有没有重新亮起。
  schema:
    type: object
    properties:
      heart:
        type: string
        title: 灯心
        enum: [missing, traced, recovered, returned, shattered, bargained-away]
        x-enumLabels:
          missing: 下落不明
          traced: 找到线索
          recovered: 已夺回
          returned: 放回灯中
          shattered: 已碎裂
          bargained-away: 交易出去
      lamp:
        type: string
        title: 古灯
        enum: [dark, flickering, burning]
        x-enumLabels:
          dark: 熄灭
          flickering: 摇曳
          burning: 燃烧
      keeper:
        type: string
        title: 守灯人
        enum: [missing, found, rescued, lost]
        x-enumLabels:
          missing: 失踪
          found: 已找到
          rescued: 已救出
          lost: 未能生还
    required: [heart, lamp, keeper]
    additionalProperties: false
  initialValue:
    heart: missing
    lamp: dark
    keeper: missing
  updateRule: >-
    只记录叙事已经确认的变化。得知灯心下落时 heart 标为 traced，拿到手后为 recovered，放回古灯后为 returned，
    毁掉后为 shattered，交给古冢之王或他人后为 bargained-away。灯心归位并点燃后，lamp 为 burning；
    只靠临时火种勉强维持时为 flickering。见到伊索德后 keeper 标为 found，带她离开古冢后为 rescued，她死去后为 lost。

renown:
  name: 名望
  description: 灰苇村和周边的人怎么谈论你。
  schema:
    type: object
    properties:
      score:
        type: integer
        title: 名望
        minimum: 0
        maximum: 10
      title:
        type: string
        title: 称号
        enum: [stranger, sellsword, trusted, hero-of-greyreed, legend]
        x-enumLabels:
          stranger: 外乡人
          sellsword: 拿钱办事的
          trusted: 可靠的人
          hero-of-greyreed: 灰苇村的英雄
          legend: 传说
      deeds:
        type: array
        title: 事迹
        maxItems: 10
        items:
          type: string
          maxLength: 120
    required: [score, title, deeds]
    additionalProperties: false
  initialValue:
    score: 0
    title: stranger
    deeds: []
  updateRule: >-
    村民亲眼看见或确实听说后才调整名望：替村民解决一件具体麻烦加 1，救回守灯人或重燃古灯加 2，
    欺骗、勒索或连累村民减 1。每次变化在事迹栏记一句缘由。
    title 按名望设置：0–1 stranger，2–3 sellsword，4–6 trusted，7–8 hero-of-greyreed，9–10 legend。
    没传到村民耳里的事不影响名望。

geography:
  name: 地理
  schema:
    type: object
    properties:
      overview: { type: string, title: 概况, x-i18n: true }
      regions:
        type: array
        title: 地区
        items:
          type: object
          properties:
            name: { type: string, title: 名称, x-i18n: true }
            description: { type: string, title: 描述, x-i18n: true }
            climate: { type: string, title: 气候, x-i18n: true }
          required: [name, description]
          additionalProperties: false
    additionalProperties: false
  initialValue:
    overview: 灰苇村坐落在灰苇沼泽的边缘，村北的小山就是提灯古冢。一百年来，山顶的古灯每夜都亮着。
    regions:
      - name: 灰苇村
        description: 三十来户人家、一座磨坊、一间歪角鹿酒馆和一座小礼拜堂。村民务实、迷信、彼此知根知底。
        climate: 潮湿多雾，深秋已冷。
      - name: 守灯人小屋
        description: 古冢山脚的石屋，伊索德住了四十年。屋里有灯油、旧日志和一扇从不上锁的门。
      - name: 提灯古冢
        description: 长满枯草的圆丘，山顶立着熄灭的古灯，山腰是洞开的青铜墓门。墓里比山更大。
        climate: 墓内阴冷，空气里有灯油和潮土的味道。
      - name: 灰苇沼泽
        description: 一望无际的芦苇和黑水。传说沼泽之王的旧村就沉在里面。

factions:
  name: 势力
  schema:
    type: array
    items:
      type: object
      properties:
        id: { type: string, title: ID }
        name: { type: string, title: 名称, x-i18n: true }
        description: { type: string, title: 描述, x-i18n: true }
      required: [id, name, description]
      additionalProperties: false
  initialValue:
    - id: greyreed-village
      name: 灰苇村
      description: 村长潘恩主事，酒馆老板娘梅瑞尔消息最灵。他们想要的是古灯重新亮起、日子回到原样。
    - id: dawn-lantern-order
      name: 黎明灯修会
      description: 维护各地古灯的修会，相信光能让亡者安息。雷恩修女是他们派来的见习祭司。
    - id: hollow-choir
      name: 空心合唱团
      description: 古冢里的亡者。他们不攻击唱歌的人，只是一直唱，唱沼泽之王的名字，唱生者的名字。

tone:
  name: 基调
  schema:
    type: object
    properties:
      genres:
        { type: array, title: 类型, items: { type: string, x-i18n: true } }
      contentRating:
        type: string
        title: 分级
        enum: [all-ages, teen, mature]
        x-enumLabels:
          all-ages: 全年龄
          teen: 青少年
          mature: 成人
      narrativeStyle: { type: string, title: 叙事风格, x-i18n: true }
    required: [genres, contentRating]
    additionalProperties: false
  initialValue:
    genres:
      - 经典奇幻
      - 地城探索
      - 民间恐怖
    contentRating: teen
    narrativeStyle: 像一位好主持人那样讲故事：场景具体、节奏利落，危险真实但不血腥，酒馆里有笑声，墓里有歌声。

mechanics:
  name: 玩法
  schema:
    type: object
    properties:
      combatStyle:
        type: string
        title: 战斗
        enum: [turn-based, real-time, narrative, none]
        x-enumLabels:
          turn-based: 回合制
          real-time: 即时
          narrative: 叙事式
          none: 无
      difficulty:
        type: string
        title: 难度
        enum: [easy, normal, hard, adaptive]
        x-enumLabels:
          easy: 简单
          normal: 普通
          hard: 困难
          adaptive: 自适应
      skillSystem: { type: string, title: 检定规则, x-i18n: true }
      customRules:
        { type: array, title: 附加规则, items: { type: string, x-i18n: true } }
    additionalProperties: false
  initialValue:
    combatStyle: turn-based
    difficulty: normal
    # Point buy: data/tabletop-rules.json. Dice rules: plugins/dice-check/lib/check-rules.js.
    skillSystem: 配点按开局表单填写；属性修正、难度与检定结果以“属性检定”面板及骰池回执为准。
    customRules:
      - 生命降到 0 会倒下而不是立刻死亡；队友可以把你拖回来。
      - 火把约烧一个时辰。古冢里没有光就看不见路和陷阱。
      - 噪音、在合唱廊点亮火光和在墓里长时间休息都会抬高古冢警戒。

startingConditions:
  name: 开局
  schema:
    type: object
    properties:
      openingScenario: { type: string, title: 开场, x-i18n: true }
      openingHook: { type: string, title: 引子, x-i18n: true }
      openingChips:
        { type: array, title: 开局行动, items: { type: string, x-i18n: true } }
      startingLocation: { type: string, title: 起点, x-i18n: true }
    additionalProperties: false
  initialValue:
    openingScenario: 深秋的雨夜，你推开歪角鹿酒馆的门。吧台上方钉着村长的赏金告示：守灯人失踪，古冢之灯熄灭，青铜墓门洞开，三十枚银币请人下墓。角落里的老兵在擦剑，靠窗的年轻修女在翻一本古灯铭文。老板娘把一杯热麦酒推到你面前：“你也是为告示来的？”
    openingHook: 古灯熄灭三天了。今晚，谁和你一起下墓？
    openingChips:
      - 问老板娘守灯人的事
      - 坐到老兵对面
      - 请修女读一读古灯铭文
      - 去找村长谈价钱
    startingLocation: 灰苇村・歪角鹿酒馆
