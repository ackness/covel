id: world
definition:
  kind: phases
  name: 灰苇村时辰
  cycleLabel: 日
  phases:
    - 黎明
    - 白昼
    - 黄昏
    - 夜晚
    - 深夜
  initial: { cycle: 1, phase: 3 }
  evolution:
    mode: forward
    defaultStep: 1
    maxStep: 5
    prompt: 以时辰计时。酒馆里的短对话不推进；在村里走访、调查小屋或下墓探索一段，推进一格；在墓里扎营休息，推进一到两格。墓内虽不见天日，时辰仍照常走。
