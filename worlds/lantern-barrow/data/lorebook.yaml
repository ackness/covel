- id: sunken-old-greyreed
  strategy: selective
  keys: [灰苇沼泽, 旧村, 沼泽之王, 契约, 百年, 歌声, 祖父]
  content: >-
    百年前的旧灰苇村并不在如今的干地上，而沉在东边半里外的泥炭黑水之下。传说那年的大水之后，沼泽之王用“全村亡者不得安眠、替他低唱守墓”为代价换得不死；初代守灯人却反手铸下青铜墓门，将他连同那批最早的死者一道封进山丘，以山顶古灯之火镇住整座陵墓。
    如今村里墓园只葬新亡之人，祖辈却总担心若古灯灭得太久，地下的合唱会顺着沼泽雾气把村里最近几代死者的名字也拉进去。磨坊主的女儿夜里听见的正是十年前葬入新墓地的祖父名字。
- id: dawn-lantern-order
  strategy: selective
  keys: [黎明灯修会, 修会, 铭文, 圣徽, 雷恩, 灯油, 封印]
  content: >-
    黎明灯修会并不供奉具体神明，只信奉“光明即安息之界”：凡归灯所照之处，死者不应听见生者之名，生者也不该借死者延寿。各地守灯人多半终身独居山脚，由修会按年拨付特制灯油与青铜灯芯。
    修会的抄本里其实悄悄记载了一句未对底层见习祭司明言的旧训：“封王之火，原亦借王骨而燃。”这也是雷恩修女心里一直不敢问出口的疑虑——若古灯之火本就牵连着古冢之王自身的力量，彻底毁掉王座，山顶的灯是否也再点不亮。
- id: village-secrets
  strategy: selective
  keys: [潘恩, 村长, 科尔文, 领主, 赏金, 账本, 守灯人小屋, 日志]
  content: >-
    领主派人巡查边境的信件已在一周前寄出。村长阿尔多斯・潘恩近两年修筑防洪堤挪用了部分公款，生怕王都来人查账，刚好上个月来自王都的年轻学者科尔文・艾什阔绰入住歪角鹿酒馆，以“整理地方古老铭文、替领主记功”为名，给了潘恩一笔钱换取进入守灯人小屋抄录旧日志的默许。
    伊索德在最后那本日志里留下了最后一行夹字：“王都书生不肯只看拓片，问及铜门内栓。今晚必须上山核对封蜡。”随后字迹中断。布兰诺克・黑尔二十年前随队下墓时，领队正是伊索德早年救过的老佣兵；那次小队在合唱廊丢下两人仓皇逃出，门栓是从内向外撞坏还是被人拉开的，老兵心里一直存疑。
- id: barrow-depths
  strategy: selective
  keys: [千灯廊, 骸骨堂, 水淹墓室, 合唱廊, 王座厅, 壁灯, 机关, 青铜墓门]
  content: >-
    提灯古冢的墓道比山丘本身深得多，建筑石材从山表泥灰岩一路过渡到湿滑的青黑玄武岩：
    - 千灯廊：三十六对青铜壁灯嵌在齐胸高石龛中，残油仍凝成蜡状；点亮壁灯能安抚亡者，但需小心通风井里的沼气。
    - 骸骨堂：右侧岔道尽头的八角石室，四壁按辈分码着百年前旧村人的骨殖，地面是踩错就会卡住石栓的浮雕方砖。亡者不主动扑杀，但会合围抢夺火光或模仿队友的声音。
    - 水淹墓室：左侧石阶通向齐膝深的黑水库，浸泡着当年的祭器与二十年前布兰诺克小队遗落的铁盾；水面漂着一层泛油光的冷雾，跌倒或强行涉水最容易被寒气浸透。
    - 合唱廊：两条支路在此重新汇合，高穹顶回声极重。此处严禁明火乱晃或喧哗——合唱团对强光与怒吼极其敏感，唯有低声随唱古灯调或熄暗多余火把才容易悄悄通过。
    - 王座厅：山心尽头，石座被青铜锁链与灯油槽环绕；古冢之王并非只会挥剑的怪物，他清醒时更乐意先谈条件，拿村里活着的人与长眠的名姓做筹码。
- id: barrow-world-protocol
  strategy: constant
  content: >-
    本世界采用经典跑团节奏：风险行动由 `dice-check` 结算，失败时按 `check-clocks`（古冢寒气、亡灵围拢）与 `check-consequences`（耗尽火把、粉笔或推高时钟）把代价写进现场；背包里的火把、麻绳、短剑、粉笔通过 `inventory` 提供对应属性修正，使用时同步交代消耗。
    探索位置严格沿 `delveMap` 相邻通路推进，每进一处未知墓室即探索并记录发现；在墓内耗费的时辰与噪音实时记入 `barrowAlarm`，`renown` 仅在消息传回灰苇村后变化。
