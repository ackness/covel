schemaVersion: 1
sources:
  dimensions:
    kind: yaml
    path: data/dimensions.yaml
    to: world:metadata.dimensions
  tabletopRules:
    kind: json
    path: data/tabletop-rules.json
    to: contract:tabletop-rules.rules.initial@1
    key: id
  cast:
    kind: json
    path: characters/main-cast.json
    to: contract:character.blueprints@1
    key: id
    after: dimensions
  characters:
    kind: json
    path: characters/characters.json
    to: characters
    key: id
    after: cast
  portraits:
    kind: media
    path: media/portraits
    to: media
    indexTo: contract:character.portrait-assets@1
    key: filename
    after: cast
  presence:
    kind: json
    path: media/presence.json
    to: contract:character.portraits@1
    key: characterId
    after: portraits
  rules:
    kind: yaml
    path: data/rules/barrow-rules.yaml
    to: contract:world.rules@1+lorebook
    key: id
    after: dimensions
  quests:
    kind: yaml
    path: data/quests.yaml
    to: contract:quests@1
    key: id
    after: dimensions
  items:
    kind: yaml
    path: data/items.yaml
    to: contract:inventory.items@1
    key: id
    after: dimensions
  affinity:
    kind: yaml
    path: data/affinity.yaml
    to: contract:character.affinity@1
    key: id
    after: cast
  memoryBlocks:
    kind: json
    path: data/memory-blocks.json
    localeArrayKeys: [label]
    to: contract:memory.blocks@1
    key: id
  timeDefinition:
    kind: yaml
    path: data/time.yaml
    to: contract:world.time-definition@1
    key: id
  storyEvents:
    kind: yaml
    path: data/hidden/story-events.yaml
    to: contract:story.events@1
    key: id
    after: dimensions
    visibility: hidden
