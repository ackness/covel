- id: brannoc-hale
  name: Brannoc Hale
  notes: The veteran in the tavern corner. He's still sizing you up, deciding whether you're worth venturing into the tomb with.
- id: sister-wren
  name: Sister Wren
  notes: The acolyte who arrived three days late. You're the first person to give her your full attention while she explains the lantern inscriptions.
- id: mirelle-voss
  name: Mirelle Voss
  notes: The innkeeper. You've paid for your room. As far as she's concerned, that's a start.
- id: aldous-penn
  name: Reeve Aldous Penn
  notes: The reeve needs your help, but doesn't trust outsiders.
