- id: brannoc-hale
  name: Brannoc Hale
  notes:
    The veteran in the tavern corner. He's still sizing you up, deciding whether you're
    worth going down with.
- id: sister-wren
  name: Sister Wren
  notes:
    The acolyte who arrived three days late. She hopes to find a companion willing
    to hear her explanation of the lantern inscriptions. She has not spoken to you yet.
- id: mirelle-voss
  name: Mirelle Voss
  notes: The innkeeper. She has just met you and is sizing up the new arrival.
- id: aldous-penn
  name: Reeve Aldous Penn
  notes: The reeve needs your help, but doesn't trust outsiders.
