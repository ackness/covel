schemaVersion: "1.0"
id: mistport
name:
  zh-CN: "雾港・裂潮纪"
  en-US: "Mistport Chronicles"
version: "0.1.0"
summary:
  zh-CN: "一座被永恒浓雾包裹的港口城市。潮汐带来远古遗物，也带来危险。"
  en-US: "A fog-shrouded port city where each tide reveals ancient ruins and dangers."
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
tags:
  - dark-fantasy
  - mystery
  - exploration
requiredPlugins:
  - pregame
  - world-init
  - char-creator
  - narrator
recommendedPlugins:
  - guide
  - codex
  - npc-graph
  - player-identity
  - living-world-rules
excludedPlugins:
  - chat-mode-narrator
  - scene-cast
  - scene-prompts
  - branch-reply

dimensions:
  geography:
    overview:
      zh-CN: "悬崖与海面之间的港口城市，永恒灰白浓雾笼罩，能见度不超过五十步。"
      en-US: "A port city wedged between sea cliffs and the ocean, shrouded in perpetual grey fog that limits visibility to fifty paces."
    regions:
      - name:
          zh-CN: "上城"
          en-US: "Upper City"
        description:
          zh-CN: "议会与商会所在地，位于悬崖顶部，建筑以石砌为主。"
          en-US: "Seat of the Council and trade guilds, perched atop the cliffs with stone-built halls."
        climate:
          zh-CN: "雾气稀薄，偶见天光"
          en-US: "Thinner fog, occasional glimpses of sky"
        landmarks:
          - name:
              zh-CN: "议事厅"
              en-US: "Council Hall"
            description:
              zh-CN: "议会权力中枢，穹顶嵌有远古潮石灯。"
              en-US: "The political nerve center, its dome set with ancient tide-stone lamps."
          - name:
              zh-CN: "验潮师公会塔"
              en-US: "Tide-Reader Guild Tower"
            description:
              zh-CN: "鉴定远古遗物的学术要地。"
              en-US: "Academy and appraisal center for ancient relics."
      - name:
          zh-CN: "中港"
          en-US: "Mid-Harbor"
        description:
          zh-CN: "码头、工坊和旅店聚集地，城市的经济心脏。"
          en-US: "Docks, workshops, and inns — the economic heart of Mistport."
        climate:
          zh-CN: "浓雾常驻，潮湿闷热"
          en-US: "Perpetual fog, humid and warm"
        landmarks:
          - name:
              zh-CN: "主栈桥"
              en-US: "Main Pier"
            description:
              zh-CN: "雾港唯一的大型泊位，渡船与货船在此停靠。"
              en-US: "The only large berth; ferries and cargo ships dock here."
          - name:
              zh-CN: "钟塔"
              en-US: "Tide-Bell Tower"
            description:
              zh-CN: "以潮汐驱动的机械钟，标记退潮与涨潮。"
              en-US: "A tide-driven clocktower marking ebb and flow."
      - name:
          zh-CN: "下潮区"
          en-US: "The Undertow"
        description:
          zh-CN: "潮退后暴露的远古遗迹区域，地形每次退潮都会改变。"
          en-US: "Ancient ruins exposed at low tide; the layout changes with every withdrawal."
        climate:
          zh-CN: "阴冷，弥漫盐雾与腐蚀气息"
          en-US: "Cold and briny, corrosive salt mist"
        landmarks:
          - name:
              zh-CN: "骨拱门"
              en-US: "Bone Arch"
            description:
              zh-CN: "半淹没的巨大拱形结构，来源不明。"
              en-US: "A half-submerged colossal archway of unknown origin."

  factions:
    - id: council
      name:
        zh-CN: "雾港议会"
        en-US: "Mistport Council"
      description:
        zh-CN: "统治上城的政治实体，试图以'封潮令'限制平民进入下潮区。"
        en-US: "The ruling political body of the Upper City, pushing the 'Seal Tide Decree' to restrict Undertow access."
      type: political
      influence: major
      leader:
        zh-CN: "陈议长"
        en-US: "Councilor Chen"
      headquarters:
        zh-CN: "上城・议事厅"
        en-US: "Upper City — Council Hall"
      relations:
        - targetId: salt-fangs
          type: hostile
          description:
            zh-CN: "视盐牙会为非法组织"
            en-US: "Views the Salt Fangs as an outlaw syndicate"
    - id: tide-readers
      name:
        zh-CN: "验潮师公会"
        en-US: "Tide-Reader Guild"
      description:
        zh-CN: "负责鉴定远古遗物、研究潮汐规律的学术组织。"
        en-US: "Scholars who appraise ancient relics and study tidal patterns."
      type: guild
      influence: major
      leader:
        zh-CN: "公会长・齐老"
        en-US: "Guildmaster Qi"
      headquarters:
        zh-CN: "上城・验潮师公会塔"
        en-US: "Upper City — Guild Tower"
      relations:
        - targetId: council
          type: allied
          description:
            zh-CN: "依赖议会资金，提供遗物鉴定"
            en-US: "Funded by the Council, provides appraisal services"
    - id: salt-fangs
      name:
        zh-CN: "盐牙会"
        en-US: "Salt Fangs"
      description:
        zh-CN: "控制下潮区遗物黑市的走私帮派，势力在底层根深蒂固。"
        en-US: "A smuggler syndicate controlling the relic black market in the Undertow."
      type: criminal
      influence: major
      leader:
        zh-CN: "铁姑"
        en-US: "Iron Meg"
      headquarters:
        zh-CN: "下潮区・隐潮窟"
        en-US: "The Undertow — Hidden Grotto"
      relations:
        - targetId: council
          type: hostile
          description:
            zh-CN: "长期对抗议会封锁政策"
            en-US: "Openly defies Council blockade policies"

  powerSystem:
    name:
      zh-CN: "潮力"
      en-US: "Tide-Force"
    type: magic
    description:
      zh-CN: "远古遗物蕴含的不可预测能量，与潮汐周期共振。验潮师可引导并稳定其效果。"
      en-US: "Unpredictable energy stored in ancient relics, resonating with tidal cycles. Tide-Readers can channel and stabilize its effects."
    rules:
      - zh-CN: "遗物效果因潮汐相位而异，满潮时最强、退潮时最稳"
        en-US: "Relic effects vary with tidal phase — strongest at high tide, most stable at low tide"
      - zh-CN: "未经鉴定的遗物直接使用可能产生反噬"
        en-US: "Using an unappraised relic may trigger dangerous backlash"
      - zh-CN: "雾兽被潮力波动吸引，大规模使用遗物会引来雾兽群"
        en-US: "Fog beasts are drawn to Tide-Force fluctuations; large-scale relic use attracts swarms"
      - zh-CN: "验潮师通过'潮纹'手法引导能量，需要长期训练"
        en-US: "Tide-Readers channel energy through 'tide-marks' — patterns requiring years of training"
    tiers:
      - name:
          zh-CN: "学徒"
          en-US: "Apprentice"
        rank: 1
        description:
          zh-CN: "能感知遗物是否活性"
          en-US: "Can sense whether a relic is active"
      - name:
          zh-CN: "验潮师"
          en-US: "Tide-Reader"
        rank: 2
        description:
          zh-CN: "可鉴定并稳定常规遗物"
          en-US: "Can appraise and stabilize standard relics"
      - name:
          zh-CN: "御潮者"
          en-US: "Tide-Warden"
        rank: 3
        description:
          zh-CN: "能主动引导潮力，极为罕见"
          en-US: "Can actively direct Tide-Force — exceedingly rare"

  history:
    - era:
        zh-CN: "远古"
        en-US: "Ancient"
      name:
        zh-CN: "造者时代"
        en-US: "The Builders' Era"
      description:
        zh-CN: "下潮区遗迹的建造者文明，已无文字记录，仅余建筑残骸。"
        en-US: "The civilization that created the Undertow ruins; no written records survive, only structural remnants."
      significance: major
    - era:
        zh-CN: "建城纪"
        en-US: "Founding"
      year:
        zh-CN: "约三百年前"
        en-US: "~300 years ago"
      name:
        zh-CN: "雾港建城"
        en-US: "Founding of Mistport"
      description:
        zh-CN: "流民在悬崖间搭建栈道定居，发现退潮暴露的遗物可以交易。"
        en-US: "Refugees built walkways between the cliffs and discovered tradeable relics exposed at low tide."
      significance: major
    - era:
        zh-CN: "当代"
        en-US: "Modern"
      year:
        zh-CN: "去年"
        en-US: "Last year"
      name:
        zh-CN: "封潮令草案"
        en-US: "Seal Tide Decree Draft"
      description:
        zh-CN: "陈议长提出封潮令，禁止无证者进入下潮区，引发底层激烈反对。"
        en-US: "Councilor Chen proposed banning unlicensed civilians from the Undertow, sparking unrest in the lower tiers."
      significance: minor

  economy:
    currencies:
      - name:
          zh-CN: "潮币"
          en-US: "Tide Coin"
        symbol: "₮"
        description:
          zh-CN: "议会发行的标准货币"
          en-US: "Standard currency issued by the Council"
      - name:
          zh-CN: "盐牙筹"
          en-US: "Salt Chip"
        description:
          zh-CN: "盐牙会在黑市流通的代币"
          en-US: "Untraceable token used in Salt Fangs black market"
    resources:
      - zh-CN: "远古遗物"
        en-US: "Ancient relics"
      - zh-CN: "潮盐"
        en-US: "Tide salt"
      - zh-CN: "雾菌（可食用真菌）"
        en-US: "Fog fungus (edible)"
      - zh-CN: "崖铁"
        en-US: "Cliff iron"
    tradeNotes:
      zh-CN: "遗物交易是雾港经济的核心。合法渠道走验潮师公会鉴定后拍卖，黑市走盐牙会。"
      en-US: "The relic trade is Mistport's economic backbone. Legal relics go through Guild appraisal and auction; the black market runs through the Salt Fangs."

  socialStructure:
    classes:
      - name:
          zh-CN: "议员与商会"
          en-US: "Councilors & Merchants"
        rank: 1
        description:
          zh-CN: "上城精英，掌握政治与合法贸易权"
          en-US: "Upper City elite controlling politics and legal trade"
      - name:
          zh-CN: "中港市民"
          en-US: "Mid-Harbor Citizens"
        rank: 2
        description:
          zh-CN: "码头工人、工匠、旅店主，城市运转的中坚"
          en-US: "Dockworkers, artisans, innkeepers — the city's backbone"
      - name:
          zh-CN: "潮民"
          en-US: "Undertow Dwellers"
        rank: 3
        description:
          zh-CN: "下潮区居民，靠拾荒和走私为生"
          en-US: "Scavengers and smugglers living at the city's edge"
    notes:
      zh-CN: "验潮师公会成员不受阶层限制，凭技术获得跨阶层通行权。"
      en-US: "Tide-Reader Guild members hold cross-tier passage rights regardless of social class."

  tone:
    genres:
      - dark-fantasy
      - mystery
      - exploration
    contentRating: teen
    narrativeStyle:
      zh-CN: "雾气氤氲的哥特悬疑风格，节奏舒缓但暗流涌动。"
      en-US: "Gothic suspense shrouded in fog — slow-paced on the surface, with dangerous undercurrents."
    themes:
      - zh-CN: "阶层对立"
        en-US: "class divide"
      - zh-CN: "未知探索"
        en-US: "the unknown"
      - zh-CN: "权力与秩序"
        en-US: "order vs. freedom"

  mechanics:
    combatStyle: narrative
    skillSystem:
      zh-CN: "以职业技能树为核心：验潮（鉴定/引导遗物）、潜行（雾中行动）、交涉（社交）、格斗。"
      en-US: "Skill trees by vocation: Tide-Reading (appraise/channel relics), Stealth (fog navigation), Diplomacy (social), Combat."
    difficulty: normal
    customRules:
      - zh-CN: "雾中行动需声音/光源检定，失败则引来雾兽"
        en-US: "Fog actions require sound/light checks — failure attracts fog beasts"
      - zh-CN: "遗物使用前必须鉴定，否则触发随机效果表"
        en-US: "Relics must be appraised before use, or trigger a random-effect table"
      - zh-CN: "潮汐周期影响下潮区可探索范围"
        en-US: "Tidal cycle determines explorable range in the Undertow"

  startingConditions:
    openingScenario:
      zh-CN: "你刚抵达雾港中港的主栈桥。潮汐钟敲响——一次罕见的深退潮即将发生。码头上有人在招募深潮探险队，也有人在发放封潮令传单。"
      en-US: "You step off the ferry onto Mid-Harbor's main pier. The fog is thick today. A deep tide-bell rings — signaling a rare 'deep withdrawal' that will expose deeper ruins than usual. The dock buzzes with expedition recruiters and Council officers handing out Seal Tide Decree leaflets."
    openingHook:
      zh-CN: 潮钟已鸣，下潜还是封港？
      en-US: The bell has rung — dive, or seal?
    openingChips:
      - zh-CN: 中港主栈桥
        en-US: Mid-Harbor pier
      - zh-CN: 深退潮
        en-US: Deep withdrawal
      - zh-CN: 封潮令
        en-US: Seal Tide Decree
    playerConstraints:
      - zh-CN: "初始为验潮师学徒或普通潮民"
        en-US: "Start as a Tide-Reader apprentice or common Undertow dweller"
      - zh-CN: "不可携带明火进入雾区"
        en-US: "No open flames permitted in the fog"
    startingLocation:
      zh-CN: "中港・主栈桥"
      en-US: "Mid-Harbor — Main Pier"
    startingResources:
      潮币: 50
      雾灯: 1
