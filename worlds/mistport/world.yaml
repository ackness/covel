# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
id: mistport
name: 雾港・裂潮纪
version: 0.4.0
summary: 潮钟三鸣，失踪的公会长与一把破碎的钥匙，把你卷入永雾港城的四方暗战。
defaultLocale: zh-CN
tags:
  - dark-fantasy
  - mystery
  - exploration
author:
  name: Covel Contributors
  url: https://github.com/ackness/covel
license: MIT
cover: media/gallery/world-cover.webp
accentColor: "oklch(72% 0.1 185)"
# 采用经典故事组合包与叙事判定；data/ 约定自动接入核心任务、记忆、世界规则、故事事件与世界时间，不启用掷骰、背包或好感插件。
plugins:
  - pack:traditional-story
pluginPitch:
  label: 雾港调查剧
  description: 追查齐老失踪案，核对证词和物证，在返潮前固定线索。带有任务日志与期限、线索记忆、四方立场面板、世界规则和七名角色的立绘。
  reason: 四条调查任务串起半封信、报告缺页、回声廊和病院证词，回声廊在深退潮急涨前设有限时窗口。案情板记录来源、矛盾与保存情况；四方立场、人物信任与钥匙碎片随叙事变化。
pluginSettings:
  story-events:
    planner: true
characterSchema:
  attributes:
    - id: persona
      name: 性格
      type: string
      category: bio
      description: 你怎样说话、怎样待人，例如“沉默寡言、谨慎多疑，必要时果断”。叙事会据此描写你的举止和对白。
    - id: origin
      name: 来历
      type: string
      category: bio
      description: 你以新晋验潮师学徒（腕带考核潮纹、可凭公会名义查档）或熟悉下潮区的潮民（知道栈桥暗门与雾灯手势、手头有齐老当年留下的便笺）身份进入故事；也可补充家乡、旧业与来到主栈桥的缘由。
    - id: motive
      name: 此行所求
      type: string
      category: bio
      description: 你愿意冒险追查齐老的私人理由，例如报当年免费鉴物之恩、查清同伴为何在退潮时失踪、保住生计或求财自保。
    - id: faction
      name: 势力
      type: string
      category: social
      description: 所属势力或公会
    - id: role
      name: 身份
      type: string
      category: bio
      description: 在势力中的身份或职务
    - id: location
      name: 所在地
      type: string
      category: bio
      description: 当前所在地点
    - id: tideSense
      name: 潮感
      type: string
      category: abilities
      description: 感知潮汐与雾的能力
    - id: fogRot
      name: 雾蚀
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description: 不可逆的雾蚀进度；0-24 难以察觉，25-49 出现半透明征兆，50-74 潮力增强但持续失能，75 以上逼近溶雾。
    - id: fogRotSigns
      name: 雾蚀征兆
      type: string
      category: stats
      description: 当前可观察到的雾蚀部位、异变与症状；没有征兆时可留空。
    - id: vitality
      name: 体力
      type: number
      min: 0
      max: 100
      defaultValue: 100
      category: stats
      description: 伤势、疲劳与失温共同影响的行动余力
    - id: stress
      name: 压力
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description: 恐惧、秘密与时间压力造成的精神负荷
    - id: condition
      name: 当前状态
      type: string
      category: stats
      description: 伤势、疾病、失温或其他持续状态
    - id: tideReading
      name: 验潮
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 鉴定遗物、辨读潮纹与稳定潮力的熟练度
    - id: stealth
      name: 雾行
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 控制声光、辨路与避开雾兽的熟练度
    - id: diplomacy
      name: 交涉
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 谈判、察言观色与周旋于四方势力的熟练度
    - id: combat
      name: 格斗
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 近身自卫与在狭窄遗迹中作战的熟练度
    - id: permit
      name: 下潮许可
      type: boolean
      defaultValue: false
      category: equipment
      description: 是否持有议会承认的下潮区通行许可
    - id: equipment
      name: 随身装备
      type: array
      itemType: string
      defaultValue: []
      category: equipment
      description: 雾灯、静音工具、防水绳与其他可用装备
    - id: relics
      name: 携带遗物
      type: array
      itemType: string
      defaultValue: []
      category: equipment
      description: 随身携带的已鉴定或未鉴定遗物及碎片
    - id: trust
      name: 信任
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的信任
    - id: dispositionToPlayer
      name: 对你的态度
      type: string
      category: social
      description: 对玩家的态度
