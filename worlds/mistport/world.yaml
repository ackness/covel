schemaVersion: "1.0"
id: mistport
name:
  zh-CN: 雾港・裂潮纪
  en-US: Mistport Chronicles
version: "0.1.0"
summary:
  zh-CN: 一座被永恒浓雾包裹的港口城市。潮汐带来远古遗物，也带来危险。
  en-US: A fog-shrouded port city where each tide reveals ancient ruins and dangers.
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
tags:
  - dark-fantasy
  - mystery
  - exploration
requiredPlugins:
  - pregame
  - world-init
  - char-creator
  - narrator
recommendedPlugins:
  - guide
  - codex
  - npc-graph
  - player-identity
  - living-world-rules
excludedPlugins:
  - chat-mode-narrator
  - scene-cast
  - scene-prompts
  - branch-reply
worldData: data/world.data.yaml
