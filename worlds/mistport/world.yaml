# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
schemaVersion: "1.0"
id: mistport
name: 雾港・裂潮纪
version: 0.3.0
summary: 潮钟三鸣，失踪的公会长与一把破碎的钥匙，把你卷入永雾港城的四方暗战。
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
tags:
  - dark-fantasy
  - mystery
  - exploration
pluginPolicy:
  packs:
    - id: mistport-investigation
      label: 雾港调查剧
      description: 以传统叙事推进齐老失踪案，并启用线索记忆、关系图谱、世界规则、预设角色与立绘。
      tags:
        - mode:traditional-story
        - role:world-rules
        - data:characters
      reason: 案情板、四方立场、深退潮与钥匙碎片每回合随剧情结算，配合潮时、雾蚀与七名核心角色，让长线调查的每个选择都留下痕迹。
      requested:
        - pregame
        - world-init
        - char-creator
        - narrator
        - guide
        - codex
        - npc-graph
        - memory
        - living-world-rules
        - character-blueprint
        - story-events
      recommended: []
  presetId: mistport-investigation
  preferredTags:
    - mode:traditional-story
    - role:codex
    - role:retrieval
    - role:world-rules
  avoidedTags:
    - mode:dialogue
  requested:
    - pregame
    - world-init
    - char-creator
    - narrator
  recommended:
    - guide
    - codex
    - npc-graph
    - memory
    - living-world-rules
    - character-blueprint
    - story-events
pluginSettings:
  story-events:
    planner: true
characterSchema:
  types:
    - npc
    - companion
  attributes:
    - id: persona
      name: 性格
      type: string
      category: bio
      description: 主角的性格与说话方式（口吻由性格而来）——如「沉默寡言、谨慎多疑、必要时果断」。影响叙事如何刻画你的角色与对白。
    - id: origin
      name: 来历
      type: string
      category: bio
      description: 你以新晋验潮师学徒或熟悉下潮区的潮民身份进入故事；也可补充家乡、旧业与来到主栈桥的缘由。
    - id: motive
      name: 此行所求
      type: string
      category: bio
      description: 你愿意冒险追查齐老的私人理由，例如报恩、求知、赎罪、求财或寻找失踪者。
    - id: faction
      name: 势力
      type: string
      category: social
      description: 所属势力或公会
    - id: role
      name: 身份
      type: string
      category: bio
      description: 在势力中的身份或职务
    - id: location
      name: 所在地
      type: string
      category: bio
      description: 当前所在地点
    - id: tideSense
      name: 潮感
      type: string
      category: abilities
      description: 感知潮汐与雾的能力
    - id: fogRot
      name: 雾蚀
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description: 不可逆的雾蚀进度；0-24 难以察觉，25-49 出现半透明征兆，50-74 潮力增强但持续失能，75 以上逼近溶雾。
    - id: fogRotSigns
      name: 雾蚀征兆
      type: string
      category: stats
      description: 当前可观察到的雾蚀部位、异变与症状；没有征兆时可留空。
    - id: vitality
      name: 体力
      type: number
      min: 0
      max: 100
      defaultValue: 100
      category: stats
      description: 伤势、疲劳与失温共同影响的行动余力
    - id: stress
      name: 压力
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description: 恐惧、秘密与时间压力造成的精神负荷
    - id: condition
      name: 当前状态
      type: string
      category: stats
      description: 伤势、疾病、失温或其他持续状态
    - id: tideReading
      name: 验潮
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 鉴定遗物、辨读潮纹与稳定潮力的熟练度
    - id: stealth
      name: 雾行
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 控制声光、辨路与避开雾兽的熟练度
    - id: diplomacy
      name: 交涉
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 谈判、察言观色与周旋于四方势力的熟练度
    - id: combat
      name: 格斗
      type: number
      min: 0
      max: 5
      defaultValue: 1
      category: abilities
      description: 近身自卫与在狭窄遗迹中作战的熟练度
    - id: permit
      name: 下潮许可
      type: boolean
      defaultValue: false
      category: equipment
      description: 是否持有议会承认的下潮区通行许可
    - id: equipment
      name: 随身装备
      type: array
      itemType: string
      defaultValue: []
      category: equipment
      description: 雾灯、静音工具、防水绳与其他可用装备
    - id: relics
      name: 携带遗物
      type: array
      itemType: string
      defaultValue: []
      category: equipment
      description: 随身携带的已鉴定或未鉴定遗物及碎片
    - id: trust
      name: 信任
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的信任
    - id: dispositionToPlayer
      name: 对你的态度
      type: string
      category: social
      description: 对玩家的态度
worldData: data/world.data.yaml
