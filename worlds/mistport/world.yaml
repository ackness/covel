schemaVersion: "1.0"
id: mistport
name:
  zh-CN: 雾港・裂潮纪
  en-US: Mistport Chronicles
version: "0.2.0"
summary:
  zh-CN: 潮钟三鸣，失踪的公会长与一把破碎的钥匙，把你卷入永雾港城的四方暗战。
  en-US: Three tide-bells, a missing Guildmaster, and a shattered Key draw you into a four-way struggle beneath Mistport's eternal fog.
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
tags:
  - dark-fantasy
  - mystery
  - exploration
pluginPolicy:
  preset: mistport-investigation
  requiredPlugins:
    - pregame
    - world-init
    - char-creator
    - narrator
  recommendedPlugins:
    - guide
    - codex
    - npc-graph
    - memory
    - living-world-rules
    # character-blueprint consumes the worldData `cast` source
    # (plugin:character-blueprint/blueprints) — main-cast cards + right panel.
    - character-blueprint
    - character-presence
    - cost-gate
  excludedPlugins:
    - chat-mode-narrator
    - scene-cast
    - scene-prompts
    - branch-reply
  packs:
    - id: mistport-investigation
      label:
        zh-CN: 雾港调查剧
        en-US: Mistport Investigation
      description:
        zh-CN: 以传统叙事推进齐老失踪案，并启用线索记忆、关系图谱、世界规则、预设角色与立绘。
        en-US: A traditional investigation of Qi's disappearance with clue memory, relationship tracking, world rules, preset characters, and portraits.
      plugins:
        - pregame
        - world-init
        - char-creator
        - narrator
        - guide
        - codex
        - npc-graph
        - memory
        - living-world-rules
        - character-blueprint
        - character-presence
        - cost-gate
      excludedPlugins:
        - chat-mode-narrator
        - scene-cast
        - scene-prompts
        - branch-reply
      tags:
        - mode:traditional-story
        - role:world-rules
        - data:characters
      reason:
        zh-CN: 让潮时、线索、雾蚀、阵营态度与七名核心角色在长线调查中持续演化。
        en-US: Keeps tide-time, evidence, fog-rot, faction attitudes, and seven core characters evolving through a long-form investigation.
  preferTags:
    - mode:traditional-story
    - role:codex
    - role:retrieval
    - role:world-rules
  avoidTags:
    - mode:dialogue
# World-authored plugin setting defaults. mistport is the heaviest world (narrator
# + codex + guide + npc-graph + character-tracker + per-turn memory extraction), so
# it ships cost-gate with GENEROUS caps as a silent budget guardrail — it never
# trims normal sessions, only runaway ones. Players can disable / retune in Settings.
pluginSettings:
  cost-gate:
    softTokens: 400000
    hardTokens: 600000
# World-authored core-memory blocks for a mystery / investigation story. The
# memory system merges these on top of plugin/framework blocks for this world's
# sessions only (genre-specific dimensions without forking a plugin).
memoryBlocks:
  - label: clues
    displayName:
      zh-CN: 线索
      en-US: Clues
    extractionHint:
      zh-CN: 已发现的线索、物证、矛盾证词，及其与齐老失踪、"钥匙"和裂潮真相的关联。
      en-US: Discovered clues, evidence, and contradictions, and how they tie to Qi's disappearance, the "key", and the truth of the Riftide.
    icon: Search
    maxChars: 3600
  - label: relics
    displayName:
      zh-CN: 遗物
      en-US: Relics
    extractionHint:
      zh-CN: 已获得或见识过的远古遗物、其鉴定结果、效果、风险与归属。
      en-US: Ancient relics obtained or seen, their appraisals, effects, risks, and ownership.
    icon: Gem
    maxChars: 2400
  - label: tides
    displayName:
      zh-CN: 潮讯
      en-US: Tide Lore
    extractionHint:
      zh-CN: 关于退潮时间、深退潮预警、雾兽出没、雾蚀进展与安全/危险窗口的观察。
      en-US: Observations on ebb timing, deep-withdrawal alerts, fog-beast sightings, fog-rot progression, and safe/danger windows.
    icon: Waves
    maxChars: 2400
  - label: commitments
    displayName:
      zh-CN: 立场与人情
      en-US: Allegiances & Debts
    extractionHint:
      zh-CN: 玩家对议会、公会、盐牙会、雾中教会作出的承诺，获得的许可、通缉、债务与人情，以及这些选择对各方态度的可见影响。
      en-US: Promises made to the Council, Guild, Salt Fangs, and Congregation; permits, warrants, debts, favors, and the visible effect of those choices on each faction.
    icon: Scale
    maxChars: 3000
# World-declared character attributes. world-init writes these verbatim as the
# session's `character-attributes` schema (no LLM, no dimension-derived
# fallback), so the right panel shows authored bilingual labels that match the
# fields on this world's cast cards (faction / role / tideSense / fogRot / …).
characterAttributes:
  # 性格是角色卡的属性、在创角时设定（口吻由性格而来）。bio 类 + freeform，
  # char-creator 创角表单会优先纳入它。
  - id: persona
    name: { zh-CN: 性格, en-US: Personality }
    type: string
    category: bio
    description:
      zh-CN: 主角的性格与说话方式（口吻由性格而来）——如「沉默寡言、谨慎多疑、必要时果断」。影响叙事如何刻画你的角色与对白。
      en-US: The hero's personality and how they speak (voice follows from personality) — e.g. "taciturn, wary, decisive when it counts." Shapes how the narrator portrays the character and their dialogue.
  - id: origin
    name: { zh-CN: 来历, en-US: Origin }
    type: string
    category: bio
    description:
      zh-CN: 你以新晋验潮师学徒或熟悉下潮区的潮民身份进入故事；也可补充家乡、旧业与来到主栈桥的缘由。
      en-US: Enter as a newly admitted Tide-Reader apprentice or an Undertow local; you may also add a homeland, former trade, and reason for coming to the Main Pier.
  - id: motive
    name: { zh-CN: 此行所求, en-US: Driving Motive }
    type: string
    category: bio
    description:
      zh-CN: 你愿意冒险追查齐老的私人理由，例如报恩、求知、赎罪、求财或寻找失踪者。
      en-US: "Your personal reason to risk investigating Qi: a debt, curiosity, redemption, profit, or a missing person of your own."
  - id: faction
    name: { zh-CN: 势力, en-US: Faction }
    type: string
    category: social
    description: { zh-CN: 所属势力或公会, en-US: Affiliated faction or guild }
  - id: role
    name: { zh-CN: 身份, en-US: Role }
    type: string
    category: bio
    description:
      { zh-CN: 在势力中的身份或职务, en-US: Role or rank within the faction }
  - id: location
    name: { zh-CN: 所在地, en-US: Location }
    type: string
    category: bio
    description: { zh-CN: 当前所在地点, en-US: Current whereabouts }
  - id: tideSense
    name: { zh-CN: 潮感, en-US: Tide Sense }
    type: string
    category: abilities
    description:
      { zh-CN: 感知潮汐与雾的能力, en-US: Sensitivity to the tide and fog }
  - id: fogRot
    name: { zh-CN: 雾蚀, en-US: Fog Rot }
    type: number
    min: 0
    max: 100
    defaultValue: 0
    category: stats
    description:
      zh-CN: 不可逆的雾蚀进度；0-24 难以察觉，25-49 出现半透明征兆，50-74 潮力增强但持续失能，75 以上逼近溶雾。
      en-US: "Irreversible fog-rot progress: 0-24 latent, 25-49 visibly translucent, 50-74 stronger Tide-Force with lasting impairment, and 75+ close to dissolution."
  - id: fogRotSigns
    name: { zh-CN: 雾蚀征兆, en-US: Fog-Rot Signs }
    type: string
    category: stats
    description:
      zh-CN: 当前可观察到的雾蚀部位、异变与症状；没有征兆时可留空。
      en-US: Currently observable locations, mutations, and symptoms of fog-rot; leave blank when there are no signs.
  - id: vitality
    name: { zh-CN: 体力, en-US: Vitality }
    type: number
    min: 0
    max: 100
    defaultValue: 100
    category: stats
    description:
      {
        zh-CN: 伤势、疲劳与失温共同影响的行动余力,
        en-US: "Capacity to act after injury, fatigue, and exposure",
      }
  - id: stress
    name: { zh-CN: 压力, en-US: Stress }
    type: number
    min: 0
    max: 100
    defaultValue: 0
    category: stats
    description:
      {
        zh-CN: 恐惧、秘密与时间压力造成的精神负荷,
        en-US: "Mental strain from fear, secrets, and time pressure",
      }
  - id: condition
    name: { zh-CN: 当前状态, en-US: Condition }
    type: string
    category: stats
    description:
      {
        zh-CN: 伤势、疾病、失温或其他持续状态,
        en-US: "Injuries, illness, exposure, or other ongoing conditions",
      }
  - id: tideReading
    name: { zh-CN: 验潮, en-US: Tide-Reading }
    type: number
    min: 0
    max: 5
    defaultValue: 1
    category: abilities
    description:
      {
        zh-CN: 鉴定遗物、辨读潮纹与稳定潮力的熟练度,
        en-US: "Skill at appraising relics, reading tide-marks, and stabilizing Tide-Force",
      }
  - id: stealth
    name: { zh-CN: 雾行, en-US: Fogcraft }
    type: number
    min: 0
    max: 5
    defaultValue: 1
    category: abilities
    description:
      {
        zh-CN: 控制声光、辨路与避开雾兽的熟练度,
        en-US: "Skill at controlling sound and light, navigating, and evading fog beasts",
      }
  - id: diplomacy
    name: { zh-CN: 交涉, en-US: Diplomacy }
    type: number
    min: 0
    max: 5
    defaultValue: 1
    category: abilities
    description:
      {
        zh-CN: 谈判、察言观色与周旋于四方势力的熟练度,
        en-US: "Skill at negotiation, reading people, and navigating the four factions",
      }
  - id: combat
    name: { zh-CN: 格斗, en-US: Combat }
    type: number
    min: 0
    max: 5
    defaultValue: 1
    category: abilities
    description:
      {
        zh-CN: 近身自卫与在狭窄遗迹中作战的熟练度,
        en-US: Skill at self-defense and fighting in confined ruins,
      }
  - id: permit
    name: { zh-CN: 下潮许可, en-US: Undertow Permit }
    type: boolean
    defaultValue: false
    category: equipment
    description:
      {
        zh-CN: 是否持有议会承认的下潮区通行许可,
        en-US: Whether the character holds a Council-recognized Undertow permit,
      }
  - id: equipment
    name: { zh-CN: 随身装备, en-US: Equipment }
    type: array
    itemType: string
    defaultValue: []
    category: equipment
    description:
      {
        zh-CN: 雾灯、静音工具、防水绳与其他可用装备,
        en-US: "Fog-lamps, silenced tools, waterproof rope, and other usable gear",
      }
  - id: relics
    name: { zh-CN: 携带遗物, en-US: Carried Relics }
    type: array
    itemType: string
    defaultValue: []
    category: equipment
    description:
      {
        zh-CN: 随身携带的已鉴定或未鉴定遗物及碎片,
        en-US: Appraised or unappraised relics and fragments currently carried,
      }
  - id: trust
    name: { zh-CN: 信任, en-US: Trust }
    type: number
    min: 0
    max: 100
    defaultValue: 0
    category: social
    description: { zh-CN: 对玩家的信任, en-US: Trust toward the player }
  - id: dispositionToPlayer
    name: { zh-CN: 对你的态度, en-US: Disposition }
    type: string
    category: social
    description: { zh-CN: 对玩家的态度, en-US: Attitude toward the player }
worldData: data/world.data.yaml
