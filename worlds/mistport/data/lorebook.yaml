- id: geography
  strategy: selective
  keys:
    [
      上城,
      中港,
      下潮区,
      主栈桥,
      封档库,
      静潮病院,
      盐市,
      无声栈,
      封潮关,
      褪水阶,
      回声廊,
      骨拱门,
      沉钟堂,
      隐潮窟,
    ]
  content: >-
    雾港夹在悬崖与海之间，灰白浓雾常年不散，能见度不超过五十步，城分上城、中港、下潮区三层。
    上城在崖顶，雾薄，偶见天光。议会和商会住在石砌建筑里，掌握合法遗物贸易。议事厅穹顶嵌着不用火焰的远古潮石灯。
    验潮师公会塔负责遗物鉴定，也是全城唯一的图书馆与档案库。塔下封档库禁止随意查阅；齐老失踪当天，第七十四号鉴定报告和访客簿各少一页，门锁却完好。
    静潮病院名义上收治重度雾蚀患者，实际由议会看守。三年前深潜队唯一的幸存者被关在最下层。
    中港潮湿闷热，码头、工坊和旅店挤在浓雾里，各方在这里做生意，也在这里暗中较量。主栈桥是唯一的大型泊位，渡船、货船和新来者都在此落脚。潮汐驱动的钟塔每六小时鸣钟，三连击是深退潮预警。
    背巷的盐市半公开营业，盐牙会在此放货、招人；持盐牙筹才听得到真正的价。无声栈的低矮墙壁填着吸音雾菌，老板不问来路，却会把未归者的雾灯挂到门梁上。
    封潮关守着通往褪水阶的路。灰隼核验许可证，没收明火和未登记遗物；从栈桥暗门绕过去，就欠盐牙会一份人情。
    下潮区阴冷，满是盐雾与腐蚀气息。遗迹随退潮露出，每次地形都变，旧地图无用，最深处从未有人到达。
    骨拱门来历不明，半淹在水里，六年前的深退潮将它露出，也带走十七条人命。沉钟堂只在退潮时露出，教会在那里礼拜，相信此处最接近“雾之主”。
    隐潮窟涨潮也淹不到，是盐牙会的据点，铁姑将收集的碎片存于此。褪水阶每一级都刻着撤离刻度；海水退过第九十级才算深退潮，返潮警铃后通常只剩约半小时。
    回声廊是本次深退潮最先露出的环形廊道，石壁会延迟复述脚步与耳语。那里留下了齐老的潮纹、灰隼私队的新绳痕和一枚陌生的童谣铜片。
- id: factions
  strategy: selective
  keys: [议会, 陈议长, 验潮师, 公会, 盐牙会, 铁姑, 教会, 小霜, 封潮令]
  content: >-
    雾港议会统治上城，议长是陈远山，据点在议事厅。议会试图用封潮令限制平民下潮，垄断合法遗物贸易，内部却分成鸽鹰两派。
    它与盐牙会长期冷战，视对方为非法组织；拨款给公会并借此施压；斥雾中教会为邪教，警惕信众在底层增长。
    验潮师公会由齐老主持，驻上城公会塔，是唯一有资格鉴定远古遗物、研究裂潮的学术组织。它依赖议会资金，以鉴定服务换取名义独立，公开反对走私。高层压下某些报告，年轻验潮师越来越不安。
    盐牙会把持下潮区的遗物黑市，根扎在底层，二当家铁姑守信，也在暗中搜集碎片。它以隐潮窟为据点，长期对抗议会封锁。不信教会的教义，但准许信徒借道，偶尔交换情报。
    雾中教会是规模尚小、信众却激增的新教团，雾使小霜在下潮区沉钟堂主持礼拜。它拜“雾之主”，相信雾有意识、遗迹是其身体，宣讲“雾蚀是升华”。议会将它列为邪教，它靠底层信众抵抗；教会用信仰解释潮力与雾蚀，与公会的“科学”立场针锋相对。
- id: powerSystem
  strategy: selective
  keys: [潮力, 潮纹, 遗物, 雾蚀, 学徒, 验潮师, 御潮者]
  content: >-
    潮力是遗物里难以预测的能量，与潮汐共振，退潮时最强。验潮师靠潮纹引导、稳定它，手法需要长期训练，公会却公开否认潮力存在。
    遗物效果另随潮相变化，满潮最强，退潮最稳。未鉴定就使用，可能反噬，轻则失能，重则致命。大规模动用遗物会以潮力波动引来雾兽群。
    学徒能感知遗物是否活性；验潮师能鉴定、稳定常规遗物；御潮者能主动引导潮力，人数极少，多数已有雾蚀。极少数人不靠遗物也能感知潮力，公会视为危险，教会奉为神迹。
    过度使用会引发不可逆的雾蚀，身体逐渐半透明，最终溶入雾中。雾蚀记为 0–100，25 起有可见异变，50 起持续失能，75 以上随时可能溶雾。
- id: history
  strategy: selective
  keys: [造者, 建城, 历史, 骨拱门, 深潜队, 探险队, 周期, 齐老的笔记]
  content: >-
    远古造者留下了下潮区的建筑残骸，没有文字记录传世，碑文比雾港古老一万年。约三百年前，流民沿悬崖搭栈道定居，发现退潮露出的遗物能卖钱，雾港由此建成。
    六年前的深退潮露出骨拱门，探险队蜂拥而入，十七人死在返潮里，至今没人愿意多提。三年前，一支议会探险队深入下潮区后失踪，唯一幸存者发疯，反复说“它在下面醒了”。
    近年雾蚀患者激增，教会以“升华”招徕底层贫民，小霜的预言屡屡应验。去年陈议长提出封潮令，禁止无证者下潮，底层激烈反对。
    如今敏感的验潮师察觉雾逐月变浓、退潮间隔拉长；齐老的笔记称这是“周期的临界点”。
- id: economy
  strategy: selective
  keys: [潮币, 盐牙筹, 交易, 买卖, 黑市, 潮盐, 雾菌, 崖铁]
  content: >-
    潮币（₮）是议会发行的标准货币；盐牙筹是盐牙会在黑市流通的不可追踪代币。常见货品有远古遗物、遗物碎片、潮盐、可食用的雾菌和崖铁。
    遗物贸易养活雾港。合法货品经验潮师公会鉴定后拍卖，黑市由盐牙会掌握。有人高价收购碎片，黑市上的碎片价格因此高得离奇。
- id: socialStructure
  strategy: selective
  keys: [阶层, 商会, 市民, 潮民, 雾蚀患者, 公会成员]
  content: >-
    上城的议员与商会居于第一阶层，掌握政治和合法贸易。中港的码头工人、工匠、旅店主居于第二阶层，维持城市日常运转。
    第三阶层是下潮区边缘的潮民，靠拾荒、走私为生，也是教会的主要信众。公会成员凭技术跨阶层通行；雾蚀患者却遭各阶层排斥，逐渐流向教会。
- id: tone
  strategy: constant
  content: >-
    这是适合青少年阅读的黑暗奇幻调查故事，也有探索。采用哥特悬疑的语气，节奏舒缓，危险藏在眼前的细节里。调查逐步揭开真相，代价随行动累积。
    写出阶层对立、对未知的探索、秩序与自由的冲突、信仰与异化、追查真相的代价，以及雾蚀让身体边界变得模糊的处境。
- id: mechanics
  strategy: constant
  content: >-
    战斗由叙事处理，难度为普通。职业技能分为验潮（鉴定、引导遗物）、雾行（雾中潜行）、交涉和格斗。
    雾中行动要判断声音与光源的风险，失败会引来雾兽；未经鉴定就动用遗物，效果难以预料。写清行为和后果，不虚构已经掷骰或查表的结果。
    潮汐决定下潮区哪些地方可走，涨潮预警后必须撤退。引导潮力、使用活性遗物会增加雾蚀，越过阈值就会留下不可逆的异变。
    四方会对遗物交易和下潮行动作出反应。取悦一方可能得罪另一方。线索在“未核实、已佐证、已污染、已解决”之间变化，证据被水冲走不能替谁作证。
    有代价的行动至少要让一项状态发生可见变化：潮时、地点、伤势或雾蚀、人物态度、阵营压力、线索可信度。
