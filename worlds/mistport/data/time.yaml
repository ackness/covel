id: world
definition:
  kind: phases
  name: 雾港潮时
  cycleLabel: 潮周期
  phases:
    - 涨潮
    - 满潮
    - 退潮
    - 低潮
  initial: { cycle: 1, phase: 2 }
  evolution:
    mode: forward
    defaultStep: 1
    maxStep: 16
    prompt: 以潮汐阶段计时，不换算现实钟点。开局海水已经后退，从退潮开始。连续短谈可留在当前阶段，等潮水或跨区域探索则推进。深退潮是罕见的剧情事件，不是循环中的常规阶段。
