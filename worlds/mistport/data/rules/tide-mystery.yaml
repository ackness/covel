- schemaVersion: 1
  id: mistport-silence-protocol
  title: 雾中生存法
  content: 雾兽追逐突兀的声光与潮力波动，而非凭空定位猎物。进入浓雾时应写清冷光雾灯、包布金属、手势交流和撤离刻度；玩家若制造明火、撞击或高声，先给出可感知的逼近征兆，再让危险升级。
  kind: constant
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 雾兽
    - 声音
    - 光源
    - 雾灯
    - 撤离
  insertionOrder: 405
- schemaVersion: 1
  id: mistport-fog-truth
  title: 雾中真相
  content: 雾港的线索经常互相矛盾。每次调查应保留可验证细节、目击者偏见和潮汐造成的证据偏移，让玩家通过追问和比对推进真相，而不是直接给出结论。
  kind: constant
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 雾
    - 线索
    - 目击者
    - 潮汐
  insertionOrder: 410
- schemaVersion: 1
  id: mistport-opening-leads
  title: 三声钟后的第一步
  content: 开局不要一次倾倒全部阴谋。苏窈的半封信、公会封档库缺失的第七十四号报告、封潮关外刚露出的回声廊，是三个可交叉验证的起点；盐牙会的暗门与议会许可证代表不同代价。每个场景至少给出一个可行动的具体线索，并让林远舟、铁姑、灰隼或小霜中的一人以自己的诉求把调查推向下一处。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 三连击
    - 齐老失踪
    - 半封信
    - 第七十四号
    - 回声廊
  insertionOrder: 415
- schemaVersion: 1
  id: mistport-tide-clock
  title: 潮汐时钟
  content: 涨潮、退潮、钟塔鸣钟和封潮令会改变可进入地点。行动选择应明确当前潮时，让时间压力影响探索路线；深退潮预警（三连击）是稀有的机会窗口，也是危险窗口。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 涨潮
    - 退潮
    - 钟塔
    - 封潮令
    - 路线
  insertionOrder: 420
- schemaVersion: 1
  id: mistport-ruin-whisper
  title: 遗迹低语
  content: 远古遗物带来知识、污染和交易价值，效果不可预测。处理遗物时需要同时考虑鉴定与否、黑市、教会、议会和个人安危的影响，未鉴定遗物的使用应有真实风险。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 遗物
    - 鉴定
    - 黑市
    - 教会
    - 风险
  insertionOrder: 430
- schemaVersion: 1
  id: mistport-fog-rot
  title: 潮力与雾蚀
  content: 引导潮力或使用活性遗物总有代价。力量的获得应伴随雾蚀的累积、身体的异变、或精神上的侵蚀，避免无成本地变强；雾蚀不可逆，越深入下潮区，代价越显形。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 潮力
    - 雾蚀
    - 代价
    - 异变
    - 御潮
  insertionOrder: 440
- schemaVersion: 1
  id: mistport-faction-pressure
  title: 四方角力
  content: 议会、验潮师公会、盐牙会、雾中教会对玩家的遗物交易与下潮区行动各有反应，立场此消彼长。推进剧情时优先呈现选边的代价：取悦一方往往得罪另一方，没有不留痕迹的中立。
  kind: triggered
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 议会
    - 公会
    - 盐牙会
    - 教会
    - 立场
  insertionOrder: 450
- schemaVersion: 1
  id: mistport-deep-truth
  title: 深处之物
  content: 裂潮、雾在变浓、齐老的失踪、"钥匙"碎片，最终指向下潮区最深处正在苏醒的某种存在。这条主线应缓慢累积、层层铺垫，用线索和异象暗示，绝不在前中期廉价揭底；越接近真相，世界的氛围越压抑、代价越沉重。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 裂潮
    - 深处
    - 钥匙
    - 周期
    - 真相
  insertionOrder: 460
- schemaVersion: 1
  id: mistport-consequence-ledger
  title: 会留下痕迹的选择
  content: 有代价的行动应让状态持续演化，而非下一幕复原。明确更新潮时与地点、角色的体力/压力/雾蚀、对玩家的信任与态度、四方势力的许可/通缉/人情，或线索的未核实/已佐证/已污染/已解决状态；只更新叙事已经明确造成的变化，且把后果带入后续场景。
  kind: evolving
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 信任
    - 压力
    - 许可
    - 通缉
    - 已佐证
    - 已污染
  insertionOrder: 470
