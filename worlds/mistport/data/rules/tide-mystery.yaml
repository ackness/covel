- schemaVersion: 1
  id: mistport-silence-protocol
  title: 雾中生存法
  content: 雾兽会循着突兀的声光和潮力波动逼近。浓雾里的行动要写清雾灯冷光、包布金属、手势和撤离刻度。玩家点起明火、撞响东西或高声说话时，先让他察觉接近的征兆，再升级危险。
  kind: constant
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 雾兽
    - 声音
    - 光源
    - 雾灯
    - 撤离
  insertionOrder: 405
- schemaVersion: 1
  id: mistport-fog-truth
  title: 雾中真相
  content: 线索常会互相矛盾。写清可核对的细节、证人的偏见和潮水怎样改动痕迹，让玩家靠追问、比对判断。证据得记出处；同一人的重复说法、同源转述不算独立佐证。污染或翻供之后，留下原因与原话，别把旧结论照抄一遍。
  kind: constant
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 雾
    - 线索
    - 目击者
    - 潮汐
  insertionOrder: 410
- schemaVersion: 1
  id: mistport-opening-leads
  title: 三声钟后的第一步
  content: 先从苏窈的半封信、公会封档库的报告缺页、刚露出的回声廊查起，不在开场揭开整场阴谋。三处可以相互比对，暗门与许可证则各有代价。每场给出至少一条能追的具体线索，让林远舟、铁姑、灰隼或小霜按自己的诉求把调查推向下一处。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 三连击
    - 齐老失踪
    - 半封信
    - 第七十四号
    - 回声廊
  insertionOrder: 415
- schemaVersion: 1
  id: mistport-tide-clock
  title: 潮汐时钟
  content: 开局海水已经后退，潮时从退潮开始。涨落潮、钟声和封潮令决定哪里能去，给选择时要说清当前潮时。深退潮的三连预警罕见，机会和风险都大；返潮警铃后通常只剩约半小时。证据若还在水边，固定它也要花一次行动，不能边撤退边当作已经保存。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 涨潮
    - 退潮
    - 钟塔
    - 封潮令
    - 路线
  insertionOrder: 420
- schemaVersion: 1
  id: mistport-ruin-whisper
  title: 遗迹低语
  content: 遗物的效用难料，能换钱，也可能带来知识或污染。写遗物时，顾及它是否经过鉴定、持有者的安危，以及黑市、教会和议会会怎样反应。擅用未鉴定遗物要有实际风险。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 遗物
    - 鉴定
    - 黑市
    - 教会
    - 风险
  insertionOrder: 430
- schemaVersion: 1
  id: mistport-fog-rot
  title: 潮力与雾蚀
  content: 引导潮力、使用活性遗物会付出代价：雾蚀累积、身体异变，或精神受损。越深入下潮区，越要写清代价落在了哪里。雾蚀不可逆，休息只能恢复体力、缓解压力。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 潮力
    - 雾蚀
    - 代价
    - 异变
    - 御潮
  insertionOrder: 440
- schemaVersion: 1
  id: mistport-faction-pressure
  title: 四方角力
  content: 议会、公会、盐牙会和教会都会回应玩家的遗物交易与下潮行动。把选边的交换条件说清楚：取悦一方，往往会得罪另一方；声称中立，也会留下痕迹。许可证、通缉只属于议会的记录，其余三方的人情各自记账。
  kind: triggered
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 议会
    - 公会
    - 盐牙会
    - 教会
    - 立场
  insertionOrder: 450
- schemaVersion: 1
  id: mistport-deep-truth
  title: 深处之物
  content: 裂潮、浓雾、齐老失踪和钥匙碎片，都指向下潮区最深处正在苏醒的东西。前中期用线索和异象逐步铺开，不把谜底提前说破。越接近真相，压迫感和行动代价越重。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 裂潮
    - 深处
    - 钥匙
    - 周期
    - 真相
  insertionOrder: 460
- schemaVersion: 1
  id: mistport-consequence-ledger
  title: 会留下痕迹的选择
  content: 有代价的行动，后果不能到下一幕就消失。潮时、地点、体力、压力、雾蚀和人物信任照常变化。案情板记录来源、矛盾、固定方式和判断，四方立场记态度与人情，另有深退潮与碎片记录。叙事写清谁目睹了变化、证据怎样得到或受损、潮讯到了哪一步，后续场景沿用这些结果。任务只在对应目标实际做到时推进；揭示隐藏事件本身不算完成调查。
  kind: evolving
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 信任
    - 压力
    - 许可
    - 通缉
