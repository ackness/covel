- schemaVersion: 1
  id: mistport-fog-truth
  title: 雾中真相
  content: 雾港的线索经常互相矛盾。每次调查应保留可验证细节、目击者偏见和潮汐造成的证据偏移，让玩家通过追问和比对推进真相，而不是直接给出结论。
  kind: constant
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 雾
    - 线索
    - 目击者
    - 潮汐
  insertionOrder: 410
- schemaVersion: 1
  id: mistport-tide-clock
  title: 潮汐时钟
  content: 涨潮、退潮、钟塔鸣钟和封潮令会改变可进入地点。行动选择应明确当前潮时，让时间压力影响探索路线；深退潮预警（三连击）是稀有的机会窗口，也是危险窗口。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 涨潮
    - 退潮
    - 钟塔
    - 封潮令
    - 路线
  insertionOrder: 420
- schemaVersion: 1
  id: mistport-ruin-whisper
  title: 遗迹低语
  content: 远古遗物带来知识、污染和交易价值，效果不可预测。处理遗物时需要同时考虑鉴定与否、黑市、教会、议会和个人安危的影响，未鉴定遗物的使用应有真实风险。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 遗物
    - 鉴定
    - 黑市
    - 教会
    - 风险
  insertionOrder: 430
- schemaVersion: 1
  id: mistport-fog-rot
  title: 潮力与雾蚀
  content: 引导潮力或使用活性遗物总有代价。力量的获得应伴随雾蚀的累积、身体的异变、或精神上的侵蚀，避免无成本地变强；雾蚀不可逆，越深入下潮区，代价越显形。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 潮力
    - 雾蚀
    - 代价
    - 异变
    - 御潮
  insertionOrder: 440
- schemaVersion: 1
  id: mistport-faction-pressure
  title: 四方角力
  content: 议会、验潮师公会、盐牙会、雾中教会对玩家的遗物交易与下潮区行动各有反应，立场此消彼长。推进剧情时优先呈现选边的代价：取悦一方往往得罪另一方，没有不留痕迹的中立。
  kind: triggered
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 议会
    - 公会
    - 盐牙会
    - 教会
    - 立场
  insertionOrder: 450
- schemaVersion: 1
  id: mistport-deep-truth
  title: 深处之物
  content: 裂潮、雾在变浓、齐老的失踪、"钥匙"碎片，最终指向下潮区最深处正在苏醒的某种存在。这条主线应缓慢累积、层层铺垫，用线索和异象暗示，绝不在前中期廉价揭底；越接近真相，世界的氛围越压抑、代价越沉重。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 裂潮
    - 深处
    - 钥匙
    - 周期
    - 真相
  insertionOrder: 460
