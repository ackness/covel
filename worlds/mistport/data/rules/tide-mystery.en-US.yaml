- id: mistport-silence-protocol
  title: Survival in the Fog
  content:
    Fog beasts follow sudden noise, light and disturbances in Tide-Force. Show how people use
    cold-light lamps, wrap metal in cloth, signal by hand and follow evacuation marks. If the player
    lights a flame, makes a loud impact or shouts, give them signs of something approaching before
    the danger grows.
  keys:
    - fog beast
    - noise
    - light
    - lamp
    - retreat
- id: mistport-fog-truth
  title: Truth in the Fog
  content:
    Leads often contradict each other. Give the player details they can check, witnesses with
    biases, and traces altered by the tide. Let questions and comparisons support their judgment.
    Record where evidence came from; repeated claims or hearsay from one source are not independent
    corroboration. After contamination or a retraction, keep the reason and original words instead
    of repeating the old conclusion.
  keys:
    - fog
    - clue
    - witness
    - tide
- id: mistport-opening-leads
  title: The First Step After Three Bells
  content:
    Begin with Su Yao's half-letter, the missing report page in the Sealed Archive and the
    newly exposed Echo Gallery. Do not reveal the whole conspiracy at the opening. These leads can
    be compared; the hidden hatch and a permit each have a price. Give every scene at least one
    specific lead to pursue, with Lin Yuanzhou, Meg, Grey Falcon or Frost pushing toward the next
    place for reasons of their own.
  keys:
    - triple strike
    - three strikes
    - three quick strikes
    - three bells
    - missing
    - letter
    - report
    - gallery
- id: mistport-tide-clock
  title: The Tide Clock
  content:
    The water is already retreating at the opening; begin at falling tide. Tides, bells and the
    decree determine where the player can go, so make the current tide clear when offering choices.
    The triple warning of a deep ebb is rare and dangerous as well as promising; the flood bell
    usually leaves about half an hour. Securing evidence still by the water takes an action. Do not
    assume it was saved merely because the player withdrew.
  keys:
    - rising tide
    - flood
    - high tide
    - falling tide
    - ebb
    - low tide
    - clocktower
    - clock tower
    - bell
    - decree
    - route
- id: mistport-ruin-whisper
  title: Whispers of the Ruins
  content:
    A relic's effects are unpredictable. It may bring money, knowledge or contamination.
    Account for its appraisal status, its holder's safety and the likely responses of the black
    market, Congregation and Council. Using an unappraised relic must carry real risk.
  keys:
    - relic
    - appraisal
    - appraise
    - appraised
    - appraising
    - black market
    - Congregation
    - risk
    - risky
- id: mistport-fog-rot
  title: Tide-Force and Fog-Rot
  content:
    Guiding Tide-Force or using active relics exacts a price in fog-rot, bodily changes or
    mental harm. Show where that cost falls as the player goes deeper into the Undertow. Fog-rot is
    irreversible; rest can restore vitality and ease stress.
  keys:
    - Tide-Force
    - Tide Force
    - fog-rot
    - fog rot
    - price
    - cost
    - mutation
    - mutate
    - Tidewielder
    - Tide wielder
- id: mistport-faction-pressure
  title: The Four-Way Struggle
  content:
    The Council, Guild, Salt Fangs and Congregation respond to relic dealings and Undertow
    activity. State the terms of taking sides. Pleasing one often offends another, and claiming
    neutrality leaves traces too. Only the Council records permits and warrants; each of the other
    factions keeps its own favors.
  keys:
    - Council
    - Guild
    - Salt Fang
    - Congregation
    - cult
    - side
    - allegiance
- id: mistport-deep-truth
  title: The Thing in the Deep
  content:
    The Riftide, thickening fog, Qi's disappearance and the Key fragments point to something
    waking in the deepest Undertow. Unfold this through clues and strange signs in the early and
    middle story, without revealing the answer ahead of time. Nearer the truth, the atmosphere grows
    more oppressive and actions cost more.
  keys:
    - Riftide
    - deep
    - Key
    - cycle
    - truth
- id: mistport-consequence-ledger
  title: Choices Leave Marks
  content:
    Carry the cost of an action into later scenes. Tide time, location, vitality, stress,
    fog-rot and trust change as usual. The Case Board keeps sources, contradictions, preservation
    and assessments; Faction Standing keeps attitudes and favors, alongside the Deep Ebb and
    fragment records. Show who witnessed each change, how evidence was obtained or damaged, and
    which tide signal appeared. Later scenes must respect those results. Advance quests only when
    their objectives have actually been met; revealing a hidden event does not by itself complete an
    inquiry.
  keys:
    - trust
    - stress
    - permit
    - warrant
    - corroborated
    - contaminated
