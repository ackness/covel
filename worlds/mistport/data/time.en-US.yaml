# en-US text for time.yaml. Only translated text; structure and ids come from time.yaml.
definition:
  name: Mistport tide time
  cycleLabel: Tide cycle
  phases:
    - Rising tide
    - High tide
    - Falling tide
    - Low tide
  evolution:
    prompt:
      Keep time in tide phases; do not convert to clock hours. A run of short
      exchanges can stay in the current phase; waiting for the tide or exploring
      across districts should move it forward. A deep withdrawal is a story
      event, not a regular phase.
