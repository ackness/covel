# en-US text for time.yaml. Only translated text; structure and ids come from time.yaml.
definition:
  name: Mistport tide time
  cycleLabel: Tide cycle
  phases:
    - Rising tide
    - High tide
    - Falling tide
    - Low tide
  evolution:
    prompt:
      Count tide phases, not clock hours. Begin at falling tide, with the water
      already retreating. Short exchanges can stay in the same phase; waiting
      for the tide or crossing districts advances it. A deep ebb is a rare story
      event outside the regular cycle.
