- id: find-guildmaster-qi
  name: Where Did Qi Go?
  description: Qi walked into the Undertow at flood tide, leaving Su Yao with half a letter. Find his way down before following the letter's mention of a Key. Every conclusion needs evidence you can check again.
  giver: Su Yao
  reward: Qi's route and evidence of where he went
  objectives:
    - id: examine-half-letter
      text: Examine the half-letter with Su Yao and record its words and the origin of the black tide-salt
    - id: compare-independent-sources
      text: Check Qi's route and the tide at his departure against independent testimony or tide-sigil records
    - id: secure-route-evidence
      text: Secure the evidence of Qi's route, then decide whether to go deeper or withdraw
- id: missing-archive-page
  name: The Missing Page of Report 74
  description: A page is missing from Appraisal Report 74 and another from that day's visitor ledger, but the lock was never forced. Who took the hinged-tooth grey fragment listed in the catalog? Check the records and who handled it before naming a thief.
  reward: The fragment's whereabouts and the people who handled the missing pages
  objectives:
    - id: inspect-archive-records
      text: Check the catalog for Appraisal Report 74 and the gap in the visitor ledger
    - id: trace-fragment-custody
      text: Find independently verifiable testimony or records of where the fragment went, and secure them
- id: echo-gallery-traces
  name: Three Times in the Echo Gallery
  description: A tide-sigil, rope marks and a nursery-rhyme copper plate share a corridor, but their timings disagree. Before the flood returns, work out which traces are worth preserving and which conclusions are still guesses.
  reward: Records that can be compared, and a usable way back
  deadline:
    label: Before the deep-ebb flood overwhelms the gallery
    missed: Surge water floods the Echo Gallery; any uncopied tide-sigils and fresh rope marks wash away before you can match their timings.
  objectives:
    - id: compare-tide-lines
      text: Compare the Gallery's tide lines, Qi's tide-sigil, the private unit's rope marks and the nursery-rhyme plate
    - id: preserve-gallery-record
      text: Secure a record of the Gallery's traces before the flood, including the contradictions still unexplained
- id: survivor-first-words
  name: The Survivor's First Words
  description: Stilltide Asylum holds the only person who came back from the deep-dive team three years ago. He keeps saying, "It woke up down there," but the earliest ward record says something else. Separate that record from hearsay before hearing him yourself.
  reward: Testimony you can check and a record of the differences still unexplained
  objectives:
    - id: read-first-record
      text: Read the survivor's earliest ward record and check how the account changed
    - id: hear-survivor
      text: Hear the survivor firsthand, compare his account with the record and preserve a copy that can be checked
