- id: frost-hears-it
  title: The Fog Is Speaking
  payload: Frost slips away from the Congregation and finds you while the ruins are exposed. She leads you down steps beside the Echo Gallery that only a deep ebb uncovers. The fog, she says, pauses between words just as Qi does. She shows the tide-sigil on her wrist and asks if you can hear it too. She does not understand it herself and fears the Congregation will use her as proof. Play this private encounter without explaining the Mist Lord or confirming Qi's whereabouts.
- id: meg-shows-the-fragment
  title: Meg's Fragment
  payload: Iron Meg meets you in a hidden Salt Fangs storehouse and produces the hinged-tooth grey fragment described on the missing page of Report 74. She admits sending her people to take it from the Sealed Archive because Chen Yuanshan's people were already looking for it. She will not say what the Key opens. She asks whether you stand with her or the Council. State her terms and leave the decision to the player.
- id: meg-calls-the-debt
  title: The Salt Fangs Collect
  payload: "Meg gave you a choice; you did not side with the Salt Fangs. Two enforcers stop you at the mouth of a wet alley and politely ask the price of her information: news from the Council, or one lead from your Case Board. Meg stays away. Let the player pay, stall or turn on them without opening with a fight to the death."
- id: gallery-washed-clean
  title: The Wall Wiped Clean
  payload: The Gallery's traces can no longer be checked as they were. If water damaged them, show the salt lines worn away; if someone tampered with them, use the cause recorded on the Case Board. An Undertow local who passed through offers to describe where the marks were, but cannot be sure of the timing. Give the player a new witness to question. Make clear this is a memory; it cannot restore the old corroboration or undo the contamination by itself.
- id: survivor-retracts
  title: A Retraction at the Ward Door
  payload: Just as independent evidence supports the survivor's account, a Council guard appears at the ward door. Under pressure, the survivor denies what he said and avoids your eyes. Retract only testimony the player has already heard; invent no earlier interview. Make clear which statement he withdraws and who is present so the sources can be reassessed afterwards. Let the player preserve the record, press him or leave for now. Do not reveal the truth beneath the Undertow.
- id: fragment-changes-hands
  title: The Fragment Changes Hands
  payload: After the hinged-tooth fragment is seized, someone spots its carrier passing through Mid-Harbor. Keep the new holder already established in the fragment record; do not substitute another mastermind. The witness recognizes the parcel and its direction but did not see a handover. Offer a route to pursue, making clear that pursuit will delay withdrawal or other inquiries. Do not recover the fragment for the player.
- id: secured-record-survives
  title: What the Water Leaves You
  payload: As the sudden flood swallows the Echo Gallery, show that the record you secured can still be found. Use the storage place and custodian established by the earlier action. If it was later forged or leaked, do not portray it as intact. Contrast one detail in the record with the traces vanishing underwater. Leave material for the next comparison; saving evidence does not solve the case.
- id: letter-ready-to-compare
  title: Salt on the Paper
  payload: Su Yao examines the secured half-letter with you again. She points out that the black tide-salt does not fit the tide at Qi's departure and suggests comparing its marks with the Echo Gallery's tide lines. If the letter has been damaged or leaked, respect its current condition on the Case Board; restore no lost words. Offer this practical way to check the discrepancy without deciding when the salt reached the paper or identifying the letter's unnamed man.
- id: bone-arch-standoff
  title: Standoff at the Bone Arch
  payload: Beyond the ninetieth Drawdown Step at the Bone Arch, three sets of lights meet in the cold mist. Grey Falcon's private unit holds the stair mouth, Iron Meg and her Salt Fangs watch from behind the side pillars, and Frost refuses to step back from the half-submerged stone threshold, where fresh tide-sigils in the shallow water show a gloved elder passed through not long ago. Each side wants the Key or first step through the arch while the returning tide already echoes along the gallery behind you. Build this standoff strictly from the fragment holders and faction standing already established, leaving the player free to pick a side, yield a fragment, step through, or pull back—without declaring Qi alive or dead.
