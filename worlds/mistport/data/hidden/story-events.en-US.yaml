- id: frost-hears-it
  title: The Fog Is Speaking
  payload: While the ruins lie fully exposed, Frost finds the player character, slips away from the rest of the Congregation, and leads them down a flight of stone steps beside the Echo Gallery that only a deep withdrawal uncovers. She says the fog is whispering with the same pauses Qi used when he talked. She shows the player character a tide-mark on her wrist like their own and asks whether they can hear it too. She doesn't know what this means, and she is afraid the Congregation will hold her up as proof. Play only this meeting and her fear; do not explain the truth about the Mist Lord, and do not confirm where Qi is.
- id: meg-shows-the-fragment
  title: Meg's Fragment
  payload: Iron Meg arranges to meet the player character privately in a hidden Salt Fangs storehouse and takes out a hinged-tooth grey fragment — the very piece described on the missing page of Appraisal Report 74. She admits she had her people take it out of the Guild's Sealed Archive, because Chen Yuanshan's people were looking for it before she was. She won't say what the Key opens; she only demands that the player character choose between her and the Council. Play out this showdown and her terms; do not make the decision for the player character.
- id: meg-calls-the-debt
  title: The Salt Fangs Collect
  payload: 'Iron Meg gave the player character a choice, and they did not side with the Salt Fangs. Now her people have come to collect. Two Salt Fangs enforcers stop the player character at the mouth of a damp alley and politely ask for the "price" of what Meg told them at the showdown: either a piece of Council news, or one lead from the Case Board handed over to the Salt Fangs. Meg does not show herself. Play this negotiation, with its threat underneath, and let the player decide whether to pay, stall or turn on them; do not let it spiral into a fight to the death on the spot.'
