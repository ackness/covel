  schema:
    properties:
      classes:
        items:
          properties:
            name:
              title: Name
            rank:
              title: Rank
            description:
              title: Description
        title: Classes
      notes:
        title: Notes
  initialValue:
    classes:
      - name: Councilors & Merchants
        description: Upper City elite controlling politics and legal trade
      - name: Mid-Harbor Citizens
        description: Dockworkers, artisans, innkeepers — the city's backbone
      - name: Undertow Dwellers
        description: Scavengers and smugglers at the city's edge — and the
          Congregation's main flock
    notes:
      Tide-Reader Guild members hold cross-tier passage regardless of class;
      the fog-rotted are shunned by all tiers and drift toward the Congregation.
tone:
  name: Tone
  schema:
    properties:
      genres:
        title: Genres
      contentRating:
        title: Rating
      narrativeStyle:
        title: Narrative style
      themes:
        title: Themes
  initialValue:
    narrativeStyle: Gothic suspense shrouded in fog — slow on the surface, with
      dangerous undercurrents, truth peeled back layer by layer and the cost
      mounting bit by bit.
    themes:
      - class divide
      - the unknown
      - order vs. freedom
      - faith and alienation
      - the price of truth
      - the boundary of the body
mechanics:
  name: Mechanics
  schema:
    properties:
      combatStyle:
        title: Combat
      skillSystem:
        title: Checks
      difficulty:
        title: Difficulty
      customRules:
        title: House rules
  initialValue:
    skillSystem:
      "Skill trees by vocation: Tide-Reading (appraise/channel relics),
      Stealth (fog navigation), Diplomacy (social), Combat."
    customRules:
      - Fog actions require sound/light checks — failure attracts fog beasts
      - Relics must be appraised before use, or trigger a random-effect table
      - The tidal cycle determines the explorable range; a flood warning forces
        retreat
      - Channeling Tide-Force or using active relics accrues fog-rot; past a
        threshold the body changes irreversibly
      - The four powers (Council/Guild/Salt Fangs/Congregation) each react to
        the player's relic and Undertow actions, standings shifting against one
        another
      - Clues evolve through unverified, corroborated, contaminated, and
        resolved states; the tide may remove evidence, but never proves anyone's
        interpretation by itself
      - "Any costly action should visibly update at least one state: tide-time,
        location, condition/fog-rot, character attitude, faction pressure, or
        clue confidence"
startingConditions:
  name: Opening
  schema:
    properties:
      openingScenario:
        title: Opening scene
      openingHook:
        title: Hook
      openingChips:
        title: Opening moves
      playerConstraints:
        title: Constraints
      startingLocation:
        title: Starting point
      startingResources:
        title: Starting resources
  initialValue:
    openingScenario: "Dusk on Mid-Harbor's main pier. The tide-bell rings a rare
      triple strike — a deep-withdrawal alert. Salt Fangs recruit explorers
      while Council officers post the Seal Tide Decree. Tide-Reader Su Yao
      pushes through the crowd: if you are a new apprentice, she recognizes your
      examination tide-mark; if you are an Undertow local, she carries Qi's note
      asking for someone who knows the hidden ways. Qi walked into the Undertow
      that morning — at high tide, when no one can."
    openingHook: The bell tolls thrice, Qi is gone — dive, or seal?
    openingChips:
      - Deep withdrawal
      - Seal Tide Decree
      - Qi's disappearance
      - A torn letter
    playerConstraints:
      - Start as a Tide-Reader apprentice or common Undertow dweller
      - No open flames permitted in the fog
      - Entering the Undertow unlicensed violates the Seal Tide Decree and draws
        Council reprisal
    startingLocation: Mid-Harbor — Main Pier
