# en-US text for dimensions.yaml. Only translated text; structure and ids come from dimensions.yaml.
caseBoard:
  name: Case Board
  description:
    The leads in Guildmaster Qi's disappearance, and how far each can be
    trusted. A lead can be corroborated — or contaminated by the tide, a
    forgery or a leak.
  schema:
    additionalProperties:
      properties:
        lead:
          title: Lead
        status:
          title: Status
          x-enumLabels:
            unverified: Unverified
            corroborated: Corroborated
            contaminated: Contaminated
            resolved: Resolved
        note:
          title: Current read
  initialValue:
    torn-letter:
      lead: The torn letter
      note:
        Su Yao has it — “The Key must not fall into his hands.” Its edge carries
        black tide-salt, which crystallizes only in ruins the ebb uncovers, yet
        Qi left at high tide.
    report-74:
      lead: Appraisal Report 74
      note:
        A page is missing in the Guild's Sealed Archive; the catalog still says
        “hinged-tooth grey fragment.” A page was also removed cleanly from that
        day's visitor ledger.
    echo-gallery:
      lead: Three traces in the Echo Gallery
      note:
        Qi's tide-sigil, new rope from Grey Falcon's private unit, a copper plate
        engraved with a nursery rhyme — and their timings contradict one
        another.
    stilltide-survivor:
      lead: The Stilltide survivor
      note:
        The only one to come back from the deep-dive team three years ago, held
        in isolation by the Council. “It woke up down there” is not what he
        first said.
  updateRule:
    Record only changes the narrative makes explicit this turn. When a new
    named piece of evidence, testimony or contradiction turns up, add an entry
    (short English kebab-case ID) with status unverified. Set corroborated when
    independent testimony or a tide-sigil record backs it up; contaminated when
    the flood washes it over, it is forged, or it leaks publicly; resolved when
    the truth is confirmed and no longer disputed. The tide carrying evidence
    away does not prove anyone's explanation. Never delete an entry; keep note
    to one sentence, the current read.
deepWithdrawal:
  name: Deep Ebb
  description:
    A rare deep ebb lays the Undertow completely bare — and leaves very
    little time to get out.
  schema:
    properties:
      stage:
        title: Stage
        x-enumLabels:
          triple-warning: Triple warning
          step-ninety: Past step ninety
          full-exposure: Ruins fully exposed
          return-bell: Flood bell
          flood: Sudden flood
          receded: Tide back in
      note:
        title: Tide report
  initialValue:
    note: The tide bell has struck three times. The deep ebb has come early,
      and no one can say why.
  updateRule:
    Advance only on tide signals the narrative states outright, in this order —
    triple-warning → step-ninety (the sea has fallen past the ninetieth
    Drawdown Step) → full-exposure (the ruins lie fully exposed) → return-bell
    (the flood bell; usually about half an hour remains) → flood (the sudden
    flood) → receded (this deep ebb is over). Never skip a stage or go
    back. After receded, return to triple-warning only if the narrative clearly
    sounds a new triple warning. Ordinary tides belong to world time and are
    not recorded here.
factionStanding:
  name: Faction Standing
  description:
    How the Council, the Tide-Reader Guild, the Salt Fangs and the Congregation
    of the Mist see you. No one stays neutral without leaving a trace.
  schema:
    properties:
      council:
        title: Council
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                permit: Permit
                owes-you: Owes you
                you-owe: You owe
                warrant: Warrant
      guild:
        title: Tide-Reader Guild
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                permit: Permit
                owes-you: Owes you
                you-owe: You owe
                warrant: Warrant
      saltFangs:
        title: Salt Fangs
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                permit: Permit
                owes-you: Owes you
                you-owe: You owe
                warrant: Warrant
      congregation:
        title: Congregation of the Mist
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                permit: Permit
                owes-you: Owes you
                you-owe: You owe
                warrant: Warrant
  updateRule:
    attitude runs from -3 (hostile) to 3 (relies on you) and starts neutral.
    Shift it by 1 when the player clearly helps, betrays, trades with or openly
    defies a faction; by 2 at most for a major event. The Council and the Salt
    Fangs are in a cold war — when the player wins favor with one and the other
    finds out, the other drops by 1. Add the matching mark (no duplicates) when
    the player gets a permit, is owed a favor, owes one, or is made wanted;
    remove it once repaid, revoked or lifted. Settle only events the narrative
    makes explicit this turn.
keyFragments:
  name: Key Fragments
  description:
    Pieces of the “Key” that Iron Meg, Chen Yuanshan and Grey Falcon are all
    looking for. What it opens, no one will say.
  schema:
    additionalProperties:
      properties:
        fragment:
          title: Fragment
        holder:
          title: Held by
        status:
          title: Status
          x-enumLabels:
            rumored: Rumored
            located: Located
            held-by-you: Yours
            taken: Taken
            lost: Lost
  initialValue:
    meg-collection:
      fragment: The relic fragments Iron Meg collects in secret
      holder: Iron Meg (Salt Fangs)
    archive-fragment:
      fragment: Hinged-tooth grey fragment
      holder: Unknown — the page of the report was taken
  updateRule:
    Record only Key fragments that appear explicitly in the narrative; give a
    new one a short English kebab-case ID. Set located when its whereabouts are
    found, held-by-you when it is in the player's hands, taken (and update
    holder) when someone else seizes it, lost when every trail to it has gone
    cold. Never invent fragments, and never reveal what the Key opens.
geography:
  name: Geography
  schema:
    properties:
      overview:
        title: Overview
      regions:
        items:
          properties:
            name:
              title: Name
            description:
              title: Description
            climate:
              title: Climate
            landmarks:
              items:
                properties:
                  name:
                    title: Name
                  description:
                    title: Description
              title: Landmarks
        title: Regions
  initialValue:
    overview:
      A harbor city between cliff and sea, buried in a pale grey fog that never
      lifts; no one can see more than fifty paces. The city is stacked in three
      tiers — the Upper City, Mid-Harbor and the Undertow.
    regions:
      - name: Upper City
        description:
          Seat of the Council and the merchant houses, on top of the cliff.
          Built mostly of stone, it is the center of the legal relic trade.
        climate: Thin fog; now and then a little daylight
        landmarks:
          - name: Council Hall
            description:
              The seat of the Council's power. An ancient tide-stone lamp that needs no flame is set
              in its dome.
          - name: Tide-Reader Guild Tower
            description:
              The scholarly center for appraising ancient relics, and Mistport's
              only library and archive.
          - name: Sealed Archive
            description:
              A restricted records room beneath the Guild Tower. On the day Qi
              disappeared, a page went missing from Appraisal Report 74 and
              another from the visitor ledger, yet the lock was never forced.
          - name: Stilltide Asylum
            description:
              Officially it cares for patients with severe fog-rot; in fact the
              Council keeps it under close guard. The only survivor of the
              deep-dive team three years ago is locked in a ward on its lowest
              floor.
      - name: Mid-Harbor
        description:
          Docks, workshops and inns crowded together — the city's economic
          heart, and the stage where the factions clash in the open and in
          secret.
        climate: Thick fog that never leaves; damp and muggy
        landmarks:
          - name: Main Pier
            description:
              Mistport's only large berth. Ferries and cargo ships tie up here,
              and newcomers take their first step into Mistport.
          - name: Clocktower
            description:
              A mechanical clock driven by the tides that strikes once every six
              hours; three quick strikes mean a deep ebb warning.
          - name: The Salt Market
            description:
              A semi-public market in Mid-Harbor's back alleys where the Salt
              Fangs sell goods and recruit. Only those carrying Salt Chips are
              told the real prices.
          - name: The Soundless Inn
            description:
              A low-ceilinged inn where explorers lodge, its walls packed with
              sound-deadening fog fungus. The keeper never asks where you came
              from, but when a guest doesn't come back, their fog-lamp goes up
              on the beam over the door.
          - name: Tide-Seal Gate
            description:
              The checkpoint on the way from Mid-Harbor down to the Drawdown
              Steps. Grey Falcon checks permits here and confiscates open flames
              and unregistered relics. The hidden hatch in the pier gets you
              around it, at the price of a favor owed to the Salt Fangs.
      - name: The Undertow
        description:
          The ancient ruins the ebb uncovers. The ground changes with every
          ebb, so no map holds; no one has ever reached its deepest part.
        climate: Cold and clammy, thick with salt mist and the smell of corrosion
        landmarks:
          - name: Bone Arch
            description:
              A huge, half-drowned arch of unknown origin. It was uncovered in the
              deep ebb six years ago, which cost seventeen lives.
          - name: The Sunken Bell Hall
            description:
              A half-sunken building that surfaces only at ebb. The Congregation
              of the Mist holds its services here, believing this is the place
              closest to the Mist Lord.
          - name: The Hidden Grotto
            description:
              A network of caves that even the flood tide never reaches — the Salt
              Fangs' base, where Iron Meg keeps the relic fragments she has
              gathered.
          - name: Drawdown Steps
            description:
              A long stair below the Tide-Seal Gate leading down to the ruins,
              each step cut with evacuation marks. It only counts as a deep
              ebb once the sea has fallen past the ninetieth step; after
              the flood bell, the safe window is down to about half an hour.
          - name: Echo Gallery
            description: A ring-shaped corridor, the first thing this deep ebb
              uncovered. Its stone walls repeat footsteps and whispers after a
              delay. Qi's tide-sigil, fresh rope marks from Grey Falcon's private
              unit and a strange copper plate engraved with a nursery rhyme have
              all turned up here together.
factions:
  name: Factions
  schema:
    items:
      properties:
        name:
          title: Name
        description:
          title: Description
        type:
          title: Type
        influence:
          title: Influence
        leader:
          title: Leader
        headquarters:
          title: Headquarters
        relations:
          items:
            properties:
              targetId:
                title: Target
              type:
                title: Type
              description:
                title: Description
          title: Relations
  initialValue:
    - id: council
      name: Mistport Council
      description:
        The political power that rules the Upper City. It is trying to restrict
        civilian access to the Undertow through the Tide-Seal Decree and to
        monopolize the legal relic trade; inside, it is split between doves and
        hawks.
      leader: Council Chair Chen Yuanshan
      headquarters: Upper City — Council Hall
      relations:
        - description: Sees the Salt Fangs as outlaws; a long cold war
        - description: Funds the Guild, and uses the money to sway it
        - description:
            Brands the Congregation a cult and watches its rapid spread through
            the lower city with alarm
    - id: tide-readers
      name: Tide-Reader Guild
      description:
        The only scholarly body qualified to appraise ancient relics and study
        the patterns of the Riftide. Its leadership deliberately suppresses
        certain appraisal reports, and its young Tide-Readers grow more uneasy
        by the day.
      leader: Guildmaster Qi
      headquarters: Upper City — Guild Tower
      relations:
        - description:
            Depends on Council money and appraises relics, while keeping its
            independence in name
        - description: Openly hostile to smuggling
    - id: salt-fangs
      name: Salt Fangs
      description:
        A smuggling gang that controls the relic black market in the Undertow,
        deeply rooted in the lower city. Its second-in-command, Iron Meg, keeps
        her word and is quietly gathering relic fragments.
      leader: Iron Meg, second-in-command
      headquarters: The Undertow — Hidden Grotto
      relations:
        - description: Has long fought the Council's lockdown
        - description:
            Doesn't believe the doctrine, but lets the faithful pass through the
            Undertow and now and then trades information with them
    - id: fog-church
      name: Congregation of the Mist
      description:
        A new sect that worships the Mist Lord. It holds that the fog is a
        conscious being and the ruins are its body, and preaches that fog-rot is
        ascension; its following is surging in the lower city.
      leader: Mist-Speaker Frost
      headquarters: The Undertow — Sunken Bell Hall
      relations:
        - description:
            Branded a cult by the Council, yet it keeps growing, shielded by its
            followers in the lower city
        - description:
            Explains Tide-Force and fog-rot through faith, in open conflict with
            the Guild's “scientific” position
powerSystem:
  name: Power System
  schema:
    properties:
      name:
        title: Name
      type:
        title: Type
      description:
        title: Description
      rules:
        title: Rules
      tiers:
        items:
          properties:
            name:
              title: Name
            rank:
              title: Rank
            description:
              title: Description
        title: Tiers
  initialValue:
    name: Tide-Force
    description:
      An unpredictable energy held in ancient relics. It resonates with the
      tidal cycle and is strongest at ebb. Tide-Readers guide and steady it with
      tide-sigils; overuse brings on fog-rot.
    rules:
      - Relic effects change with the phase of the tide — strongest at high
        tide, most stable at ebb
      - Using an unappraised relic can backfire — at best it disables you, at
        worst it kills
      - Fog beasts are drawn to fluctuations in Tide-Force; using relics on a
        large scale brings whole packs of them
      - Tide-Readers guide the energy with the tide-sigil technique, which takes
        long training — yet the official position denies Tide-Force exists
      - Overusing Tide-Force brings on fog-rot — the body slowly turns
        translucent and finally dissolves into the fog, and it cannot be
        reversed
      - A very few people can sense Tide-Force without any relic — a gift the
        Guild treats as dangerous and the Congregation hails as a miracle
      - "Fog-rot is tracked from 0 to 100 and never goes down: visible changes
        begin at 25, lasting impairment at 50, and at 75 and above the body may
        dissolve into the fog at any moment"
    tiers:
      - name: Apprentice
        description: Can tell whether a relic is active
      - name: Tide-Reader
        description: Can appraise and steady ordinary relics
      - name: Tidewielder
        description:
          Can actively guide Tide-Force — extremely rare, and most already show
          fog-rot
history:
  name: History
  schema:
    items:
      properties:
        era:
          title: Era
        name:
          title: Name
        description:
          title: Description
        significance:
          title: Significance
        year:
          title: Year
  initialValue:
    - era: Ancient
      name: The Builders' Era
      description:
        The civilization that built the ruins of the Undertow. No written records
        survive, only the remains of its buildings; its inscriptions are ten
        thousand years older than Mistport.
    - era: Founding
      year: About 300 years ago
      name: Founding of Mistport
      description:
        Drifters built walkways along the cliffs, settled, and found that the
        relics the ebb uncovered could be sold.
    - era: Modern
      year: Six years ago
      name: The Bone Arch Ebb
      description:
        The last deep ebb uncovered the Bone Arch. Expeditions poured in,
        and seventeen people died in the returning flood. People still avoid
        speaking of it.
    - era: Modern
      year: Three years ago
      name: The Vanished Expedition
      description:
        A Council expedition went deep into the Undertow and was lost. The only
        survivor went mad and keeps repeating, “It woke up down there.”
    - era: Recent years
      name: Rise of the Congregation
      description:
        As fog-rot cases soared, the Congregation of the Mist drew in the poor
        of the lower city with its doctrine of ascension, and the prophecies of
        Mist-Speaker Frost kept coming true.
    - era: Modern
      year: Last year
      name: The Tide-Seal Decree Is Drafted
      description:
        Council Chair Chen proposed the Tide-Seal Decree to bar anyone without a
        permit from the Undertow, and the lower city rose in fierce opposition.
    - era: Now
      name: The Thickening Fog
      description:
        The most sensitive Tide-Readers can tell the fog is getting thicker
        month by month and the ebbs are coming further apart; Qi's notes call it
        “the tipping point of the cycle.”
economy:
  name: Economy
  schema:
    properties:
      currencies:
        items:
          properties:
            name:
              title: Name
            symbol:
              title: Symbol
            description:
              title: Description
        title: Currencies
      resources:
        title: Resources
      tradeNotes:
        title: Trade
  initialValue:
    currencies:
      - name: Tide Coin
        description: The standard currency, issued by the Council
      - name: Salt Chip
        description: An untraceable token the Salt Fangs use on the black market
    resources:
      - Ancient relics
      - Relic fragments
      - Tide salt
      - Fog fungus (edible)
      - Cliff iron
    tradeNotes:
      The relic trade is the core of Mistport's economy. Legal relics are
      appraised by the Tide-Reader Guild and then auctioned; the black market
      runs through the Salt Fangs. Relic fragments fetch absurd prices on the
      black market, because someone is buying them up at a premium.
socialStructure:
  name: Society
  schema:
    properties:
      classes:
        items:
          properties:
            name:
              title: Name
            rank:
              title: Rank
            description:
              title: Description
        title: Classes
      notes:
        title: Notes
  initialValue:
    classes:
      - name: Councilors & Merchants
        description:
          The Upper City elite, who hold political power and the right to trade
          legally
      - name: Mid-Harbor Citizens
        description:
          Dockworkers, craftsmen and innkeepers — the people who keep the city
          running
      - name: Undertow Locals
        description:
          People on the edge of the Undertow who get by on scavenging and
          smuggling; also the Congregation's main following
    notes: Members of the Tide-Reader Guild can move between tiers regardless of
      class, thanks to their skills. People with fog-rot are shunned by every
      class and drift, one by one, to the Congregation.
tone:
  name: Tone
  schema:
    properties:
      genres:
        title: Genres
      contentRating:
        title: Rating
      narrativeStyle:
        title: Narrative style
      themes:
        title: Themes
  initialValue:
    narrativeStyle:
      Gothic mystery wrapped in fog — an unhurried pace with dangerous currents
      underneath; the truth is uncovered layer by layer, and the cost mounts bit
      by bit.
    themes:
      - class conflict
      - exploring the unknown
      - order versus freedom
      - faith and alienation
      - the price of truth
      - where the body ends
mechanics:
  name: Mechanics
  schema:
    properties:
      combatStyle:
        title: Combat
      skillSystem:
        title: Checks
      difficulty:
        title: Difficulty
      customRules:
        title: House rules
  initialValue:
    skillSystem:
      "Built on vocational skill trees: Tide-Reading (appraising and guiding
      relics), Stealth (moving through fog), Diplomacy (social), Combat."
    customRules:
      - Actions in fog require noise/light checks; a failure draws fog beasts
      - Relics must be appraised before use; otherwise roll on the random-effect
        table
      - The tide cycle limits how much of the Undertow can be explored; when the
        flood warning sounds, you must retreat
      - Guiding Tide-Force or using an active relic builds up fog-rot; past a
        threshold, the body changes for good
      - The four factions (Council / Guild / Salt Fangs / Congregation) each
        react to the player's relic dealings and Undertow activity; when one
        gains standing, another loses it
      - Leads move through unverified / corroborated / contaminated / resolved;
        the tide may carry evidence away, but that never proves anyone's
        explanation on its own
      - "A costly action should update at least one visible state: tide time,
        location, injury or fog-rot, a character's attitude, faction pressure,
        or confidence in a lead"
startingConditions:
  name: Opening
  schema:
    properties:
      openingScenario:
        title: Opening scene
      openingHook:
        title: Hook
      openingChips:
        title: Opening moves
      playerConstraints:
        title: Constraints
      startingLocation:
        title: Starting point
      startingResources:
        title: Starting resources
  initialValue:
    openingScenario:
      "Dusk. You have just arrived on the main pier in Mid-Harbor. The tide
      clock sounds three quick strikes — the rare deep ebb warning. On the docks
      the Salt Fangs are recruiting explorers and the Council is posting the
      Tide-Seal Decree. Tide-Reader Su Yao pushes through the crowd. If you are
      a new apprentice, she knows the tide-sigil from your exam; if you are an
      Undertow local, she carries a note in which Qi asked for someone who knows
      the way. She tells you Guildmaster Qi walked into the Undertow this
      morning — at flood tide."
    openingHook: Three bells, a missing Guildmaster — go down, or seal the harbor?
    openingChips:
      - Deep ebb
      - Tide-Seal Decree
      - Qi's disappearance
      - A torn letter
    playerConstraints:
      - You start as a Tide-Reader apprentice or an ordinary Undertow local
      - You may not carry an open flame into the fog
      - Entering the Undertow without a permit breaks the Tide-Seal Decree, and
        the Council will hold you to account
    startingLocation: Mid-Harbor — Main Pier
