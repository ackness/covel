        title: Trade
  initialValue:
    currencies:
      - name: Tide Coin
        description: Standard currency issued by the Council
      - name: Salt Chip
        description: Untraceable token used in the Salt Fangs black market
    resources:
      - Ancient relics
      - Relic fragments
      - Tide salt
      - Fog fungus (edible)
      - Cliff iron
    tradeNotes: The relic trade is Mistport's backbone. Legal relics go through
      Guild appraisal and auction; the black market runs through the Salt Fangs
      — and relic fragments fetch strange prices, because someone is buying them
      up.
