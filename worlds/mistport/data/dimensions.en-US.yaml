caseBoard:
  name: Case Board
  description: Leads, sources and unanswered questions in Qi's disappearance. Every claim needs a source; tides, forgery and leaks can spoil the evidence.
  schema:
    additionalProperties:
      properties:
        lead:
          title: Lead
        status:
          title: Status
          x-enumLabels:
            unverified: Unverified
            corroborated: Corroborated
            contaminated: Contaminated
            resolved: Resolved
        note:
          title: Current assessment
        sources:
          title: Sources
          items:
            properties:
              from:
                title: Origin
              kind:
                title: Kind
                x-enumLabels:
                  physical: Physical evidence
                  witness: Testimony
                  document: Document
                  tide-mark: Tide-sigil
              detail:
                title: What was found or heard
              retracted:
                title: Retracted
        contradictions:
          title: Contradictions
          items:
            properties:
              a:
                title: One account
              b:
                title: Other account
              why:
                title: Point of conflict
        secured:
          title: Secured
  initialValue:
    torn-letter:
      lead: The torn letter
      note: 'Su Yao holds half a letter: "The Key must not fall into his hands." Black tide-salt clings to its edge. It forms only in ruins exposed at ebb, yet Qi left at high tide.'
      contradictions:
        - a: The black tide-salt on the paper forms only in ruins exposed at ebb.
          b: Qi left at high tide.
          why: The salt does not fit the tide at his departure; when it reached the letter is still unknown.
    report-74:
      lead: Appraisal Report 74
      note: 'A page is missing from the report in the Sealed Archive. The catalog still reads "hinged-tooth grey fragment." A page was also removed cleanly from that day''s visitor ledger.'
    echo-gallery:
      lead: Three traces in the Echo Gallery
      note: Qi's tide-sigil, fresh rope marks from Grey Falcon's unit and a copper plate bearing a nursery rhyme were left at times that do not agree.
    stilltide-survivor:
      lead: The Stilltide survivor
      note: 'The Council has isolated the sole survivor of the deep-dive team lost three years ago. "It woke up down there" was not what he first said.'
  updateRule: >-
    Add sources only for evidence actually collected, testimony heard firsthand, documents read or tide-sigils examined in this turn's narrative. The starting leads are avenues of inquiry, not grounds for inventing sources.
    Name the person, place or document and record what was found or heard. Use physical for physical evidence, witness for testimony, document for written records and tide-mark for examined tide-sigils. Repeated statements by one witness, secondhand versions of the same account and copies of one document count as a single source. Different kinds of source are not necessarily independent.
    Record both accounts and the point of conflict when a contradiction appears; do not settle it for either side. When a witness explicitly recants, keep the original testimony and mark it retracted. Hearsay is not firsthand testimony.
    Assess status from the evidence. A lead needs at least two valid, independent sources to be corroborated; with fewer, it is unverified. Mark it contaminated after forgery, damage or a public leak, and state the reason in the current assessment.
    Mark a lead resolved only when the truth is established, its contradictions explained and the dispute settled. After a retraction, reassess the remaining sources instead of keeping unsupported corroboration.
    Securing evidence takes an action in the narrative: deposit the original or a copy in the Sealed Archive, carry it in waterproof protection, or have a named witness confirm it and leave a record that can be checked. Then mark it secured.
    During the deep ebb's sudden flood, contaminate only unsecured evidence still within reach of the water. Rumors, Upper City records and a witness's memory cannot be washed away. Secured evidence can still be spoiled by a later forgery or leak.
    Keep every lead, source and contradiction. Give new leads the same structure. Use one sentence for the current assessment, stating its basis and what remains to be checked. Lost evidence proves no one's explanation.
deepWithdrawal:
  name: Deep Ebb
  description: A rare deep ebb lays the Undertow bare. Once the flood bell sounds, there is usually about half an hour to get out.
  schema:
    properties:
      stage:
        title: Stage
        x-enumLabels:
          triple-warning: Triple warning
          step-ninety: Past step ninety
          full-exposure: Ruins fully exposed
          return-bell: Flood bell
          flood: Sudden flood
          receded: Tide back in
      note:
        title: Tide report
  initialValue:
    note: Three strikes of the tide bell. The deep ebb has come early, and no one knows why.
  updateRule: >-
    Advance only on explicit tide signals, using these stage values in order: triple-warning (the triple warning), step-ninety (water below the ninetieth Drawdown Step), full-exposure (fully exposed ruins), return-bell (the flood bell), flood (the sudden flood) and receded (the tide's return).
    return-bell usually leaves about half an hour. Never skip a stage or go backwards. After receded, return to triple-warning only when another triple warning sounds. World time records the ordinary tides.
factionStanding:
  name: Faction Standing
  description: How the Council, Guild, Salt Fangs and Congregation see you, and the favors owed on either side.
  schema:
    properties:
      council:
        title: Mistport Council
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                permit: Permit held
                owes-you: Owes you
                you-owe: You owe
                warrant: Wanted
      guild:
        title: Tide-Reader Guild
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                owes-you: Owes you
                you-owe: You owe
      saltFangs:
        title: Salt Fangs
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                owes-you: Owes you
                you-owe: You owe
      congregation:
        title: Congregation of the Mist
        properties:
          attitude:
            title: Attitude
          marks:
            title: Marks
            items:
              x-enumLabels:
                owes-you: Owes you
                you-owe: You owe
  updateRule: >-
    Attitude runs from -3 (hostile) to 3 (relies on you), starting at neutral. Shift it by 1 when the player clearly helps, betrays, trades with or openly defies a faction, or by at most 2 for a major event.
    The Council and Salt Fangs are in a cold war. If the player wins favor with one and the other learns of it, reduce the other's attitude by 1. Record each favor under the faction concerned, without duplicates, and remove it when repaid.
    Use permit for a permit and warrant for being wanted, only under the Council and only after an explicit issue, revocation or lifting in the story. Use owes-you when the faction owes the player and you-owe when the player owes it. The other three factions use only these two favor marks. Settle only what happened in this turn's narrative.
keyFragments:
  name: Key Fragments
  description: Iron Meg, Chen Yuanshan and Grey Falcon are all searching for pieces of the Key. None will say what it opens.
  schema:
    additionalProperties:
      properties:
        fragment:
          title: Fragment
        holder:
          title: Held by
        status:
          title: Status
          x-enumLabels:
            rumored: Rumored
            located: Located
            held-by-you: In your hands
            taken: Taken
            lost: Lost
  initialValue:
    meg-collection:
      fragment: The relic fragments Iron Meg collects in secret
      holder: Said to be with Iron Meg; one on her person, the rest in the Hidden Grotto. Not yet checked.
    archive-fragment:
      fragment: Hinged-tooth grey fragment
      holder: Unknown. The page of the appraisal report was removed.
  updateRule: >-
    Record only Key fragments mentioned in the narrative. Use rumored for an unconfirmed report, located when its whereabouts are established, held-by-you when the player acquires it, taken when someone seizes it, and lost only when the trail has gone cold. Update the holder after a seizure.
    Do not count the fragment Meg carries again as part of her stored collection. Until someone compares them, do not identify any of her pieces as the hinged-tooth fragment from the report. Never invent fragments or reveal the Key's purpose ahead of the story.
startingConditions:
  name: Opening
  schema:
    properties:
      openingScenario:
        title: Opening scene
      openingHook:
        title: Hook
      openingChips:
        title: Opening moves
      playerConstraints:
        title: Constraints
      startingLocation:
        title: Starting point
      startingResources:
        title: Starting resources
  initialValue:
    openingScenario: Dusk. You have just reached Mid-Harbor's Main Pier when the tide bell strikes three times, warning of a deep ebb. The Salt Fangs recruit explorers on the docks while the Council's people post the Tide-Seal Decree. Su Yao pushes through the crowd. If you are an apprentice, she recognizes your exam tide-sigil; if you are an Undertow local, she carries Qi's note asking for someone who knows the way. She tells you Qi entered the Undertow this morning, while the tide was rising. Now the water has begun to retreat.
    openingHook: Three bells. Qi is missing. Go down, or seal the harbor?
    openingChips:
      - Deep ebb
      - Tide-Seal Decree
      - Qi's disappearance
      - A torn letter
    playerConstraints:
      - Begin as a Tide-Reader apprentice or an ordinary Undertow local.
      - Do not carry an open flame into the fog.
      - Entering the Undertow without a permit breaks the Tide-Seal Decree; the Council will hold you to account.
    startingLocation: Mid-Harbor · Main Pier
