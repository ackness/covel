caseBoard:
  name: 案情板
  description: 齐老失踪案的线索与可信度。线索会被佐证，也会被潮水、伪造或走漏污染。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        lead:
          type: string
          title: 线索
          x-i18n: true
        status:
          type: string
          title: 状态
          enum: [unverified, corroborated, contaminated, resolved]
          x-enumLabels:
            unverified: 未核实
            corroborated: 已佐证
            contaminated: 已污染
            resolved: 已解决
        note:
          type: string
          title: 当前判断
          maxLength: 240
          x-i18n: true
      required: [lead, status]
      additionalProperties: false
  initialValue:
    torn-letter:
      lead: 半封信
      status: unverified
      note: 苏窈手中，写着“钥匙不能落到他手里”。纸边有只在退潮遗迹结晶的黑潮盐，可齐老是在满潮时离开的。
    report-74:
      lead: 第七十四号鉴定报告
      status: unverified
      note: 公会封档库缺了一页，目录仍写着“铰齿状灰色碎片”；同日访客簿也被无损取页。
    echo-gallery:
      lead: 回声廊的三种痕迹
      status: unverified
      note: 齐老的潮纹、灰隼私队的新绳索、刻着童谣的铜片——出现时间互相矛盾。
    stilltide-survivor:
      lead: 静潮病院的幸存者
      status: unverified
      note: 三年前深潜队唯一归来者，被议会隔离。“它在下面醒了”并不是他最初说的原句。
  updateRule:
    只记录本轮叙事明确发生的变化。发现新的具名物证、证词或矛盾时新增一条（ID 用简短英文 kebab-case），状态为
    unverified。有独立证词或潮纹记录印证时改为 corroborated；被涨潮冲刷、被伪造或公开走漏时改为
    contaminated；真相被确认且不再有争议时改为 resolved。潮水带走证据不等于证实任何一方的解释。不删除条目；note 只写一句当前判断。

deepWithdrawal:
  name: 深退潮
  description: 罕见的深退潮会让下潮区完全暴露——也只给人很短的撤离时间。
  schema:
    type: object
    properties:
      stage:
        type: string
        title: 阶段
        enum:
          [
            triple-warning,
            step-ninety,
            full-exposure,
            return-bell,
            flood,
            receded,
          ]
        x-enumLabels:
          triple-warning: 三连预警
          step-ninety: 退过第九十级
          full-exposure: 遗迹完全暴露
          return-bell: 返潮警铃
          flood: 急涨
          receded: 潮水复归
      note:
        type: string
        title: 潮讯
        maxLength: 240
        x-i18n: true
    required: [stage]
    additionalProperties: false
  initialValue:
    stage: triple-warning
    note: 潮钟三鸣。深退潮比往常提前，没人说得清为什么。
  updateRule:
    只按叙事中明确出现的潮讯推进，顺序为 triple-warning → step-ninety（海水退过褪水阶第九十级）→
    full-exposure（遗迹完全暴露）→ return-bell（返潮警铃，通常只剩约半小时）→ flood（急涨）→
    receded（本次深退潮结束）。不跳级、不倒退；receded 之后只有叙事明确出现新的三连预警才回到
    triple-warning。普通涨落潮由世界时间负责，不在此记录。

factionStanding:
  name: 四方立场
  description: 议会、验潮师公会、盐牙会与雾中教会怎么看你。没有不留痕迹的中立。
  schema:
    type: object
    properties:
      council:
        type: object
        title: 雾港议会
        properties:
          attitude:
            type: integer
            title: 态度
            minimum: -3
            maximum: 3
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [permit, owes-you, you-owe, warrant]
              x-enumLabels:
                permit: 持有许可
                owes-you: 欠你人情
                you-owe: 你欠人情
                warrant: 通缉
        required: [attitude, marks]
        additionalProperties: false
      guild:
        type: object
        title: 验潮师公会
        properties:
          attitude:
            type: integer
            title: 态度
            minimum: -3
            maximum: 3
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [permit, owes-you, you-owe, warrant]
              x-enumLabels:
                permit: 持有许可
                owes-you: 欠你人情
                you-owe: 你欠人情
                warrant: 通缉
        required: [attitude, marks]
        additionalProperties: false
      saltFangs:
        type: object
        title: 盐牙会
        properties:
          attitude:
            type: integer
            title: 态度
            minimum: -3
            maximum: 3
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [permit, owes-you, you-owe, warrant]
              x-enumLabels:
                permit: 持有许可
                owes-you: 欠你人情
                you-owe: 你欠人情
                warrant: 通缉
        required: [attitude, marks]
        additionalProperties: false
      congregation:
        type: object
        title: 雾中教会
        properties:
          attitude:
            type: integer
            title: 态度
            minimum: -3
            maximum: 3
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [permit, owes-you, you-owe, warrant]
              x-enumLabels:
                permit: 持有许可
                owes-you: 欠你人情
                you-owe: 你欠人情
                warrant: 通缉
        required: [attitude, marks]
        additionalProperties: false
    required: [council, guild, saltFangs, congregation]
    additionalProperties: false
  initialValue:
    council: { attitude: 0, marks: [] }
    guild: { attitude: 0, marks: [] }
    saltFangs: { attitude: 0, marks: [] }
    congregation: { attitude: 0, marks: [] }
  updateRule:
    attitude 从 -3（敌视）到 3（倚重），开局中立。玩家明确帮助、出卖、与之交易或公开违抗某方时调整 1，重大事件最多
    2。议会与盐牙会处于冷战：讨好一方且被另一方得知时，另一方 -1。获得许可证、被欠或欠下人情、遭到通缉时加入对应
    marks（不重复），偿还、撤销或解除后移除。只按本轮叙事明确发生的事件结算。

keyFragments:
  name: 钥匙碎片
  description: 铁姑、陈远山和灰隼都在找的“钥匙”零件。它能打开什么，没人肯说。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        fragment:
          type: string
          title: 碎片
          x-i18n: true
        holder:
          type: string
          title: 持有者
          x-i18n: true
        status:
          type: string
          title: 状态
          enum: [rumored, located, held-by-you, taken, lost]
          x-enumLabels:
            rumored: 传闻
            located: 已定位
            held-by-you: 在你手中
            taken: 被夺走
            lost: 遗失
      required: [fragment, holder, status]
      additionalProperties: false
  initialValue:
    meg-collection:
      fragment: 铁姑暗中收集的遗物碎片
      holder: 铁姑（盐牙会）
      status: rumored
    archive-fragment:
      fragment: 铰齿状灰色碎片
      holder: 不明——报告那一页被取走了
      status: rumored
  updateRule:
    只记录叙事中明确出现的钥匙碎片，新碎片用简短英文 kebab-case ID。找到下落时改为 located，落入玩家手中为
    held-by-you，被他人夺走为 taken 并更新 holder，下落彻底断绝为 lost。不凭空增加碎片，也不揭示钥匙能打开什么。

geography:
  name: 地理
  schema:
    type: object
    properties:
      overview:
        type: string
        x-i18n: true
        title: 概况
      regions:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              x-i18n: true
              title: 名称
            description:
              type: string
              x-i18n: true
              title: 描述
            climate:
              type: string
              x-i18n: true
              title: 气候
            landmarks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    x-i18n: true
                    title: 名称
                  description:
                    type: string
                    x-i18n: true
                    title: 描述
                additionalProperties: false
              title: 地标
          additionalProperties: false
        title: 地区
    additionalProperties: false
  initialValue:
    overview: 悬崖与海面之间的港口城市，永恒灰白浓雾笼罩，能见度不超过五十步。城市垂直分上城、中港、下潮区三层。
    regions:
      - name: 上城
        description: 议会与商会所在地，位于悬崖顶部，建筑以石砌为主，是合法遗物贸易的中枢。
        climate: 雾气稀薄，偶见天光
        landmarks:
          - name: 议事厅
            description: 议会权力中枢，穹顶嵌有远古潮石灯——全城唯一不靠火焰的光源。
          - name: 验潮师公会塔
            description: 鉴定远古遗物的学术要地，也是雾港唯一的图书馆与档案库。
          - name: 封档库
            description: 公会塔地下的禁阅档案室。齐老失踪当日，第七十四号鉴定报告与访客簿各少了一页，门锁却没有被撬动。
          - name: 静潮病院
            description: 名义上收治重度雾蚀患者，实际由议会严密看守；三年前深潜队唯一的幸存者被关在最下层病房。
      - name: 中港
        description: 码头、工坊和旅店聚集地，城市的经济心脏，也是各方势力公开与暗中交锋的舞台。
        climate: 浓雾常驻，潮湿闷热
        landmarks:
          - name: 主栈桥
            description: 雾港唯一的大型泊位，渡船与货船在此停靠，新来者从这里踏入雾港。
          - name: 钟塔
            description: 以潮汐驱动的机械钟，每六小时鸣响一次；三连击代表深退潮预警。
          - name: 盐市
            description: 中港背巷里半公开的市集，盐牙会在此放货与招募；持盐牙筹者才听得到真正的价。
          - name: 无声栈
            description: 探险者常住的低顶旅店，墙壁填了吸音雾菌。老板不问来路，却会把未归者的雾灯挂在门梁上。
          - name: 封潮关
            description: 中港通往下潮区褪水阶的检查站，灰隼在此核验许可证、没收明火与未登记遗物；栈桥暗门可绕行，但欠盐牙会一份人情。
      - name: 下潮区
        description: 潮退后暴露的远古遗迹区域，地形每次退潮都会改变，无图可循；最深处从未有人到达。
        climate: 阴冷，弥漫盐雾与腐蚀气息
        landmarks:
          - name: 骨拱门
            description: 半淹没的巨大拱形结构，来源不明；六年前的深退潮中暴露，带走了十七条人命。
          - name: 沉钟堂
            description: 退潮时才露出的半沉建筑，雾中教会在此聚会礼拜，相信这里离"雾之主"最近。
          - name: 隐潮窟
            description: 涨潮也淹不到的洞窟群，盐牙会的根据地，铁姑在此存放她搜集的遗物碎片。
          - name: 褪水阶
            description: 封潮关下方通往遗迹的长阶，每一级刻着撤离刻度。海水退过第九十级才算深退潮；返潮警铃后，安全窗口只剩约半小时。
          - name: 回声廊
            description: 本次深退潮最先露出的环形廊道，石壁会延迟复述脚步与耳语。齐老的潮纹印记、灰隼私队的新绳痕与一枚陌生童谣铜片同时出现在这里。
factions:
  name: 势力
  schema:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          title: ID
        name:
          type: string
          x-i18n: true
          title: 名称
        description:
          type: string
          x-i18n: true
          title: 描述
        type:
          type: string
          title: 类型
        influence:
          type: string
          title: 影响力
        leader:
          type: string
          x-i18n: true
          title: 领袖
        headquarters:
          type: string
          x-i18n: true
          title: 据点
        relations:
          type: array
          items:
            type: object
            properties:
              targetId:
                type: string
                title: 对象
              type:
                type: string
                title: 类型
              description:
                type: string
                x-i18n: true
                title: 描述
            additionalProperties: false
          title: 关系
      additionalProperties: false
  initialValue:
    - id: council
      name: 雾港议会
      description: 统治上城的政治实体，试图以"封潮令"限制平民进入下潮区，垄断合法遗物贸易；内部鸽鹰两派分裂。
      type: political
      influence: major
      leader: 议长・陈远山
      headquarters: 上城・议事厅
      relations:
        - targetId: salt-fangs
          type: hostile
          description: 视盐牙会为非法组织，长期冷战
        - targetId: tide-readers
          type: patron
          description: 拨款资助公会，也借此施加影响
        - targetId: fog-church
          type: hostile
          description: 斥雾中教会为邪教，警惕其在底层迅速扩张
    - id: tide-readers
      name: 验潮师公会
      description: 唯一有资质鉴定远古遗物、研究裂潮规律的学术组织；高层刻意压制某些鉴定报告，年轻验潮师日渐不安。
      type: guild
      influence: major
      leader: 公会长・齐老
      headquarters: 上城・验潮师公会塔
      relations:
        - targetId: council
          type: allied
          description: 依赖议会资金，提供遗物鉴定，保持名义独立
        - targetId: salt-fangs
          type: complicated
          description: 公开敌对走私，私下铁姑曾是公会学徒，旧情难断
    - id: salt-fangs
      name: 盐牙会
      description: 控制下潮区遗物黑市的走私帮派，势力深植底层；二当家铁姑守信，暗中搜集遗物碎片。
      type: criminal
      influence: major
      leader: 二当家・铁姑
      headquarters: 下潮区・隐潮窟
      relations:
        - targetId: council
          type: hostile
          description: 长期对抗议会封锁政策
        - targetId: fog-church
          type: neutral
          description: 不信其教义，但容许信徒在下潮区借道，偶尔交易情报
    - id: fog-church
      name: 雾中教会
      description: 崇拜"雾之主"的新兴教团，相信雾是有意识的存在、遗迹是其身体，宣讲"雾蚀是升华"；信众在底层激增。
      type: religious
      influence: minor
      leader: 雾使・小霜
      headquarters: 下潮区・沉钟堂
      relations:
        - targetId: council
          type: defiant
          description: 被议会列为邪教，却以底层信众为盾顽强生长
        - targetId: tide-readers
          type: rival
          description: 以"信仰"解释潮力与雾蚀，与公会的"科学"立场针锋相对
powerSystem:
  name: 力量体系
  schema:
    type: object
    properties:
      name:
        type: string
        x-i18n: true
        title: 名称
      type:
        type: string
        title: 类型
      description:
        type: string
        x-i18n: true
        title: 描述
      rules:
        type: array
        items:
          type: string
          x-i18n: true
        title: 规则
      tiers:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              x-i18n: true
              title: 名称
            rank:
              type: integer
              title: 等级
            description:
              type: string
              x-i18n: true
              title: 描述
          additionalProperties: false
        title: 层级
    additionalProperties: false
  initialValue:
    name: 潮力
    type: magic
    description: 远古遗物蕴含的不可预测能量，与潮汐周期共振，退潮时最强。验潮师以"潮纹"引导稳定，过度使用招致雾蚀。
    rules:
      - 遗物效果因潮汐相位而异——满潮时最强、退潮时最稳
      - 未经鉴定的遗物直接使用可能产生反噬，轻则失能、重则致命
      - 雾兽被潮力波动吸引，大规模使用遗物会引来雾兽群
      - 验潮师通过"潮纹"手法引导能量，需要长期训练，官方却否认潮力存在
      - 过度使用潮力引发"雾蚀"：身体逐渐半透明，最终溶入雾中，不可逆
      - 极少数人无需遗物也能感知潮力，这种天赋被公会视为危险，被教会奉为神迹
      - 雾蚀以 0-100 记录且不可逆：25 起出现可见异变，50 起伴随持续失能，75 以上随时可能溶入雾中
    tiers:
      - name: 学徒
        rank: 1
        description: 能感知遗物是否活性
      - name: 验潮师
        rank: 2
        description: 可鉴定并稳定常规遗物
      - name: 御潮者
        rank: 3
        description: 能主动引导潮力，极为罕见，多已显雾蚀
history:
  name: 历史
  schema:
    type: array
    items:
      type: object
      properties:
        era:
          type: string
          x-i18n: true
          title: 时代
        name:
          type: string
          x-i18n: true
          title: 名称
        description:
          type: string
          x-i18n: true
          title: 描述
        significance:
          type: string
          title: 重要性
        year:
          type: string
          x-i18n: true
          title: 年份
      additionalProperties: false
  initialValue:
    - era: 远古
      name: 造者时代
      description: 下潮区遗迹的建造者文明，已无文字记录，仅余建筑残骸；其碑文比雾港古老一万年。
      significance: major
    - era: 建城纪
      year: 约三百年前
      name: 雾港建城
      description: 流民在悬崖间搭建栈道定居，发现退潮暴露的遗物可以交易。
      significance: major
    - era: 当代
      year: 六年前
      name: 骨拱门深退潮
      description: 上一次深退潮暴露出"骨拱门"，多支探险队涌入，十七人葬身涨潮，至今为忌讳。
      significance: major
    - era: 当代
      year: 三年前
      name: 失踪的探险队
      description: 一支议会探险队深入下潮区后全队失踪，唯一幸存者发疯，反复念叨"它在下面醒了"。
      significance: major
    - era: 近年
      name: 雾中教会兴起
      description: 雾蚀患者激增，雾中教会以"升华"教义吸纳底层贫民，雾使小霜的预言屡屡应验。
      significance: minor
    - era: 当代
      year: 去年
      name: 封潮令草案
      description: 陈议长提出封潮令，禁止无证者进入下潮区，引发底层激烈反对。
      significance: minor
    - era: 当下
