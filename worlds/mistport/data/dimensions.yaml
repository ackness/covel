        type: string
        x-i18n: true
        title: { zh-CN: 贸易, en-US: Trade }
    additionalProperties: false
  initialValue:
    currencies:
      - name:
          zh-CN: 潮币
          en-US: Tide Coin
        symbol: ₮
        description:
          zh-CN: 议会发行的标准货币
          en-US: Standard currency issued by the Council
      - name:
          zh-CN: 盐牙筹
          en-US: Salt Chip
        description:
          zh-CN: 盐牙会在黑市流通的不可追踪代币
          en-US: Untraceable token used in the Salt Fangs black market
    resources:
      - zh-CN: 远古遗物
        en-US: Ancient relics
      - zh-CN: 遗物碎片
        en-US: Relic fragments
      - zh-CN: 潮盐
        en-US: Tide salt
      - zh-CN: 雾菌（可食用真菌）
        en-US: Fog fungus (edible)
      - zh-CN: 崖铁
        en-US: Cliff iron
    tradeNotes:
      zh-CN: 遗物交易是雾港经济的核心。合法渠道走验潮师公会鉴定后拍卖，黑市走盐牙会；遗物碎片在黑市价格离奇，因为有人在高价收购。
      en-US: The relic trade is Mistport's backbone. Legal relics go through Guild appraisal and auction; the black market runs through the Salt Fangs — and relic fragments fetch strange prices, because someone is buying them up.
socialStructure:
  name:
    zh-CN: 社会结构
    en-US: Society
  schema:
    type: object
    properties:
      classes:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              x-i18n: true
              title: { zh-CN: 名称, en-US: Name }
            rank:
              type: integer
              title: { zh-CN: 等级, en-US: Rank }
            description:
              type: string
              x-i18n: true
              title: { zh-CN: 描述, en-US: Description }
