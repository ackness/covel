    openingScenario:
      zh-CN: 黄昏，你刚抵达中港主栈桥。潮汐钟敲响罕见的三连击——深退潮预警。码头上盐牙会在招募探险者，议会在张贴封潮令；验潮师苏窈挤过人群。若你是新学徒，她认得你的考核潮纹；若你是潮民，她带着齐老点名寻找熟路人的便笺。她告诉你：齐老今早走进了下潮区，而那时正是涨潮期。
      en-US: "Dusk on Mid-Harbor's main pier. The tide-bell rings a rare triple strike — a deep-withdrawal alert. Salt Fangs recruit explorers while Council officers post the Seal Tide Decree. Tide-Reader Su Yao pushes through the crowd: if you are a new apprentice, she recognizes your examination tide-mark; if you are an Undertow local, she carries Qi's note asking for someone who knows the hidden ways. Qi walked into the Undertow that morning — at high tide, when no one can."
    openingHook:
      zh-CN: 潮钟三鸣，齐老失踪，下潜还是封港？
      en-US: The bell tolls thrice, Qi is gone — dive, or seal?
    openingChips:
      - zh-CN: 深退潮
        en-US: Deep withdrawal
      - zh-CN: 封潮令
        en-US: Seal Tide Decree
      - zh-CN: 齐老失踪
        en-US: Qi's disappearance
      - zh-CN: 半封失踪信
        en-US: A torn letter
    playerConstraints:
      - zh-CN: 初始为验潮师学徒或普通潮民
        en-US: Start as a Tide-Reader apprentice or common Undertow dweller
      - zh-CN: 不可携带明火进入雾区
        en-US: No open flames permitted in the fog
      - zh-CN: 无证进入下潮区违反封潮令，会被议会追责
        en-US: Entering the Undertow unlicensed violates the Seal Tide Decree and draws Council reprisal
    startingLocation:
