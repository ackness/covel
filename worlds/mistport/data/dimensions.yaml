      notes:
        type: string
        x-i18n: true
        title: { zh-CN: 备注, en-US: Notes }
    additionalProperties: false
  initialValue:
    classes:
      - name:
          zh-CN: 议员与商会
          en-US: Councilors & Merchants
        rank: 1
        description:
          zh-CN: 上城精英，掌握政治与合法贸易权
          en-US: Upper City elite controlling politics and legal trade
      - name:
          zh-CN: 中港市民
          en-US: Mid-Harbor Citizens
        rank: 2
        description:
          zh-CN: 码头工人、工匠、旅店主，城市运转的中坚
          en-US: Dockworkers, artisans, innkeepers — the city's backbone
      - name:
          zh-CN: 潮民
          en-US: Undertow Dwellers
        rank: 3
        description:
          zh-CN: 下潮区边缘居民，靠拾荒和走私为生，也是雾中教会的主要信众
          en-US: Scavengers and smugglers at the city's edge — and the Congregation's main flock
    notes:
      zh-CN: 验潮师公会成员不受阶层限制，凭技术获得跨阶层通行权；雾蚀患者则被各阶层排斥，逐渐流向教会。
      en-US: Tide-Reader Guild members hold cross-tier passage regardless of class; the fog-rotted are shunned by all tiers and drift toward the Congregation.
tone:
  name:
    zh-CN: 基调
    en-US: Tone
  schema:
    type: object
    properties:
      genres:
        type: array
        items:
          type: string
        title: { zh-CN: 类型, en-US: Genres }
      contentRating:
        type: string
        title: { zh-CN: 分级, en-US: Rating }
      narrativeStyle:
        type: string
        x-i18n: true
        title: { zh-CN: 叙事风格, en-US: Narrative style }
      themes:
        type: array
        items:
          type: string
          x-i18n: true
        title: { zh-CN: 主题, en-US: Themes }
    additionalProperties: false
  initialValue:
    genres:
      - dark-fantasy
      - mystery
      - exploration
    contentRating: teen
    narrativeStyle:
      zh-CN: 雾气氤氲的哥特悬疑风格，节奏舒缓但暗流涌动，真相一层层剥开、代价一点点累积。
      en-US: Gothic suspense shrouded in fog — slow on the surface, with dangerous undercurrents, truth peeled back layer by layer and the cost mounting bit by bit.
    themes:
      - zh-CN: 阶层对立
        en-US: class divide
      - zh-CN: 未知探索
        en-US: the unknown
      - zh-CN: 秩序与自由
        en-US: order vs. freedom
      - zh-CN: 信仰与异化
        en-US: faith and alienation
      - zh-CN: 真相的代价
        en-US: the price of truth
      - zh-CN: 身体的边界
        en-US: the boundary of the body
mechanics:
  name:
    zh-CN: 玩法
    en-US: Mechanics
  schema:
    type: object
    properties:
      combatStyle:
        type: string
        title: { zh-CN: 战斗, en-US: Combat }
      skillSystem:
        type: string
        x-i18n: true
        title: { zh-CN: 检定规则, en-US: Checks }
      difficulty:
        type: string
        title: { zh-CN: 难度, en-US: Difficulty }
      customRules:
        type: array
        items:
          type: string
          x-i18n: true
        title: { zh-CN: 附加规则, en-US: House rules }
    additionalProperties: false
  initialValue:
    combatStyle: narrative
    skillSystem:
      zh-CN: 以职业技能树为核心：验潮（鉴定/引导遗物）、潜行（雾中行动）、交涉（社交）、格斗。
      en-US: "Skill trees by vocation: Tide-Reading (appraise/channel relics), Stealth (fog navigation), Diplomacy (social), Combat."
    difficulty: normal
    customRules:
      - zh-CN: 雾中行动需声音/光源检定，失败则引来雾兽
        en-US: Fog actions require sound/light checks — failure attracts fog beasts
      - zh-CN: 遗物使用前必须鉴定，否则触发随机效果表
        en-US: Relics must be appraised before use, or trigger a random-effect table
      - zh-CN: 潮汐周期影响下潮区可探索范围，涨潮预警必须撤退
        en-US: The tidal cycle determines the explorable range; a flood warning forces retreat
      - zh-CN: 引导潮力或使用活性遗物会累积雾蚀值，过线则身体不可逆地变化
        en-US: Channeling Tide-Force or using active relics accrues fog-rot; past a threshold the body changes irreversibly
      - zh-CN: 四方势力（议会/公会/盐牙会/教会）对玩家的遗物与下潮区行动各有反应，立场此消彼长
        en-US: The four powers (Council/Guild/Salt Fangs/Congregation) each react to the player's relic and Undertow actions, standings shifting against one another
      - zh-CN: 线索按「未核实 / 已佐证 / 已污染 / 已解决」演化；潮水可能带走物证，却不会自动证明任何人的解释
        en-US: Clues evolve through unverified, corroborated, contaminated, and resolved states; the tide may remove evidence, but never proves anyone's interpretation by itself
      - zh-CN: 有代价的行动应更新至少一项可见状态：潮时、地点、伤势/雾蚀、角色态度、阵营压力或线索可信度
        en-US: "Any costly action should visibly update at least one state: tide-time, location, condition/fog-rot, character attitude, faction pressure, or clue confidence"
