      - 引导潮力或使用活性遗物会累积雾蚀值，过线则身体不可逆地变化
      - 四方势力（议会/公会/盐牙会/教会）对玩家的遗物与下潮区行动各有反应，立场此消彼长
      - 线索按「未核实 / 已佐证 / 已污染 / 已解决」演化；潮水可能带走物证，却不会自动证明任何人的解释
      - 有代价的行动应更新至少一项可见状态：潮时、地点、伤势/雾蚀、角色态度、阵营压力或线索可信度
