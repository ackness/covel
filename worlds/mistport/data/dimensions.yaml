caseBoard:
  name: 案情板
  description: 齐老失踪案的线索、来源与疑点。佐证要能追到出处，证据也可能被潮水、伪造或泄密污染。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        lead:
          type: string
          title: 线索
          x-i18n: true
        status:
          type: string
          title: 状态
          enum: [unverified, corroborated, contaminated, resolved]
          x-enumLabels:
            unverified: 未核实
            corroborated: 已佐证
            contaminated: 已污染
            resolved: 已解决
        note:
          type: string
          title: 当前判断
          maxLength: 240
          x-i18n: true
        sources:
          type: array
          title: 来源
          items:
            type: object
            properties:
              from: { type: string, title: 出处, x-i18n: true }
              kind:
                type: string
                title: 类别
                enum: [physical, witness, document, tide-mark]
                x-enumLabels:
                  physical: 物证
                  witness: 证词
                  document: 文书
                  tide-mark: 潮纹
              detail: { type: string, title: 所见所闻, x-i18n: true }
              retracted: { type: boolean, title: 已撤回 }
            required: [from, kind, detail, retracted]
            additionalProperties: false
        contradictions:
          type: array
          title: 矛盾
          items:
            type: object
            properties:
              a: { type: string, title: 一方说法, x-i18n: true }
              b: { type: string, title: 另一方说法, x-i18n: true }
              why: { type: string, title: 冲突所在, x-i18n: true }
            required: [a, b, why]
            additionalProperties: false
        secured: { type: boolean, title: 已固定 }
      required: [lead, status, sources, contradictions, secured]
      additionalProperties: false
  initialValue:
    torn-letter:
      lead: 半封信
      status: unverified
      note: 苏窈手里有半封信，写着“钥匙不能落到他手里”。纸边沾着只在退潮遗迹结晶的黑潮盐，可齐老是在满潮时离开的。
      sources: []
      contradictions:
        - a: 纸边的黑潮盐只在退潮遗迹结晶。
          b: 齐老在满潮时离开。
          why: 信上的盐与他离开的潮时对不上，还不知道盐何时沾上。
      secured: false
    report-74:
      lead: 第七十四号鉴定报告
      status: unverified
      note: 封档库的报告缺了一页，目录还留着“铰齿状灰色碎片”。同日访客簿也被无损取页。
      sources: []
      contradictions: []
      secured: false
    echo-gallery:
      lead: 回声廊的三种痕迹
      status: unverified
      note: 齐老的潮纹、灰隼私队的新绳痕和刻着童谣的铜片，留下的时间对不上。
      sources: []
      contradictions: []
      secured: false
    stilltide-survivor:
      lead: 静潮病院的幸存者
      status: unverified
      note: 三年前深潜队唯一归来的人被议会隔离。“它在下面醒了”并非他最初说的原句。
      sources: []
      contradictions: []
      secured: false
  updateRule: >-
    只按本轮叙事里实际取得的物证、亲闻的证词、查阅的文书或辨读的潮纹添加来源；初始线索只是待查方向，不能据此补造来源。
    出处写人名、地点或文书名称，所见所闻写具体内容。来源类别只写 physical（物证）、witness（证词）、document（文书）或 tide-mark（潮纹）。同一证人重复说话、转述同一个人或抄录同一文书，都只算一个来源；类别不同也不一定独立。
    发现矛盾时分别记下两方说法和冲突所在，不替任何一方下结论。证人明确翻供时保留原证词并标为已撤回，不把转述当成亲闻。
    状态按证据维护：有效且互相独立的来源至少两条，才可设为 corroborated（已佐证）；不足两条时为 unverified（未核实）。证据遭伪造、损毁或公开走漏时设为 contaminated（已污染），并在当前判断里写明原因。
    只有查清真相、解释了矛盾且争议已消除，才设为 resolved（已解决）。翻供后重新检查其余来源，不能沿用失去依据的佐证。
    固定证据须在叙事中花一次行动完成：将物证或副本封存到公会封档库、随身防水保存，或请具名证人确认并留下可复核的记录，随后标为已固定。
    深退潮急涨时，只污染仍在潮水可及处且未固定的证据；单纯传闻、上城档案和证人记忆不会被水冲走。固定过的证据若另遭伪造或泄密，仍可污染。
    不删除线索、来源或矛盾；新线索沿用同一结构。当前判断只写一句话，说明判断的依据和仍待查的问题。潮水带走证据不证明任何人的解释。

deepWithdrawal:
  name: 深退潮
  description: 罕见的深退潮让下潮区完全露出，返潮警铃一响，撤离通常只剩约半小时。
  schema:
    type: object
    properties:
      stage:
        type: string
        title: 阶段
        enum:
          [
            triple-warning,
            step-ninety,
            full-exposure,
            return-bell,
            flood,
            receded,
          ]
        x-enumLabels:
          triple-warning: 三连预警
          step-ninety: 退过第九十级
          full-exposure: 遗迹完全暴露
          return-bell: 返潮警铃
          flood: 急涨
          receded: 潮水复归
      note:
        type: string
        title: 潮讯
        maxLength: 240
        x-i18n: true
    required: [stage]
    additionalProperties: false
  initialValue:
    stage: triple-warning
    note: 潮钟三鸣。深退潮提前了，没人说得清缘由。
  updateRule: >-
    只随叙事明确写出的潮讯推进，阶段依次为 triple-warning（三连预警）、step-ninety（海水退过褪水阶第九十级）、full-exposure（遗迹完全暴露）、return-bell（返潮警铃）、flood（急涨）、receded（潮水复归）。
    return-bell 后通常只剩约半小时。不跳级、不倒退；receded 之后，只有新的三连预警才回到 triple-warning。普通涨落潮由世界时间记录。

factionStanding:
  name: 四方立场
  description: 议会、公会、盐牙会与雾中教会对你的态度，以及彼此欠下的人情。
  schema:
    type: object
    properties:
      council:
        type: object
        title: 雾港议会
        properties:
          attitude: { type: integer, title: 态度, minimum: -3, maximum: 3 }
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [permit, owes-you, you-owe, warrant]
              x-enumLabels:
                permit: 持有许可
                owes-you: 欠你人情
                you-owe: 你欠人情
                warrant: 通缉
        required: [attitude, marks]
        additionalProperties: false
      guild:
        type: object
        title: 验潮师公会
        properties:
          attitude: { type: integer, title: 态度, minimum: -3, maximum: 3 }
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [owes-you, you-owe]
              x-enumLabels:
                owes-you: 欠你人情
                you-owe: 你欠人情
        required: [attitude, marks]
        additionalProperties: false
      saltFangs:
        type: object
        title: 盐牙会
        properties:
          attitude: { type: integer, title: 态度, minimum: -3, maximum: 3 }
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [owes-you, you-owe]
              x-enumLabels:
                owes-you: 欠你人情
                you-owe: 你欠人情
        required: [attitude, marks]
        additionalProperties: false
      congregation:
        type: object
        title: 雾中教会
        properties:
          attitude: { type: integer, title: 态度, minimum: -3, maximum: 3 }
          marks:
            type: array
            title: 记录
            maxItems: 4
            items:
              type: string
              enum: [owes-you, you-owe]
              x-enumLabels:
                owes-you: 欠你人情
                you-owe: 你欠人情
        required: [attitude, marks]
        additionalProperties: false
    required: [council, guild, saltFangs, congregation]
    additionalProperties: false
  initialValue:
    council: { attitude: 0, marks: [] }
    guild: { attitude: 0, marks: [] }
    saltFangs: { attitude: 0, marks: [] }
    congregation: { attitude: 0, marks: [] }
  updateRule: >-
    态度从 -3（敌视）到 3（倚重），开局为中立。玩家明确帮助、出卖、交易或公开违抗某方时调整 1，重大事件最多调整 2。
    议会与盐牙会长期冷战；玩家取悦一方且被另一方得知，另一方态度减 1。具体人情只记在相关势力名下，不重复添加，偿还后移除。
    许可证用 permit、通缉用 warrant，只记在议会名下，须有明确签发、撤销或解除的情节。人情用 owes-you（对方欠你）或 you-owe（你欠对方），其余三方只用这两种标记。只结算本轮叙事已发生的事。

keyFragments:
  name: 钥匙碎片
  description: 铁姑、陈远山和灰隼都在找“钥匙”的零件，谁也不肯说它能开什么。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        fragment: { type: string, title: 碎片, x-i18n: true }
        holder: { type: string, title: 持有者, x-i18n: true }
        status:
          type: string
          title: 状态
          enum: [rumored, located, held-by-you, taken, lost]
          x-enumLabels:
            rumored: 传闻
            located: 已定位
            held-by-you: 在你手中
            taken: 被夺走
            lost: 遗失
      required: [fragment, holder, status]
      additionalProperties: false
  initialValue:
    meg-collection:
      fragment: 铁姑暗中收集的遗物碎片
      holder: 据说在铁姑手里；随身一枚，其余存于隐潮窟，尚待核实。
      status: rumored
    archive-fragment:
      fragment: 铰齿状灰色碎片
      holder: 不明，鉴定报告的那一页被取走了。
      status: rumored
  updateRule: >-
    只记录叙事明确提到的钥匙碎片，传闻用 rumored，不当成已找到的东西。查到下落后设为 located；到玩家手里后设为 held-by-you；遭人夺走后设为 taken，并写明新的持有者；线索彻底中断才设为 lost。
    铁姑随身的一枚与隐潮窟里的收藏不能重复计数；尚未比对之前，不断言其中哪枚就是报告里的铰齿状碎片。不凭空增加碎片，也不提前揭示钥匙的用途。

startingConditions:
  name: 开局
  schema:
    type: object
    properties:
      openingScenario: { type: string, title: 开场, x-i18n: true }
      openingHook: { type: string, title: 引子, x-i18n: true }
      openingChips:
        type: array
        title: 开局行动
        items: { type: string, x-i18n: true }
      playerConstraints:
        type: array
        title: 开局限制
        items: { type: string, x-i18n: true }
      startingLocation: { type: string, title: 起点, x-i18n: true }
      startingResources:
        type: object
        title: 初始资源
        properties:
          潮币: { type: integer }
          雾灯: { type: integer }
        additionalProperties: false
    additionalProperties: false
  initialValue:
    openingScenario: 黄昏，你刚到中港主栈桥，潮钟便敲了三下：深退潮预警。盐牙会在码头招募探险者，议会的人贴起封潮令。苏窈挤过人群；你是新学徒，她认得你考核留下的潮纹；你是潮民，她带着齐老点名找熟路人的便笺。她告诉你，齐老今早走进下潮区时还在涨潮。眼下，海水已经开始后退。
    openingHook: 潮钟三鸣，齐老失踪。下潜，还是封港？
    openingChips:
      - 深退潮
      - 封潮令
      - 齐老失踪
      - 半封失踪信
    playerConstraints:
      - 以验潮师学徒或普通潮民的身份开始。
      - 不可携带明火进入雾区。
      - 无证进入下潮区违反封潮令，会被议会追责。
    startingLocation: 中港・主栈桥
    startingResources:
      潮币: 50
      雾灯: 1
