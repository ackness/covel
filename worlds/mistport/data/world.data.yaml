schemaVersion: 1
sources:
  dimensions:
    kind: yaml
    path: data/dimensions.yaml
    schema: covel://world/dimensions
    to: world:metadata.dimensions
  tideRules:
    kind: yaml
    path: data/rules/tide-mystery.yaml
    schema: plugin://living-world-rules/rules
    to: plugin:living-world-rules/rules+lorebook
    key: id
    after: dimensions
