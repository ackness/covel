- id: mio-the-club-room
  title: What Mio kept to herself
  payload: >-
    After school, alone with the player in the Literature Club Room, Mio explains what she has kept from the other members. Someone on the Student Council wants to turn their old third-floor room into a festival storeroom; the merger review is about more than membership numbers.
    She slips a draft renovation plan under the contents page of Spring Mint and asks whether the player would tell everyone in her place. Show her exhaustion and hesitation. Leave the answer to the player, let Mio make her own decision, and keep the problem open beyond this scene.
- id: kaho-last-verse
  title: A song with no name
  payload: >-
    Kaho waits by the vending machine on Sakurazaka Seawall with her guitar on her back. She says she can't finish the last verse, then plays the part she has written properly for the player for the first time. She stops where the missing verse should begin.
    If the festival performance goes wrong, the Light Music Club could lose its main-stage place. She admits she can't bring herself to write about what comes after it. Let the melody and her unease carry the scene. Leave room for the player's response and the lyrics for Kaho to write.
- id: akane-sisters-note
  title: The faded line on the title page
  payload: >-
    Just before the library closes, Akane takes down the oldest festival special issue and shows the player a faded line on its title page: "Hope we can still be here next year."
    Her sister wrote it when she led the Save the Old Clubhouse campaign seven years ago. Akane quietly says she wants to carry that work on, and asks whether the player would share the old issue's story with the Literature Club. Give her unusual willingness to speak some room, including its silences. Leave some of her thoughts unsaid.
- id: kaho-names-the-song
  title: A name for the song
  payload: >-
    After the main-stage preview, Kaho stops the player outside the Light Music Club Practice Room and hands them a page covered in crossed-out lyrics. The last verse is finished; it has spring, the sea breeze, and "you" in it.
    She wants the player to hear the whole song first. Looking away, she asks what they should call it. Show her nerves and anticipation, and let the player respond or suggest a name. Leave the title to them and let the scene stop short of a full confession.
- id: rin-closed-notebook
  title: The closed notebook
  payload: >-
    While sorting anonymous submissions for the Fact-or-Rumor Wall, Rin closes her notebook. If a story is true but publishing it would hurt a friend, she asks, should it still go to print?
    She skips her usual opening joke and refuses to give up the sender's name for an easy answer. She admits she's afraid of missing something that matters, and of friends who come to see her only as a reporter.
    Let her hear the player out. They can ask questions, suggest holding the story, or propose a way to check it. Leave their position to them and the submission's truth unresolved by this conversation alone.
- id: rin-unsigned-margin
  title: The empty byline
  payload: >-
    After school in the Newspaper Club Editorial Office, Rin slides over a proof of the Fact-or-Rumor Wall. The byline is blank. She wants the player's help checking the wording, but puts her notebook in her bag first: some things don't need writing down this time.
    Since she closed it the other day, has talking to her felt any easier? The question comes out fast. This time she doesn't follow it with a joke.
    Let the player answer and decide whether to add their name. The proof should reflect their earlier conversation and any checking that has actually happened. Leave open whether she ran or held that submission unless the story has already established it, and keep the conversation short of a confession.
- id: yuma-rooftop-round
  title: The back of the patrol sheet
  payload: >-
    After his 17:40 patrol, Yuma pauses on the Club Building Rooftop to look at the clubrooms still lit below. He turns his patrol sheet over and shows the player how clubs can submit missing documents or appeal.
    If the Literature Club has a case for keeping its room, would the player help them finish the paperwork? He checks his watch again and reminds them that closing time is near.
    Show his respect for procedure and the concern he leaves unspoken. Let the player offer help, ask questions, or leave. They must make their own promises; Yuma must not alter the review result on his own authority.
- id: yuma-after-review
  title: The walk after the review
  payload: >-
    After the first budget review, Yuma puts his papers away. As they leave school, he asks whether the player wants to take the longer way past Sakurazaka Seawall. No more forms today, he says, but a few steps later he asks whether the review was fair to the people who worked so hard.
    Draw on the established review result to let him discuss the part he still worries about. He is willing to hear criticism and wants to know whether the player understands his concerns.
    The player can answer, ask him a question, or walk beside him in silence. Leave any reassurance to them. This conversation neither settles the Literature Club's future nor confirms their feelings for each other.
