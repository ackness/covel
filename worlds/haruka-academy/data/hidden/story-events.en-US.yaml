- id: mio-the-club-room
  title: What Mio Didn't Say
  payload: "After school, alone with the player in the Literature Club Room, Mio finally tells them what she has been keeping from the other members: someone on the Student Council has proposed turning the old third-floor clubroom in the Club Building into a storeroom for running the festival, so the merger review isn't only about member numbers. She slides a draft renovation plan under the contents page of Spring Mint and asks the player whether, in her place, they would tell everyone. Play out her exhaustion and hesitation and let the player decide how to respond; don't decide for her, and don't let the problem be solved on the spot."
- id: kaho-last-verse
  title: A Song with No Name
  payload: 'Kaho is waiting for the player by the vending machine on Sakurazaka Seawall, her guitar on her back. She says she can''t finish the last verse of her new song. Then, for the first time, she properly plays the part she has written for the player, and stops where the empty verse should begin. She admits why she can''t write it: if the festival performance goes badly, the Light Music Club could lose its place on the main stage, and she doesn''t dare write an "after." Play out the melody and her unease and let the player respond; don''t write the lyrics for her.'
- id: akane-sisters-note
  title: The Note on the Title Page
  payload: 'Just before the library closes, Akane Toujou takes the oldest festival special issue down from that shelf and opens it to the title page to show the player a faded line: "Hope we can still be here next year." She says quietly that her sister wrote it — the sister who led the Old Club Building Preservation Movement seven years ago — and that she has always wanted to keep that going. She asks whether the player would be willing to hand this old issue''s story over to the Literature Club. Play out this rare moment of her reaching out and leave room for silence; don''t say everything on her mind for her.'
- id: kaho-names-the-song
  title: Naming the Song
  payload: 'After the main-stage preview, Kaho stops the player at the door of the Light Music Club Practice Room and presses a sheet of heavily scribbled-over lyrics into their hands — the last verse is finally done, and its lines hold spring, the sea breeze, and "you." She says she wants the player to be the first to hear the whole song, then looks away and asks: what should this song be called? Play out her rare nerves and hope and let the player respond or name it; don''t choose the title for the player, and don''t turn this into a confession scene where everything gets said at once.'
