- id: old-club-preservation
  strategy: selective
  keys: [旧社团楼, 保留运动, 文艺部合并, 三层活动室, 旧特刊, 扉页]
  content: >-
    七年前遥风学园迁来青砾町新校区时，第一届学生曾发起签名保住了木造旧社团楼。当时留在图书馆最老一本特刊扉页上的那句“希望明年还能在这里”，正是东条茜已经毕业的姐姐写下的。
    眼下学生会筹备学园祭翻修，有人提议把旧社团楼三层文艺部活动室改成执委会仓库；白石悠真在规则里卡得严，却每天下午借巡查去屋顶记下哪几间活动室还亮着灯。
- id: seireki-merchants
  strategy: selective
  keys: [海猫书房, 青砾町商店街, 乐器行, 家庭餐厅, 自动贩卖机, 薄荷苏打]
  content: >-
    青砾町车站前只有两条商店街：靠海那条拐角是海猫书房，老店主认识历届文艺部成员，替他们留便宜的再生纸与旧校刊；斜对面老乐器行可以试弹调弦，店员也肯借练习用备用音箱线。
    坡底海堤边的自动贩卖机常年只剩柠檬汽水、薄荷苏打和罐装热咖啡，传闻“日落时掉出哪一罐会暴露你在想谁”多半只是学生放学顺路买饮料后的起哄。
- id: campus-traditions
  strategy: selective
  keys: [夕风点灯, 海风邮局, 传闻真伪墙, 春日学园祭, 最后一盏灯]
  content: >-
    三年前学园祭改制为社团与班级联合企划，闭幕压轴沿用了两年前商店街借来的「夕风点灯」——从中庭一路亮到樱坂海堤尽头，学生们私下把“和谁看最后一盏灯”当作没明说的约定暗号。
    今年二年 B 组负责的「海风邮局」替来客封存一年后寄出的明信片，新闻部做「传闻真伪墙」，轻音部则盼着夏帆的新歌能接在点灯前最后一轮演出里。
- id: seating-and-timetable
  strategy: selective
  keys: [二年 B 组, 早读, 午休, 闭校广播, 值日, 课间]
  content: >-
    遥风学园八点二十分早读，课间十分钟，十二点二十分午休，十五点四十分放学，十六点至十七点半为社团时间，十八点准时响起闭校广播。每个大时段通常只够办一件事，去图书馆就可能错过教室外或走廊上的临时话头。
    二年 B 组靠窗最后一排可以望见海面渡轮与楼下吉他声；小野寺千寻老师不会替学生拿主意，但值日表与补习留堂常是最自然的单独谈话契机。
