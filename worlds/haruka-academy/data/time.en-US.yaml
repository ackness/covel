definition:
  name: Campus time
  calendar:
    era: Campus year
    months:
      - name: January
      - name: February
      - name: March
      - name: April
      - name: May
      - name: June
      - name: July
      - name: August
      - name: September
      - name: October
      - name: November
      - name: December
    weekdays:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
    periods:
      - name: Late night
      - name: Arrival and morning reading prep
      - name: Morning classes and breaks
      - name: Midday
      - name: Afternoon classes
      - name: Last classes and dismissal
      - name: Club activities
      - name: Clubs winding down and dusk
      - name: After closing
  evolution:
    prompt: >-
      Students arrive before 08:20 to get ready for morning reading. Lunch begins at 12:20, school ends at 15:40, club activities run from 16:00 to 17:30, and the school closes at 18:00.
      Period labels use whole hours. For a move to lunch, dismissal, club activities, or closing time, use the exact times above and include classes and waiting skipped since the current time.
      A conversation usually takes a few minutes; settle classes and club activities by the time the narrative says they take. Sleep or an explicit cut to the next day advances the date. Flashbacks do not change it.
