schemaVersion: 1
sources:
  dimensions:
    kind: yaml
    path: data/dimensions.yaml
    to: world:metadata.dimensions
  cast:
    kind: json
    path: characters/main-cast.json
    to: contract:character.blueprints@1
    key: id
    after: dimensions
  campusRules:
    kind: yaml
    path: data/rules/campus-life.yaml
    to: contract:world.rules@1+lorebook
    key: id
    after: cast
  portraits:
    kind: media
    path: media/portraits
    to: media
    indexTo: contract:character.portrait-assets@1
    key: filename
    after: cast
  scenes:
    kind: media
    path: media/scenes
    to: media
    indexTo: contract:stage.scene-assets@1
    key: filename
    after: dimensions
  scenesRegistry:
    kind: json
    path: media/scenes.registry.json
    to: contract:stage.scenes@1
    key: registryId
    after: scenes
  presence:
    kind: json
    path: media/presence.json
    to: contract:character.portraits@1
    key: characterId
    after: portraits
  affinity:
    kind: yaml
    path: data/affinity.yaml
    to: contract:character.affinity@1
    key: id
    after: cast
  characters:
    kind: json
    path: characters/characters.json
    to: characters
    key: id
    after: cast
  memoryBlocks:
    kind: json
    path: data/memory-blocks.json
    to: contract:memory.blocks@1
    key: id
  timeDefinition:
    kind: yaml
    path: data/time.yaml
    to: contract:world.time-definition@1
    key: id
  storyEvents:
    kind: yaml
    path: data/hidden/story-events.yaml
    to: contract:story.events@1
    key: id
    after: dimensions
    visibility: hidden
