id: world
definition:
  kind: calendar
  name: 学园时间
  calendar:
    era: 学园历
    months:
      - { name: 1月, days: 31 }
      - { name: 2月, days: 28 }
      - { name: 3月, days: 31 }
      - { name: 4月, days: 30 }
      - { name: 5月, days: 31 }
      - { name: 6月, days: 30 }
      - { name: 7月, days: 31 }
      - { name: 8月, days: 31 }
      - { name: 9月, days: 30 }
      - { name: 10月, days: 31 }
      - { name: 11月, days: 30 }
      - { name: 12月, days: 31 }
    hoursPerDay: 24
    minutesPerHour: 60
    weekdays:
      - 周一
      - 周二
      - 周三
      - 周四
      - 周五
      - 周六
      - 周日
    # Periods accept whole hours only; the evolution prompt gives the exact timetable.
    periods:
      - { startHour: 0, name: 深夜 }
      - { startHour: 6, name: 上学与早读准备 }
      - { startHour: 8, name: 上午课程与课间 }
      - { startHour: 12, name: 午间 }
      - { startHour: 13, name: 下午课程 }
      - { startHour: 15, name: 课程收尾与放学 }
      - { startHour: 16, name: 社团活动 }
      - { startHour: 17, name: 社团收尾与黄昏 }
      - { startHour: 18, name: 闭校后 }
  initial: { year: 1, month: 4, day: 8, hour: 8, minute: 20, weekday: 0 }
  evolution:
    mode: forward
    defaultStep: 5
    maxStep: 43200
    prompt: >-
      八点二十分前到校准备早读，午休从 12:20 开始，15:40 放学，16:00 至 17:30 是社团活动，18:00 闭校。
      时段标签只按整点划分；转到午休、放学、社团活动或闭校时，以上述精确钟点为准，计入从当前时刻略过的课程与等待。
      一段对话通常用几分钟，课堂与社团活动按叙事中的耗时结算。当一个时段已收尾、双方没有当场后续约定时，主动顺延到下一次课间、放学或次日早读，让二十一天倒计时自然往前走；睡眠或明确的次日转场应跨日，回忆不改变当前日期。
