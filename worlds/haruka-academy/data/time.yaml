id: world
definition:
  kind: calendar
  name: 学园时间
  calendar:
    era: 学园历
    months:
      - { name: 1月, days: 31 }
      - { name: 2月, days: 28 }
      - { name: 3月, days: 31 }
      - { name: 4月, days: 30 }
      - { name: 5月, days: 31 }
      - { name: 6月, days: 30 }
      - { name: 7月, days: 31 }
      - { name: 8月, days: 31 }
      - { name: 9月, days: 30 }
      - { name: 10月, days: 31 }
      - { name: 11月, days: 30 }
      - { name: 12月, days: 31 }
    hoursPerDay: 24
    minutesPerHour: 60
    weekdays:
      - 周一
      - 周二
      - 周三
      - 周四
      - 周五
      - 周六
      - 周日
    periods:
      - { startHour: 0, name: 深夜 }
      - { startHour: 6, name: 早晨 }
      - { startHour: 12, name: 午后 }
      - { startHour: 18, name: 晚间 }
  initial: { year: 1, month: 4, day: 8, hour: 8, minute: 20, weekday: 0 }
  evolution:
    mode: forward
    defaultStep: 5
    maxStep: 43200
    prompt: >-
      早读准备在 08:20 前，午休从 12:20 开始，15:40 放学，社团活动在 16:00 至 17:30，18:00 闭校。
      叙事跳到午休、放学后或社团活动时，要从当前钟点算入略过的课程和等待时间，不能只算抵达后的谈话。
      对话通常几分钟，课堂与社团活动按剧情耗时结算，睡眠或明确的次日转场应跨日。回忆不改变当前日期。
