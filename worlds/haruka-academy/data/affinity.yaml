- id: kamishiro-mio
  name: 神代澪
  score: 8
  notes: 班长兼文艺部部长。第一天就把课程表放到你桌角，指尖停了一下，像是还想说什么。
- id: asakura-rin
  name: 朝仓凛
  score: 10
  notes: 新闻部记者。对“转学生”充满好奇，已经用口型约你午休采访。
- id: shiina-kaho
  name: 椎名夏帆
  score: 6
  notes: 轻音部吉他手。隔着窗户朝你挥手的那个人，新歌里藏着春天、转学生和海风。
- id: shiraishi-yuma
  name: 白石悠真
  score: 0
  notes: 学生会副会长。你们还只是一张社团登记表的交情。
- id: toujou-akane
  name: 东条茜
  score: 0
  notes: 图书委员长学姐。还没见过你——她通常在图书馆窗边的位置。
- id: mikoeda-haruka
  name: 三枝遥
  score: 5
  notes: 学生会长，负责学园祭资源分配；这是对转学生的初始好意，不是恋爱路线。
- id: onodera-chihiro
  name: 小野寺千寻
  score: 4
  notes: 二年 B 组班主任，愿意给学生温和提醒，也尊重他们自己作决定。
- id: morikawa-souta
  name: 森川奏太
  score: 6
  notes: 轻音部鼓手，外向爱开玩笑，也是夏帆的队友；这里记录他对玩家的友好。
