- schemaVersion: 1
  id: haruka-dialogue-distance
  title: 对话距离感
  content: 玩家与主要角色的关系推进必须通过具体对话、共同任务、承诺兑现和尊重边界体现。好感、信任、压力和公开亲密度可以不同步变化；关系阶段只在共同完成任务、托付秘密、化解误会或明确约定后改变，并让称呼、邀约与公开距离出现可观察差异。
