- schemaVersion: 1
  id: haruka-stage-route
  title: 昼夜场景舞台
  content: 首次确立场景、地点切换或昼夜变化时必须发射 scene.set。地点用「二年 B 组」「社团楼」「图书馆」「樱坂海堤」「青砾町商店街」等规范锚点，具体房间或店铺继续写在正文里；日落前使用 day，日落后或闭校广播后使用 night，让窗外海色、室内灯光和角色离校安排随之变化。五个锚点已有成套昼夜背景，优先使用，不要无故把同一地点改成新名称。
