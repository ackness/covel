- schemaVersion: 1
  id: haruka-dialogue-distance
  title: 对话距离感
  content: 玩家与主要角色的关系推进必须通过具体对话、共同任务、承诺兑现和尊重边界体现。角色会在好感、信任、压力和公开亲密度之间产生不同步变化。
  kind: constant
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 好感
    - 信任
    - 压力
    - 公开亲密度
  insertionOrder: 410
- schemaVersion: 1
  id: haruka-school-calendar
  title: 学园祭倒计时
  content: 学园祭筹备、社团审查、考试周、采访报道和主舞台选拔是推动日常关系变化的主要事件来源。每次事件应给出可对话、可选择、可承担后果的校园情境。
  kind: triggered
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 学园祭
    - 社团审查
    - 考试
    - 采访
    - 主舞台
  insertionOrder: 420
- schemaVersion: 1
  id: haruka-romance-boundary
  title: 校园恋爱边界
  content: 恋爱描写保持 teen 分级，侧重心动、误会、等待、并肩完成目标和放学路上的对话。避免成人化描写，避免用单次选择直接跳过关系阶段。
  kind: constant
  category: style
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 校园恋爱
    - teen
    - 关系阶段
  insertionOrder: 430
- schemaVersion: 1
  id: haruka-ensemble-reactions
  title: 群像交错
  content: 主要角色彼此认识，支持角色（三枝遥、小野寺千寻、森川奏太）也会评价玩家对他人的选择。推进某段关系会影响其他角色的态度——偏袒、冷落或误会都会在群像中产生连锁反应，但核心冲突应保持青春日常质感。
  kind: triggered
  category: relationship
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 群像
    - 偏袒
    - 误会
    - 其他角色
    - 连锁
  insertionOrder: 440
- schemaVersion: 1
  id: haruka-rumor-heat
  title: 传闻热度
  content: 青砾町和遥风学园都很小。公开场合频繁独处、明显偏袒或被新闻部记录，会优先提高传闻热度与公开亲密度；私下兑现承诺、记住细节、尊重沉默，则优先提升信任、降低压力。传闻能制造机会，也会让内向或守规矩的角色退后一步。
  kind: triggered
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
  keys:
    - 传闻
    - 公开
    - 私下
    - 新闻部
    - 热度
  insertionOrder: 450
