- schemaVersion: 1
  id: haruka-school-day
  title: 校园一日节拍
  content: 八点二十分前到校准备早读，接着是上午课程和课间，十二点二十分午休，十五点四十分放学，十六点至十七点三十分社团活动，黄昏后十八点闭校。跨时段时，写出铃声、光线、天气或下一项约定的变化。每个时段通常只够做一件主要的事；错过的邀约记入约定记忆，不自动补做。
  kind: constant
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
