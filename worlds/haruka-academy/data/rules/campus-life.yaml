- schemaVersion: 1
  id: haruka-school-calendar
  title: 学园祭倒计时
  content: 学园祭倒计时十四天时预算初审，十天时考试与稿件中检，七天时主舞台预演，三天时《春日薄荷》截稿和总彩排，一天时前夜布置，零天正式开祭、夕风点灯。每到节点，二年 B 组“海风邮局”、文艺部特刊、新闻部“传闻真伪墙”、轻音部新歌和学生会流程应当牵动彼此。给玩家留下能开口商量、作选择并承担后果的事情。“学园祭筹备”显示随世界时钟变化的剩余天数，也记录筹备进度和节点结果；“文艺部存续审查”记录审查进展。叙事要写清完成了哪些工作。
  kind: evolving
  category: world
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
