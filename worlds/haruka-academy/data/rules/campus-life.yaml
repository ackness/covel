- schemaVersion: 1
  id: haruka-festival-convergence
  title: 春日薄荷与夕风点灯
  content: 祭典高潮不是彼此孤立的任务清单：文艺部《春日薄荷》可以刊登海风邮局来信或新闻部辟谣，新闻部报道能替轻音部预演争取观众，夏帆的新歌可以成为夕风点灯最后一曲，旧刊故事则能为保留社团楼提供公开理由。玩家可以优先帮助一条线，也可以通过具体交换让多条线互相支撑；成功仍要保留角色各自的代价、署名权和选择权。
  kind: evolving
