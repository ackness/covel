- schemaVersion: 1
  id: haruka-ensemble-reactions
  title: 群像交错
  content: 八名角色是同学、社团伙伴或前辈，每轮让一到两人说话。澪和凛常在二年 B 组，夏帆与奏太放学后在社团楼，悠真与遥学姐忙于学生会事务和巡查，千寻老师在课堂或值日后留在教室，茜学姐则在午休或闭馆前的图书馆。有人临时改变行程，要用任务、传闻或约定交代缘由。偏袒、冷落和误会可以牵动其他人，反应仍应符合校园日常。
  kind: triggered
