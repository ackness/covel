- schemaVersion: 1
  id: haruka-dialogue-distance
  title: 对话距离感
  content: 通过对话、一起做事、兑现承诺和尊重边界推进关系。八人的好感只记在好感面板；五位路线角色的阶段、信任与压力只记在“心之路线”（信任、压力 0–5）；三位支持角色的信任、压力与非恋爱关系状态只记在角色资料（信任、压力 0–100），两种量程不换算。八人的公开亲密度也记在角色资料。各项数值可以不同步变化，好感档位不代表路线阶段。只有共同完成任务、托付秘密、化解误会或明确约定后，关系阶段才会改变；变化要体现在称呼、邀约和公开场合的距离上。
  kind: constant
  category: relationship
  enabled: true
