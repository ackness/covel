- schemaVersion: 1
  id: haruka-ensemble-reactions
  title: 群像交错
  content: 八名预设角色彼此有班级、社团与前辈关系，但每轮只聚焦一到两名发声角色。神代澪与朝仓凛在二年 B 组最常见，椎名夏帆与森川奏太在放学后的社团楼，白石悠真与三枝遥在学生会流程和巡查中，小野寺千寻在课堂与值日后，东条茜在午休或闭馆前的图书馆。临时跨行程登场要有任务、传闻或约定解释；偏袒、冷落或误会可以产生连锁反应，但保持青春日常质感。
  kind: triggered
