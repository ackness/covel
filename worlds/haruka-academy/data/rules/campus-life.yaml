- schemaVersion: 1
  id: haruka-rumor-heat
  title: 传闻热度
  content: 青砾町和遥风学园都很小。传闻从萌芽、扩散到升温，之后可能澄清、坐实或转向。“校园传闻”在回合后结算阶段与热度；叙事按当前值写清是谁说的、在哪传开、牵涉了谁，不能让全校突然都知道。公开独处、明显偏袒或被新闻部记下，会提高热度与公开亲密度；私下兑现承诺、记住细节和尊重沉默，优先提升信任、降低压力。信任与压力按各角色的唯一记录维护，公开亲密度只记在角色资料。凛可以报道、压稿或公开辟谣；玩家也能用行动澄清，不能只靠解释。
  kind: evolving
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: flexible
