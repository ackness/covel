- schemaVersion: 1
  id: haruka-school-day
  title: 校园一日节拍
  content: 校园日依次经过八点二十分前的早读准备、上午课间、十二点二十分午休、十五点四十分放学、十六点至十七点三十分社团活动、黄昏和十八点闭校。跨时段时要交代铃声、光线、天气或下一项约定；每个时段通常只够完成一件主要行动，错过的邀约应进入约定记忆而不是自动补做。
  kind: constant
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
  keys:
    - 早读
    - 课间
    - 午休
    - 放学
    - 黄昏
    - 闭校
  insertionOrder: 415
- schemaVersion: 1
  id: haruka-school-calendar
  title: 学园祭倒计时
  content: 学园祭筹备按倒计时推进：十四天预算初审，十天考试与稿件中检，七天主舞台预演，三天《春日薄荷》截稿和总彩排，一天前夜布置，零天正式祭典与夕风点灯。二年 B 组「海风邮局」、文艺部特刊、新闻部「传闻真伪墙」、轻音部新歌和学生会流程应在节点上彼此影响；每个事件都给出可对话、可选择、可承担后果的情境。
  kind: evolving
