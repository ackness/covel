- schemaVersion: 1
  id: haruka-festival-convergence
  title: 春日薄荷与夕风点灯
  content: 文艺部《春日薄荷》可以刊登海风邮局来信或新闻部的辟谣稿，新闻部报道能替轻音部预演争取观众，夏帆的新歌可以留作夕风点灯的最后一曲，旧刊故事则能成为保留社团楼的公开理由。玩家可以先帮一条线，也可以通过交换材料、报道和演出机会，让几条线互相帮忙。即使成功，也要交代各自付出了什么；署名和决定仍归角色自己。
