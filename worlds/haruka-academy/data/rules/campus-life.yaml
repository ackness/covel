- schemaVersion: 1
  id: haruka-stage-route
  title: 场景与角色舞台
  content: >-
    首次确立场景、换地点或切换昼夜时发射 scene.set。使用“二年 B 组”“社团楼”“图书馆”“樱坂海堤”“青砾町商店街”等规范地点名，房间和店铺写在正文里。
    五处地点都有昼夜背景；日落前用日景，日落后或闭校广播后用夜景，同时写出海色、室内灯光和离校安排的变化。同一地点沿用同一名称。
    角色进出、焦点与站位改变，或更换服装、表情、姿势时发射 stage.direction，同一轮的变化合在一个 cues 数组里。用服装、表情或姿势描述选择已有立绘；没有对应图时省略视觉字段，使用默认立绘。
    凛平时穿校服、神态爱开玩笑，认真倾听或决定压稿时收起笑意；夏帆认真听社团问题时露出担忧；奏太排练时换排练服；千寻老师在商店街或海堤等校外场景可穿便装。
    角色从画面左侧或右侧离开时，分别向对应方向滑出；其余退场可淡出或溶解。清空舞台时也指定合适的转场。
  kind: constant
  category: scene
  enabled: true
  coordinate:
    position: before_plugin
  budgetClass: sticky
