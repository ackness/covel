- schemaVersion: 1
  id: haruka-rumor-heat
  title: 传闻热度
  content: 青砾町和遥风学园都很小。每条传闻按「种子—扩散—升温—澄清、坐实或转向」演化，必须记录来源、传播地点、涉及角色和当前热度，不能凭空全校皆知。公开独处、明显偏袒或被新闻部记录会提高热度与公开亲密度；私下兑现承诺、记住细节、尊重沉默则优先提升信任、降低压力。凛可以报道、压稿或公开辟谣，玩家也可以用行动改变传闻而非只靠解释。
  kind: evolving
