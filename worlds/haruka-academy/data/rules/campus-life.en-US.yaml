- id: haruka-dialogue-distance
  title: Keeping the right distance
  content: >-
    Build relationships through conversation, working together, keeping promises, and respecting boundaries. The Affinity panel holds all eight characters' affinity. Heart Routes holds stage, Trust and Pressure for the five romance routes (Trust and Pressure 0–5). The three supporting characters' profiles hold their Trust, Pressure and non-romantic relationship state (Trust and Pressure 0–100); the scales do not convert. All eight characters' Public Closeness also belongs in their profiles.
    These values can change independently. Affinity tiers do not represent route stages. A stage changes only after finishing a task together, confiding a secret, clearing up a misunderstanding, or making an explicit promise. Show the change in how they address each other, who offers invitations, and how close they stand in public.
  keys:
    - affection
    - trust
    - pressure
    - closeness
- id: haruka-school-day
  title: The school day
  content: >-
    Students arrive before 8:20 to prepare for morning reading. Morning classes and breaks lead to lunch at 12:20, dismissal at 15:40, club activities from 16:00 to 17:30, dusk, and closing at 18:00. When moving between periods, show a change in the bell, light, weather, or next appointment. Each period usually has room for one main activity. Record missed invitations in promise memory; they are not made up automatically.
  keys:
    - morning
    - break
    - lunch
    - after school
    - dusk
    - closing
- id: haruka-school-calendar
  title: Festival countdown
  content: >-
    The first budget review comes at fourteen days to go, exams and the manuscript check at ten, the main-stage preview at seven, the Spring Mint deadline and dress rehearsal at three, setup at one, and the festival and Evening Breeze Lanterns at zero.
    At each milestone, Class 2-B's Sea Breeze Post, the Literature Club's special issue, the Newspaper Club's Fact-or-Rumor Wall, the Light Music Club's song, and Student Council procedures should affect one another. Give the player something to discuss, a choice to make, and consequences to live with. Festival Prep shows the days remaining as world time passes, project progress, and milestone results. Literature Club Review tracks the review. The narrative must say what work was completed.
  keys:
    - festival
    - countdown
    - review
    - exam
    - interview
    - main stage
    - Sea Breeze Post
    - Evening Breeze Lanterns
- id: haruka-stage-route
  title: Scenes and the stage
  content: >-
    Emit scene.set when establishing a scene, changing location, or switching between day and night. Use the standard names: "Class 2-B", "Club Building", "Library", "Sakurazaka Seawall", and "Seireki Town Shopping Street". Keep individual rooms and shops in the prose.
    All five places have day and night backdrops. Use the day view before sunset and the night view after sunset or the closing announcement. Let the sea outside, indoor lighting, and plans to leave school change with it. Keep the same name for the same place.
    Emit stage.direction for entrances, exits, changes of focus or position, and changes of clothing, expression, or pose. Put the turn's changes in one cues array. Select existing portraits by clothing, expression, or pose; if none matches, omit the visual fields and use the default portrait.
    Rin usually wears her uniform and looks playful; her smile fades when she listens seriously or decides to hold a story. Kaho looks concerned when listening to club problems. Souta wears rehearsal clothes at practice. Ms. Onodera can wear casual clothes off campus, such as on the shopping street or seawall.
    Characters exiting on the left or right should slide out in that direction. Other exits can fade or dissolve. Choose a suitable transition when clearing the stage too.
  keys:
    - location
    - scene
    - sunset
    - night
    - classroom
    - Club Building
    - library
    - seawall
    - shopping street
    - portrait
    - enter
    - focus
- id: haruka-romance-boundary
  title: Romance boundaries
  content: Keep romance suitable for teens. Write about crushes, misunderstandings, waiting, reaching a goal together, and conversations on the walk home. Avoid adult content. A single choice cannot skip a relationship stage.
  keys:
    - romance
    - teen
    - relationship
- id: haruka-ensemble-reactions
  title: The ensemble
  content: >-
    The eight characters are classmates, clubmates, or seniors and juniors. Let one or two speak each turn. Mio and Rin are usually in Class 2-B; Kaho and Souta in the Club Building after school; Yuma and Haruka on Student Council business and patrols; Ms. Onodera in class or staying behind after cleaning duty; Akane in the library at lunch or before closing.
    Explain a change of schedule through a task, rumor, or appointment. Favoritism, neglect, and misunderstandings can affect others, with reactions that fit everyday school life.
  keys:
    - everyone
    - favorite
    - favoritism
    - misunderstanding
    - others
    - other characters
    - reaction
    - schedule
- id: haruka-rumor-heat
  title: Rumor heat
  content: >-
    Seireki and Harukaze Academy are small. Rumors begin, spread, and gather heat, then may be cleared up, confirmed, or redirected. Campus Rumors settles stage and heat after each turn. Follow its current values, naming who said what, where it spread, and whom it involved. The whole school cannot suddenly know.
    Being seen alone together in public, obvious favoritism, or appearing in the Newspaper Club's notes raises heat and Public Closeness. Keeping promises in private, remembering details, and respecting silences raise Trust and lower Pressure first. Keep Trust and Pressure in each character's sole record, and Public Closeness in their profile. Rin can report, hold, or publicly debunk a story. The player can also clear things up through action, beyond offering explanations.
  keys:
    - rumor
    - public
    - private
    - Newspaper Club
    - gossip
    - deny
    - denies
    - denied
    - denying
    - debunk
    - debunking
- id: haruka-festival-convergence
  title: Spring Mint and Evening Breeze Lanterns
  content: >-
    Spring Mint can print Sea Breeze Post letters or the Newspaper Club's corrections. Newspaper coverage can bring an audience to the Light Music Club's preview. Kaho's song can close the Evening Breeze Lanterns, and the back issues' story can make a public case for keeping the Club Building.
    The player can help one project first, or help several through exchanges of materials, coverage, and performance opportunities. Even success should show what each character paid for it. Their bylines and decisions remain their own.
  keys:
    - Spring Mint
    - Sea Breeze Post
    - Fact-or-Rumor Wall
    - Fact or Rumor Wall
    - song
    - Evening Breeze Lanterns
    - old issue
    - back issue
