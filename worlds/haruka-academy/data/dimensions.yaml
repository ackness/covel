routes:
  name: 心之路线
  description: 与五位可攻略角色的关系阶段、信任与压力。心动值（好感）由好感面板记录。
  schema:
    type: object
    properties:
      mio:
        type: object
        title: 神代澪
        properties:
          stage:
            type: string
            title: 阶段
            enum: [acquaintance, familiar, heartbeat, confession-eve, together]
            x-enumLabels:
              acquaintance: 初识
              familiar: 熟悉
              heartbeat: 心动
              confession-eve: 告白前夜
              together: 共同未来
          trust:
            type: integer
            title: 信任
            minimum: 0
            maximum: 5
          pressure:
            type: integer
            title: 压力
            minimum: 0
            maximum: 5
        required: [stage, trust, pressure]
        additionalProperties: false
      rin:
        type: object
        title: 朝仓凛
        properties:
          stage:
            type: string
            title: 阶段
            enum: [acquaintance, familiar, heartbeat, confession-eve, together]
            x-enumLabels:
              acquaintance: 初识
              familiar: 熟悉
              heartbeat: 心动
              confession-eve: 告白前夜
              together: 共同未来
          trust:
            type: integer
            title: 信任
            minimum: 0
            maximum: 5
          pressure:
            type: integer
            title: 压力
            minimum: 0
            maximum: 5
        required: [stage, trust, pressure]
        additionalProperties: false
      kaho:
        type: object
        title: 椎名夏帆
        properties:
          stage:
            type: string
            title: 阶段
            enum: [acquaintance, familiar, heartbeat, confession-eve, together]
            x-enumLabels:
              acquaintance: 初识
              familiar: 熟悉
              heartbeat: 心动
              confession-eve: 告白前夜
              together: 共同未来
          trust:
            type: integer
            title: 信任
            minimum: 0
            maximum: 5
          pressure:
            type: integer
            title: 压力
            minimum: 0
            maximum: 5
        required: [stage, trust, pressure]
        additionalProperties: false
      yuma:
        type: object
        title: 白石悠真
        properties:
          stage:
            type: string
            title: 阶段
            enum: [acquaintance, familiar, heartbeat, confession-eve, together]
            x-enumLabels:
              acquaintance: 初识
              familiar: 熟悉
              heartbeat: 心动
              confession-eve: 告白前夜
              together: 共同未来
          trust:
            type: integer
            title: 信任
            minimum: 0
            maximum: 5
          pressure:
            type: integer
            title: 压力
            minimum: 0
            maximum: 5
        required: [stage, trust, pressure]
        additionalProperties: false
      akane:
        type: object
        title: 东条茜
        properties:
          stage:
            type: string
            title: 阶段
            enum: [acquaintance, familiar, heartbeat, confession-eve, together]
            x-enumLabels:
              acquaintance: 初识
              familiar: 熟悉
              heartbeat: 心动
              confession-eve: 告白前夜
              together: 共同未来
          trust:
            type: integer
            title: 信任
            minimum: 0
            maximum: 5
          pressure:
            type: integer
            title: 压力
            minimum: 0
            maximum: 5
        required: [stage, trust, pressure]
        additionalProperties: false
    required: [mio, rin, kaho, yuma, akane]
    additionalProperties: false
  initialValue:
    mio: { stage: acquaintance, trust: 0, pressure: 3 }
    rin: { stage: acquaintance, trust: 0, pressure: 1 }
    kaho: { stage: acquaintance, trust: 0, pressure: 2 }
    yuma: { stage: acquaintance, trust: 0, pressure: 2 }
    akane: { stage: acquaintance, trust: 0, pressure: 1 }
  updateRule:
    只结算本轮叙事中玩家与该角色明确发生的互动。兑现承诺、记住细节、尊重沉默、托付秘密时 trust
    +1；公开偏袒、玩笑越界、逼问心意或让角色独自扛事时 pressure +1，替其分担、化解误会时 pressure -1。stage
    只能在共同完成任务、托付秘密、化解误会或明确约定等可回忆事件之后前进一级，且 trust 至少达到 初识→熟悉 1、熟悉→心动 2、心动→告白前夜
    4；共同未来只在学园祭当天或之后、双方明确确认心意时到达。不跳级、不因数值自动升级；明显伤害可退回一级。心动值不在这里记录。

festival:
  name: 学园祭筹备
  description: 四条筹备线的进度与倒计时节点。剩余天数由世界时间负责。
  schema:
    type: object
    properties:
      projects:
        type: object
        title: 筹备线
        properties:
          seaBreezePost:
            type: object
            title: 二年B组「海风邮局」
            properties:
              progress:
                type: integer
                title: 进度
                minimum: 0
                maximum: 100
              status:
                type: string
                title: 状态
                enum: [on-track, struggling, blocked, done]
                x-enumLabels:
                  on-track: 顺利
                  struggling: 吃力
                  blocked: 卡住了
                  done: 完成
              note:
                type: string
                title: 近况
                maxLength: 160
                x-i18n: true
            required: [progress, status]
            additionalProperties: false
          springMint:
            type: object
            title: 文艺部《春日薄荷》
            properties:
              progress:
                type: integer
                title: 进度
                minimum: 0
                maximum: 100
              status:
                type: string
                title: 状态
                enum: [on-track, struggling, blocked, done]
                x-enumLabels:
                  on-track: 顺利
                  struggling: 吃力
                  blocked: 卡住了
                  done: 完成
              note:
                type: string
                title: 近况
                maxLength: 160
                x-i18n: true
            required: [progress, status]
            additionalProperties: false
          rumorWall:
            type: object
            title: 新闻部「传闻真伪墙」
            properties:
              progress:
                type: integer
                title: 进度
                minimum: 0
                maximum: 100
              status:
                type: string
                title: 状态
                enum: [on-track, struggling, blocked, done]
                x-enumLabels:
                  on-track: 顺利
                  struggling: 吃力
                  blocked: 卡住了
                  done: 完成
              note:
                type: string
                title: 近况
                maxLength: 160
                x-i18n: true
            required: [progress, status]
            additionalProperties: false
          closingSong:
            type: object
            title: 轻音部新歌
            properties:
              progress:
                type: integer
                title: 进度
                minimum: 0
                maximum: 100
              status:
                type: string
                title: 状态
                enum: [on-track, struggling, blocked, done]
                x-enumLabels:
                  on-track: 顺利
                  struggling: 吃力
                  blocked: 卡住了
                  done: 完成
              note:
                type: string
                title: 近况
                maxLength: 160
                x-i18n: true
            required: [progress, status]
            additionalProperties: false
        required: [seaBreezePost, springMint, rumorWall, closingSong]
        additionalProperties: false
      milestones:
        type: object
        title: 节点
        properties:
          budgetReview:
            type: string
            title: 十四天·预算初审
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
          midCheck:
            type: string
            title: 十天·考试与中检
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
          stagePreview:
            type: string
            title: 七天·主舞台预演
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
          finalDeadline:
            type: string
            title: 三天·截稿与总彩排
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
          festivalEve:
            type: string
            title: 一天·前夜布置
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
          festivalDay:
            type: string
            title: 零天·开祭与夕风点灯
            enum: [upcoming, passed, rough, missed]
            x-enumLabels:
              upcoming: 未到
              passed: 顺利通过
              rough: 勉强过关
              missed: 错过
        required:
          [
            budgetReview,
            midCheck,
            stagePreview,
            finalDeadline,
            festivalEve,
            festivalDay,
          ]
        additionalProperties: false
    required: [projects, milestones]
    additionalProperties: false
  initialValue:
    projects:
      seaBreezePost:
        progress: 10
        status: on-track
        note: 摊位方案刚通过班会，明信片还没着落。
      springMint:
        progress: 20
        status: struggling
        note: 澪一个人在扛目录和稿件，部员不够。
      rumorWall:
        progress: 15
        status: on-track
        note: 凛在收集第一批匿名投稿。
      closingSong:
        progress: 30
        status: struggling
        note: 夏帆的新歌还缺最后一段歌词。
    milestones:
      budgetReview: upcoming
      midCheck: upcoming
      stagePreview: upcoming
      finalDeadline: upcoming
      festivalEve: upcoming
      festivalDay: upcoming
  updateRule:
    进度只在本轮叙事中玩家或角色确实完成筹备工作时增加：一次具体工作 +5~+10，一整段合作 +15，单回合最多
    +20；事故、争执、被拒稿可减少。卡住时设为 blocked，明显吃力为 struggling，完成时 progress 100 且
    done。节点在叙事中真正发生后再标记：顺利为 passed，勉强过关为 rough，错过为 missed。天数由世界时间负责，这里不记录。note
    写一句近况。

clubReview:
  name: 文艺部存续审查
  description: 文艺部因人数不足被列入合并审查名单。《春日薄荷》和公开反响是它最后的机会。
  schema:
    type: object
    properties:
      status:
        type: string
        title: 状态
        enum: [under-review, building-case, hearing-passed, saved, merged]
        x-enumLabels:
          under-review: 审查中
          building-case: 收集理由中
          hearing-passed: 初审通过
          saved: 保住了
          merged: 被合并
      support:
        type: integer
        title: 支持度
        minimum: 0
        maximum: 10
      evidence:
        type: array
        title: 有力理由
        maxItems: 8
        items:
          type: string
          maxLength: 120
    required: [status, support, evidence]
    additionalProperties: false
  initialValue:
    status: under-review
    support: 1
    evidence: []
  updateRule:
    玩家或角色在叙事中拿到具体、可公开的支持（新部员加入、旧刊故事被找到、特刊试读得到反响、学生会有人松口、签名或来信）时 support
    +1~+2，并在 evidence 加一句话；丑闻、截稿失败或冲突公开化可 -1。第一次有人主动为存续做准备时改为
    building-case。预算初审在叙事中发生后：support ≥ 4 为 hearing-passed，否则仍为
    under-review；学园祭之后按最终结果设为 saved 或 merged。澪隐瞒的翻修真相被公开时要在 evidence 中记录。

promises:
  name: 约定
  description: 你对谁许下了什么约定，以及它有没有被守住。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        to:
          type: string
          title: 对象
        promise:
          type: string
          title: 约定内容
          maxLength: 160
        status:
          type: string
          title: 状态
          enum: [pending, kept, broken, released]
          x-enumLabels:
            pending: 待兑现
            kept: 已守住
            broken: 已失约
            released: 已解除
      required: [to, promise, status]
      additionalProperties: false
  initialValue: {}
  updateRule:
    玩家在本轮叙事中明确答应某个角色的具体事情（一起回家、帮忙、保密、赴约）时新增一条，ID 用简短英文 kebab-case，状态
    pending；客套和模糊的“下次吧”不算。叙事中兑现为 kept，错过或违背为 broken，对方明确说不用了为 released。不删除条目。

rumors:
  name: 校园传闻
  description: 青砾町很小，传闻传得很快。谁先说、谁相信、谁因此靠近或退后。
  schema:
    type: object
    additionalProperties:
      type: object
      properties:
        rumor:
          type: string
          title: 传闻
          maxLength: 160
          x-i18n: true
        stage:
          type: string
          title: 阶段
          enum: [seed, spreading, heating, cleared, confirmed, redirected]
          x-enumLabels:
            seed: 萌芽
            spreading: 扩散
            heating: 升温
            cleared: 已澄清
            confirmed: 被坐实
            redirected: 转向
        heat:
          type: integer
          title: 热度
          minimum: 0
          maximum: 5
      required: [rumor, stage, heat]
      additionalProperties: false
  initialValue:
    vending-machine:
      rumor: 日落时自动贩卖机掉出的饮料，会暴露你心里在想谁。
      stage: spreading
      heat: 2
    lit-window:
      rumor: 社团楼十八点后仍亮着的窗口，会替某个愿望保密。
      stage: spreading
      heat: 1
    window-seat:
      rumor: 东条学姐只给特别的人留窗边座位。
      stage: spreading
      heat: 1
  updateRule:
    传闻按 seed → spreading → heating → cleared / confirmed / redirected
    演化，只在叙事明确出现传播、澄清或证实时推进。新传闻（例如关于转学生的）在叙事中第一次被人说出时新增，ID 用简短英文 kebab-case，阶段
    seed、热度 1。公开独处、明显偏袒或被新闻部记录 heat +1；凛压稿、当事人用行动澄清或话题被新事件盖过 heat -1。不凭空让传闻全校皆知。

geography:
  name: 地理
  schema:
    type: object
    properties:
      overview:
        type: string
        title: 概况
        x-i18n: true
      regions:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              title: 名称
              x-i18n: true
            description:
              type: string
              title: 描述
              x-i18n: true
            climate:
              type: string
              title: 气候
              x-i18n: true
            landmarks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    title: 名称
                    x-i18n: true
                  description:
                    type: string
                    title: 描述
                    x-i18n: true
                additionalProperties: false
              title: 地标
          additionalProperties: false
        title: 地区
    additionalProperties: false
  initialValue:
    overview: 位于青砾町海边坡地的私立高中，教学楼、社团楼、图书馆、车站商店街和通往海堤的樱坂构成主要活动范围。地点距离很近，从午休铃到十八点闭校广播之间的路线选择会决定玩家遇见谁，也让偶遇和传闻自然发生。
    regions:
      - name: 二年 B 组
        description: 玩家转入的班级，靠窗最后一排能看见操场和远处海面。早读前、十分钟课间、十二点二十分的午休、十五点四十分后的值日和小测前空白都是对话起点。
        climate: 春季通风明亮，午后常有海风吹动窗帘；下雨天玻璃会起雾，教室声音变轻。
        landmarks:
          - name: 靠窗座位
            description: 玩家最初的座位，神代澪会把资料放在桌角，朝仓凛常从后排探身搭话。
          - name: 黑板旁公告栏
            description: 贴着学园祭倒计时、值班表、社团招募、补考名单和二年 B 组「海风邮局」摊位分工；被改动的排班最容易引出误会。
          - name: 后排储物柜
            description: 同学们会把社团传单、借来的漫画和写错名字的便签塞在这里。
      - name: 社团楼
        description: 老旧三层木造楼，十六点后会被各社团的声音填满，十八点闭校广播后原则上必须熄灯。这里是文艺部存续、轻音部排练和学生会巡查交汇的地点。
        climate: 傍晚偏冷，楼道里常有乐器声、旧纸味和咖啡香；日落后只剩少数窗口亮着暖黄灯。
        landmarks:
          - name: 文艺部活动室
            description: 三层尽头的小房间，堆满旧书、学园祭特刊和手写稿，正赶制题为《春日薄荷》的特刊并面临合并审查。
          - name: 轻音部练习室
            description: 一层靠操场的练习室，隔音效果一般，吉他声会漏到走廊。
          - name: 社团楼屋顶
            description: 白石悠真在十七点四十分巡查后常会停留的地方，可以看到操场灯、海面和仍未熄灯的社团窗口。
          - name: 二层走廊公告板
            description: 新闻部会在这里贴采访招募、学园祭报道计划和容易引发议论的短讯。
      - name: 图书馆
        description: 教学楼后方的两层小图书馆，十二点二十分至十三点和放学后开放，十七点三十分闭馆。窗边座位下午会被海光照亮，适合安静对话、补习、查资料和文艺部取材。
        climate: 安静干燥，春天常有纸张、木书架和薄荷糖的味道。
        landmarks:
          - name: 二楼窗边长桌
            description: 澪喜欢在这里校对稿件，也会把真正焦虑的表情藏在书页后。
          - name: 旧刊架
            description: 保存历年学园祭特刊；最旧一本夹着东条茜姐姐当年的签名页，小野寺千寻学生时代的笔名也藏在其中。
          - name: 借阅台便签盒
            description: 东条茜会用短便签提醒归还日期、留座或推荐下一本书；熟悉后，便签上的称呼会悄悄改变。
      - name: 樱坂海堤
        description: 从校门通往海边的坡道，步行到车站约十二分钟，春天樱花沿路开放。这里适合放学后并肩走、短暂停步和说出教室里难以开口的话。
        climate: 风大，雨后路面反光，傍晚能听到海浪和远处电车声。
        landmarks:
          - name: 自动贩卖机
            description: 常年只剩柠檬汽水、薄荷苏打和罐装热咖啡。学生传言在日落那一刻投币，最先掉下来的饮料会暴露心里正在想谁。
          - name: 海堤长椅
            description: 椎名夏帆偶尔会在这里写歌词，白石悠真也会绕路经过；雨后长椅一端总是先干，成了「给约会的人留的座位」这条传闻的来源。
      - name: 青砾町商店街
        description: 车站前两条短短的商店街，十七点后迎来放学人潮。书店、花店、家庭餐厅、乐器行和便利店构成校园外的日常据点，也共同赞助学园祭闭幕的「夕风点灯」。
        climate: 傍晚灯牌很亮，雨天会有伞和校服挤在窄檐下。
        landmarks:
          - name: 海猫书房
            description: 文艺部常来的独立书店，老板保存着过去十年的学园祭刊物，并为《春日薄荷》特刊提供最后一批再生纸。
          - name: 橙屋家庭餐厅
            description: 适合多人碰头、补习和把严肃话题伪装成点餐闲聊。
          - name: 星砂乐器行
            description: 轻音部购买琴弦和拨片的地方，夏帆会在试音角落停很久；主舞台彩排前三天，店里会替学生免费检查一件乐器。
      - name: 行政楼与中庭
        description: 教学楼和社团楼之间的流程中枢。学生会室保存预算表、场地图和社团登记，楼下中庭则是午休公告与学园祭预演最公开的舞台。
        climate: 白天明亮嘈杂，放学后迅速安静；学生会室常到十八点仍亮着灯。
        landmarks:
          - name: 学生会室
