geography:
  overview: 位于青砾町海边坡地的私立高中，教学楼、社团楼、图书馆、车站商店街和通往海堤的樱坂构成主要活动范围。地点距离很近，偶遇和传闻会自然发生。
  regions:
    - name: 二年 B 组
      description: 玩家转入的班级，靠窗最后一排能看见操场和远处海面。课间、午休、值日和小测前的短暂空白都是对话起点。
      climate: 春季通风明亮，午后常有海风吹动窗帘；下雨天玻璃会起雾，教室声音变轻。
      landmarks:
        - name: 靠窗座位
          description: 玩家最初的座位，神代澪会把资料放在桌角，朝仓凛常从后排探身搭话。
        - name: 黑板旁公告栏
          description: 贴着学园祭倒计时、值班表、社团招募、补考名单和临时通知。
        - name: 后排储物柜
          description: 同学们会把社团传单、借来的漫画和写错名字的便签塞在这里。
    - name: 社团楼
      description: 老旧三层木造楼，放学后会被各社团的声音填满。这里是文艺部存续、轻音部排练和学生会巡查交汇的地点。
      climate: 傍晚偏冷，楼道里常有乐器声、旧纸味和咖啡香。
      landmarks:
        - name: 文艺部活动室
          description: 三层尽头的小房间，堆满旧书、学园祭特刊和手写稿，正面临合并审查。
        - name: 轻音部练习室
          description: 一层靠操场的练习室，隔音效果一般，吉他声会漏到走廊。
        - name: 社团楼屋顶
          description: 白石悠真傍晚巡查时常会停留的地方，可以看到操场灯和海面。
        - name: 二层走廊公告板
          description: 新闻部会在这里贴采访招募、学园祭报道计划和容易引发议论的短讯。
    - name: 图书馆
      description: 教学楼后方的两层小图书馆，窗边座位下午会被海光照亮。适合安静对话、补习、查资料和文艺部取材。
      climate: 安静干燥，春天常有纸张、木书架和薄荷糖的味道。
      landmarks:
        - name: 二楼窗边长桌
          description: 澪喜欢在这里校对稿件，也会把真正焦虑的表情藏在书页后。
        - name: 旧刊架
          description: 保存历年学园祭特刊，能发现文艺部曾经辉煌的痕迹。
    - name: 樱坂海堤
      description: 从校门通往海边的坡道，春天樱花沿路开放。这里适合放学后并肩走、短暂停步和说出教室里难以开口的话。
      climate: 风大，雨后路面反光，傍晚能听到海浪和远处电车声。
      landmarks:
        - name: 自动贩卖机
          description: 学生常在这里买热饮，交换不方便在教室说的话。
        - name: 海堤长椅
          description: 椎名夏帆偶尔会在这里写歌词，白石悠真也会绕路经过。
    - name: 青砾町商店街
      description: 车站前两条短短的商店街，书店、花店、家庭餐厅、乐器行和便利店构成校园外的日常据点。
      climate: 傍晚灯牌很亮，雨天会有伞和校服挤在窄檐下。
      landmarks:
        - name: 海猫书房
          description: 文艺部常来的独立书店，老板保存着过去十年的学园祭刊物。
        - name: 橙屋家庭餐厅
          description: 适合多人碰头、补习和把严肃话题伪装成点餐闲聊。
        - name: 星砂乐器行
          description: 轻音部购买琴弦和拨片的地方，夏帆会在试音角落停很久。
factions:
  - id: student-council
    name: 遥风学生会
    description: 负责学园祭、社团预算、活动室分配和校内纪律。它代表规则与流程，也承受老师、社团和学生之间的多重压力。
    type: political
    influence: major
    leader: 学生会长・三枝遥
    headquarters: 行政楼二层・学生会室
    relations:
      - targetId: literature-club
        type: oversight
        description: 因人数不足，学生会正在评估文艺部是否保留独立活动室。
      - targetId: light-music-club
        type: scheduling
        description: 轻音部需要学生会批准主舞台排练时段和音量申请。
  - id: literature-club
    name: 文艺部
    description: 老牌小社团，成员少但坚持制作学园祭刊物。旧活动室和历年特刊是它的精神核心。
    type: guild
    influence: minor
    leader: 神代澪
    headquarters: 社团楼三层・文艺部活动室
    relations:
      - targetId: news-club
        type: friendly-rivalry
        description: 常因刊物选题与新闻部争抢采访对象。
  - id: news-club
    name: 新闻部
    description: 掌握校内传闻和学园祭报道权，行动力强，界限感时好时坏。一次采访可能带来机会，也可能放大误会。
    type: guild
    influence: minor
    leader: 朝仓凛
    headquarters: 社团楼二层・新闻部编辑室
    relations:
      - targetId: student-council
        type: negotiated
        description: 需要学生会批准采访权限，也常让学生会头疼。
  - id: light-music-club
    name: 轻音部
    description: 以学园祭主舞台为目标的乐队社团，气氛自由但排练压力很大。成员常把认真说成随便玩玩。
    type: guild
    influence: minor
    leader: 椎名夏帆
    headquarters: 社团楼一层・练习室
    relations:
      - targetId: news-club
        type: publicity
        description: 新闻部的报道能帮轻音部拉票，也会把排练失误写成热门话题。
  - id: class-2b
    name: 二年 B 组
    description: 玩家转入的班级，是日常关系、值日、午休、传闻和班级学园祭企划的核心舞台。
    type: other
    influence: major
    leader: 班主任・小野寺千寻
    headquarters: 教学楼二层・二年 B 组教室
    relations:
      - targetId: literature-club
        type: member-overlap
        description: 神代澪同时是班长和文艺部部长，班级事务常与社团压力叠在一起。
      - targetId: news-club
        type: rumor-source
        description: 朝仓凛在班级里收集传闻，也会保护她真正重视的人。
  - id: shopping-street
    name: 青砾町商店街
    description: 车站前的小型商业区，学生放学后购买材料、补习、偶遇和绕路回家的地方。
    type: other
    influence: minor
    leader: 商店街会长・海猫书房老板
    headquarters: 青砾町车站前
powerSystem:
  name: 好感与距离感
  type: other
  description: 本世界的核心变化来自角色对玩家的信任、好奇、依赖、嫉妒、压力和边界感。它是对话模式的关系推进系统。
  rules:
    - 关系推进依赖具体事件和对话选择，直接越界会降低信任。
    - 同一角色的好感、压力和公开亲密度可以不同步变化。
    - 学园祭筹备、考试、社团危机和传闻会推动角色关系发生阶段性变化。
    - 好感代表心动，信任代表愿意托付秘密，压力代表现实负担，公开亲密度代表周围同学怎样解读这段关系。
    - 玩家兑现承诺、记住细节、尊重沉默时，信任优先上升；公开偏袒、玩笑越界或逼问心意时，压力和传闻热度优先上升。
  tiers:
    - name: 初识
      rank: 1
      description: 能进行普通对话，角色会保持礼貌距离。
    - name: 熟悉
      rank: 2
      description: 角色愿意分享日常烦恼或邀请玩家参与活动。
    - name: 心动
      rank: 3
      description: 角色会出现明显在意、试探或独处邀约。
    - name: 告白前夜
      rank: 4
      description: 关系接近确认，需要处理误会、承诺或未来选择。
    - name: 共同未来
      rank: 5
      description: 角色与玩家确认彼此位置，并一起面对学园祭后的选择。
history:
  - era: 十年前
    name: 遥风学园迁至海边校区
    description: 学园搬到青砾町坡地，新校区保留了旧社团楼作为传统象征。
    significance: major
  - era: 七年前
    name: 旧社团楼保留运动
    description: 第一届搬迁生发起签名，保住了木造旧社团楼。文艺部和轻音部都把这件事视为社团传统。
    significance: minor
  - era: 三年前
    name: 春日学园祭改制
    description: 学园祭从班级展示改为社团和班级联合企划，学生会权力扩大。
    significance: major
  - era: 去年
    name: 轻音部主舞台失误
    description: 轻音部在学园祭预演中设备故障，差点失去今年主舞台资格。夏帆对此一直耿耿于怀。
    significance: minor
  - era: 本学期
    name: 文艺部合并审查
    description: 文艺部因人数不足被列入合并名单，学园祭刊物成为保留社团的最后机会。
    significance: major
  - era: 近日
    name: 转学生到来
    description: 玩家转入二年 B 组，成为班级、文艺部、新闻部、轻音部和学生会共同注意到的新变量。
    significance: major
economy:
  currencies:
    - name: 零用钱
      symbol: 円
      description: 用于购买饮料、便当、社团材料和放学后的约会小物。
    - name: 人情
      description: 通过帮忙值日、搬器材、保守秘密和陪伴练习积累的软性资源。
  resources:
    - 社团预算
    - 学园祭摊位名额
    - 采访许可
    - 练习室预约时间
    - 特刊稿件页数
    - 主舞台彩排时段
    - 班级值日交换
    - 放学后同行时间
  tradeNotes: 资源交换常通过人情完成。一次帮忙搬器材、替人值日、保守秘密或陪某人练习，往往比金钱更重要。花钱适合购买饮料、便当、花束、琴弦和刊物材料；关系推进依赖承诺兑现。
socialStructure:
  classes:
    - name: 转学生
      rank: 1
      description: 玩家初始身份，容易被关注，也容易被传闻包围。空白身份让玩家能进入不同小圈子。
    - name: 班级干部
      rank: 2
      description: 负责班级事务，掌握活动安排和同学关系。
    - name: 社团核心成员
      rank: 3
      description: 推动学园祭企划的人，常把私人情绪藏进工作里。
    - name: 学生会成员
      rank: 4
      description: 代表规则与秩序，也承受来自老师和学生的双重压力。
    - name: 商店街熟人
      rank: 5
      description: 书店老板、乐器行店员和家庭餐厅员工等校园外熟人，会成为偶遇和消息来源。
  races:
    - name: 普通学生
      description: 没有超自然身份，情绪、成绩、家庭和未来选择构成主要矛盾。
      traits:
        - 对他人的评价敏感
        - 在集体生活中隐藏真实想法
        - 用社团、成绩和玩笑包装自己的不安
  notes: 角色关系以班级、社团、学生会和放学后路线交织。公开关系变化会引发传闻；私下承诺、共同任务和称呼变化会推动亲密感。
tone:
  genres:
    - 校园恋爱
    - 青春日常
    - 轻微群像
  contentRating: teen
  narrativeStyle: 细腻、克制、对话优先。用动作和停顿表达情绪，避免夸张戏剧化和成人化描写。
  themes:
    - 转学后的归属感
    - 学园祭前的共同目标
    - 暧昧与误会
    - 社团存续
    - 青春期的自我确认
    - 小城传闻与公开视线
    - 规则与私心的平衡
    - 共同创作带来的亲密感
mechanics:
  combatStyle: none
  difficulty: easy
  skillSystem: 通过对话选择、共同活动、承诺兑现和学园祭任务推动关系。关注好感、信任、压力、传闻热度、公开亲密度和学园祭倒计时。
  customRules:
    - 每轮尽量让一到两名主要角色成为对话焦点。
    - 角色表达喜欢时保持含蓄，优先使用试探、玩笑、沉默和行动。
    - 学园祭倒计时会自然制造任务压力。
    - 玩家可以选择加入社团、帮忙筹备、调查传闻或单独陪伴某个角色。
    - 场景短句应提供三到四个自然说法，覆盖温柔、直率、观察和轻微玩笑等不同语气。
    - 同一轮只推进一个清晰情绪节点，避免一次解决多个角色的核心矛盾。
    - 公开场合优先影响传闻热度和公开亲密度，私下场合优先影响信任和压力。
    - 对话模式下，分支回复应像玩家自然会说的话，避免系统化任务按钮口吻。
startingConditions:
  openingScenario: 四月的第二个周一，你作为转学生来到遥风学园二年 B
    组。班主任刚把你介绍完，教室里还残留着粉笔灰和海风的味道。靠窗最后一排空着，班长神代澪把课程表放到桌角，新闻部的朝仓凛在后排举起采访本，窗外传来轻音部试音的吉他声。门口经过的学生会副会长白石悠真把社团登记表交给老师，黑板旁公告栏写着春日学园祭还有二十一天。
  startingLocation: 二年 B 组・靠窗座位
  playerConstraints:
    - 玩家是二年级转学生。
    - 初始没有固定社团。
    - 所有恋爱推进必须保持 teen 内容尺度。
    - 初始与四名主要角色都处于初识阶段，需要通过具体事件建立信任。
    - 玩家可以选择转学原因，但应服务于校园日常和关系推进。
  startingResources:
    allowance: 3000
    rumorHeat: 1
    festivalDaysLeft: 21
    trustSeed: 5
  openingHook: 转学第一天，春风把四个人的视线带到你身上。
  openingChips:
    - 靠窗新座位
    - 学园祭倒计时
    - 文艺部危机
    - 放学后的海堤
    - 社团登记表
    - 新闻部采访本
