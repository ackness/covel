      significance: major
    - era: 七年前
      name: 旧社团楼保留运动
      description: 第一届搬迁生发起签名，保住了木造旧社团楼。文艺部和轻音部都把这件事视为社团传统。
      significance: minor
    - era: 三年前
      name: 春日学园祭改制
      description: 学园祭从班级展示改为社团和班级联合企划，学生会权力扩大。
      significance: major
    - era: 两年前
      name: 夕风点灯成为闭幕传统
      description: 商店街把剩余彩灯借给学园，闭幕时从中庭到樱坂逐盏点亮。学生开始把「和谁一起看最后一盏灯」当作不肯承认的约会暗号。
      significance: minor
    - era: 去年
      name: 轻音部主舞台失误
      description: 轻音部在学园祭预演中设备故障，差点失去今年主舞台资格。夏帆对此一直耿耿于怀。
      significance: minor
    - era: 本学期
      name: 文艺部合并审查
      description: 文艺部因人数不足被列入合并名单，学园祭刊物成为保留社团的最后机会。
      significance: major
    - era: 近日
      name: 转学生到来
      description: 玩家转入二年 B 组，成为班级、文艺部、新闻部、轻音部和学生会共同注意到的新变量。
      significance: major
