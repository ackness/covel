- id: kamishiro-mio
  name: Mio Kamishiro
  notes: Class President and Club President of the Literature Club. On the first day, she placed the schedule at the corner of your desk, her fingertips pausing for a moment as if she wanted to say more.
- id: asakura-rin
  name: Rin Asakura
  notes: Reporter for the News Club. Full of curiosity about the Transfer Student, she has already mouthed words inviting you to a lunchtime interview.
- id: shiina-kaho
  name: Kaho Shiina
  notes: Guitarist for the Light Music Club. She is the person waving at you through the window; her new song hides spring, the transfer student, and the sea breeze.
- id: shiraishi-yuma
  name: Yuma Shiraishi
  notes: Vice President of the Student Council. You only know each other through a club registration form.
- id: toujou-akane
  name: Akane Toujou
  notes: Akane Toujou, Head Librarian and senior. She hasn't met you yet—she usually sits by the library window.
