- id: kamishiro-mio
  name: Mio Kamishiro
  notes: Class president and head of the Literature Club. On your first day she set the class schedule on the corner of your desk, and her fingertips lingered there as if she wanted to say something more.
- id: asakura-rin
  name: Rin Asakura
  notes: Newspaper Club reporter. Dying to know all about "the transfer student" — she has already mouthed an invitation to a lunchtime interview.
- id: shiina-kaho
  name: Kaho Shiina
  notes: Light Music Club guitarist. The one who waved at you through the window; her new song hides spring, a transfer student, and the sea breeze.
- id: shiraishi-yuma
  name: Yuma Shiraishi
  notes: Student Council vice president. So far, all the two of you share is a club registration form.
- id: toujou-akane
  name: Akane Toujou
  notes: A third-year senpai who chairs the Library Committee. She hasn't met you yet — she's usually by the window in the library.
- id: mikoeda-haruka
  name: Haruka Saegusa
  notes: The Student Council president who allocates festival resources. This is initial goodwill toward the transfer student, not a romance route.
- id: onodera-chihiro
  name: Chihiro Onodera
  notes: Class 2-B’s homeroom teacher, who offers gentle guidance and respects her students’ own decisions.
- id: morikawa-souta
  name: Souta Morikawa
  notes: The Light Music Club’s outgoing, joking drummer and Kaho’s bandmate. This records his friendliness toward the player.
