  initialValue:
    openingScenario: The second Monday of April, 8:20 AM, ten minutes before the morning reading bell. You arrive as a Transfer Student at Class 2-B in Haruka Academy, where chalk dust and sea breeze still linger in the classroom. The last window seat is empty; Class President Mio Kamishiro places the schedule on her desk corner; Rin Asakura from the News Club raises her notebook in the back row; guitar sounds from the Light Music Club's tuning drift in from outside. Akane Toujou... wait, Yuma Shiraishi from the Student Council Vice President hands the club registration form to the teacher; the Bulletin Board by the Blackboard reads 'Spring School Festival in 21 days.' Your immediate options are responding to Mio's invitation for a campus tour or Rin's lunch break interview; the guitar music and club registration will guide your after-school plans.
    startingLocation: Class 2-B, window seat
    playerConstraints:
      - The player is a second-year Transfer Student.
      - No fixed Club initially.
      - All romantic progression must maintain teen content standards.
      - Initially, relationships with Mio Kamishiro, Rin Asakura, Kaho Shiina, and Yuma Shiraishi—all Opening focus characters—are at the Acquaintance Stage; Akane Toujou has not yet appeared and needs to be naturally encountered by the player visiting the Library.
      - The player may choose their reason for transferring, but it should serve campus daily life and Relationship Progression.
    openingHook: Before the morning reading bell rings, do you respond to the Class President's invitation for a tour, or the News Club's lunch break interview?
    openingChips:
      - Ask Mio to show me around campus
      - Agree to Rin's lunch break interview
      - Clarify the club registration deadline
      - Remember that guitar melody from outside the window
