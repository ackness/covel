mechanics:
  name: Play Style
  schema:
    properties:
      combatStyle:
        title: Combat
      difficulty:
        title: Difficulty
      skillSystem:
        title: Checks
      customRules:
        title: House rules
  initialValue:
    skillSystem: Advance relationships through dialogue choices, shared activities, keeping promises, and School Festival tasks. Monitor Affection, Trust, Pressure, Rumor Heat, Public Closeness, and the School Festival Countdown.
    customRules:
      - In each round, try to make one or two main characters the focus of the conversation.
      - Keep expressions of affection subtle; prioritize hints, jokes, silence, and actions.
      - The School Festival Countdown naturally creates task pressure.
      - Players can choose to join the club, help with preparations, investigate rumors, or spend time alone with a specific character.
      - Short scene prompts should offer three to four natural phrasings, covering tones such as gentle, direct, observant, and lightly teasing.
      - Advance only one clear emotional Milestone per round; avoid resolving core conflicts for multiple characters at once.
      - Public settings primarily affect Rumor Heat and Public Closeness, while private settings primarily affect Trust and Pressure.
      - In dialogue mode, branching responses should sound like what a player would naturally say, avoiding the tone of systemized task buttons.
      - A school day progresses through pre-morning reading, morning breaks, lunch break, after school, dusk, and post-closure; whenever there is a significant time shift, describe the bell rings, lighting, weather, or the next appointment.
      - Use Class 2-B as an anchor for pre-morning reading and breaks; during lunch, go to the classroom, Library, or Courtyard; after school, enter the Club Building and Shopping Street; dusk is suitable for the Sakurazaka Seawall and the Club Building Rooftop.
      - When establishing a scene for the first time, switching locations, or when day/night changes, use standard location names to trigger scene.set; the classroom, Club Building, Library, Sakurazaka Seawall, and Seireki Town Shopping Street prioritize hitting the world's built-in day/night backgrounds.
      - Use 'day' before sunset, and 'night' after sunset, after the closing announcement, or in explicitly nighttime segments; when switching variants, ensure that lighting, the color of the sea outside the window, and whether characters should leave school change accordingly.
      - Emit stage.direction when characters enter, exit, become the focus of speech, change position, or alter clothing/expression/posture. Merge all changes in a single turn into one cues array; omit visual fields and use the default sprite if no corresponding visual variant exists.
      - New character appearances must align with Usual Schedule or be explained by ad-hoc tasks; each turn focuses on one to two speaking characters, while others enter via passing by, notes, Rumor, or the next Promise—do not cram all eight characters into one scene simultaneously.
      - "Key School Festival Milestones are: budget preliminary review at 14 days countdown, exam and manuscript mid-check at 10 days, main stage rehearsal at 7 days, special issue deadline and full dress rehearsal at 3 days, eve-of-festival setup at 1 day, and the official festival with Evening Wind Lighting at 0 days."
      - Rumors evolve through 'Seed—Spreading—Heating up—Clarify/Confirm/Redirected'; each rumor must have a source, spread location, and affected characters—it cannot simply become known school-wide out of nowhere.
