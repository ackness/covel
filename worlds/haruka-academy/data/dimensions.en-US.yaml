mechanics:
  name: Play Style
  schema:
    properties:
      combatStyle:
        title: Combat
      difficulty:
        title: Difficulty
      skillSystem:
        title: Checks
      customRules:
        title: House rules
  initialValue:
    skillSystem: Relationships move forward through dialogue choices, activities together, promises kept, and festival tasks. Keep an eye on Affection, Trust, Pressure, Rumor Heat, Public Closeness, and the festival countdown.
    customRules:
      - Each turn, try to keep one or two main characters at the center of the conversation.
      - Characters keep their feelings understated when they like someone; hints, jokes, silences, and actions come first.
      - The festival countdown naturally puts pressure on everyone's tasks.
      - The player can choose to join a club, help with festival prep, look into a rumor, or spend time alone with one character.
      - The short reply options should offer three or four natural ways to say something, covering different tones such as gentle, direct, observant, and lightly teasing.
      - Move only one clear emotional beat forward per turn; don't resolve the core conflicts of several characters at once.
      - Public scenes mainly affect Rumor Heat and Public Closeness; private scenes mainly affect Trust and Pressure.
      - In dialogue mode, the reply options should sound like things the player would naturally say, not like task buttons in a system.
      - A school day moves through before morning reading, the morning breaks, lunch, after school, dusk, and after closing; whenever the story clearly moves to a new time slot, mention the bell, the light, the weather, or the next plan.
      - Before morning reading and during breaks, Class 2-B is the anchor; at lunch the player can go to the classroom, the library, or the courtyard; after school, the Club Building and the shopping street; dusk is for Sakurazaka Seawall and the Club Building Rooftop.
      - When a scene is first established, the location changes, or day turns to night, emit scene.set with a standard location name; the classroom, Club Building, Library, Sakurazaka Seawall, and Seireki Town Shopping Street should match the world's built-in day and night backdrops first.
      - Use day before sunset, and night after sunset, after the closing announcement, or in a clearly nighttime passage; when the variant switches, the lighting, the color of the sea outside the window, and whether characters should have gone home change with it.
      - Emit stage.direction when characters enter, leave, become the focus of the conversation, change position, or change outfit, expression, or pose; merge every change in a turn into one cues array, and when there is no matching visual variant, leave out the visual fields and use the default portrait.
      - A character's entrance must fit their Usual Schedule or be explained by a one-off task; each turn focuses on one or two speaking characters, and the others come in by passing by, through notes, rumors, or the next appointment — never cram all eight into one scene.
      - "The key festival milestones on the countdown are: the first budget review at fourteen days, exams and the manuscript check at ten, the main-stage preview at seven, the special-issue deadline and the dress rehearsal at three, festival-eve setup at one, and at zero the festival itself and the Evening Wind Lighting."
      - Rumors go seed → spreading → heating up → cleared / confirmed / redirected; every rumor needs a source, a place where it spread, and the characters it affects, and it never becomes known across the whole school out of nowhere.
