  updateRule: Settle only interactions between the player and that character that this turn's narrative actually shows. trust +1 for keeping a promise, remembering a detail, respecting a silence, or sharing a secret. pressure +1 for favoritism in public, a joke that goes too far, pushing for their feelings, or leaving them to carry something alone; pressure -1 for sharing the load or clearing up a misunderstanding. stage moves up one step only after a memorable event — something finished together, a secret shared, a misunderstanding cleared up, or an explicit promise — and only when trust is at least 1 for acquaintance → familiar, 2 for familiar → heartbeat, and 4 for heartbeat → confession-eve. together is reached only on or after festival day, when both of them explicitly confirm their feelings. Never skip a stage or move up on numbers alone; real hurt can drop the stage by one. Affection is not tracked here.
