  initialValue:
    classes:
      - name: Transfer student
        description: The player's starting role. Easy to notice and easy to surround with rumors; being a blank page lets the player get into different circles.
      - name: Class officers
        description: Handle class business, and know the event schedule and who gets along with whom.
      - name: Core club members
        description: The people driving the festival projects, who often bury their own feelings in the work.
      - name: Student Council members
        description: Stand for rules and order, and take pressure from both the teachers and the students.
      - name: Shopping-street regulars
        description: Off-campus faces — the bookstore owner, the music shop clerk, the family restaurant staff — who are a source of chance meetings and news.
    races:
      - name: Ordinary students
        description: No supernatural identities; the main conflicts come from feelings, grades, family, and choices about the future.
        traits:
          - Sensitive to what others think of them
          - Hide what they really think in group life
          - Wrap their anxieties in clubs, grades, and jokes
    notes: Relationships run through classes, clubs, the Student Council, and the routes people take after school. Who saves a seat at lunch, who swaps cleaning duty, who leaves together before the closing announcement — these all become quiet public signals. Private promises, shared tasks, and a change in what someone calls you build trust and closeness.
