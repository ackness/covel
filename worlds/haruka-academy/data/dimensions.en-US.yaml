  updateRule: Add an entry (short English kebab-case ID, status pending) when the player explicitly agrees to something specific for a character this turn — walking home together, helping out, keeping a secret, showing up somewhere. Pleasantries and vague "maybe next time" do not count. Set kept when fulfilled on the page, broken when missed or betrayed, released when the other person clearly lets it go. Never delete entries.
rumors:
  name: Campus Rumors
  description: It is a small seaside town and rumors travel fast — who started it, who believes it, who moves closer or away because of it.
  schema:
    additionalProperties:
      properties:
        rumor:
          title: Rumor
        stage:
          title: Stage
          x-enumLabels:
            seed: Seed
            spreading: Spreading
            heating: Heating up
            cleared: Cleared
            confirmed: Confirmed
            redirected: Redirected
        heat:
          title: Heat
  initialValue:
    vending-machine:
      rumor: Whatever drink the vending machine drops at sunset reveals who you are thinking about.
    lit-window:
      rumor: A clubhouse window still lit after six keeps someone's wish secret.
    window-seat:
      rumor: Akane only saves the window seat for someone special.
  updateRule: Rumors move seed → spreading → heating → cleared, confirmed, or redirected, advancing only when the narrative shows them spread, cleared, or proven. Add a new rumor (short English kebab-case ID, stage seed, heat 1) the first time someone says it on the page — for example, one about the transfer student. Heat +1 for being seen alone together, obvious favoritism, or the News Club writing it down; heat -1 when Rin holds the story, someone disproves it through action, or a newer event buries it. Never make a rumor school-wide out of nowhere.
geography:
  name: Geography
  schema:
    properties:
      overview:
        title: Overview
      regions:
        items:
          properties:
            name:
              title: Name
            description:
              title: Description
            climate:
              title: Climate
            landmarks:
              items:
                properties:
                  name:
                    title: Name
                  description:
                    title: Description
              title: Landmarks
        title: Regions
  initialValue:
    overview: A private high school located on a seaside slope in Seireki Town. The main activity areas consist of the classroom building, Club Building, Library, station Shopping Street, and Sakurazaka leading to the seawall. Locations are close together; route choices between the lunch bell and the 6 PM closing broadcast determine who players encounter, naturally creating chance meetings and Rumors.
    regions:
      - name: Class 2-B
        description: The Class the player transfers into. The last seat by the window offers a view of the playground and the distant sea. Moments before morning reading, during ten-minute breaks, at the 12:20 PM lunch break, after 3:40 PM duty shifts, and before quizzes serve as Starting points for conversation.
        climate: Spring brings bright ventilation, with sea breezes often rustling the curtains in the Afternoon. On rainy days, glass fogs up, and classroom sounds become softer.
        landmarks:
          - name: Window Seat
            description: The player's initial seat. Mio Kamishiro places materials on the corner of the desk, while Rin Asakura often leans forward from the back row to strike up conversation.
          - name: Bulletin Board by the Blackboard
            description: Pinned here are the School Festival Countdown, duty roster, Club recruitment notices, makeup exam lists, and the 'Sea Breeze Post' booth assignments for Class 2-B. Altered schedules are the easiest source of misunderstandings.
          - name: Back Row Lockers
            description: Students stuff Club flyers, borrowed manga, and notes with misspelled names in here.
      - name: Club Building
        description: An old three-story wooden building. After 4 PM, it fills with the sounds of various Clubs. Lights must be turned off after the 6 PM closing broadcast. This is where the Literature Club's survival, Light Music Club rehearsals, and Student Council patrols intersect.
        climate: It gets chilly in the evening. Hallways often carry instrument sounds, the scent of old paper, and coffee. After sunset, only a few windows remain lit with warm yellow light.
        landmarks:
          - name: Literature Club Activity Room
            description: A small room at the end of the third floor, piled with old books, School Festival special issues, and handwritten manuscripts. They are rushing to produce a special issue titled *Spring Mint* while facing Merger Review.
          - name: Light Music Club Practice Room
            description: A practice room on the first floor near the playground. Soundproofing is mediocre, so guitar sounds leak into the hallway.
          - name: Club Building Rooftop
            description: A place where Yuma Shiraishi often lingers after his 5:40 PM patrol. From here, one can see the playground lights, the sea, and Club windows that haven't gone dark yet.
          - name: Second Floor Corridor Bulletin Board
            description: The News Club posts interview recruitments, School Festival reporting plans, and briefs prone to sparking debate here.
      - name: Library
        description: A two-story library behind the classroom building. Open from 12:20 PM to 1 PM and after school, closing at 5:30 PM. Window seats are illuminated by sea light in the afternoon, suitable for quiet conversations, tutoring, research, and Literature Club material gathering.
        climate: Quiet and dry. In spring, there is often the scent of paper, wooden bookshelves, and mint candy.
        landmarks:
          - name: Second Floor Window Long Table
            description: Mio likes proofreading manuscripts here, hiding her truly anxious expressions behind the pages.
          - name: Old Journal Shelf
            description: Archives past years' School Festival special issues. The oldest volume contains a signed page from Akane Toujou's sister's time, and Chihiro Onodera's student-era pen name is also hidden within.
          - name: Lending Desk Note Box
            description: Akane Toujou uses short sticky notes to remind people of return dates, reserve seats, or recommend the next book. Once Familiar, the way she addresses you on the notes subtly changes.
      - name: Sakurazaka Seawall
        description: A slope leading from the school gate to the seaside. Walking to the station takes about twelve minutes. Cherry blossoms line the path in spring. It is suitable for walking side-by-side after school, brief pauses, and saying things difficult to utter in the classroom.
        climate: Windy. Pavement reflects light after rain. In the evening, one can hear waves and distant train sounds.
        landmarks:
          - name: Vending Machine
            description: Usually only lemon soda, mint soda, and canned hot coffee remain. A student Rumor says that if you insert coins at sunset, the first drink dispensed reveals who you are thinking about.
          - name: Seawall Bench
            description: Kaho Shiina occasionally writes lyrics here, and Yuma Shiraishi sometimes takes a detour past this spot. One end of the bench always dries first after rain, becoming the origin of the Rumor about 'seats saved for couples'.
      - name: Seireki Town Shopping Street
        description: Two short Shopping Streets in front of the station. After 5 PM, they fill with students leaving school. Bookstores, florists, family restaurants, music shops, and convenience stores form daily Headquarters outside campus, and jointly sponsor the 'Evening Wind Lighting' ceremony closing the School Festival.
        climate: Neon signs are bright in the evening. On rainy days, umbrellas and uniforms crowd under narrow eaves.
        landmarks:
          - name: Umineko Bookstore
            description: An independent bookstore frequently visited by the Literature Club. The owner keeps School Festival publications from the past decade and provides the final batch of recycled paper for the *Spring Mint* special issue.
          - name: Orange House Family Restaurant
            description: Suitable for group meetups, tutoring, and disguising serious topics as casual dining chatter.
          - name: Hoshisuna Instrument Shop
            description: Where the Light Music Club buys strings and picks. Kaho lingers long in the sound-check corner. Three days before main stage rehearsals, the shop offers free instrument checks for students.
      - name: Administrative Building and Courtyard
        description: The logistical hub between the classroom building and Club Building. The Student Council Room holds budget sheets, venue maps, and Club registrations. The Courtyard downstairs is the most public stage for lunch announcements and School Festival previews.
        climate: Bright and noisy during the day, quickly becoming quiet after school. The Student Council Room often remains lit until 6 PM.
        landmarks:
          - name: Student Council Room
            description: Haruka Mikoeda presides over budget reviews here, and Yuma Shiraishi verifies Club registrations. The master Progress chart on the wall changes color at fourteen, seven, and three days remaining on the countdown.
          - name: Courtyard Notice Board
            description: A common location where the News Club releases School Festival extras and rebuttals, the Light Music Club conducts open auditions, and Class 2-B recruits volunteers for 'Sea Breeze Post'.
