  initialValue:
    openingScenario: The second Monday of April, 8:20, ten minutes before the morning reading bell. You have just transferred into Class 2-B at Harukaze Academy, and the classroom still smells of chalk dust and sea breeze. The back-row seat by the window is empty. Class President Mio Kamishiro sets a class schedule on the corner of the desk, Rin Asakura of the Newspaper Club holds up her interview notebook from the back of the room, and the Light Music Club's guitar drifts in from outside the window as someone tunes up. Passing the door, Student Council Vice President Yuma Shiraishi hands a club registration form to the teacher, and the bulletin board beside the blackboard says the spring school festival is twenty-one days away. The first things you can answer are Mio's offer to show you around the school and Rin's lunchtime interview; the guitar and the club registration point to where you might go after school.
    startingLocation: Class 2-B · Window Seat
    playerConstraints:
      - The player is a second-year transfer student.
      - The player has no club at the start.
      - All romance must stay teen-rated.
      - The four opening characters are Mio Kamishiro, Rin Asakura, Kaho Shiina, and Yuma Shiraishi. Each starts at Just met with the player. Akane Toujou has yet to appear; they meet naturally when the player visits the library.
      - The player can choose why they transferred, but the reason should serve everyday school life and the relationships.
    openingHook: Before the morning reading bell, do you answer the class president's offer to show you around, or the Newspaper Club's lunchtime interview first?
    openingChips:
      - Ask Mio to show me around the school
      - Say yes to Rin's lunchtime interview
      - Ask when club registration closes
      - Remember the guitar tune from outside the window
