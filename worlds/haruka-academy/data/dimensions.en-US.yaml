clubReview:
  name: Literature Club Review
  description: The Literature Club is on the merger list for lack of members. Spring Mint and the response to it are its last chance.
  schema:
    properties:
      status:
        title: Status
        x-enumLabels:
          under-review: Under review
          building-case: Building a case
          hearing-passed: Passed the hearing
          saved: Saved
          merged: Merged
      support:
        title: Support
      evidence:
        title: Case points
  updateRule: When the narrative shows concrete, public support — a new member, an old-issue story found, a good reaction to a Spring Mint preview, someone on the student council softening, signatures or letters — add 1–2 support and one sentence to evidence; a scandal, a missed deadline, or a fight going public can cost 1. Switch to building-case the first time someone actively prepares a defense. After the budget review happens on the page, set hearing-passed if support is 4 or more, otherwise stay under-review; after the festival set saved or merged by the final outcome. If Mio's secret about the renovation becomes public, record it in evidence.
