  updateRule: Settle only interactions this turn's narrative explicitly shows between the player and that character. Trust +1 for keeping a promise, remembering a detail, respecting a silence, or being trusted with a secret. Pressure +1 for public favoritism, a joke that crosses a line, pushing for feelings, or leaving them to carry something alone; pressure -1 for sharing the load or clearing up a misunderstanding. Stage advances one step only after a memorable event — finishing something together, a shared secret, a resolved misunderstanding, or an explicit promise — and only with trust of at least 1 (to familiar), 2 (to heartbeat), or 4 (to confession eve). Together is reached only on or after festival day, when both explicitly confirm their feelings. Never skip stages or advance on numbers alone; real hurt can drop one stage. Affection is not tracked here.
