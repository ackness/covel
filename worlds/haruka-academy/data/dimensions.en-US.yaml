clubReview:
  name: Literature Club Review
  description: The Literature Club is on the merger list for lack of members. Spring Mint and how people respond to it are its last chance.
  schema:
    properties:
      status:
        title: Status
        x-enumLabels:
          under-review: Under review
          building-case: Building a case
          hearing-passed: Passed first review
          saved: Saved
          merged: Merged
      support:
        title: Support
      evidence:
        title: Points in favor
  updateRule: When the narrative shows the player or a character winning concrete support that can be made public — a new member joining, an old-issue story turning up, a good reaction to a Spring Mint preview, someone on the Student Council softening, signatures or letters — add 1–2 support and one sentence to evidence; a scandal, a missed deadline, or a conflict going public can cost 1. Switch to building-case the first time someone actively prepares to argue for the club's survival. After the first budget review happens in the narrative, set hearing-passed if support is 4 or more, otherwise leave it at under-review; after the festival, set saved or merged by the final outcome. If the truth about the renovation that Mio has been hiding comes out, record it in evidence.
promises:
  name: Promises
  description: What you promised, to whom, and whether you kept it.
  schema:
    additionalProperties:
      properties:
        to:
          title: To
        promise:
          title: Promise
        status:
          title: Status
          x-enumLabels:
            pending: Pending
            kept: Kept
            broken: Broken
            released: Called off
  updateRule: Add an entry when the player explicitly agrees to do something specific for a character in this turn's narrative — walking home together, helping out, keeping a secret, showing up somewhere — with a short English kebab-case ID and status pending. Polite noises and a vague "maybe next time" don't count. Set kept when it is fulfilled in the narrative, broken when it is missed or betrayed, and released when the other person clearly says it isn't needed anymore. Never delete entries.
rumors:
  name: Campus Rumors
  description: Seireki is small, and rumors travel fast — who said it first, who believes it, who moves closer or backs away because of it.
  schema:
    additionalProperties:
      properties:
        rumor:
          title: Rumor
        stage:
          title: Stage
          x-enumLabels:
            seed: Seed
            spreading: Spreading
            heating: Heating up
            cleared: Cleared
            confirmed: Confirmed
            redirected: Redirected
        heat:
          title: Heat
  initialValue:
    vending-machine:
      rumor: Whatever drink the vending machine drops at sunset shows who you're thinking about.
    lit-window:
      rumor: A Club Building window still lit after 18:00 keeps someone's wish secret.
    window-seat:
      rumor: Toujou-senpai only saves the window seat for someone special.
  updateRule: Rumors move seed → spreading → heating → cleared / confirmed / redirected, and advance only when the narrative clearly shows a rumor spreading, being cleared up, or being proven. Add a new rumor (for example, one about the transfer student) the first time someone says it in the narrative, with a short English kebab-case ID, stage seed, and heat 1. heat +1 for being seen alone together in public, obvious favoritism, or ending up in the News Club's notes; heat -1 when Rin sits on the story, the people involved clear it up through their actions, or a newer event pushes it out of the conversation. Never make a rumor known across the whole school out of nowhere.
geography:
  name: Geography
  schema:
    properties:
      overview:
        title: Overview
      regions:
        items:
          properties:
            name:
              title: Name
            description:
              title: Description
            climate:
              title: Climate
            landmarks:
              items:
                properties:
                  name:
                    title: Name
                  description:
                    title: Description
              title: Landmarks
        title: Regions
  initialValue:
    overview: A private high school on the seaside slopes of Seireki. Most of the story happens in the classroom building, the Club Building, the library, the shopping streets by the station, and Sakurazaka, the slope down to the seawall. Everything is close together, so the route the player picks between the lunch bell and the 18:00 closing announcement decides who they run into, and chance meetings and rumors happen naturally.
    regions:
      - name: Class 2-B
        description: The class the player transfers into; from the back row by the window you can see the sports field and the sea in the distance. Before morning reading, the ten-minute breaks, lunch at 12:20, cleaning duty after 15:40, and the blank minutes before a quiz are all openings for a conversation.
        climate: Airy and bright in spring, with a sea breeze often stirring the curtains in the afternoon; on rainy days the windows mist over and the classroom goes quiet.
        landmarks:
          - name: Window Seat
            description: The player's first seat. Mio Kamishiro leaves papers on the corner of the desk, and Rin Asakura often leans over from the back row to start talking.
          - name: Bulletin Board by the Blackboard
            description: Holds the festival countdown, the duty roster, club recruiting posters, the makeup-exam list, and Class 2-B's job sheet for the Sea Breeze Post booth. A changed duty roster is the easiest way to start a misunderstanding.
          - name: Back Row Lockers
            description: Where classmates stuff club flyers, borrowed manga, and notes with somebody's name spelled wrong.
      - name: Club Building
        description: An old three-story wooden building. After 16:00 it fills with the sounds of every club, and in principle the lights must go off after the 18:00 closing announcement. This is where the Literature Club's survival, Light Music Club rehearsals, and Student Council patrols all meet.
        climate: Chilly toward evening, with the sound of instruments, the smell of old paper, and a hint of coffee in the stairwells; after sunset only a few windows still glow warm yellow.
        landmarks:
          - name: Literature Club Room
            description: A small room at the end of the third floor, piled with old books, past festival special issues, and handwritten drafts. The club is rushing to finish its special issue, Spring Mint, while facing a merger review.
          - name: Light Music Club Practice Room
            description: A practice room on the first floor, on the sports-field side. The soundproofing is so-so, and the guitar leaks out into the hallway.
          - name: Club Building Rooftop
            description: Where Yuma Shiraishi often lingers after his 17:40 patrol. From here you can see the sports-field lights, the sea, and the club windows that are still lit.
          - name: Second Floor Hallway Bulletin Board
            description: Where the News Club puts up calls for interviewees, its plans for festival coverage, and short news items that get people talking.
      - name: Library
        description: A small two-story library behind the classroom building, open from 12:20 to 13:00 and after school, closing at 17:30. In the afternoon the window seats catch the light off the sea; it's a good place for quiet conversations, study sessions, looking things up, and Literature Club research.
        climate: Quiet and dry; in spring it smells of paper, wooden shelves, and mint candy.
        landmarks:
          - name: Second Floor Window Table
            description: A long table where Mio likes to proofread manuscripts, and where she hides her real worry behind the pages.
          - name: Back Issue Shelf
            description: Keeps the festival special issues from every year. The oldest one holds the signature page Akane Toujou's sister left back then, and Chihiro Onodera's pen name from her student days is hidden in there too.
          - name: Checkout Desk Note Box
            description: Akane Toujou uses short notes to remind people of due dates, save seats, or recommend the next book. As she gets to know someone, the way she addresses them on the notes quietly changes.
      - name: Sakurazaka Seawall
        description: The slope from the school gate down to the sea, about a twelve-minute walk from the station, lined with cherry blossoms in spring. A place for walking side by side after school, stopping for a moment, and saying the things that are hard to say in the classroom.
        climate: Windy; the pavement shines after rain, and in the evening you can hear the waves and a train in the distance.
        landmarks:
          - name: Vending Machine
            description: Never seems to have anything left but lemon soda, mint soda, and canned hot coffee. Students say that if you put your coins in right at sunset, the first drink to drop shows who you're thinking about.
          - name: Seawall Bench
            description: Kaho Shiina sometimes writes lyrics here, and Yuma Shiraishi takes the long way round to pass by. After rain, one end of the bench always dries first, which started the rumor about "the seat saved for couples."
      - name: Seireki Town Shopping Street
        description: Two short shopping streets in front of the station that fill with students heading home after 17:00. The bookstore, florist, family restaurant, music shop, and convenience store are everyday hangouts off campus, and together they sponsor the Evening Wind Lighting that closes the festival.
        climate: Bright shop signs in the evening; on rainy days, umbrellas and school uniforms crowd under the narrow eaves.
        landmarks:
          - name: Umineko Bookstore
            description: An independent bookstore the Literature Club often visits. The owner keeps ten years of festival publications and is supplying the last batch of recycled paper for the Spring Mint special issue.
          - name: Orange House Family Restaurant
            description: Good for meeting up in a group, studying together, and disguising a serious talk as chat over the menu.
          - name: Hoshisuna Instrument Shop
            description: Where the Light Music Club buys strings and picks; Kaho can spend ages in the corner where you try out instruments. In the three days before the main-stage rehearsal, the shop checks one instrument per student for free.
      - name: Administrative Building and Courtyard
        description: The hub of festival business, between the classroom building and the Club Building. The Student Council Room keeps the budget sheets, venue maps, and club registrations; the courtyard below is the most public stage for lunchtime announcements and festival previews.
        climate: Bright and noisy by day, quiet soon after school lets out; the Student Council Room's lights are often still on at 18:00.
        landmarks:
          - name: Student Council Room
            description: Where Haruka Mikoeda chairs the budget reviews and Yuma Shiraishi checks club registrations. The master progress chart on the wall changes color at fourteen, seven, and three days on the countdown.
          - name: Courtyard Notice Board
            description: Where the News Club puts out festival extras and corrections to rumors, the Light Music Club holds open listening sessions, and Class 2-B recruits volunteers for the Sea Breeze Post.
factions:
  name: Factions
  schema:
    items:
      properties:
        name:
          title: Name
        description:
          title: Description
        type:
          title: Type
        influence:
          title: Influence
        leader:
          title: Leader
        headquarters:
          title: Base
        relations:
          items:
            properties:
              targetId:
                title: Target
              type:
                title: Type
              description:
                title: Description
          title: Relations
  initialValue:
    - id: student-council
      name: Haruka Academy Student Council
      description: Runs the school festival, club budgets, clubroom assignments, and discipline on campus. It stands for rules and procedure, and takes pressure from teachers, clubs, and students all at once.
      leader: Student Council President · Haruka Mikoeda
      headquarters: 2nd Floor, Administrative Building · Student Council Room
      relations:
        - description: Because the Literature Club is short of members, the Student Council is deciding whether it keeps a room of its own.
        - description: The Light Music Club needs Student Council approval for its main-stage rehearsal times and its volume requests.
        - description: Class 2-B's Sea Breeze Post has to get its courtyard booth and the content of its anonymous messages approved.
    - id: literature-club
      name: Literature Club
      description: An old, small club with few members that still insists on making a festival special issue, this year titled Spring Mint. The old clubroom, the back issues, and the recycled paper from Umineko Bookstore are the heart of the club.
      leader: Mio Kamishiro
      headquarters: 3rd Floor, Club Building · Literature Club Room
      relations:
        - description: Often competes with the News Club for the same interviewees because their topics overlap; this year the two clubs could swap a page, so that short stories, interviews, and rumor-busting together help the Literature Club pass the review.
    - id: news-club
      name: News Club
      description: Has its finger on every campus rumor and holds the right to report on the festival; it's planning the Rumor Truth Wall. Very driven, with a sense of boundaries that comes and goes — one interview can open a door or blow a misunderstanding up.
      leader: Rin Asakura
      headquarters: 2nd Floor, Club Building · News Club Editorial Office
      relations:
        - description: Needs the Student Council's permission to interview people, and regularly gives the council headaches.
    - id: light-music-club
      name: Light Music Club
      description: A band club with its sights on the festival's main stage and the last song before the festival closes. The mood is loose, but the pressure in rehearsal is intense. Members tend to pass off working hard as "just messing around," and Kaho Shiina's new song still has no real name.
      leader: Kaho Shiina
      headquarters: 1st Floor, Club Building · Practice Room
      relations:
        - description: News Club coverage can win the Light Music Club votes, and it can also turn a botched rehearsal into the talk of the school.
    - id: class-2b
      name: Class 2-B
      description: The class the player transfers into, and the main stage for everyday relationships, cleaning duty, lunch breaks, rumors, and the class festival project. Its booth, the Sea Breeze Post, seals away postcards visitors write to their future selves until next year.
      leader: Homeroom Teacher · Chihiro Onodera
      headquarters: 2nd Floor, Classroom Building · Class 2-B Classroom
      relations:
        - description: Mio Kamishiro is both class president and Literature Club president, so class business and club pressure often pile up together.
        - description: Rin Asakura collects rumors in class, but she also protects the people she truly cares about.
    - id: shopping-street
      name: Seireki Town Shopping Street
      description: The little shopping district in front of the station, where students buy supplies, study together, run into each other, and take the long way home after school.
      leader: Head of the Shopping Street Association · owner of Umineko Bookstore
      headquarters: In front of Seireki Station
powerSystem:
  name: Relationship Progression
  schema:
    properties:
      name:
        title: Name
      type:
        title: Type
      description:
        title: Description
      rules:
        title: Rules
      tiers:
        items:
          properties:
            name:
              title: Name
            rank:
              title: Rank
            description:
              title: Description
        title: Stages
  initialValue:
    name: Affection and Distance
    description: Change in this world comes from how the characters feel toward the player — trust, curiosity, reliance, jealousy, pressure, and a sense of boundaries. This is the relationship system for dialogue mode.
    rules:
      - Relationships move forward through concrete events and dialogue choices; crossing a line outright lowers Trust.
      - A character's Affection, Pressure, and Public Closeness don't have to change together.
      - Festival preparations, exams, club crises, and rumors push relationships from one stage to the next.
      - Affection is attraction, Trust is willingness to confide a secret, Pressure is the real-world weight they carry, and Public Closeness is how the classmates around them read the relationship.
      - When the player keeps promises, remembers details, and respects silences, Trust goes up first; favoritism in public, jokes that go too far, or pushing for someone's feelings raise Pressure and Rumor Heat first.
      - A single everyday choice usually moves the numbers only a little. A relationship stage has to be moved by a memorable event — a task finished together, a secret confided, a misunderstanding cleared up, or an explicit promise — never by numbers alone.
      - After a relationship stage changes, there must be visible differences in what the character calls the player, whether they offer invitations, where they're willing to show up, and how close they stand in public.
    tiers:
      - name: Just met
        description: Ordinary conversation is possible; the character keeps a polite distance.
      - name: Friends
        description: The character shares everyday worries or invites the player to things, starts remembering the player's likes, and changes what they call them.
      - name: Crush
        description: The character clearly cares, tests the waters, or asks to spend time alone, but in public is still held back by rumors and duties.
      - name: On the verge
        description: The relationship is close to being confirmed; misunderstandings, promises, or choices about the future still have to be dealt with.
      - name: Together
        description: The character and the player confirm where they stand with each other and face the choices after the festival together. This comes from a long run of events and should not be reached early in festival prep.
history:
  name: History
  schema:
    items:
      properties:
        era:
          title: When
        name:
          title: Name
        description:
          title: Description
        significance:
          title: Significance
  initialValue:
    - era: Ten years ago
      name: Haruka Academy moves to its seaside campus
      description: The school moved to the slopes of Seireki, and the new campus kept the old Club Building as a symbol of tradition.
    - era: Seven years ago
      name: Old Club Building Preservation Movement
      description: The first students to enroll at the new campus started a petition and saved the old wooden Club Building. Both the Literature Club and the Light Music Club count it as part of their club's tradition.
    - era: Three years ago
      name: The spring school festival is reorganized
      description: The festival changed from class exhibits to joint projects by clubs and classes, and the Student Council's power grew.
    - era: Two years ago
      name: The Evening Wind Lighting becomes the closing tradition
      description: The shopping street lent the school its leftover string lights, and at the close of the festival they were lit one by one from the courtyard down to Sakurazaka. Students started using "who you watch the last light with" as a code for a date they won't admit to.
    - era: Last year
      name: The Light Music Club's main-stage mishap
      description: The Light Music Club's equipment failed during the festival preview, and the club nearly lost its place on this year's main stage. Kaho has never been able to let it go.
    - era: This term
      name: Literature Club merger review
      description: The Literature Club was put on the merger list for lack of members, and its festival publication became its last chance to keep the club.
    - era: Recently
      name: A transfer student arrives
      description: The player transfers into Class 2-B and becomes a new unknown that the class, the Literature Club, the News Club, the Light Music Club, and the Student Council have all noticed.
