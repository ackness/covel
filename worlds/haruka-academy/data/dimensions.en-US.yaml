      name: Harukaze Student Council
      description: Responsible for the School Festival, club budgets, activity room assignments, and school discipline. It represents rules and procedures, bearing multiple pressures from teachers, clubs, and students.
      leader: Student Council President · Haruka Mikoeda
      headquarters: 2nd Floor, Administrative Building · Student Council Room
      relations:
        - description: Due to insufficient membership, the Student Council is evaluating whether the Literature Club should retain an independent activity room.
        - description: The Light Music Club needs Student Council approval for main stage rehearsal times and volume requests.
        - description: Class 2-B's "Sea Breeze Post" requires content review for its courtyard booth and anonymous messages.
    - id: literature-club
      name: Literature Club
      description: A long-standing small club with few members but a commitment to producing the School Festival special issue titled "Spring Mint." The old activity room, past issues, and recycled paper provided by Umineko Bookstore are its spiritual core.
      leader: Mio Kamishiro
      headquarters: 3rd Floor, Club Building · Literature Club Activity Room
      relations:
        - description: Often competes with the News Club over interview subjects due to publication topic choices; this year, they can swap one page so that short stories, interviews, and rumor debunking help the club pass review.
    - id: news-club
      name: News Club
      description: Controls in-school rumors and reporting rights for the School Festival, currently planning the "Rumor Truth Wall." Highly proactive but inconsistent with boundaries; one interview may bring opportunities or amplify misunderstandings.
      leader: Rin Asakura
      headquarters: 2nd Floor, Club Building · News Club Editorial Office
      relations:
        - description: Needs Student Council approval for interview permissions and often gives the Student Council headaches.
    - id: light-music-club
      name: Light Music Club
      description: A band club aiming for the School Festival main stage and the final song before closing. The atmosphere is free, but rehearsal pressure is high. Members often downplay their seriousness as casual fun, and Kaho Shiina's new song still has no official title.
      leader: Kaho Shiina
      headquarters: 1st Floor, Club Building · Practice Room
      relations:
        - description: News Club coverage can help the Light Music Club gain votes but may also turn rehearsal mistakes into hot topics.
    - id: class-2b
      name: Class 2-B
      description: The class the player transfers into, serving as the core stage for daily relationships, duty rosters, lunch breaks, rumors, and class festival projects. The class booth, "Sea Breeze Post," seals postcards written to future selves for guests until next year.
      leader: Homeroom Teacher · Chihiro Onodera
      headquarters: 2nd Floor, Academic Building · Class 2-B Classroom
      relations:
        - description: Mio Kamishiro is both Class President and Literature Club President, so class affairs often overlap with club pressures.
        - description: Rin Asakura collects rumors within the class but protects those she truly values.
    - id: shopping-street
      name: Seireki Town Shopping Street
      description: A small commercial area near the station, where students buy materials, attend cram schools, have chance encounters, or take detours home after school.
      leader: Shopping Street Association President · Owner of Umineko Bookstore
      headquarters: In Front of Seireki Station
powerSystem:
  name: Relationship Progression
  schema:
    properties:
      name:
        title: Name
      type:
        title: Type
      description:
        title: Description
      rules:
        title: Rules
      tiers:
        items:
          properties:
            name:
              title: Name
            rank:
              title: Rank
            description:
              title: Description
        title: Tiers
  initialValue:
    name: Affection and Distance
    description: Core changes in this world stem from characters' trust, curiosity, dependence, jealousy, pressure, and sense of boundaries toward the player. It is a relationship progression system based on dialogue patterns.
    rules:
      - Relationship Progression relies on specific events and dialogue choices; directly crossing boundaries lowers Trust.
      - Affection, Pressure, and Public Closeness for the same character can change asynchronously.
      - Festival Prep, exams, club crises, and rumors drive staged changes in character relationships.
      - Affection represents Heartbeat, Trust represents willingness to share secrets, Pressure represents real-world burdens, and Public Closeness represents how surrounding classmates interpret the relationship.
      - When the player fulfills promises, remembers details, and respects silence, Trust rises first; when publicly favoring someone, jokingly crossing lines, or pressing for feelings, Pressure and Rumor Heat rise first.
      - Single daily choices usually cause only minor stat changes; Relationship stages must be driven by memorable events like completing tasks together, sharing secrets, resolving misunderstandings, or making explicit Promises, rather than automatic jumps based solely on stats.
      - After a Relationship stage change, observable differences in how characters address the player, initiate invitations, willing locations to appear, and public distance should reflect this shift.
    tiers:
      - name: Acquaintance
        description: Normal conversation is possible, and characters maintain polite distance.
      - name: Familiar
        description: Characters are willing to share daily worries or invite the player to activities, starting to remember preferences and adjust forms of address.
      - name: Heartbeat
        description: Characters show clear interest, testing behaviors, or private invitations, but public conduct remains influenced by rumors and duties.
      - name: Confession eve
        description: The relationship approaches confirmation, requiring resolution of misunderstandings, promises, or future choices.
      - name: Together
        description: Characters and the player confirm each other's positions and face post-festival choices together; this is the result of long-term events and should not be reached prematurely during early festival prep.
history:
  name: History
  schema:
    items:
      properties:
        era:
          title: Era
        name:
          title: Name
        description:
          title: Description
        significance:
          title: Significance
  initialValue:
    - era: Ten years ago
      name: Haruka Academy relocated to the seaside campus
      description: The school moved to the slopes of Seireki Town, preserving the old Club Building as a symbol of tradition.
    - era: Seven years ago
      name: Old Club Building Preservation Movement
      description: The first cohort of transfer students launched a petition that Saved the wooden old Club Building. Both the Literature Club and Light Music Club view this event as part of their club traditions.
    - era: Three years ago
      name: Spring Festival Reform
      description: The School Festival shifted from individual class displays to joint club and class projects, expanding the Student Council's authority.
    - era: Two years ago
      name: Evening Wind Lighting became the closing tradition
      description: The Shopping Street lent its remaining lights to the school, illuminating them one by one from the Courtyard to Cherry Blossom Slope at closing time. Students began treating "who you watch the last light with" as an unspoken code for a date.
    - era: Last year
      name: Light Music Club main stage mishap
      description: Equipment failure during the School Festival rehearsal nearly cost the Light Music Club their spot on this year's main stage. Kaho has been holding a grudge about it ever since.
    - era: This semester
      name: Literature Club Merger Review
      description: Due to low membership, the Literature Club was placed on the merger list. The School Festival publication became their last chance to keep the Club alive.
    - era: Recently
      name: Transfer Student arrived
      description: The player transfers into Class 2-B, becoming a new variable noticed by the Class, Literature Club, News Club, Light Music Club, and Student Council alike.
