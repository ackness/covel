  updateRule: >-
    Settle only interactions between the player and this character shown in the current turn's narrative. Add 1 trust for keeping a promise, remembering a detail, respecting a silence, or confiding a secret. Add 1 pressure for public favoritism, a joke that crosses a boundary, pressing for someone's feelings, or leaving them to carry a burden alone. Subtract 1 pressure for sharing the load or clearing up a misunderstanding.
    stage can advance once after a task finished together, a secret confided, a misunderstanding resolved, or an explicit promise. It requires trust of at least 1 for acquaintance → familiar, 2 for familiar → heartbeat, and 4 for heartbeat → confession-eve.
    Set stage to together only when both characters confirm their feelings on or after festival day. Never skip stages or advance on numbers alone. Clear harm can set the route back one stage. Track affinity separately.
