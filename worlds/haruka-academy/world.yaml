# yaml-language-server: $schema=../../packages/shared/schemas/world-manifest.schema.json
schemaVersion: "1.0"
id: haruka-academy
name: 遥风学园・春日薄荷
version: 0.3.0
summary: 转入海边私立高中，在二十一天的学园祭倒计时里选择社团、守住约定，也回应那些没能说出口的喜欢。
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
defaultViewMode: stage
tags:
  - school
  - romance
  - slice-of-life
  - chat-mode
  - ensemble
  - visual-novel
  - galgame
  - school-festival
author:
  name: Covel Contributors
  url: https://github.com/ackness/covel
license: MIT
cover: media/gallery/world-cover.webp
accentColor: "oklch(72% 0.15 350)"
pluginPolicy:
  packs:
    - id: haruka-galgame
      label: 学园恋爱 · 视觉小说
      description: 全屏舞台、立绘与日夜场景，多条回复可选，好感度与心之路线、约定、传闻和学园祭筹备随对话实时变化。
      tags:
        - mode:dialogue
      reason: 二十一天的学园祭倒计时里，每一次赴约、失约和传闻都会留在面板上，五条心之路线只靠真实发生的事件推进。
      requested:
        - pregame
        - world-init
        - char-creator
        - chat-mode-narrator
        - scene-stage
        - guide
        - character-blueprint
        - living-world-rules
        - branch-reply
        - affinity
        - story-events
      recommended:
        - npc-graph
  presetId: haruka-galgame
  preferredTags:
    - mode:dialogue
  avoidedTags:
    - mode:traditional-story
  requested:
    - pregame
    - world-init
    - char-creator
  recommended:
    - chat-mode-narrator
    - scene-stage
    - guide
    - character-blueprint
    - living-world-rules
    - branch-reply
    - affinity
    - story-events
    - npc-graph
pluginSettings:
  chat-mode-narrator:
    dialogueRatio: 80
    proseLength: short
  scene-stage:
    activeSpeakerCount: 2
characterSchema:
  types:
    - npc
    - companion
  attributes:
    - id: persona
      name: 性格
      type: string
      category: bio
      description: 主角的性格与说话方式（口吻由性格而来）——如「谨慎内向，紧张时话少，礼貌但有主见」。影响叙事如何刻画你的角色与对白。
    - id: club
      name: 社团
      type: string
      category: social
      description: 所属社团
    - id: class
      name: 班级
      type: string
      category: bio
      description: 所在班级
    - id: relationshipStage
      name: 关系阶段
      type: string
      category: social
      description: 与玩家的当前关系阶段
    - id: affection
      name: 好感度
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的好感
    - id: trust
      name: 信任
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 对玩家的信任
    - id: pressure
      name: 压力
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description: 当前承受的心理压力
    - id: publicCloseness
      name: 公开亲密度
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description: 在他人面前与玩家的亲密程度
    - id: favoriteTopic
      name: 喜欢的话题
      type: string
      category: bio
      description: 感兴趣或容易聊开的话题
    - id: availability
      name: 常见行程
      type: string
      category: bio
      description: 角色通常会在哪些时段和地点自然登场；临时变化应由剧情事件解释。
    - id: currentConcern
      name: 当前牵挂
      type: string
      category: social
      description: 角色此刻最在意的校园事件、关系或未完成目标。
worldData: data/world.data.yaml
