schemaVersion: "1.0"
id: haruka-academy
name: 遥风学园・春日薄荷
version: "0.1.0"
summary: 一所海边私立高中，社团、考试、传闻与未说出口的喜欢交织成青春日常。
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
tags:
  - school
  - romance
  - slice-of-life
  - chat-mode
requiredPlugins:
  - pregame
  - world-init
  - char-creator
recommendedPlugins:
  - chat-mode-narrator
  - scene-cast
  - scene-prompts
  - character-blueprint
  - character-presence
  - player-identity
  - living-world-rules
  - branch-reply
excludedPlugins:
  - narrator
  - guide
  - codex
pluginPolicy:
  preset: dialogue-mode
  preferTags:
    - mode:dialogue
    - role:character
    - role:world-rules
  avoidTags:
    - mode:traditional-story
# World-authored defaults for plugin userSettings (players can still override
# these in Settings). A slice-of-life school world leans dialogue-heavy and
# keeps replies short and snappy.
pluginSettings:
  chat-mode-narrator:
    dialogueRatio: 80
    proseLength: short
worldData: data/world.data.yaml
