schemaVersion: "1.0"
id: haruka-academy
name:
  zh-CN: 遥风学园・春日薄荷
  en-US: Haruka Academy · Spring Mint
version: 0.3.0
summary:
  zh-CN: 转入海边私立高中，在二十一天的学园祭倒计时里选择社团、守住约定，也回应那些没能说出口的喜欢。
  en-US: Transfer to a seaside private high school, choose a club, keep your
    promises, and answer unspoken feelings during a twenty-one-day festival
    countdown.
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US
defaultViewMode: stage
tags:
  - school
  - romance
  - slice-of-life
  - chat-mode
  - ensemble
  - visual-novel
  - galgame
  - school-festival
pluginPolicy:
  packs:
    - id: haruka-galgame
      label:
        zh-CN: 学园恋爱 · 视觉小说
        en-US: Campus Romance · Visual Novel
      description:
        zh-CN: 全屏舞台、立绘与日夜场景，多条回复可选，好感度与心之路线、约定、传闻和学园祭筹备随对话实时变化。
        en-US: Full-screen stage with portraits and day/night scenes, selectable
          replies, and live affection, heart routes, promises, rumors, and
          festival prep that change with every conversation.
      tags:
        - mode:dialogue
        - role:character
      reason:
        zh-CN: 二十一天的学园祭倒计时里，每一次赴约、失约和传闻都会留在面板上，五条心之路线只靠真实发生的事件推进。
        en-US:
          Across the twenty-one-day festival countdown, every promise kept or
          broken and every rumor stays on the panels, and the five heart routes
          advance only through moments that actually happen.
      requested:
        - pregame
        - world-init
        - char-creator
        - chat-mode-narrator
        - scene-stage
        - scene-prompts
        - character-blueprint
        - character-presence
        - living-world-rules
        - branch-reply
        - affinity
        - story-events
      recommended:
        - npc-graph
  presetId: haruka-galgame
  preferredTags:
    - mode:dialogue
    - role:character
    - role:world-rules
  avoidedTags:
    - mode:traditional-story
  requested:
    - pregame
    - world-init
    - char-creator
  recommended:
    - chat-mode-narrator
    - scene-stage
    - scene-prompts
    - character-blueprint
    - character-presence
    - living-world-rules
    - branch-reply
    - affinity
    - story-events
    - npc-graph
pluginSettings:
  chat-mode-narrator:
    dialogueRatio: 80
    proseLength: short
  scene-stage:
    activeSpeakerCount: 2
characterSchema:
  types:
    - npc
    - companion
  attributes:
    - id: persona
      name:
        zh-CN: 性格
        en-US: Personality
      type: string
      category: bio
      description:
        zh-CN: 主角的性格与说话方式（口吻由性格而来）——如「谨慎内向，紧张时话少，礼貌但有主见」。影响叙事如何刻画你的角色与对白。
        en-US: The hero's personality and how they speak (voice follows from
          personality) — e.g. "cautious and reserved, terse when nervous, polite
          but opinionated." Shapes how the narrator portrays the character and
          their dialogue.
    - id: club
      name:
        zh-CN: 社团
        en-US: Club
      type: string
      category: social
      description:
        zh-CN: 所属社团
        en-US: Club membership
    - id: class
      name:
        zh-CN: 班级
        en-US: Class
      type: string
      category: bio
      description:
        zh-CN: 所在班级
        en-US: Homeroom class
    - id: relationshipStage
      name:
        zh-CN: 关系阶段
        en-US: Relationship
      type: string
      category: social
      description:
        zh-CN: 与玩家的当前关系阶段
        en-US: Current relationship stage with the player
    - id: affection
      name:
        zh-CN: 好感度
        en-US: Affection
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description:
        zh-CN: 对玩家的好感
        en-US: Affection toward the player
    - id: trust
      name:
        zh-CN: 信任
        en-US: Trust
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description:
        zh-CN: 对玩家的信任
        en-US: Trust toward the player
    - id: pressure
      name:
        zh-CN: 压力
        en-US: Pressure
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: stats
      description:
        zh-CN: 当前承受的心理压力
        en-US: Current psychological pressure
    - id: publicCloseness
      name:
        zh-CN: 公开亲密度
        en-US: Public Closeness
      type: number
      min: 0
      max: 100
      defaultValue: 0
      category: social
      description:
        zh-CN: 在他人面前与玩家的亲密程度
        en-US: How close to the player in public
    - id: favoriteTopic
      name:
        zh-CN: 喜欢的话题
        en-US: Favorite Topic
      type: string
      category: bio
      description:
        zh-CN: 感兴趣或容易聊开的话题
        en-US: Topics they enjoy talking about
    - id: availability
      name:
        zh-CN: 常见行程
        en-US: Usual Schedule
      type: string
      category: bio
      description:
        zh-CN: 角色通常会在哪些时段和地点自然登场；临时变化应由剧情事件解释。
        en-US:
          When and where the character usually appears; story events should explain
          temporary changes.
    - id: currentConcern
      name:
        zh-CN: 当前牵挂
        en-US: Current Concern
      type: string
      category: social
      description:
        zh-CN: 角色此刻最在意的校园事件、关系或未完成目标。
        en-US:
          The school event, relationship, or unfinished goal currently weighing
          most on the character.
worldData: data/world.data.yaml
