openingScenario: >-
  四月的第二个周一，你作为转学生来到遥风学园二年 B 组。班主任刚把你介绍完，教室里还残留着粉笔灰和海风的味道。靠窗最后一排空着，班长神代澪把课程表放到桌角，新闻部的朝仓凛在后排举起采访本，窗外传来轻音部试音的吉他声。门口经过的学生会副会长白石悠真把社团登记表交给老师，黑板旁公告栏写着春日学园祭还有二十一天。
startingLocation: 二年 B 组・靠窗座位
playerConstraints:
  - 玩家是二年级转学生。
  - 初始没有固定社团。
  - 所有恋爱推进必须保持 teen 内容尺度。
  - 初始与四名主要角色都处于初识阶段，需要通过具体事件建立信任。
  - 玩家可以选择转学原因，但应服务于校园日常和关系推进。
startingResources:
  allowance: 3000
  rumorHeat: 1
  festivalDaysLeft: 21
  trustSeed: 5
openingHook: 转学第一天，春风把四个人的视线带到你身上。
openingChips:
  - 靠窗新座位
  - 学园祭倒计时
  - 文艺部危机
  - 放学后的海堤
  - 社团登记表
  - 新闻部采访本
