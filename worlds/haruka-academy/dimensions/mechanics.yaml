combatStyle: none
difficulty: easy
skillSystem: 通过对话选择、共同活动、承诺兑现和学园祭任务推动关系。关注好感、信任、压力、传闻热度、公开亲密度和学园祭倒计时。
customRules:
  - 每轮尽量让一到两名主要角色成为对话焦点。
  - 角色表达喜欢时保持含蓄，优先使用试探、玩笑、沉默和行动。
  - 学园祭倒计时会自然制造任务压力。
  - 玩家可以选择加入社团、帮忙筹备、调查传闻或单独陪伴某个角色。
  - 场景短句应提供三到四个自然说法，覆盖温柔、直率、观察和轻微玩笑等不同语气。
  - 同一轮只推进一个清晰情绪节点，避免一次解决多个角色的核心矛盾。
  - 公开场合优先影响传闻热度和公开亲密度，私下场合优先影响信任和压力。
  - 对话模式下，分支回复应像玩家自然会说的话，避免系统化任务按钮口吻。
