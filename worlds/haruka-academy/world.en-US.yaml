# en-US text for world.yaml. Only translated text; structure and ids come from world.yaml.
name: Haruka Academy · Spring Mint
summary: Transfer to a seaside private high school, choose a club, keep your
  promises, and answer unspoken feelings during a twenty-one-day festival
  countdown.
pluginPolicy:
  packs:
    - id: haruka-galgame
      label: Campus Romance · Visual Novel
      description:
        Full-screen stage with portraits and day/night scenes, selectable
        replies, and live affection, heart routes, promises, rumors, and
        festival prep that change with every conversation.
      reason:
        Across the twenty-one-day festival countdown, every promise kept or
        broken and every rumor stays on the panels, and the five heart routes
        advance only through moments that actually happen.
characterSchema:
  attributes:
    - id: persona
      name: Personality
      description: The hero's personality and how they speak (voice follows from
        personality) — e.g. "cautious and reserved, terse when nervous, polite
        but opinionated." Shapes how the narrator portrays the character and
        their dialogue.
    - id: club
      name: Club
      description: Club membership
    - id: class
      name: Class
      description: Homeroom class
    - id: relationshipStage
      name: Relationship
      description: Current relationship stage with the player
    - id: affection
      name: Affection
      description: Affection toward the player
    - id: trust
      name: Trust
      description: Trust toward the player
    - id: pressure
      name: Pressure
      description: Current psychological pressure
    - id: publicCloseness
      name: Public Closeness
      description: How close to the player in public
    - id: favoriteTopic
      name: Favorite Topic
      description: Topics they enjoy talking about
    - id: availability
      name: Usual Schedule
      description:
        When and where the character usually appears; story events should
        explain temporary changes.
    - id: currentConcern
      name: Current Concern
      description: The school event, relationship, or unfinished goal currently
        weighing most on the character.
