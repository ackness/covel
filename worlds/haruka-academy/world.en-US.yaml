# en-US text for world.yaml. Only translated text; structure and ids come from world.yaml.
name: Haruka Academy · Spring Mint
summary: Transfer to a private high school by the sea. With twenty-one days until the school festival, choose a club, keep your promises, and answer the feelings left unspoken.
pluginPolicy:
  pitch:
    label: Campus Romance · Visual Novel
    description: A full-screen stage with character portraits and day and night
      backdrops, several replies to choose from, and affection, heart routes,
      promises, rumors and festival prep that shift as you talk.
    reason:
      Over the twenty-one-day festival countdown, every promise you keep or
      break and every rumor stays on the panels, and the five heart routes move
      forward only on things that actually happen.
characterSchema:
  attributes:
    - id: persona
      name: Personality
      description: Your character's personality and way of speaking (the voice
        follows from the personality) — e.g. "cautious and introverted, goes quiet
        when nervous, polite but has opinions of their own." Shapes how the story
        portrays your character and their lines.
    - id: club
      name: Club
      description: The club they belong to
    - id: class
      name: Class
      description: Their homeroom class
    - id: relationshipStage
      name: Relationship
      description: Where their relationship with the player stands right now
    - id: affection
      name: Affection
      description: How much they like the player
    - id: trust
      name: Trust
      description: How much they trust the player
    - id: pressure
      name: Pressure
      description: The emotional pressure they are under right now
    - id: publicCloseness
      name: Public Closeness
      description: How close they act with the player in front of other people
    - id: favoriteTopic
      name: Favorite Topics
      description: Things they're interested in or open up about easily
    - id: availability
      name: Usual Schedule
      description:
        When and where the character usually turns up; a story event should
        explain any temporary change.
    - id: currentConcern
      name: On Their Mind
      description: The school event, relationship, or unfinished goal they care
        about most right now.
