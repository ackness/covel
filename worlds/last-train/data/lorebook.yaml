- id: line-4
  strategy: selective
  keys: [Line 4, tunnel]
  content: Line 4 crosses under the River Calder between Wharf Street on the low bank and Mercer Park nine hundred meters ahead and uphill. The tunnel dips under the river and climbs back out. Cross-passages to the parallel tunnel sit every hundred and twenty meters behind heavy numbered doors.
- id: wharf-street
  strategy: selective
  keys: [Wharf Street, pump room]
  content: Wharf Street is the station on the low bank, behind the train. Its pump room is supposed to keep the dip under the river dry. During the blackout the pumps stopped. Whether they can be started by hand, and how deep the water is between the train and the pump room, nobody on the train knows for sure.
- id: crossover
  strategy: selective
  keys: [crossover, Mercer Park, stair]
  content: About four hundred meters ahead of the train, the two Line 4 tunnels meet in a wide crossover chamber with an emergency stair up to street level. Mercer Park station is another five hundred meters beyond it, uphill. The stair door at the top opens outward and is meant to stay unlocked.
- id: blackout
  strategy: selective
  keys: [blackout, storm, surge]
  content: A storm surge came over the river wall at 23:47 and took out the city grid. Phone masts are running on backup, if at all; signal comes and goes. Control is on its own emergency power and is trying to track every stopped train at once.
- id: tunnel-safety
  strategy: selective
  keys: [walkway, track, third rail]
  content: The walkway is a concrete ledge along the tunnel wall, wide enough for one person. The power rail is dead in a blackout, but staff are trained to treat it as live until Control confirms isolation. Water on the track bed hides the sleepers and the drainage channel.
- id: calder-floodwall
  strategy: selective
  keys: [river, wall, floodwall, water, surge, Calder]
  content: Calder's old stone embankment at the East Dockyards lies two feet lower than the Mercer Park bluff. When the storm surge cleared the coping at 23:47, water poured down the Wharf Street ventilation shaft into the river-bottom dip while upper districts stayed dry. At the current inflow rate, the track bed fills slowly at first and reaches the train's battery boxes around 02:36.
- id: pump-refit
  strategy: selective
  keys: [Graham, bypass, valve, sump, silt, refit]
  content: Six years ago the Wharf Street pump room was converted to remote grid-powered relays, eliminating the full-time night attendant. Graham Pike fought that budget cut at the time and remembers where the heavy cast-iron manual bypass wheel still sits behind the south tool locker—though river silt tends to jam the non-return gate once water backs above the floor.
- id: second-train-and-control
  strategy: selective
  keys: [Control, rescue, second train, signal, radio, behind]
  content: On battery backup, Line 4 Control sees only rough track-circuit occupancy lights, not carriage water levels. Another late train stopped two hundred meters closer to Wharf Street with an elderly conductor who could not keep radio contact; Control's 23:51 blanket instruction ("rescue coming from Wharf Street") assumed emergency crews could clear the flooded Wharf Street concourse stairs before reaching either train.
- id: car-passengers
  strategy: selective
  keys: [passengers, Arthur, cello, Tomas, wedding, Maya, Sam, students, Priya, Ben]
  content: Among the forty passengers on board are Arthur Bell (seventy-three, retired dock clerk with asthma whom Nadia is tending near row four), Tomas Lind (cellist hugging a waterproofed wooden case with dry resin and spare gut strings), Maya and Sam Patel (newlyweds in soaked dress clothes sharing a half-full thermos and spare scarf), and engineering students Priya Nair and Ben Ortiz, who climbed onto the walkway ten minutes earlier behind Theo Marsh.
