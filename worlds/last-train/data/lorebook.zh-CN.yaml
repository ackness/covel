- id: line-4
  keys: [四号线, 隧道]
  content: 四号线在考尔德河底下穿过，一头是低岸的码头街，另一头是前方九百米、地势偏高的默瑟公园。隧道在河底往下沉，再爬上来。每隔一百二十米有一条联络通道通到平行隧道，入口是带编号的厚门。
- id: wharf-street
  keys: [码头街, 泵房]
  content: 码头街是车后方低岸的那一站。它的泵房本该让河底这段保持干燥。停电时泵停了。能不能手动启动、列车和泵房之间的水有多深，车上没人说得准。
- id: crossover
  keys: [渡线室, 默瑟公园, 楼梯]
  content: 列车前方大约四百米，四号线的两条隧道在一个宽敞的渡线室里汇合，那里有一道通到街面的紧急楼梯。过了渡线室再往前五百米、往上走，就是默瑟公园站。楼梯顶上的门往外开，按规定不该上锁。
- id: blackout
  keys: [停电, 风暴, 风暴潮]
  content: 23:47 风暴潮翻过河堤，全城电网瘫痪。手机基站靠备用电撑着，有的已经撑不住，信号时有时无。调度中心有自己的应急电源，正在同时盯着每一列停下的车。
- id: tunnel-safety
  keys: [疏散平台, 道床, 接触轨]
  content: 疏散平台是贴着隧道壁的一条水泥台，宽度够一个人走。停电时接触轨是断电的，但员工受的训练是：调度确认隔离之前，一律当它带电。道床上的积水会盖住轨枕和排水沟。
- id: calder-floodwall
  keys: [河水, 河堤, 防洪墙, 水位, 倒灌, 考尔德]
  content: 考尔德河东码头段的旧石砌防洪堤比默瑟公园高岸低了约半米。23:47 风暴潮漫过堤顶后，雨水与河水顺着码头街通风井灌进河底这段凹槽，高岸城区却几乎没进水。按眼下的倒灌速度，积水先慢后急，大约在 02:36 漫到车厢地板下的电池箱。
- id: pump-refit
  keys: [格雷厄姆, 旁通阀, 手摇, 阀门, 淤泥, 翻修]
  content: 六年前码头街泵房改造成电网远程控制，撤掉了夜班值守工。格雷厄姆·派克当年反对过那次省钱改造，至今记得南侧工具柜后面还留着沉重的铸铁手动旁通轮——不过一旦水倒灌淹过机房地板，河泥很容易把止回闸门卡死。
- id: second-train-and-control
  keys: [调度, 救援, 后面那列车, 信号, 电台]
  content: 断电切到备用电源后，四号线调度室只能看到模糊的区段占线灯，看不见每列车厢里的水位。还有一列晚班车停在离码头街更近两百米处，老车长的电台先一步中断；调度 23:51 发出的那句“救援正从码头街过来”，前提是抢险队能先趟过码头街站厅楼梯再救那列车。
- id: car-passengers
  keys: [乘客, 亚瑟, 大提琴, 托马斯, 婚礼, 玛雅, 山姆, 学生, 普丽娅, 本]
  content: 车厢里的四十名乘客中，有患哮喘的七十三岁退休码头文员亚瑟·贝尔（娜迪娅正守在第四排照看他）、一直抱紧防水大提琴盒（里面还有干松香和备用琴弦）的乐手托马斯·林德、穿着湿透礼服带了半壶温茶与围巾的新婚夫妻玛雅和山姆·帕特尔，以及十分钟前跟西奥·马什一起沿着疏散平台先走的工科生普丽娅·奈尔和本·奥尔蒂斯。
