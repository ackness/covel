- id: dara-quinn
  name: 达拉·奎因
  notes: 这趟车的司机。车上有个穿员工外套的人，她松了口气，也指望你帮她守住调度的命令。
- id: theo-marsh
  name: 西奥·马什
  notes: 往渡线室先走了的休班信号维修工。你们在车辆段打过照面；他喜欢不耽误他时间的人。
- id: nadia-haddad
  name: 娜迪娅·哈达德
  notes: 在照看一位老人的夜班护士。她跟谁都能合作，但不会拿病人的那口气去换任何人的计划。
- id: graham-pike
  name: 格雷厄姆·派克
  notes: 想回泵房的退休工程师。他觉得你太谨慎；你觉得他低估了水。
- id: kit-alvarez
  name: 基特·阿尔瓦雷斯
  notes: 车上唯一一部总能找到信号的手机就在这个外卖骑手手里。他想帮忙，也想被人相信，想得有点过头。
