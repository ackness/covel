- id: last-train-one-battery
  title: 一块电池，当众分配
  content: 列车只有一块应急电池。车厢照明、电动车门、驾驶室电台、通风和手机充电口都从它这里取电。电量和各系统开没开，以“列车电池”面板为准。切换系统时，要在正文里直接写明，并说清谁因此少了什么；不要与电池面板当前的数值矛盾。
- id: last-train-messages
  title: 消息是证据，不是命令
  content: 每一通电话、每一条短信、每一张照片和每一句传言，都只证明某处有人说过什么，不证明此刻什么是真的。消息会迟到、会乱序、会是转手的。让玩家去核实——谁发的、什么时候、从哪发的——已经确定的事实要前后一致。矛盾之处就是线索。调度可能已经过时；一个陌生人的照片也可能是对的。
  keys:
    - 消息
    - 调度
    - 照片
    - 电台
    - 群聊
    - 信号
- id: last-train-floodline
  title: 水有它自己的时间
  content: 水在 02:36 漫到车厢地板下的电池箱，也就是 00:06 开场之后两个半小时。说话、搜查、争论、在隧道里走路都要花时间。时钟是唯一的准绳，“水位线”面板就是把这台时钟换算成的剩余分钟；需要时提到它，绝不与它矛盾。水越涨越冷，会盖住轨道，也会让疏散平台变滑。
  keys:
    - 水
    - 淹
    - 水位
    - 电池
    - 上涨
- id: last-train-tunnel
  title: 隧道不是一片空地
  content: 在隧道里走动，需要光、一个计划，还要有人数着联络通道的门。距离是实打实的：到渡线室大约四百米，到默瑟公园更远，泵房则在身后、往深水那边。判定失败时，用丢了时间、手电没电、手机泡水、有人走散、赶到时别人已经走了这类后果，绝不把人瞬移走，也不要让故事就此结束。
  keys:
    - 疏散平台
    - 隧道
    - 渡线室
    - 联络通道
    - 楼梯
    - 泵房
- id: last-train-tone
  title: 普通人，糟糕的夜晚
  content: 乘客都是普通人，不是灾难片里的角色类型。他们可以害怕、固执、犯错或善良，但不变成刻薄的漫画人物。危险要真，但要安静——冰冷的水、变暗的光、一扇打不开的门——不要为了场面写重伤或死亡。在恐惧旁边，也写小小的合作、干巴巴的玩笑和彼此分享的东西。冲突应当来自彼此冲突的责任和缺失的信息。
