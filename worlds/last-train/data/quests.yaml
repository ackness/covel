- id: two-messages
  name: Two Messages
  description: Control says hold position and wait for a rescue team from Wharf Street. A photo on Kit's phone says Wharf Street is underwater. Find out which one to act on before the car decides for itself.
  status: active
  giver: The car
  reward: A plan the car can actually follow
  deadline:
    when: { dimension: floodline, path: stage, equals: battery }
    label: Before the water reaches the battery boxes
    missed: The water reached the battery boxes and the car went dark before anyone knew which message to trust. From here on, the car argues in the dark.
  objectives:
    - id: reach-control
      text: Get a clear answer from Control over the cab radio
      done: false
    - id: check-the-photo
      text: Find out where and when the flooded-station photo was taken
      done: false
    - id: tell-the-car
      text: Tell the car what you know, and what you don't
      done: false
- id: the-three-who-walked
  name: The Three Who Walked Ahead
  description: Theo and two students set off along the walkway toward the crossover with one of the train's two lamps. Nobody has heard from them since. Reach them, or get a message to them, before they reach the crossover alone.
  status: active
  giver: Dara Quinn
  reward: Theo's knowledge of the tunnel, and three people accounted for
  objectives:
    - id: reach-theo
      text: Get word to Theo's group
      done: false
      deadline:
        when: { time: elapsedSinceStart, gte: 45 }
        label: Before they reach the crossover, about 00:51
        missed: Theo's group reached the crossover with no word from you and chose their own way on. Their lamp is gone from the walkway; you will have to find them.
    - id: meet-or-recall
      text: Meet them at the crossover, or bring them back
      done: false
- id: one-battery
  name: One Battery
  description: The emergency battery under the floor has to run the lights, the doors, the radio, the fans, and the phone chargers, and it can't run them all. The water is rising toward it.
  status: active
  giver: Dara Quinn
  reward: A train that still has light when it matters
  objectives:
    - id: read-the-gauge
      text: Read the battery gauge with Dara in the cab
      done: false
    - id: keep-graham
      text: Keep Graham with the car instead of the pump room
      done: false
      deadline:
        when: { affinity: Graham Pike, path: tier, in: [cold, hostile] }
        label: While Graham still listens to you
        missed: Graham stopped listening to you and set off alone toward the Wharf Street pump room with the spare lamp. Someone will have to go after him, or let him go.
    - id: choose-priorities
      text: Decide what the battery runs
      done: false
      deadline:
        when: { dimension: floodline, path: stage, in: [knee, battery] }
        label: Before the water is knee-deep
        missed: Nobody chose in time. Dara cut the doors and the phone chargers herself to keep the radio alive, and half the car blames you for it.
