- id: second-train
  title: 后面那列车
  payload: 驾驶室电台通着电，一个小时以来，调度的声音第一次清楚地传过来。这列车后面还停着一列四号线，离码头街很近，泡在更深的水里。码头街的救援队会先去那列车。调度没说之后要多久。让达拉先听到，让她自己决定要不要告诉车里的人，也让玩家看到这对她意味着什么；不要交代救援会不会很快到。
- id: kit-tells-the-truth
  title: 照片是哪来的
  payload: 有人核实过那张站厅被淹的照片之后，基特把玩家拉到一边。照片不是他姐姐发的，是他直播间里一个观众发的，那人说自己就站在码头街。他说成“我姐姐”，是因为觉得没人会听网上一个陌生人的话。他很难为情，也有点害怕。写出他的紧张，和终于说出口的如释重负；照片到底是不是真的，仍以核实结果为准。
- id: chained-door
  title: 楼梯门
  payload: 西奥一行爬到渡线室楼梯顶上，发现紧急门打不开。从门缝里能看到外侧推杆上绕着一圈施工队的铁链，能感觉到外面又冷又干的风，还能听见上面某处有警笛。把这些物理细节写具体——铁链、推杆、门缝、那盏灯——让这组人做出反应；不要决定门怎么打开、由谁打开。
- id: asthma-air-crisis
  title: 闷住的空气
  payload: 通风一直关着，湿衣服在密闭车厢里散着潮气，第四排的亚瑟·贝尔开始喘得接不上气，喷雾罐也快见底了。娜迪娅隔着过道喊，必须把通风重新开到低档——哪怕要关掉车厢灯或手机充电口。写出吃力的喘息、起雾的车窗和抱着半格电手机的人投来的目光，让玩家决定切掉哪一项供电。
- id: students-split-walkway
  title: 折返的年轻人
  payload: 前方黑漆漆的隧道里传来飘忽的喊声：冰水漫过脚踝时，本·奥尔蒂斯吓慌了，没带手提灯就摸黑沿疏散平台往车厢这边挪，西奥和普丽娅留在三号联络通道口一边叫他一边没法离开手头的灯。把声音和距离写具体，让玩家决定是拿手电上平台去接，还是叫达拉闪几下车头大灯。
- id: pump-room-seal
  title: 码头街背后的泥沙
  payload: 格雷厄姆·派克盯着后门处上涨的水线，从钱包里摸出一张旧公交维修证。他像是说给自己听似的，讲出全城停电后泵房自动继电器为何断开，又承认工具柜后面那个手动旁通阀需要人稳住脚跟两手去拧。把他的固执与老工程师的经验落到具体物件上，让玩家决定支持他、拦住他还是改派人手，但先别替他走完这段路。
- id: cello-in-the-dark
  title: 黑暗里的琴弦与最后一格微光
  payload: 车厢积水没到膝盖、顶灯闪成暗黄时，托马斯·林德解开护在膝上的大提琴盒，拉响一记沉稳的低音弦压住了人群的噪动；门边的基特举着只剩百分之三电量的手机，刚好刷出一格断断续续的信号——够发出一行短消息，或者最后照明一小段路，玛雅与山姆也把包里那壶还带着余温的茶递给周围站不稳的人。用这些具体动作写出普通乘客在绝境里的支撑，留给玩家决定基特最后这点电该用来发求救坐标、传口信，还是立刻带着大家动身撤离。
