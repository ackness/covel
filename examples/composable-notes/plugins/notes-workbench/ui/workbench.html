<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes Workbench</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        color: CanvasText;
        background: Canvas;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .hint,
      .meta {
        margin: 4px 0 12px;
        opacity: 0.7;
        font-size: 12px;
      }
      label {
        display: block;
        margin: 10px 0 5px;
        font-weight: 600;
      }
      textarea,
      select,
      button {
        font: inherit;
        border: 1px solid GrayText;
        border-radius: 8px;
      }
      textarea,
      select {
        width: 100%;
        color: CanvasText;
        background: Canvas;
        padding: 8px;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
        max-height: 180px;
      }
      button {
        padding: 7px 12px;
        cursor: pointer;
        background: ButtonFace;
        color: ButtonText;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      #save {
        color: HighlightText;
        background: Highlight;
        border-color: Highlight;
      }
      #status {
        min-height: 2.5em;
        margin: 8px 0;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      #status[data-error="true"] {
        color: light-dark(#a32929, #ffb4ab);
      }
      h2 {
        margin: 12px 0 6px;
        font-size: 14px;
      }
      #notes {
        max-height: 200px;
        overflow-y: auto;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      #notes li {
        border-top: 1px solid GrayText;
        padding: 10px 0;
      }
      .note-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0 0 4px;
      }
      .meta {
        overflow-wrap: anywhere;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="title">Notes Workbench</h1>
    <p class="hint" data-i18n="intro">
      Save a note as written, or process it with an enabled extension.
    </p>
    <label for="text" data-i18n="textLabel">Note</label>
    <textarea id="text" maxlength="4000" rows="4" spellcheck="true"></textarea>
    <label for="processor" data-i18n="processorLabel">Processing</label>
    <select id="processor"></select>
    <div class="actions">
      <button id="save" type="button" disabled data-i18n="save">
        Save note
      </button>
      <button id="refresh" type="button" disabled data-i18n="refresh">
        Refresh processors
      </button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <h2 data-i18n="savedTitle">Saved notes</h2>
    <p id="empty" class="hint" data-i18n="empty">
      Your saved notes will appear here.
    </p>
    <ul id="notes" aria-label="Saved notes"></ul>
    <script>
      const messages = {
        en: {
          title: "Notes Workbench",
          intro:
            "Save a note as written, or process it with an enabled extension.",
          textLabel: "Note",
          placeholder: "Write or paste a note…",
          processorLabel: "Processing",
          raw: "Save as written",
          save: "Save note",
          refresh: "Refresh processors",
          savedTitle: "Saved notes",
          empty: "Your saved notes will appear here.",
          ready:
            "Refresh to find enabled processors. Saving as written is always available.",
          saving: "Saving…",
          refreshing: "Finding processors…",
          saved: "Note saved.",
          refreshed: "Available processors updated.",
          noProviders:
            "No enabled processors found. Enable one in plugin settings, then refresh.",
          failed:
            "The operation failed. Check that the selected processor is enabled and approved, then retry. Your draft is unchanged.",
          cancelled: "Permission was not granted. Your draft is unchanged.",
          unavailable: "Unavailable",
          locked: "Wait for the current action to finish.",
          invalid: "Enter a note between 1 and 4,000 characters.",
          source: "Processed by",
          original: "Saved as written",
        },
        zh: {
          title: "记录工作台",
          intro: "直接保存记录，或交给已启用的扩展处理后保存。",
          textLabel: "记录内容",
          placeholder: "写下或粘贴一段记录…",
          processorLabel: "处理方式",
          raw: "原样保存",
          save: "保存记录",
          refresh: "刷新处理方式",
          savedTitle: "已保存的记录",
          empty: "保存后的记录会显示在这里。",
          ready: "刷新可查找已启用的处理方式，也可以直接原样保存。",
          saving: "正在保存…",
          refreshing: "正在查找处理方式…",
          saved: "记录已保存。",
          refreshed: "可用处理方式已更新。",
          noProviders: "尚无可用处理方式。请在插件设置中启用后刷新。",
          failed:
            "操作失败。请确认所选处理插件已启用并获得授权，然后重试。草稿已保留。",
          cancelled: "尚未获得操作授权，草稿已保留。",
          unavailable: "当前不可用",
          locked: "请等待当前操作完成。",
          invalid: "请输入 1 到 4000 个字符的记录。",
          source: "处理来源",
          original: "原样保存",
        },
      };
      const text = document.getElementById("text");
      const select = document.getElementById("processor");
      const save = document.getElementById("save");
      const refresh = document.getElementById("refresh");
      const status = document.getElementById("status");
      let locale = "en",
        ready = false,
        locked = false,
        busy = false;
      let providers = [],
        records = {},
        statusKey = "ready",
        statusError = false;
      const t = (key) => messages[locale][key];
      function showStatus(key, error = false) {
        statusKey = key;
        statusError = error;
        status.textContent = t(key);
        status.dataset.error = String(error);
      }
      function controls() {
        const unavailable =
          !!select.value &&
          !providers.some((item) => item.pluginId === select.value);
        save.disabled =
          !ready || locked || busy || unavailable || !text.value.trim();
        refresh.disabled = !ready || locked || busy;
        select.disabled = locked || busy;
        text.disabled = locked || busy;
      }
      function renderProviders() {
        const chosen = select.value;
        select.replaceChildren(new Option(t("raw"), ""));
        for (const provider of providers) {
          select.add(
            new Option(
              provider.description || provider.pluginId,
              provider.pluginId,
            ),
          );
        }
        // A removed provider never silently changes a processed save into a raw save.
        if (chosen && !providers.some((item) => item.pluginId === chosen)) {
          const option = new Option(`${chosen} · ${t("unavailable")}`, chosen);
          option.disabled = true;
          select.add(option);
        }
        select.value = chosen;
        controls();
      }
      function renderNotes() {
        const list = document.getElementById("notes");
        list.replaceChildren();
        const notes = Object.values(records)
          .filter((note) => note && typeof note.text === "string")
          .sort((a, b) =>
            String(b.createdAt).localeCompare(String(a.createdAt)),
          );
        document.getElementById("empty").hidden = notes.length > 0;
        list.setAttribute("aria-label", t("savedTitle"));
        for (const note of notes) {
          const row = document.createElement("li");
          const body = document.createElement("p");
          body.className = "note-text";
          body.textContent = note.text;
          const meta = document.createElement("p");
          meta.className = "meta";
          const date = new Date(note.createdAt);
          const timestamp = Number.isNaN(date.valueOf())
            ? ""
            : date.toLocaleString(locale === "zh" ? "zh-CN" : "en");
          meta.textContent = `${note.providerPluginId ? `${t("source")}: ${note.providerPluginId}` : t("original")} · ${timestamp}`;
          row.append(body, meta);
          list.append(row);
        }
      }
      async function invoke(name, payload = {}) {
        const response = await window.covel.invoke("invokeRuntime", {
          runtimeId: `notes-workbench/${name}`,
          payload,
        });
        if (!response || response.status === "approval-required") {
          showStatus("cancelled");
          return null;
        }
        const result = response.runtimeResults?.find(
          (item) => item.runtimeId === `notes-workbench/${name}`,
        );
        if (
          response.status !== "ok" ||
          response.abortReason ||
          result?.status !== "success" ||
          !result.output
        ) {
          throw new Error("The note operation did not complete");
        }
        return result.output;
      }
      refresh.addEventListener("click", async () => {
        if (busy || locked || !ready) return;
        busy = true;
        controls();
        showStatus("refreshing");
        try {
          const output = await invoke("providers");
          if (output) {
            if (!Array.isArray(output.providers))
              throw new Error("Invalid providers");
            providers = output.providers.filter(
              (item) =>
                typeof item.pluginId === "string" &&
                item.name === "format-note",
            );
            renderProviders();
            showStatus(providers.length ? "refreshed" : "noProviders");
          }
        } catch {
          showStatus("failed", true);
        } finally {
          busy = false;
          controls();
        }
      });
      save.addEventListener("click", async () => {
        if (busy || locked || !ready || save.disabled) return;
        if (!text.value.trim() || text.value.length > 4000) {
          showStatus("invalid", true);
          return;
        }
        const draft = text.value;
        const payload = {
          text: draft,
          ...(select.value ? { providerPluginId: select.value } : {}),
        };
        busy = true;
        controls();
        showStatus("saving");
        try {
          const output = await invoke("save", payload);
          if (output) {
            if (!output.note || typeof output.note.id !== "string")
              throw new Error("Invalid note response");
            // Only a committed successful runtime response may clear the draft.
            if (text.value === draft) text.value = "";
            showStatus("saved");
          }
        } catch {
          showStatus("failed", true);
        } finally {
          busy = false;
          controls();
        }
      });
      text.addEventListener("input", controls);
      select.addEventListener("change", controls);
      window.covel.subscribe((state) => {
        ready = typeof state.locale === "string";
        locale = state.locale?.toLowerCase().startsWith("zh") ? "zh" : "en";
        locked = state.locked === true;
        records =
          state.data && typeof state.data === "object" ? state.data : {};
        document.documentElement.lang = locale;
        for (const element of document.querySelectorAll("[data-i18n]"))
          element.textContent = t(element.dataset.i18n);
        text.placeholder = t("placeholder");
        renderProviders();
        renderNotes();
        if (locked && !busy) {
          status.textContent = t("locked");
          status.dataset.error = "false";
        } else showStatus(statusKey, statusError);
        controls();
      });
    </script>
  </body>
</html>
