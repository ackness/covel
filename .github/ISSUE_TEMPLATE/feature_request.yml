name: Feature request · 功能建议
description: Suggest a new feature or improvement / 建议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Fill in either language. New plugins and worlds are shared through the plugin and world directories, not this repository.
        可以使用任一语言。新的插件和世界通过插件目录、世界目录分享，不需要在本仓库提需求。
  - type: textarea
    id: context
    attributes:
      label: Context / 背景
      description: |
        Current limitation or use case, and who runs into it (player, world author, plugin author).
        当前遇到的问题、限制或使用场景，以及受影响的是玩家、世界作者还是插件作者。
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior / 期望行为
      description: What should happen instead? / 希望 Covel 怎样处理？
    validations:
      required: true
  - type: checkboxes
    id: layer
    attributes:
      label: Where it belongs / 归属层
      description: |
        Covel keeps gameplay in plugins and settings in world packs; the kernel only gains generic primitives (a proposal type, hook event, extension point, or trigger). Tick your best guess.
        Covel 把玩法放在插件里、把设定放在世界包里；内核只增加通用原语（proposal 类型、hook 事件、扩展点或触发方式）。按你的判断勾选。
      options:
        - label: Kernel primitive or API / 内核原语或 API
        - label: Bundled plugin / 内置插件
        - label: World pack or world data / 世界包或世界数据
        - label: App UI (web / desktop) / 应用界面
        - label: Tooling or docs / 工具链或文档
        - label: Not sure / 不确定
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 备选方案
      description: |
        Other approaches you considered, including doing it as a community plugin today.
        你考虑过的其他做法，包括现在就用社区插件实现。
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 额外上下文
      description: Screenshots, links, references. / 相关截图、链接、文档引用。
