name: Site

# Builds the showcase website (apps/site) with the documentation site
# (apps/docs, pages in docs) under its `docs/` path, and publishes both on
# GitHub Pages.
# CI calls this once per nonrelease run; only eligible main pushes deploy.
# Manual runs can also deploy. PRs only build, regardless of the deploy input.
# Pages must use "GitHub Actions" as its source (Settings > Pages).
on:
  workflow_call:
    inputs:
      commit:
        description: Immutable source commit, when supplied by CI.
        required: false
        type: string
      deploy:
        description: Publish this build to GitHub Pages.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this build to GitHub Pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# A build-only main run must not replace a pending deployment. PRs still share
# a group, as do eligible deployments, matching the previous Site trigger.
concurrency:
  group: site-${{ (github.event_name == 'pull_request' || inputs.deploy) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep the content-addressed build cache bounded independently of other CI jobs.
env:
  TURBO_CACHE_MAX_AGE: 2d
  TURBO_CACHE_MAX_SIZE: 500MB

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub keeps PR caches scoped to the PR ref; deployments cannot restore
      # them. Turbo validates task inputs, including SITE_BASE, after restore.
      - name: Cache site builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-site-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ inputs.commit || github.sha }}
          restore-keys: |
            turbo-site-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      # Both builds read SITE_BASE, the path Pages serves the site under: `/covel/` on
      # ackness.github.io, `/` once a custom domain is set. A pull request
      # cannot read the Pages settings, so it builds for `/covel/`.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && '/covel/' || format('{0}/', steps.pages.outputs.base_path) }}
        run: |
          pnpm exec turbo build --filter=@covel/site --filter=@covel/docs --concurrency=2
          # Assembly happens after Turbo has cached each independent output.
          # A restored site output must never retain an older docs subtree.
          rm -rf apps/site/dist/docs
          cp -R apps/docs/dist apps/site/dist/docs

      - name: Upload Pages artifact
        if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ inputs.deploy && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
