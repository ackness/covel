name: Merge gate

# One check that every pull request has, for the `Protect main` ruleset to
# require. CI, Docs and Site each run only for the paths they cover, so none of
# them can be required by name: a pull request that does not trigger a required
# workflow would wait for it without end.
#
# The job waits until every other check of the head commit has finished and
# fails as soon as one of them fails. After a failed check is re-run and passes,
# re-run this job too.
on:
  pull_request:

permissions: {}

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: All checks pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read

    steps:
      - name: Wait for the other checks of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: All checks pass
        run: |
          set -euo pipefail
          # Give the other workflows time to create their check runs.
          sleep 45
          quiet=0
          while true; do
            runs="$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.SELF) | [.status, (.conclusion // "-"), .name] | @tsv')"
            failed="$(awk -F'\t' '$1 == "completed" && $2 !~ /^(success|skipped|neutral)$/' <<< "$runs")"
            if [[ -n "$failed" ]]; then
              echo "::error::A check of this commit did not pass."
              echo "$failed"
              exit 1
            fi
            pending="$(awk -F'\t' 'NF && $1 != "completed"' <<< "$runs")"
            if [[ -z "$pending" ]]; then
              # A workflow may add its jobs a moment after the last one
              # finished: pass only when two polls in a row find nothing left.
              quiet=$((quiet + 1))
              if (( quiet >= 2 )); then
                echo "Every check of $SHA passed:"
                echo "$runs"
                exit 0
              fi
            else
              quiet=0
              echo "Waiting for:"
              echo "$pending"
            fi
            sleep 30
          done
