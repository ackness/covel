name: Merge gate

# The stable ruleset check requires CI's explicit Verification aggregate and
# retains failures from Site and every other check. Cross-workflow checks do
# not support jobs.needs, so only this outer gate still polls the Checks API.
# After a failed check is re-run and passes, re-run this job too.
on:
  pull_request:

permissions: {}

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: All checks pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for the other checks of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Give the other workflows time to create their check runs.
          sleep 45
          quiet=0
          while true; do
            runs="$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100")"
            state="$(printf '%s' "$runs" | node scripts/ci-results.mjs checks)"
            if [[ "$state" == failure ]]; then
              echo "::error::A check of this commit did not pass."
              echo "$runs"
              exit 1
            fi
            if [[ "$state" == success ]]; then
              # Keep the existing quiet period for late-arriving Site/other jobs.
              quiet=$((quiet + 1))
              if (( quiet >= 2 )); then
                echo "Verification and every other check of $SHA passed."
                exit 0
              fi
            else
              quiet=0
              echo "Waiting for Verification and the other checks of $SHA."
            fi
            sleep 30
          done
