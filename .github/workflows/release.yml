name: Build Desktop (macOS)

# Triggers:
#   - push to a `v*` tag → build & publish a Release automatically.
#   - manual dispatch     → optional tag/publish for ad-hoc reproductions.
#
# Primary distribution path is local builds (`pnpm build:electron`); CI is
# the reproducible / signed path. macOS arm64 only — Windows/Linux build
# locally on their native OS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build against. Leave empty for current HEAD."
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release with the built artefacts (requires tag)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # On tag push the ref is `refs/tags/vX.Y.Z`; on dispatch fall back to the
  # supplied tag or the workflow ref. Either way one tag at a time.
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Electron shell (macOS arm64) ────────────────────────────────
  build-electron:
    name: Electron mac-arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On tag push the runner already checks out the tag; on dispatch
          # honour the optional input. Empty string falls back to default.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Build desktop (web + server staging + native rebuild for Electron)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron mac
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unpacked release resources
        run: node apps/desktop/scripts/verify-release.mjs mac

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covel-electron-mac-arm64
          # cleanup-artifacts.mjs strips blockmaps and update-info yml so the
          # release dir only ever contains the two distributable bundles.
          path: |
            release/electron/*.dmg
            release/electron/*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Publish GitHub Release ─────────────────────────────────────
  # Auto-publishes when a `v*` tag is pushed. On manual dispatch the
  # `publish_release` toggle still gates publication.
  release:
    name: Publish GitHub Release
    needs: [build-electron]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.tag != '')

    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout (for CHANGELOG extraction)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # We only need the working tree for docs/CHANGELOG.md, no history.
          fetch-depth: 1

      - name: Extract CHANGELOG section for this tag
        # Pull the lines between `## [<version>]` and the next `## [` header
        # in docs/CHANGELOG.md and write them to release/notes.md so the
        # GitHub Release body shows the same notes maintainers wrote in the
        # repo. Falls back to a generic "see CHANGELOG.md" line when the
        # section is missing — the auto-generated PR list still gets
        # appended below by `generate_release_notes: true`.
        run: |
          set -euo pipefail
          mkdir -p release
          version="${RELEASE_TAG#v}"
          if [ ! -f docs/CHANGELOG.md ]; then
            echo "_See [docs/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${RELEASE_TAG}/docs/CHANGELOG.md)._" > release/notes.md
            echo "::warning::docs/CHANGELOG.md missing — release body will only carry auto-generated PR notes."
            exit 0
          fi
          # `awk` is more reliable than sed for "between two markers" on
          # macOS+linux. Stop printing the moment we hit the next `## [` header.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' docs/CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "## ${RELEASE_TAG}" > release/notes.md
            echo "" >> release/notes.md
            echo "_No CHANGELOG entry found for ${RELEASE_TAG}. See [docs/CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${RELEASE_TAG}/docs/CHANGELOG.md)._" >> release/notes.md
            echo "::warning::No CHANGELOG section matched version $version — using fallback body."
          fi
          echo "── release/notes.md ──"
          cat release/notes.md

      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/electron
          pattern: covel-electron-*
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          echo "=== release/electron ==="
          ls -lh release/electron/ || true

      - name: Remove stale releases for this tag
        run: |
          gh api /repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "'"$RELEASE_TAG"'") | .id' |
          while read -r id; do
            echo "Deleting stale release $id for tag $RELEASE_TAG"
            gh api -X DELETE "/repos/${{ github.repository }}/releases/$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Covel ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          # `-rc1`, `-beta` etc. are pre-releases. Plain `v0.0.1` is stable.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # `body_path` populates the top of the release body with the
          # CHANGELOG section authored in `docs/CHANGELOG.md`.
          # `generate_release_notes: true` then appends the auto-generated
          # "What's Changed" / "New Contributors" sections beneath it.
          body_path: release/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          # cleanup-artifacts.mjs leaves only the two distributables behind.
          files: |
            release/electron/*.dmg
            release/electron/*.zip
