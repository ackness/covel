name: Build Desktop

# Tag pushes build and publish an unsigned release. Manual runs may build any
# existing ref; enabling publish_release requires an existing v* tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag or ref to build. Leave empty for this workflow commit."
        required: false
        type: string
      publish_release:
        description: "Publish the existing v* tag."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve and validate source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve a moving branch only here. Every downstream job checks out
          # the immutable commit output by this job.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit and validate release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_INPUT: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          publish=false
          release_tag=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            publish=true
            release_tag="$EVENT_TAG"
          elif [[ "$PUBLISH_INPUT" == "true" ]]; then
            publish=true
            release_tag="$INPUT_TAG"
          fi

          if [[ "$publish" == "true" ]]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Publishing requires an existing semantic-version tag such as v0.0.27."
              exit 1
            fi

            tag_commit="$(git rev-list -n 1 "refs/tags/$release_tag" 2>/dev/null || true)"
            if [[ -z "$tag_commit" ]]; then
              echo "::error::Tag $release_tag does not exist; the release workflow never creates tags."
              exit 1
            fi
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "::error::Tag $release_tag resolves to $tag_commit, but the build resolved $commit."
              exit 1
            fi

            version="${release_tag#v}"
            RELEASE_VERSION="$version" node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const files = execFileSync(
            "git",
            [
              "ls-files",
              "--",
              "package.json",
              "apps/*/package.json",
              "packages/*/package.json",
              "plugins/*/package.json",
            ],
            { encoding: "utf8" },
          )
            .trim()
            .split(/\r?\n/)
            .filter(
              (file) =>
                file &&
                (file === "package.json" || file.split("/").length === 3),
            );
          const expected = process.env.RELEASE_VERSION;
          const mismatches = files.filter(
            (file) => JSON.parse(fs.readFileSync(file, "utf8")).version !== expected,
          );
          if (mismatches.length > 0) {
            console.error(
              `Release tag v${expected} does not match package version in:\n${mismatches.join("\n")}`,
            );
            process.exit(1);
          }
          console.log(`Validated version ${expected} across ${files.length} workspace manifests.`);
          NODE

            if ! grep -Fq "## [$version]" docs/CHANGELOG.md; then
              echo "::error::docs/CHANGELOG.md has no section for $release_tag."
              exit 1
            fi
          fi

          {
            echo "commit=$commit"
            echo "publish=$publish"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  verify-release:
    name: Test and release preflight
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Dependency hygiene
        run: pnpm deps:check

      - name: Test
        run: pnpm test

      - name: Check plugin/world i18n coverage and READMEs
        run: pnpm check:i18n

      - name: Release preflight
        run: pnpm release:preflight -- --skip-lockfile

  build-electron:
    name: Electron mac-arm64
    needs: [prepare, verify-release]
    runs-on: macos-15

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Build desktop (web + server staging + native rebuild for Electron)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron mac
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          pnpm exec electron-builder --mac --publish=never

      - name: Verify unpacked release resources
        run: node apps/desktop/scripts/verify-release.mjs mac

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covel-electron-mac-arm64
          path: |
            release/electron/*.dmg
            release/electron/*.zip
          if-no-files-found: error
          retention-days: 7

  build-electron-win:
    name: Electron windows-x64
    needs: [prepare, verify-release]
    runs-on: windows-latest

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop (web + server staging + native rebuild for Electron)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron win
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --win --publish=never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify unpacked release resources
        run: node apps/desktop/scripts/verify-release.mjs win

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covel-electron-win
          path: release/electron/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, verify-release, build-electron, build-electron-win]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Extract CHANGELOG section for this tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' docs/CHANGELOG.md > release/notes.md
          test -s release/notes.md

      - name: Download Electron artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/electron
          pattern: covel-electron-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lh release/electron/

      # action-gh-release updates an existing release for the immutable tag;
      # do not delete a valid release before all new assets are ready.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Covel ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: release/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.exe
