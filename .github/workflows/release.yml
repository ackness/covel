name: Release Desktop

# 只在推送 v* tag 时触发（例如 v0.0.1-beta / v0.1.0 / v1.0.0）。
# push 到 main 不会触发；CI 由 PR 上的其他 workflow 覆盖（本 repo 暂无）。
# 也允许手动从 Actions UI 触发，便于测试构建流程。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build against (e.g. v0.0.1-beta). Leave empty to use current HEAD."
        required: false
        type: string

permissions:
  contents: write  # 需要此权限来创建 GitHub Release 并上传产物

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon runner
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        # 不指定 version，v6 会从 package.json packageManager 字段读取，
        # 确保本地与 CI 用同一个 pnpm 版本
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Build desktop (web + server staging)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron (${{ matrix.platform }})
        # 直接调 electron-builder CLI 避免 pnpm script + `--` 吞参数；
        # --publish=never 让 electron-builder 不自己创建 release，交给下游
        # softprops/action-gh-release job 统一处理。
        # 签名 secret 在未设置时会变成空串，空的 CSC_LINK 会被 electron-builder
        # 当成 cert 路径误读，因此只在确实存在时才注入。
        working-directory: apps/desktop
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covel-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          ls -lh release/
          echo "---"
          find release -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Covel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          # tag 带 -（如 -beta / -rc.1）视为 pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
