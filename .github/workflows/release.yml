name: Build Desktop (macOS)

# Manual-only to keep GitHub Actions usage low. Primary distribution path
# is local builds (`pnpm dist:mac:electron` / `pnpm dist:mac:tauri`).
# This workflow just produces the same artefacts on a clean macOS runner
# when you want an independent reproduction, or to publish a signed
# release with the `publish_release` input set.
#
# macOS arm64 only. Windows/Linux are intentionally dropped — build them
# locally on their native OS as needed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build against. Leave empty for current HEAD."
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release with the built artefacts (requires tag)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Electron shell (macOS arm64) ────────────────────────────────
  build-electron:
    name: Electron mac-arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Build desktop (web + server staging + native rebuild for Electron)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron mac
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unpacked release resources
        run: node apps/desktop/scripts/verify-release.mjs mac

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covel-electron-mac-arm64
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.blockmap
            release/electron/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # ── Tauri shell (macOS arm64, ~50% smaller bundle) ─────────────
  build-tauri:
    name: Tauri mac-arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target
          key: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Electron desktop (shared staging for Tauri sidecar)
        run: pnpm --filter @covel/desktop build

      - name: Prepare Tauri sidecar (download node + rebuild native deps)
        run: node apps/desktop-tauri/scripts/prepare-sidecar.mjs --target aarch64-apple-darwin

      - name: Build Tauri bundle
        working-directory: apps/desktop-tauri
        run: pnpm tauri build --target aarch64-apple-darwin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Stage release artefacts
        run: node apps/desktop-tauri/scripts/stage-release.mjs aarch64-apple-darwin

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covel-tauri-mac-arm64
          path: release/tauri/aarch64-apple-darwin/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ── Publish GitHub Release (optional, gated by inputs.publish_release) ─
  release:
    name: Publish GitHub Release
    needs: [build-electron, build-tauri]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_release && inputs.tag != '' }}

    steps:
      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/electron
          pattern: covel-electron-*
          merge-multiple: true

      - name: Download Tauri artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/tauri
          pattern: covel-tauri-*
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          echo "=== release/electron ==="
          ls -lh release/electron/ || true
          echo "=== release/tauri ==="
          ls -lh release/tauri/ || true

      - name: Remove stale releases for this tag
        run: |
          gh api /repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "${{ inputs.tag }}") | .id' |
          while read -r id; do
            echo "Deleting stale release $id for tag ${{ inputs.tag }}"
            gh api -X DELETE "/repos/${{ github.repository }}/releases/$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Covel ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.blockmap
            release/electron/latest*.yml
            release/tauri/*.dmg
