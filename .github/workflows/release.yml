name: Build Desktop (macOS)

# Triggers:
#   - push to a `v*` tag → build & publish a Release automatically.
#   - manual dispatch     → optional tag/publish for ad-hoc reproductions.
#
# Primary distribution path is local builds (`pnpm build:electron`); CI is
# the reproducible / signed path. macOS arm64 only — Windows/Linux build
# locally on their native OS.
#
# Tauri shell is temporarily disabled (toolchain/compile issues). The
# `build-tauri` job and its release hooks below are commented out rather
# than removed so we can turn it back on easily later.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build against. Leave empty for current HEAD."
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release with the built artefacts (requires tag)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # On tag push the ref is `refs/tags/vX.Y.Z`; on dispatch fall back to the
  # supplied tag or the workflow ref. Either way one tag at a time.
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Electron shell (macOS arm64) ────────────────────────────────
  build-electron:
    name: Electron mac-arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On tag push the runner already checks out the tag; on dispatch
          # honour the optional input. Empty string falls back to default.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Build desktop (web + server staging + native rebuild for Electron)
        run: pnpm --filter @covel/desktop build

      - name: Package Electron mac
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unpacked release resources
        run: node apps/desktop/scripts/verify-release.mjs mac

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: covel-electron-mac-arm64
          # cleanup-artifacts.mjs strips blockmaps and update-info yml so the
          # release dir only ever contains the two distributable bundles.
          path: |
            release/electron/*.dmg
            release/electron/*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Tauri shell (macOS arm64) ─— DISABLED ──────────────────────
  # Tauri packaging is currently on hold (compile chain is brittle). Leave
  # this job definition commented for now; re-enable once the toolchain
  # settles. Also re-add `build-tauri` to `needs` of the `release` job and
  # uncomment the Tauri download/publish steps below when restoring.
  #
  # build-tauri:
  #   name: Tauri mac-arm64
  #   runs-on: macos-14
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #       with:
  #         ref: ${{ inputs.tag || github.ref }}
  #
  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v6
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v6
  #       with:
  #         node-version: 24
  #         cache: pnpm
  #
  #     - name: Setup Rust toolchain
  #       uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: aarch64-apple-darwin
  #
  #     - name: Cache Rust build
  #       uses: Swatinem/rust-cache@v2
  #       with:
  #         workspaces: apps/desktop-tauri/src-tauri -> target
  #         key: aarch64-apple-darwin
  #
  #     - name: Install dependencies
  #       run: pnpm install --frozen-lockfile
  #
  #     - name: Stage Electron desktop (shared staging for Tauri sidecar)
  #       run: pnpm --filter @covel/desktop build
  #
  #     - name: Prepare Tauri sidecar (download node + rebuild native deps)
  #       run: node apps/desktop-tauri/scripts/prepare-sidecar.mjs --target aarch64-apple-darwin
  #
  #     - name: Build Tauri bundle
  #       working-directory: apps/desktop-tauri
  #       run: pnpm tauri build --target aarch64-apple-darwin
  #       env:
  #         CSC_IDENTITY_AUTO_DISCOVERY: "false"
  #
  #     - name: Stage release artefacts
  #       run: node apps/desktop-tauri/scripts/stage-release.mjs aarch64-apple-darwin
  #
  #     - name: Upload Tauri artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: covel-tauri-mac-arm64
  #         path: release/tauri/aarch64-apple-darwin/*.dmg
  #         if-no-files-found: error
  #         retention-days: 7

  # ── Publish GitHub Release ─────────────────────────────────────
  # Auto-publishes when a `v*` tag is pushed. On manual dispatch the
  # `publish_release` toggle still gates publication.
  release:
    name: Publish GitHub Release
    needs: [ build-electron ]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.tag != '')

    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/electron
          pattern: covel-electron-*
          merge-multiple: true

      # Tauri publishing disabled along with build-tauri. Re-enable together.
      # - name: Download Tauri artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     path: release/tauri
      #     pattern: covel-tauri-*
      #     merge-multiple: true

      - name: Inspect artifacts
        run: |
          echo "=== release/electron ==="
          ls -lh release/electron/ || true
          # echo "=== release/tauri ==="
          # ls -lh release/tauri/ || true

      - name: Remove stale releases for this tag
        run: |
          gh api /repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "'"$RELEASE_TAG"'") | .id' |
          while read -r id; do
            echo "Deleting stale release $id for tag $RELEASE_TAG"
            gh api -X DELETE "/repos/${{ github.repository }}/releases/$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Covel ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          # `-rc1`, `-beta` etc. are pre-releases. Plain `v0.0.1` is stable.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # cleanup-artifacts.mjs leaves only the two distributables behind.
          files: |
            release/electron/*.dmg
            release/electron/*.zip
