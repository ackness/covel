name: CI

# Verify PRs and main, and reuse the same gates for release packaging.
#
# This owns verification. The local pre-push hook runs the static gate, adding
# docs tests for docs-only pushes; check:push adds affected suites for source.
# Source CI runs all suites in `verify`, `web`, and `server`.
#
# Push is scoped to main deliberately. A `*-dev` branch with an open PR gets
# two runs of the same commit otherwise — the PR ref and the branch ref hash
# to different concurrency groups, so neither cancels the other. The PR run
# covers dev branches; this push trigger is the post-merge guard on main.
#
# All changes run the complete static gate. Scope selection only changes which
# tests and builds run; unknown changes and releases always take the full path.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to verify for a release.
        required: false
        type: string
      release:
        description: Run release preflight before packaging.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR pushes cancel. Main pushes use separate groups so a newer
# source-only push cannot replace a pending run that must publish the site.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions/cache restores and re-saves the whole Turbo cache directory, so bound
# it tighter than turbo.json's local defaults. Turbo evicts at the start of each
# run, before this run's entries are written.
env:
  TURBO_CACHE_MAX_AGE: 2d
  TURBO_CACHE_MAX_SIZE: 500MB

jobs:
  scope:
    name: Select verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      site_deploy: ${{ steps.scope.outputs.site_deploy }}
    steps:
      # Control scripts belong to the workflow revision, not a requested older
      # release source. Local reusable workflows share their caller's commit.
      - name: Checkout verification controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Uses only Node built-ins and git; no dependency installation is needed.
      - name: Select scope
        id: scope
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  # One build owner for docs, full and unknown scope alike. Keep these elevated
  # permissions on this nonrelease call only; executing release jobs stay read-only.
  site:
    name: Site
    needs: scope
    if: ${{ !cancelled() && !inputs.release }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      commit: ${{ inputs.commit }}
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.release && needs.scope.outputs.site_deploy == 'true' }}

  verify:
    name: Check, test, build
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      # Keep the version in sync with mise.toml, which provides it locally.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo's local cache. lint/test/build are content-addressed per
      # package, so a run that only touches one package replays the rest from
      # here instead of re-running them. restore-keys falls back to the most
      # recent cache on this OS when the exact SHA has no entry.
      - name: Cache turbo
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Restore CI task cache
        if: ${{ inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.commit }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Check
        run: pnpm check

      - name: Test documentation examples
        if: ${{ needs.scope.outputs.scope == 'docs' && !inputs.release }}
        run: pnpm test:docs:packages

      # The web and server suites run in the parallel `web` and `server` jobs,
      # and so does the runtime suite (with coverage);
      # each was this step's critical path in turn.
      - name: Test
        if: ${{ needs.scope.outputs.scope != 'docs' || inputs.release }}
        # Bound both workspace tasks and their worker pools on shared runners.
        env:
          VITEST_MAX_WORKERS: "2"
        run: pnpm test --concurrency=2 --filter=!@covel/web --filter=!@covel/server --filter=!@covel/runtime

      # Site owns docs/site on every nonrelease run. The release matrix builds
      # desktop and its web/server dependencies. Read Turbo build outputs but
      # never write the large desktop staging tree back into the cache.
      - name: Build
        if: ${{ !inputs.release && needs.scope.outputs.scope != 'docs' }}
        run: pnpm build --cache=local:r --filter=!@covel/docs --filter=!@covel/site

      - name: Release preflight
        if: ${{ inputs.release }}
        run: pnpm release:preflight

  web:
    name: Web unit tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.scope != 'docs' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate key namespace keeps this cache to the web test graph.
      - name: Cache turbo
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-${{ runner.os }}-

      - name: Restore CI task cache
        if: ${{ inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.commit }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-${{ runner.os }}-

      # The only task in this job gets every runner core.
      - name: Test
        env:
          VITEST_MAX_WORKERS: "4"
        run: pnpm test --filter=@covel/web

  server:
    name: Server tests, runtime coverage
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.scope != 'docs' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The server suite is never replayed from the Turbo cache and is the
      # longest in the workspace. Alone on a runner it gets every core.
      - name: Test server
        env:
          VITEST_MAX_WORKERS: "4"
        run: pnpm test --filter=@covel/server

      # The kernel's coverage must not fall under the floor in
      # packages/runtime/vitest.config.ts. This is the only run of the runtime
      # suite (`verify` leaves @covel/runtime out), and it sits in this job,
      # which finishes before `verify` does.
      - name: Runtime coverage floor
        env:
          VITEST_MAX_WORKERS: "4"
        run: pnpm test:coverage:runtime

  postgres:
    name: PostgreSQL integration
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.scope != 'docs' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # PostgreSQL 18 + pgvector 0.8.7, pinned by multi-platform digest.
        image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: covel
          POSTGRES_PASSWORD: covel_ci
          POSTGRES_DB: covel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covel -d covel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://covel:covel_ci@localhost:5432/covel
      COVEL_REQUIRE_PG_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PostgreSQL integration
        run: pnpm test:pg

  browser:
    name: Browser smoke and community plugins
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.scope != 'docs' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect browser tests
        run: pnpm e2e --list

      # The browser download is cached by Playwright version (from the
      # lockfile) and runner image (ImageOS, e.g. ubuntu24), because Playwright
      # downloads a build per distribution release and ubuntu-latest moves to a
      # new release. The system packages are not part of it and are installed
      # on every run.
      - name: Read Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Test browser smoke
        run: pnpm e2e:smoke

      - name: Test community plugin acceptance
        run: pnpm e2e:extensions

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covel-browser-smoke-failure
          path: |
            tests/e2e/artifacts/ci-smoke
            tests/e2e/report/ci-smoke
            tests/e2e/artifacts/extensions
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: Verification
    needs: [scope, verify, site, web, server, postgres, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Aggregate with the workflow's helper even when inputs.commit predates it.
      - name: Checkout verification controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # `always` exposes failures and skips instead of skipping the aggregate.
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node scripts/ci-results.mjs verification
