name: CI

# Verify lint and tests on PRs and main; main also runs the full build.
# release.yml repeats the test gates and release preflight before packaging.
# Setup steps mirror release.yml (pnpm/action-setup + actions/setup-node with
# pnpm cache) so both workflows install identically.
#
# Push is scoped to main deliberately. A `*-dev` branch with an open PR gets
# two runs of the same commit otherwise — the PR ref and the branch ref hash
# to different concurrency groups, so neither cancels the other. The PR run
# covers dev branches; this push trigger is the post-merge guard on main.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo's local cache. lint/test/build are content-addressed per
      # package, so a run that only touches one package replays the rest from
      # here instead of re-running them. restore-keys falls back to the most
      # recent cache on this OS when the exact SHA has no entry.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Check peer dependency compatibility
        run: pnpm peers check

      - name: Lint
        run: pnpm lint

      - name: Dependency hygiene (knip)
        run: pnpm deps:check

      - name: Test
        run: pnpm test

      # Exclude convention-only `_archive`; every active plugin directory is
      # validated together so cross-runtime collisions are also detected.
      - name: Strict plugin manifest validation
        run: pnpm validate:plugin plugins/[!_]*

      # Only the three apps have a build script, so this covers the bundling
      # layer (vite/rolldown config, manualChunks, circular imports) that
      # `tsc --noEmit` in Lint cannot see. Kept off PRs for faster feedback —
      # push to main still gates it, well before a release tag would.
      - name: Build
        if: github.event_name == 'push'
        run: pnpm build

      - name: Check plugin/world i18n coverage + READMEs
        run: pnpm check:i18n

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 18 + pgvector 0.8.6, pinned by multi-platform digest.
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: covel
          POSTGRES_PASSWORD: covel_ci
          POSTGRES_DB: covel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covel -d covel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://covel:covel_ci@localhost:5432/covel
      COVEL_REQUIRE_PG_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PostgreSQL stores
        run: pnpm --filter @covel/store test

      - name: Test PostgreSQL server integration
        run: pnpm --filter @covel/server exec vitest run tests/integration
