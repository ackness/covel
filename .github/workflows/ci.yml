name: CI

# Verify PRs and main, and reuse the same gates for release packaging.
#
# Push is scoped to main deliberately. A `*-dev` branch with an open PR gets
# two runs of the same commit otherwise — the PR ref and the branch ref hash
# to different concurrency groups, so neither cancels the other. The PR run
# covers dev branches; this push trigger is the post-merge guard on main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to verify for a release.
        required: false
        type: string
      release:
        description: Run release preflight before packaging.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR pushes cancel; main keeps every post-merge run so each merged
# commit is verified and built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions/cache restores and re-saves the whole Turbo cache directory, so bound
# it tighter than turbo.json's local defaults. Turbo evicts at the start of each
# run, before this run's entries are written.
env:
  TURBO_CACHE_MAX_AGE: 2d
  TURBO_CACHE_MAX_SIZE: 500MB

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      # Keep the version in sync with mise.toml, which provides it locally.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo's local cache. lint/test/build are content-addressed per
      # package, so a run that only touches one package replays the rest from
      # here instead of re-running them. restore-keys falls back to the most
      # recent cache on this OS when the exact SHA has no entry.
      - name: Cache turbo
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Restore CI task cache
        if: ${{ inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.commit }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Check
        run: pnpm check

      # Web unit tests run in the parallel `web` job; they were this step's
      # critical path.
      - name: Test
        # Bound both workspace tasks and their worker pools on shared runners.
        env:
          VITEST_MAX_WORKERS: "2"
        run: pnpm test --concurrency=2 --filter=!@covel/web

      # The release matrix builds desktop and its web/server dependencies.
      # Build outputs (the desktop staging tree is ~90 MB per entry) are read
      # from the Turbo cache but never written back, which keeps the saved
      # cache small.
      - name: Build
        if: ${{ !inputs.release }}
        run: pnpm build --cache=local:r

      - name: Release preflight
        if: ${{ inputs.release }}
        run: pnpm release:preflight

  web:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate key namespace keeps this cache to the web test graph.
      - name: Cache turbo
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-${{ runner.os }}-

      - name: Restore CI task cache
        if: ${{ inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.commit }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-${{ runner.os }}-

      # The only task in this job gets every runner core.
      - name: Test
        env:
          VITEST_MAX_WORKERS: "4"
        run: pnpm test --filter=@covel/web

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # PostgreSQL 18 + pgvector 0.8.6, pinned by multi-platform digest.
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: covel
          POSTGRES_PASSWORD: covel_ci
          POSTGRES_DB: covel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covel -d covel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://covel:covel_ci@localhost:5432/covel
      COVEL_REQUIRE_PG_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PostgreSQL integration
        run: pnpm test:pg

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect browser tests
        run: pnpm e2e --list

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser smoke
        run: pnpm e2e:smoke

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covel-browser-smoke-failure
          path: |
            tests/e2e/artifacts/ci-smoke
            tests/e2e/report/ci-smoke
          if-no-files-found: ignore
          retention-days: 7
