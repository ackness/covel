# Chinese text of this plugin.
# A section named after a manifest file translates its labels, under the same keys.
# messages translates the UI: English text, then its translation.
PLUGIN.md:
  description: "{{pluginDescriptionZh}}"
runtimes/analyst/RUNTIME.md:
  description: 读取当前 narrator 输出和本插件 notes，判断是否需要写入一条可执行观察。Agent runtime 起点。
runtimes/note/RUNTIME.md:
  description: 玩家点击侧栏按钮时，向本插件 notes namespace 写入一条结构化记录。函数 runtime 起点。
messages:
  Plugin Notes: 插件记录
  Notes: 记录
  No plugin notes yet. Add a manual note or ask the analyst runtime to inspect the current narrative.: 还没有插件记录。可以手动添加一条记录，或让 analyst runtime 分析当前剧情。
  "{{pluginName}} plugin workbench": "{{pluginName}} 插件工作台"
  The function runtime writes deterministic notes; the agent runtime reads the narrative and records one observation. Replace the notes schema with your real plugin state.: 函数 runtime 写入确定性记录；agent runtime 读取剧情并写入一条观察。把 notes schema 换成你的真实插件状态即可继续开发。
  Add note: 添加记录
  Analyze scene: 分析剧情
