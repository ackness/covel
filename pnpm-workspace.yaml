packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

minimumReleaseAge: 10080

# pnpm 11 defaults verifyDepsBeforeRun to an implicit auto-install, which is
# actively harmful here: a `pnpm --filter <pkg> run …` that trips the check
# reinstalls only the filtered subgraph and prunes every other package from
# node_modules (this broke `pnpm check:i18n` in CI right after the Node 26
# bump invalidated the deps-state hash). CI and local flows install
# explicitly (`pnpm install --frozen-lockfile`), so run-time auto-installs
# are never wanted.
verifyDepsBeforeRun: false

# Native packages allowed to run install build scripts. pnpm 11 replaces
# `onlyBuiltDependencies` with this explicit allow/deny map.
allowBuilds:
  better-sqlite3: true
  electron: true
  # Squirrel installer helper pulled in by electron-builder; its download
  # script never ran under pnpm 10 (`onlyBuiltDependencies`) and Windows
  # packaging works without it, so keep script execution denied.
  electron-winstaller: false
  esbuild: true

# Keep transitive tool peers inside the same seven-day stable window as their
# direct consumers. Newer compatible releases are still quarantined upstream.
overrides:
  rolldown: 1.1.4
  tsx: 4.22.4

# @tailwindcss/language-service currently combines media-query-list-parser
# 2.0.4 with the csstools v3 parser/tokenizer family. Its transitive peer
# metadata still requests v2 even though this installed combination is the one
# selected by the upstream toolchain. Keep the exception exact so it can be
# removed when that package publishes corrected peer ranges.
peerDependencyRules:
  allowedVersions:
    "@csstools/media-query-list-parser@2.0.4>@csstools/css-parser-algorithms": "3.0.4"
    "@csstools/media-query-list-parser@2.0.4>@csstools/css-tokenizer": "3.0.3"
