# Render Blueprint — operator-controlled demo infrastructure (no PostgreSQL)
# https://docs.render.com/infrastructure-as-code
#
# The official web app is not supported yet. This blueprint starts the server;
# it does not provide a public sign-in or anonymous session-creation flow.
# DEPLOYMENT_TIER=demo requires the operator token for session creation and
# global/admin APIs, and an owner token for session access. Keep the generated
# operator token private; do not distribute it to visitors to bypass this gate.
# See docs/internals/security.md for the host-profile access rules.
#
# STORE_BACKEND=memory selects browser IndexedDB saves via /api/health. The
# server holds only volatile copies for execution, lost on sleep/restart.
# Provider keys travel per request in X-Provider-Keys and are never persisted.
#
# Deploy infrastructure by connecting this repository on the Render Dashboard.

services:
  - type: web
    name: covel-demo
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Explicit — the default is sqlite, which would put every player's
      # data in one shared server-side DB. memory ⇒ frontend local mode
      # (browser IndexedDB), per-player isolation.
      - key: STORE_BACKEND
        value: memory
      - key: SERVE_STATIC
        value: "true"
      - key: STATIC_DIR
        value: ./web-dist
      - key: SERVER_PORT
        value: "3001"
      # Render's proxy can only reach services that listen on all container
      # interfaces; the application default remains loopback for local use.
      - key: COVEL_BIND_HOST
        value: 0.0.0.0
      - key: DEPLOYMENT_TIER
        value: demo
      # Public demo posture is fail-closed without both independent secrets.
      # Render generates them once and keeps their values out of the Blueprint.
      - key: COVEL_MEDIA_TOKEN_SECRET
        generateValue: true
      - key: COVEL_DESKTOP_REST_TOKEN
        generateValue: true
      - key: ENABLE_DEBUG_PAGE
        value: "false"
