minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^pnpm-lock\.yaml$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: (^|/)tsconfig\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^\.claude/
      - id: check-added-large-files
        # 3 MB: covers tracked world character portraits (~1.7–2.4 MB PNGs)
        # while still catching accidental large blobs (videos, dumps, bundles).
        args: [--maxkb=3072]
        exclude: ^worlds/[^/]+/media/gallery/[^/]+\.png$
      - id: check-added-large-files
        name: check gallery PNG size
        files: ^worlds/[^/]+/media/gallery/[^/]+\.png$
        args: [--maxkb=4096]

  - repo: local
    hooks:
      # Resolve the lockfile-pinned linter through the project toolchain.
      - id: oxlint
        name: oxlint
        entry: mise exec -- node scripts/run-with-project-node.mjs pnpm exec oxlint
        args: [--fix]
        language: system
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^apps/web/src/routeTree\.gen\.ts$
      - id: prettier
        name: prettier
        entry: mise exec -- node scripts/run-with-project-node.mjs pnpm exec prettier --write --ignore-unknown
        language: system
        types_or:
          - css
          - html
          - javascript
          - json
          - jsx
          - markdown
          - scss
          - ts
          - tsx
          - yaml
      - id: pnpm-lint
        name: pnpm lint
        entry: mise exec -- node scripts/run-with-project-node.mjs pnpm lint
        language: system
        pass_filenames: false
        types_or: [ts, tsx, javascript, jsx]
