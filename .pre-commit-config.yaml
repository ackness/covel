minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^pnpm-lock\.yaml$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: (^|/)tsconfig\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^(\.claude/|apps/desktop-tauri/src-tauri/src/main\.rs$)
      - id: check-added-large-files
        # 3 MB: covers tracked world character portraits (~1.7–2.4 MB PNGs)
        # while still catching accidental large blobs (videos, dumps, bundles).
        args: [--maxkb=3072]

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.63.0
    hooks:
      - id: oxlint
        args: [--fix]
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^apps/web/src/routeTree\.gen\.ts$

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or:
          - css
          - html
          - javascript
          - json
          - jsx
          - markdown
          - scss
          - ts
          - tsx
          - yaml
      - id: pnpm-lint
        name: pnpm lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        types_or: [ts, tsx, javascript, jsx]
